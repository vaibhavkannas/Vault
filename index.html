<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1/user-scalable=no: this is a PWA meant to feel like a native app, not a
     document — the browser's own pinch/double-tap page zoom fought with in-app gestures (the
     crop screen's own drag handles, swipe-to-dismiss) more than it ever helped. Zooming into an
     actual document's content is handled separately and deliberately, inside the document viewer
     itself (see .view-zoom-inner) — this line only disables zooming the CHROME OF THE APP. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vault — your documents, secured</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1a73e8">
<!-- iOS Safari (including the installed Home Screen / standalone PWA) doesn't read theme-color for
     its own status bar at all — apple-mobile-web-app-status-bar-style is the one tag that does, so
     without it the status bar stayed opaque light/dark-text regardless of the app's actual theme.
     apple-mobile-web-app-capable is what puts the app in standalone mode in the first place, needed
     for status-bar-style to have any effect. Both toggled below alongside theme-color. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Applied before first paint so there's no flash of the wrong theme (or the wrong OS chrome
  // color alongside it) on load.
  try{
    const saved = localStorage.getItem('vault-theme');
    if(saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
    const isDark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#111214' : '#1a73e8');
    // black-translucent draws the app's own background under the iOS status bar (paired with the
    // safe-area-inset-top padding on header.topbar/.login-screen below) instead of leaving it a
    // fixed opaque bar that visibly clashes with the dark theme's background right underneath it.
    document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', isDark ? 'black-translucent' : 'default');
  } catch(e){}
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  :root{
    color-scheme:light dark;
    --ink:#1f1f1f;
    --ink-soft:#5f6368;
    --paper:#ffffff;
    --paper-2:#ffffff;
    --brass:#1a73e8;
    --brass-dark:#0842a0;
    --on-brass:#ffffff; /* text/icons sitting ON a solid --brass fill — white here since brass is dark, but a dark-mode brass has to flip this or the same button reads as washed-out/disabled */
    --on-danger:#ffffff; /* same idea as --on-brass, for a solid --danger fill (delete buttons etc.) */
    --line:#dadce0;
    --danger:#c5221f;
    --danger-bg:#fce8e6;
    --success:#157a34;
    --success-bg:#e6f4ea;
    --warning:#8a5a05;
    --warning-bg:#f7edd9;
    --radius:16px;
    --radius-sm:8px;
    --radius-full:999px;
    --surface-container:#f1f3f4;
    --primary-container:#d3e3fd;
    --on-primary-container:#0842a0;
    --elevation-1:0 1px 2px rgba(60,64,67,0.15), 0 1px 3px 1px rgba(60,64,67,0.08);
    --elevation-2:0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    font-family:'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  /* Chrome's edge-swipe "navigate back/forward" gesture is a distinct code path from a discrete
     Back button/key press: it can skip straight past every history.pushState() entry this file
     creates (there's no different document to show a swipe-preview of for those) and land
     directly on whichever real, different page was open before this one — bypassing the popstate
     handler below entirely, no matter what it does. overscroll-behavior-x is the browser's own
     documented opt-out for exactly that gesture, applied where Chrome looks for it (the
     scrolling root, which is <html> unless something else scrolls instead). A hardware/software
     Back button still reaches popstate normally either way — this only suppresses the swipe.

     overscroll-behavior-y is the same idea for the vertical axis: without it, dragging down from
     the top of the document viewer's own pull-to-dismiss gesture (see enableSwipeToDismiss) also
     triggers Chrome's native pull-to-refresh underneath the modal — the browser watches the page's
     own scroll position for that gesture regardless of what overlay is drawn on top, so a modal
     being open doesn't suppress it on its own. Dragging further reloads the whole tab instead of
     the modal closing. This is the documented opt-out for that, same mechanism as the X-axis one. */
  /* touch-action, not just the viewport meta's maximum-scale/user-scalable=no, is what actually
     stops native pinch-zoom reliably on Android/Chrome — the meta tag alone left it still working
     there. Listing pan-x/pan-y without pinch-zoom is what disables it while keeping ordinary
     scrolling; this is deliberately NOT the "manipulation" keyword, which explicitly re-enables
     pinch-zoom. The document viewer's own pinch-to-zoom (wireViewFileZoom()) is unaffected —
     it's built on Pointer Events, which fire regardless of touch-action; this only ever stops the
     BROWSER's own native zoom gesture from fighting with it. */
  html{overscroll-behavior: none; touch-action: pan-x pan-y;}
  body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:pan-x pan-y;}
  /* Baseline tap feedback for every button so nothing feels inert — more specific :active rules
     elsewhere (e.g. button.primary's scale(0.98)) simply override this by CSS specificity. */
  button, .doc-icon, .icon-pick-btn, .cat-toggle, .renewal-card{transition:transform 0.1s ease;}
  button:active, .doc-icon:active, .icon-pick-btn:active, .cat-toggle:active, .renewal-card:active{transform:scale(0.96);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  /* dvh after vh (not instead of it — older engines that don't understand dvh just keep the vh
     value, a browser ignores a whole declaration it can't parse rather than falling back within it):
     in an ordinary (non-installed) mobile tab, vh is pinned to the toolbar-hidden viewport height, so
     these recompute and visibly reflow every time Safari/Chrome's own address bar shows or hides;
     dvh tracks the actual visible viewport instead. */
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;}
  /* The viewport meta's viewport-fit=cover opts into drawing content under the iOS status bar/notch/
     Dynamic Island — env(safe-area-inset-top) is what actually reserves room for it again, without
     which this (the topmost thing on every screen) sat right against or under the status bar. */
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:max(20px, env(safe-area-inset-top)) 16px 12px;}
  .topbar-actions{display:flex;align-items:center;gap:2px;}
  /* Bulk multi-select mode's topbar (see renderVault) — replaces the Quick Reference/Settings
     icons with a plain count label plus a single Cancel (×), reusing .icon-only-btn for that × so
     it matches every other bare-glyph icon-only button's size/tap-target in this file. */
  .select-mode-bar{gap:10px;}
  .select-count-label{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:28%;background:var(--brass);display:flex;align-items:center;justify-content:center;flex:none;}
  /* Now an <h1> (each screen's own page title — see the Vault/Settings/Quick Reference/Recently
     Deleted/Upcoming markup), so its browser-default block margin needs zeroing to sit inline with
     its topbar/settings-header flex siblings exactly as the plain <div> it used to be did. */
  .brand-name{font-size:22px;font-weight:400;letter-spacing:0;margin:0;}
  /* A plain static dot reads as decoration, not status — the dot itself stays put (so it's never
     mistaken for a loading spinner) and a periodic expanding, fading ring around it is what
     actually signals "live". Online pulses slow and quiet (a reassuring background fact); offline
     pulses faster and pairs with a text label, since that's the state actually worth noticing —
     color alone would also miss anyone who can't distinguish green from red. */
  .conn-indicator{display:flex;align-items:center;gap:5px;margin-left:1px;}
  .conn-dot{position:relative;width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-soft);}
  .conn-dot::before{content:'';position:absolute;inset:0;border-radius:50%;opacity:0;}
  .conn-indicator.online .conn-dot{background:var(--success);}
  .conn-indicator.online .conn-dot::before{background:var(--success);animation:connPing 2.6s ease-out infinite;}
  .conn-indicator.offline .conn-dot{background:var(--danger);}
  .conn-indicator.offline .conn-dot::before{background:var(--danger);animation:connPing 1.3s ease-out infinite;}
  .conn-label{font-size:11px;font-weight:500;color:var(--danger);letter-spacing:0.2px;}
  @keyframes connPing{0%{transform:scale(1);opacity:0.55;}100%{transform:scale(2.6);opacity:0;}}

  .login-screen{padding:max(56px, calc(env(safe-area-inset-top) + 24px)) 28px 40px;text-align:center;}
  /* The app-lock screen (renderLocked) adds this on top of the base rule above so it's always the
     topmost, unavoidable layer regardless of what else is in the document — a defense-in-depth
     backstop alongside renderLocked()'s own modal teardown, not a substitute for it. */
  .login-screen.login-screen--locked{position:fixed;inset:0;z-index:1000;background:var(--paper);overflow-y:auto;margin:0;}
  .seal{width:92px;height:92px;margin:0 auto 24px;border-radius:28%;background:var(--brass);display:flex;align-items:center;justify-content:center;box-shadow:var(--elevation-2);}
  .login-screen h1{font-weight:400;font-size:28px;margin:0 0 8px;}
  .checking-spinner{width:26px;height:26px;margin:20px auto 0;border:3px solid var(--surface-container);border-top-color:var(--brass);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* No opacity here — --ink-soft alone already passes WCAG AA against --paper/--paper-2 (~6:1
     light, ~11:1 dark); alpha-blending it with opacity dropped that below 4.5:1 in both themes. */
  .version-tag{text-align:center;font-size:10px;color:var(--ink-soft);margin-top:16px;font-variant-numeric:tabular-nums;letter-spacing:0.04em;text-transform:uppercase;}
  .login-screen p{color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 auto 30px;max-width:320px;}
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-full);font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;box-shadow:var(--elevation-1);}
  .google-btn:active{transform:scale(0.98);}
  .gicon{width:18px;height:18px;flex:none;}
  .demo-note{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--surface-container);border-radius:12px;padding:10px 12px;text-align:left;line-height:1.5;}
  .privacy-link{display:block;margin-top:14px;font-size:12px;color:var(--ink-soft);text-decoration:underline;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;}
  /* A <button> stays shrink-to-fit width even at display:block, so .login-screen's inherited
     text-align:center only centers the text WITHIN that tight little box, never the box itself —
     it was sitting flush left instead of centered like .version-tag right below it. margin:auto is
     what actually centers a shrink-to-fit block box. Scoped to .login-screen specifically so the
     Settings instance (left-aligned with its own version-tag, see below) is untouched. */
  .login-screen .privacy-link{margin-left:auto;margin-right:auto;}
  /* In Settings' About section, .version-tag sits directly under .privacy-link as one left-aligned
     group, not as its own isolated centered footer (the .login-screen/checking/locked/vault-footer
     contexts it was designed for, where there's nothing beside it to align with) — override just
     that one context rather than the shared default, which those other screens still need. */
  .settings-section .version-tag{text-align:left;text-transform:none;letter-spacing:normal;opacity:1;font-size:12px;margin-top:6px;}

  /* font-size:16px, not 14px: iOS Safari auto-zooms the whole page on focus whenever a field's
     computed font-size is under 16px, which fought directly with this app's own
     maximum-scale=1,user-scalable=no viewport setting (chosen specifically so the app wouldn't have
     to fight browser-level zoom) — focusing almost any field used to zoom the page in regardless. */
  input[type="text"], input[type="date"], input[type="password"], select, textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--surface-container);font-size:16px;color:var(--ink);margin-bottom:12px;font-family:inherit;}
  input[type="text"]:focus, input[type="date"]:focus, input[type="password"]:focus, select:focus, textarea:focus{outline:2px solid var(--brass);outline-offset:-1px;}
  input[type="text"]:disabled{opacity:0.55;cursor:not-allowed;}
  input[type="password"]{letter-spacing:0.3em;}
  /* display:flex (not the plain text-centering a <button> gets by default) so an icon — svg.icon
     below is display:block — sits inline with its label instead of dropping to its own line; a
     text-only .primary button centers exactly the same either way, so this is safe everywhere. */
  button.primary{width:100%;padding:13px 16px;background:var(--brass);color:var(--on-brass);border:none;border-radius:var(--radius-full);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;}
  /* Delegated tap-feedback ripple — see spawnRipple()/the document-level pointerdown listener.
     Neither selector sets its own box-shadow, so clipping via this overflow:hidden is safe. */
  .ripple-effect{position:absolute;border-radius:50%;background:currentColor;opacity:0.25;transform:scale(0);pointer-events:none;animation:rippleExpand 0.45s ease-out;}
  @keyframes rippleExpand{to{transform:scale(1);opacity:0;}}
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.5;}
  button.danger-solid{width:100%;padding:13px 16px;background:var(--danger);color:var(--on-danger);border:none;border-radius:var(--radius-full);font-size:14px;font-weight:500;cursor:pointer;}
  button.danger-solid:active{transform:scale(0.98);}
  button.danger-solid:disabled{opacity:0.5;}
  button.ghost{width:100%;padding:12px 16px;background:transparent;color:var(--brass);border:1px solid var(--line);border-radius:var(--radius-full);font-size:13.5px;font-weight:500;cursor:pointer;margin-top:8px;}
  /* svg.icon is display:block (below), which otherwise breaks an icon+text ghost button onto two
     stacked lines instead of one centered row — every other icon+text control in this app already
     sets its own flex/gap for this reason (.archive-toggle, .action-menu button, .fab .primary). */
  button.ghost.ghost-icon{display:flex;align-items:center;justify-content:center;gap:6px;}
  .error-text{color:var(--danger);font-size:12.5px;text-align:left;margin:-6px 0 12px;}

  /* flex column + a flex:1 spacer (see .vault-spacer, right before the version tag in the markup)
     is what keeps the version tag from sitting in the middle of the screen when there are few or no
     documents — without it, the tag just sat directly under the empty-state message wherever that
     happened to end, nowhere near the actual bottom of the screen. The spacer absorbs whatever
     vertical space the real content doesn't use, pushing the tag down to the bottom; with a full
     document list already taller than the viewport, the spacer collapses to ~0 and the tag sits
     right after the last real content exactly like before. min-height is an estimate of the
     topbar's own height (safe-area-inset-top makes the real one taller on notched phones, which
     just means the tag sits a little higher there, never clipped) — it only has to be a reasonable
     lower bound, not pixel-exact, since its only job is giving the spacer a floor to expand within. */
  .vault{display:flex;flex-direction:column;min-height:calc(100vh - 90px);min-height:calc(100dvh - 90px);padding:8px 16px 86px;}
  .vault-spacer{flex:1;}
  .search-bar{position:relative;margin-bottom:14px;}
  .search-bar input{margin-bottom:0;padding-left:44px;padding-right:46px;background:var(--surface-container);border-radius:var(--radius-full);box-shadow:var(--elevation-1);}
  .search-clear{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:none;border-radius:50%;background:none;color:var(--ink-soft);cursor:pointer;}
  .search-clear:hover{color:var(--ink);}
  .search-bar .sicon{position:absolute;left:15px;top:50%;transform:translateY(-50%);display:flex;color:var(--ink-soft);}
  .search-hint{font-size:11.5px;color:var(--ink-soft);margin:6px 2px 0;}
  /* A slim inline control, not a .settings-row card — this sits above the document list on the
     already-tight vault screen, not in a scrollable settings list, so it gets the same lightweight
     treatment as .search-hint right above rather than a padded/elevated/shadowed row. */
  .sort-row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:8px 2px 2px;font-size:12px;color:var(--ink-soft);}
  /* The shared input[type=...]/select reset above (width:100%, 12px padding, margin-bottom) is
     meant for full-width modal form fields — it isn't scoped away from a plain <select> like this
     one, so every property it sets must be explicitly neutralized here, not just the ones this rule
     already overrides. Without width:auto the select was stretching to fill almost the entire row
     (its real box nearly 300px wide even though the visible text only needed a fraction of that),
     which is what actually read as "misaligned" — the text sits flush right, but the native
     dropdown arrow and the real clickable edge were sitting way out past it. */
  .sort-row select{width:auto;font-size:12px;font-weight:500;color:var(--ink);background:none;border:none;padding:2px;margin:0;cursor:pointer;}

  .quick-actions{display:flex;gap:8px;margin-bottom:6px;}
  .quick-actions button{flex:1;padding:11px 8px;background:var(--surface-container);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);}

  .section-title{font-size:13px;font-weight:500;color:var(--ink);margin:18px 4px 9px;display:flex;align-items:center;justify-content:space-between;}
  /* .cat-toggle is the clickable variant (a whole category's collapse/expand control) — the plain
     .section-title above has no padding at all, which is fine for a non-interactive label like
     "Pinned", but left this one's actual tappable band only as tall as its 13px text (~16-18px),
     well under a comfortable touch target. Padding added here instead of on the shared base rule,
     with margin trimmed by the same amount so the visible gap around it is unchanged. */
  .section-title.cat-toggle{margin:8px 4px 0;padding:10px 0 9px;}
  .cat-toggle{cursor:pointer;user-select:none;}
  .cat-title-label{display:inline-flex;align-items:center;gap:7px;}
  .cat-count{font-weight:400;color:var(--ink-soft);font-size:12px;display:inline-flex;align-items:center;gap:2px;}
  .cat-chevron{display:flex;transition:transform 0.15s ease;}
  .cat-chevron.collapsed{transform:rotate(-90deg);}
  /* Always present in the DOM now (see renderVault's cat-toggle handler) — collapsing used to omit
     this whole wrapper from the template instead, which meant there was never a persistent node for
     this transition (or the .cat-chevron rotation above) to actually animate between two states. */
  .doc-card-grid-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows 0.28s ease;}
  .doc-card-grid-wrap.is-collapsed{grid-template-rows:0fr;}
  .doc-card-grid-inner{overflow:hidden;min-height:0;}
  /* Needed for the collapse/expand grid-template-rows animation to actually clip content while a
     category's row is shrinking/growing — but it ALSO clips anything that deliberately extends past
     a document card's own bounds once fully open, most notably an open ⋮ action menu overlapping
     the next card down. Added once a category settles fully expanded (see the .cat-toggle handler
     and this category's own initial render), removed the instant a collapse starts so the shrink
     animation still clips correctly from its very first frame. */
  .doc-card-grid-inner.overflow-visible{overflow:visible;}
  .archive-toggle{background:none;border:none;color:var(--brass);font-size:12.5px;font-weight:500;cursor:pointer;padding:4px;margin:24px auto 0;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;}

  .reminder-card{display:flex;align-items:center;gap:10px;background:var(--success-bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;font-size:13px;}
  .reminder-card.urgent{background:var(--danger-bg);}
  /* min-width:0 overrides a flex item's default min-width:auto, which otherwise refuses to shrink
     below its own text's natural (unwrapped) width — without it, a longer two-line message (see the
     offline banner's reason subline) overflowed past the card's edge instead of wrapping at all. */
  .reminder-card .rtitle{font-weight:500;flex:1;min-width:0;color:var(--ink);}
  .reminder-card .rdays{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .renewal-strip-wrap{position:relative;margin:0 0 20px;}
  .renewal-strip{display:flex;gap:9px;overflow-x:auto;margin:0;scrollbar-width:none;}
  .renewal-strip::-webkit-scrollbar{display:none;}
  /* Fades the right edge into the page background — the same "more content" cue Gmail and Photos
     use for horizontally-scrolling chip/card rows — but ONLY when the strip actually overflows.
     has-overflow is set after render by measuring scrollWidth vs clientWidth (see renderVault),
     since a card-count guess can't account for actual title lengths or the viewport it's on. */
  .renewal-strip-wrap.has-overflow::after{content:'';position:absolute;top:0;right:0;bottom:0;width:32px;background:linear-gradient(to right, transparent, var(--paper));pointer-events:none;}
  .renewal-card{flex:0 0 auto;min-width:148px;max-width:190px;background:var(--success-bg);border-radius:16px;padding:11px 13px;cursor:pointer;}
  .renewal-card.urgent{background:var(--danger-bg);}
  .renewal-title{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .renewal-days{font-size:11.5px;font-weight:500;color:var(--success);}
  .renewal-card.urgent .renewal-days{color:var(--danger);}
  .renewal-actions{display:flex;gap:8px;margin:6px 0 -4px -6px;}
  .renewal-actions svg{width:14px;height:14px;}

  /* Staggered entrance for freshly-inserted rows (renewal cards, doc cards, quick-ref rows) — an
     ordinary transition can't do this (a brand-new element has no earlier frame to interpolate
     from), so this is a self-playing keyframe animation instead, timed per item via the --i custom
     property each of those three templates sets inline. Capped with min() so a long list doesn't
     end in a multi-second cascade. Suppressed during a view-transitioned render (see the render()
     wrapper) — a view transition shows a snapshot of the real DOM in its own overlay while the live
     nodes animate underneath, unseen, so this would otherwise finish invisibly before the crossfade
     even lifts.
     */
  /* A per-card "fade in from transparent" entrance animation used to run unconditionally here,
     triggered by insertion — but renderVault() rebuilds every card from scratch on every single
     render(), not just when the list has genuinely changed, so it replayed on every click (editing
     a field, opening a menu, a background token refresh, ...), making the whole visible list look
     like it kept "refreshing" no matter what was actually clicked. Toggling a suppressing class
     around the render (the html.vt-pending pattern still used elsewhere in this file) turned out
     not to reliably prevent it either — a CSS animation-name change still starts an animation once
     the browser gets around to a style flush, whether or not the suppressing class is still present
     by then, so a same-tick add-then-remove is invisible to it. Removed rather than fought further.
  */

  .doc-card{background:var(--paper-2);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start;box-shadow:var(--elevation-1);}

  .doc-snippet{font-size:12px;color:var(--ink-soft);margin:4px 0 0;background:var(--surface-container);padding:6px 9px;border-radius:8px;}

  .doc-actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;}

  /* A native <input type="date"> has no visible way to clear it once set on several mobile

  .icon-only-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);padding:8px;line-height:1;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}

  .action-menu-wrap{position:relative;margin-left:auto;}

  .fab{position:fixed;max-width:480px;margin:0 auto;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 20px;padding-bottom:max(16px, env(safe-area-inset-bottom));pointer-events:none;}

  .fab .camera-fab{width:56px;height:56px;flex:none;background:var(--primary-container);color:var(--on-primary-container);border:none;border-radius:16px;box-shadow:var(--elevation-2);display:flex;align-items:center;justify-content:center;}
  /* Bulk action bar replacing the Add/Camera FAB while select mode is active (see renderVault) —
     reuses .fab's fixed bottom positioning (including its own "button{pointer-events:all}" rule

  .fab.bulk-action-bar{justify-content:space-between;gap:10px;}
  .fab.bulk-action-bar .chip-btn{flex:1;justify-content:center;padding:13px 10px;border-radius:16px;box-shadow:var(--elevation-2);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:overlayFadeIn 0.2s ease;}
  /* --paper-2 rather than --paper: in light mode they're identical (both white), but in dark mode

  /* Same idea as .fab/.toast just above: a flat bottom padding put every sheet's trailing

     notched/Dynamic-Island iPhone. */
  .modal-sheet{width:100%;max-width:480px;background:var(--paper-2);border-radius:28px 28px 0 0;padding:22px max(20px, env(safe-area-inset-right)) max(28px, calc(env(safe-area-inset-bottom) + 8px)) max(20px, env(safe-area-inset-left));max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;animation:sheetSlideUp 0.24s cubic-bezier(0.05,0.7,0.1,1);position:relative;}
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}

  .modal-sheet h3{font-weight:400;font-size:20px;margin:0 0 4px;}
  .modal-sheet .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
  .pdf-pages{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .pdf-page-canvas{max-width:100%;border-radius:8px;box-shadow:var(--elevation-1);}
  /* The one place inside the app that's allowed to zoom, now that the page itself can't (see the

     #viewFileSheet below) alike, hands the browser NOTHING to interpret natively anywhere in this

     .view-zoom-inner is deliberate, not decorative: it makes the element's own box shrink-wrap to
     its actual visible content (the image, or the stack of PDF-page canvases) instead of the full

  #viewFileSheet{touch-action:none;}
  #viewFileContent{overflow:hidden;max-height:65vh;max-height:65dvh;touch-action:none;overscroll-behavior:contain;text-align:center;}
  .view-zoom-inner{display:inline-block;transform-origin:0 0;touch-action:none;}
  .view-file-content-wrap{position:relative;}
  .view-zoom-reset-btn{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,0.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;}
  .view-file-actions{display:flex;gap:10px;}
  .view-file-actions button{flex:1;}
  label.field-label{font-size:12px;font-weight:500;color:var(--ink-soft);display:block;margin-bottom:6px;}
  /* Floats in the corner instead of its own full-width row above the title — the previous stacked
     layout (close-button row, THEN separately the drag handle's own row above THAT) added up to a
     needlessly tall, mostly-empty header before any real content ever showed. Sharing one compact
     band with the handle below fixes that for every sheet at once. */
  .modal-close{position:absolute;top:10px;right:10px;z-index:1;}
  .modal-close button{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:0;border-radius:50%;min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;}
  .modal-close button:hover{background:var(--surface-container);}

     actual touch target a proper ~44px even though the visible bar itself stays small and quiet.
     Present on every slide-in sheet now — renderModal()'s shared tail inserts one generically for
     any modal whose own markup didn't already include it, so this can't be missed again. */

  .sheet-handle::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--line);}

  .toast{position:fixed;bottom:max(24px, calc(env(safe-area-inset-bottom) + 8px));left:50%;transform:translateX(-50%);background:#333537;color:#f1f1f1;padding:12px 20px;border-radius:8px;font-size:13.5px;z-index:100;opacity:0;transition:opacity 0.25s ease, transform 0.25s ease;pointer-events:none;max-width:88%;text-align:center;box-shadow:var(--elevation-2);}

  .toast-action-btn:hover{background:rgba(255,255,255,0.14);}
  .toast-action-btn:focus-visible{background:rgba(255,255,255,0.14);outline:2px solid #8ab4f8;outline-offset:1px;}


  /* Camera modal */
  /* A fixed aspect-ratio (rather than sizing off the <video>'s own intrinsic dimensions) keeps

  .camera-wrap video, .camera-wrap canvas{width:100%;height:100%;object-fit:cover;display:block;}
  .camera-controls{display:flex;gap:10px;margin-bottom:12px;}
  .camera-controls button{flex:1;}

  .camera-controls button.ghost{margin-top:0;}
  .capture-btn{background:var(--brass);color:var(--on-brass);border:none;border-radius:var(--radius-full);padding:13px;font-weight:500;font-size:14px;cursor:pointer;}
  .scroll-hint{display:flex;align-items:center;justify-content:center;gap:4px;color:var(--ink-soft);font-size:12px;margin:0 0 14px;}
  .page-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
  .page-thumb-wrap{position:relative;flex:none;}
  .page-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;display:block;cursor:pointer;}
  .page-thumb-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--on-danger);border:2px solid var(--paper);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}

  /* Edge-midpoint handles: dragging one moves its two adjacent corners together (see

     finger (see HANDLE_OFFSET in wireCropOverlay), so this just centers on that same point, zoomed

  .crop-magnifier::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);}
  .crop-magnifier::after{top:50%;left:0;right:0;height:1px;transform:translateY(-50%);}

     loupe is deliberately positioned AWAY from the finger so it isn't covered, but with nothing
     visually linking the two, there's no obvious relationship between "this magnified circle" and
     "the spot under my finger." A short line from the loupe's edge straight to the touch point

  .crop-magnifier-tail{position:absolute;height:2px;background:#fff;box-shadow:0 0 3px rgba(0,0,0,0.5);pointer-events:none;opacity:0;transform-origin:left center;}
  .progress-row{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:10px 0;}
  .progress-track{height:4px;background:var(--surface-container);border-radius:4px;overflow:hidden;margin-bottom:6px;}
  .progress-fill{height:100%;background:var(--brass);transition:width 0.2s ease;}

<div class="app" id="app"></div>

<script>
/* ============================================================
   VAULT — functional prototype
   Real: OCR (Tesseract.js) with an on-device best-effort expiry-
   date guesser, full-text search over OCR'd content, camera
   capture, PDF export of captured pages, Google Sign-In (Firebase
   Auth), per-account cloud storage — Firestore holds document
   metadata, the user's own Google Drive (drive.file scope) holds
   the actual files, organized under a "Vault" folder with one
   subfolder per category.
   By design (per product decision): documents are stored as
   plain, Drive-viewable files, not encrypted — Google Sign-In is
   the only access gate, there is no separate passphrase.
   Sharing a document hands its real file to another app via the
   Web Share API (or downloads it directly) — there is no link-
   based sharing.
   ============================================================ */

// instead of previewing it). Rendering with canvas behaves identically everywhere.
// (Its GlobalWorkerOptions.workerSrc assignment used to live here as a top-level statement, back
// when pdf.min.js was a blocking <head> script tag guaranteed to have already defined pdfjsLib by
// this point. Now that pdf.min.js loads lazily — see loadPdfJsScript() — that assignment moved
// into the loader itself, since pdfjsLib doesn't exist yet at top-level script execution time.)

const firebaseConfig = {
  apiKey: "AIzaSyC9zVPWgTekPiDUDn1YcLDInHBFRRUgW9w",
  authDomain: "elite-vault-7b00a.firebaseapp.com",
  projectId: "elite-vault-7b00a",
  storageBucket: "elite-vault-7b00a.firebasestorage.app",
  messagingSenderId: "713625816347",
  appId: "1:713625816347:web:72d45d04fbb9e6944c97be"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// Public VAPID key for Web Push (Firebase Console > Project settings > Cloud Messaging > Web Push
// certificates). Not a secret — same exposure level as firebaseConfig.apiKey above.
const FCM_VAPID_KEY = 'BN2rOcWAxDeqds9LlGU--0buUzdWu0wABgZD3OvAdrh8Pr911CxG83DKRSWFjq2lgDppPyMuRlhRM9CjtQNP4fA';

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Browsers only auto-check a registered service worker's script for updates roughly once every
    // 24 hours — fine for a passive install, but far too slow for a PWA reopened many times in the
    // same day expecting each reopen to pick up whatever was just deployed. update() explicitly
    // forces a check (a no-op, not an error, when there's nothing new) rather than waiting on the
    // browser's own throttle; every foreground return is as good a moment as any to ask.
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') reg.update().catch(() => {});
    });
  }).catch(e => console.error('Service worker registration failed', e));

// Warms OpenCV.js (script fetch + WASM compile) as early as physically possible in the app's own
// lifecycle — not gated on sign-in at all, since it's a static library with no user data involved.
// It's the library confirmCrop()'s perspective correction needs once the user finishes adjusting a
// crop and taps confirm (see warpQuadToDataUrl()) — nothing during the drag interaction itself ever
// touches OpenCV (onPointerDown/applyDragMove/paintQuad/showMagnifier don't reference cv in any
// form), so this warm-up has no bearing on how responsive the crop handles themselves feel; a
// separate, real cause was found and fixed for that (see wireCropOverlay()'s own comment on the
// crop-magnifier's backgroundImage). This still earns its keep on its own terms though: without it,
// a user who adjusts a crop quickly and taps confirm before OpenCV has ever been touched would
// otherwise wait on its ~8MB script fetch + WASM compile right at that moment instead of it already
// being ready. Starting here — as soon as the app itself finishes loading, whether or not the user
// ever opens the camera at all this session — gives it the entire time the user spends signing in
// and browsing their vault as a head start, well before openCameraModal()'s own (still useful,
// still correct) warm-up call, which only covers the narrower window from opening the camera to
// actually confirming a crop.
// waitForOpenCvReady/loadOpenCvScript are declared later in this file but hoisted, so calling them
// here is safe; loadOpenCvScript caches its own promise, so this and every later warm call (camera
// open, wireCropOverlay itself) just await the same one in-flight/settled attempt, never a second
// fetch. requestIdleCallback (falling back to a short setTimeout on Safari, which lacks it) defers
// this off the app's own critical initial paint instead of competing with it for main-thread time.
// The 3s timeout option forces it to run even if the main thread never reports a true idle period
// before then — without it, requestIdleCallback carries no upper bound at all, which could in
// principle delay this past the moment the user actually opens the camera, quietly losing the head
// start this exists to provide (openCameraModal()'s own warm call, below, is the fallback for
// exactly that case, not just for whoever skips this file's idle-scheduling path entirely).
(function warmOpenCvEarly(){
  const idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 1500));
  idle(() => { waitForOpenCvReady().catch(() => {}); }, {timeout: 3000});
})();

// Firebase Auth (above) only handles identity — who's signed in. Drive *access* is a fully
// separate concern, deliberately decoupled from Firebase's own signInWithPopup credential (that
// path depends on a storage-relay iframe between this origin and the authDomain, which needs
// third-party storage access that modern Chrome — and any org-managed browser policy —
// increasingly blocks by default; when blocked, sign-in still succeeds but
// GoogleAuthProvider.credentialFromResult() silently comes back null).
//
// Drive access tokens are short-lived (~1hr) by Google's own design for a public/browser OAuth
// client — no refresh token is ever handed to client-side JS. True persistence (surviving the app
// being closed for days, with zero re-prompting) needs a refresh token, and a refresh token can
// only be requested and stored safely server-side — hence the Apps Script Web App behind
// APPS_SCRIPT_URL (see apps-script/Code.gs), which holds it and mints fresh access tokens on
// request. The two functions below are the only two ways the client ever gets a Drive access
// token now:
//   mintDriveAccessToken()   — every app open, and a periodic background refresh: asks the
//                              backend to turn the stored refresh token into a fresh access
//                              token. No Google UI at all; this is what makes reopening the app
//                              after days closed just work.
//   grantDriveAccessOneTime() — the one-time (or after a revoke) flow: pops Google's consent
//                              screen via GIS's authorization-CODE client (not the old
//                              implicit-token client — a code, not a token, is what the backend
//                              needs to exchange for a refresh token), then hands that code to
//                              the backend to store.
const GOOGLE_OAUTH_CLIENT_ID = '713625816347-61h6pgrra3ec7639kq3o8v3vdfpgmsjb.apps.googleusercontent.com';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzyWh524czh8pIMh-oaJccc6ocSvC1ZscUIBpkc4RGMKjHpX7fIvqKNLSDBv7oL-hFV0w/exec';

// Apps Script Web Apps don't speak the Firebase callable-function protocol, so this is a plain
// fetch — sent as text/plain (not application/json) specifically to stay a CORS "simple request"
// and skip a preflight OPTIONS call Apps Script has no handler for; the ID token travels inside
// the JSON body instead of an Authorization header for the same reason. Apps Script always
// responds 200 for a completed execution regardless of outcome, so success/failure is signaled by
// an `error` field in the body, not the HTTP status.
async function callDriveAuth(payload){
  const idToken = await auth.currentUser.getIdToken();
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({idToken}, payload))
  });
  const data = await res.json();
  if(data.error){
    const err = new Error(data.message || data.error);
    err.details = {reason: data.reason};
    throw err;
  }
  return data; // {accessToken, expiresIn}
}

async function mintDriveAccessToken(){
  return callDriveAuth({mode: 'mint'});
}

// A cold app open often races the phone's own network stack (radio/DNS not actually ready a moment
// after unlocking the screen or switching apps) — mintDriveAccessToken() is a single plain fetch
// with no retry of its own, so a purely transient hiccup at exactly that moment used to be
// indistinguishable from a real outage and dropped straight into offline mode, sometimes for as long
// as the next 5-minute background refresh (see the setInterval below), even though a full app
// reopen moments later — just a fresh attempt — would succeed. One short, bounded retry closes that
// gap for the case it's actually worth closing: e.details is only ever attached AFTER Apps
// Script successfully parsed and answered (see describeDriveAuthError's own reasoning), so its
// absence reliably means the fetch itself never completed — retrying makes sense there. A real
// backend-reported error (.details present, e.g. NO_GRANT) won't be fixed by trying again, so this
// only ever retries the "never actually reached it" case, exactly once, after a short pause.
async function mintDriveAccessTokenWithRetry(){
  try{
    return await mintDriveAccessToken();
  } catch(e){
    if(e && e.details) throw e; // a real answer from the backend — retrying won't change it
    await new Promise(resolve => setTimeout(resolve, 1500));
    return await mintDriveAccessToken();
  }
}

// Turns a caught callDriveAuth() failure into a message that actually explains WHY offline mode
// kicked in, instead of just "offline" — the common real-world cause isn't "no internet at all", it's
// a WiFi network/router whose DNS-level content filtering blocks script.google.com specifically
// (Apps Script URLs are a known target for that kind of filter) while everything else, including
// mobile data, stays reachable — which otherwise looks indistinguishable from a real outage.
// callDriveAuth() only ever attaches `.details` to an error AFTER successfully parsing a real JSON
// response from Apps Script (see its own `if(data.error)` branch) — so `.details` being absent here
// reliably means the fetch (or its response) never got that far: a DNS failure, connection refused,
// timeout, or a filtering proxy intercepting the request all look the same from here, and all point
// at the same fix (check whether script.google.com loads at all on the current network).
function describeDriveAuthError(e){
  if(e && e.details) return e.message || 'Vault’s backend reported an error.';
  return 'Couldn’t reach Vault’s backend at script.google.com — your network may be blocking it.';
}

let gisCodeClient = null;
async function grantDriveAccessOneTime(){
  await loadGisScript();
  return new Promise((resolve, reject) => {
    if(!gisCodeClient){
      gisCodeClient = google.accounts.oauth2.initCodeClient({
        client_id: GOOGLE_OAUTH_CLIENT_ID,
        // drive.file: read/write only the files and folders this app creates.
        // drive.metadata.readonly: read-only access to account-wide storage quota, for the
        // Settings storage display — this app still can't see the *content* of other files.
        scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.metadata.readonly',
        ux_mode: 'popup',
        access_type: 'offline', // ask Google to actually issue a refresh token, not just an access token
        prompt: 'consent',      // Google only issues a NEW refresh token when consent is freshly shown
        callback: () => {} // overwritten per-call below, immediately before requestCode()
      });
    }
    gisCodeClient.callback = (resp) => {
      if(resp.error) reject(new Error(resp.error));
      else resolve(resp.code);
    };
    gisCodeClient.error_callback = (err) => reject(new Error((err && err.type) || 'popup_failed'));
    gisCodeClient.requestCode();
  }).then(code => callDriveAuth({mode: 'exchange', code}));
}

// Try the silent path first — a stored refresh token can still be good even after signing back
// in as the same Google account post-sign-out, saving a second consent popup on top of Firebase's
// own sign-in. Only fall back to the one-time consent flow when the function says there's
// nothing to mint from (never provisioned yet, or the grant was revoked).
async function acquireDriveAccess(){
  try{
    return await mintDriveAccessToken();
  } catch(e){
    const reason = e && e.details && e.details.reason;
    if(reason === 'NO_GRANT' || reason === 'GRANT_REVOKED') return await grantDriveAccessOneTime();
    throw e;
  }
}

const DEFAULT_CATEGORIES = [

  {id:'insurance', label:'Insurance', icon:'umbrella', keepOfflineDefault:true},
  {id:'other', label:'Other', icon:'doc', keepOfflineDefault:true}

const EXPIRED_REMINDER_GRACE_DAYS = 30; // how long an already-expired doc keeps nagging in "Renewals coming up"
// Display-only mirror of DIGEST_MILESTONE_DAYS in apps-script/Code.gs (the backend digest job is
// what actually applies it) — shown to the user in the Add/Edit forms so "leave blank for the
// default schedule" means something concrete instead of asking them to trust an invisible default.
// Keep in sync by hand if that array ever changes.
const DEFAULT_REMINDER_SCHEDULE_LABEL = '14, 7, 3, 1, and 0 days before expiry';
// How long a document sits in "Recently deleted" (Vault/Deleted in Drive) before the daily Apps
// Script job (runTrashCleanup) permanently removes it — matches TRASH_RETENTION_DAYS in Code.gs;
// keep the two in sync if this ever changes.

function daysSinceIso(isoString){

function icon(key, size){
  size = size || 20;
  const body = ICONS[key] || ICONS.doc;
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}

function categoryIconHtml(cat, size){
  // Legacy accounts may still carry a raw emoji in their category icon field — pass it through
  // rather than silently swapping in the wrong glyph for a category the user picked deliberately.
  const key = (cat && cat.icon) || 'doc';
  return ICONS[key] ? icon(key, size) : `<span class="legacy-emoji-icon">${escapeHtml(key)}</span>`;
}

function brandMarkSvg(size){
  // The app's own mark — a shield around a document — kept separate from the flat-line ICONS
  // set above since it's a filled logo glyph, not a UI icon, and always sits on a --brass tile.

function iconPickerHtml(inputId, selected){
  const sel = ICONS[selected] ? selected : 'doc';
  return `
    <input type="hidden" id="${inputId}" value="${sel}" />
    <div class="icon-picker" id="${inputId}Picker" role="group" aria-label="Icon">
      ${CATEGORY_ICON_KEYS.map(key => `<button type="button" class="icon-pick-btn ${key===sel?'selected':''}" data-icon-key="${key}" aria-label="${CATEGORY_ICON_LABELS[key] || key}" aria-pressed="${key===sel}">${icon(key,18)}</button>`).join('')}
    </div>
  `;
}
function wireIconPicker(inputId){
  const input = document.getElementById(inputId);
  const wrap = document.getElementById(inputId+'Picker');
  if(!input || !wrap) return;
  wrap.querySelectorAll('[data-icon-key]').forEach(btn => {
    btn.onclick = () => {
      input.value = btn.getAttribute('data-icon-key');
      wrap.querySelectorAll('[data-icon-key]').forEach(b => {
        const isSel = b===btn;
        b.classList.toggle('selected', isSel);
        b.setAttribute('aria-pressed', isSel);
      });
    };
  });
}

function categoryFor(id){
  return state.categories.find(c => c.id === id)
    || state.categories.find(c => c.id === 'other')
    || state.categories[0]
    || {id:'other', label:'Other', icon:'doc'};
}

let activeToastEl = null;
let activeToastTimer = null;

// Shared cleanup for a toast's DOM element -- used both by the auto-dismiss timeout below and by
// an action button's click handler (see toast()), so both paths land on the same code instead of
// each hand-rolling their own removal. `immediate` skips the fade-out delay (the toast is being
// replaced or acted on right now). No-ops if `el` isn't the currently-tracked toast -- e.g. a
// stale reference from a toast a newer one has already replaced.
function dismissToast(el, immediate){
  if(el !== activeToastEl) return;
  if(activeToastTimer){ clearTimeout(activeToastTimer); activeToastTimer = null; }
  activeToastEl = null;
  el.classList.remove('show');
  if(immediate) el.remove();
  else setTimeout(()=> el.remove(), 300);
}

// opts (all optional): {actionLabel, onAction, duration}. Passing onAction adds an inline action
// button (default label "Undo") for actions like Archive/Pin that can be reversed by calling the
// same toggle function again -- see toggleArchive()/togglePin(). Only one toast shows at a time;
// a new call clears whatever's currently on screen first.
function toast(msg, opts){
  opts = opts || {};
  if(activeToastEl) dismissToast(activeToastEl, true);
  const el = document.createElement('div');
  el.className = opts.onAction ? 'toast toast-action' : 'toast';
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  el.textContent = msg;
  if(opts.onAction){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action-btn';
    btn.textContent = opts.actionLabel || 'Undo';
    btn.onclick = () => {
      // Clear the auto-dismiss timer before anything else so a click racing the timeout can
      // never let onAction() fire twice.
      if(activeToastTimer){ clearTimeout(activeToastTimer); activeToastTimer = null; }
      dismissToast(el, true);
      opts.onAction();
    };
    el.appendChild(btn);
  }
  document.body.appendChild(el);
  activeToastEl = el;
  requestAnimationFrame(()=> el.classList.add('show'));
  const duration = opts.duration != null ? opts.duration : (opts.onAction ? 5000 : 2400);
  activeToastTimer = setTimeout(()=> dismissToast(el, false), duration);
}

/* ---------- back-button navigation ----------
   Without this, the browser/hardware Back button has nowhere to go within a single-page app
   that never touches history — it just exits the site from any screen. Every "deeper" view
   (Settings, the archived-documents view, any open modal) pushes one history entry; Back (or
   an in-app back control, routed through goBackOneLayer so both paths stay in sync) pops
   exactly one layer via popstate before ever reaching the browser's own "leave the page" step.

   The one number that matters — how many of our own entries deep the CURRENT entry is — is
   never mirrored in a separate JS variable. Two earlier versions tried that (a hand
   incremented/decremented counter), and it kept drifting from reality: signing out reset the

let changelogCheckedThisSession = false;
// Called after every path that lands on the vault screen (sign-in, silent session restore,
// reconnect, offline open) — safe to call more than once per session, since the guard below makes
// every call after the first a no-op.
function maybeShowChangelog(){
  if(changelogCheckedThisSession) return;
  changelogCheckedThisSession = true;
  try{
    // A vault provisioned for the very first time on this exact call has nothing to catch up on —
    // whatever they're seeing right now IS their baseline, so recording it silently (rather than
    // showing a new sign-up a list of changes to a version of the app they never used) is still
    // correct. But this exact moment — and only this moment, never again for this account — is
    // also precisely when introducing the app itself is actually useful, so show that instead of
    // just returning.
    if(!state.vaultWasAlreadyProvisioned){
      localStorage.setItem('vault-last-seen-version', APP_VERSION);
      state.welcomeStep = 0;
      state.modal = 'welcome';
      pushAppHistoryState();
      renderModal();
      return;
    }
    const lastSeen = localStorage.getItem('vault-last-seen-version');
    if(lastSeen === APP_VERSION) return;
    // No recorded version at all on this device isn't necessarily a brand-new install (this feature
    // didn't exist before a certain point — plenty of already-provisioned accounts will hit this on
    // their first open after it ships) — treat it the same as "show everything currently on file",
    // rather than assuming it means nothing changed.
    const items = CHANGELOG.filter(e => !lastSeen || e.version > lastSeen).flatMap(e => e.items);
    localStorage.setItem('vault-last-seen-version', APP_VERSION);
    if(!items.length) return;
    state.pendingChangelogItems = items;
    state.modal = 'changelog';
    pushAppHistoryState();
    renderModal();
  } catch(e){ console.error('Changelog check failed', e); }
}

// Re-opens the exact same 'welcome' modal maybeShowChangelog() shows automatically to a brand-new
// account — wired to Settings > About > "Take a tour" so anyone can replay the full walkthrough
// later, always starting from step 1 regardless of where a previous viewing left off.
function openWelcomeTour(){
  state.welcomeStep = 0;
  state.modal = 'welcome';
  pushAppHistoryState();
  render();
}

// Updates the ALREADY-OPEN welcome modal's step content in place — icon, title, description,
// progress dots, and the Next/Back buttons' label/visibility — instead of going through the
// generic renderModal(), which tears down and recreates the whole overlay from scratch. That
// matters here specifically because .modal-overlay/.modal-sheet each carry their own CSS entrance
// animation (overlayFadeIn/sheetSlideUp), which would otherwise replay in full on every single
// Next/Back tap — looking like the entire screen "refreshes" rather than a smooth step change.
// The very first time this modal opens (see the state.modal === 'welcome' block above) still goes
// through the normal full render, so the entrance animation still plays exactly once, on open.
function updateWelcomeStepContent(){
  const stepIdx = Math.min(Math.max(state.welcomeStep, 0), WELCOME_FEATURES.length - 1);
  const f = WELCOME_FEATURES[stepIdx];
  const isFirst = stepIdx === 0;
  const isLast = stepIdx === WELCOME_FEATURES.length - 1;
  const intro = document.getElementById('welcomeIntro');
  if(intro) intro.style.display = isFirst ? '' : 'none';
  const iconEl = document.getElementById('welcomeFeatureIcon');
  if(iconEl) iconEl.innerHTML = icon(f.icon, 20);
  const titleEl = document.getElementById('welcomeFeatureTitle');
  if(titleEl) titleEl.textContent = f.title;
  const descEl = document.getElementById('welcomeFeatureDesc');
  if(descEl) descEl.textContent = f.desc;
  const stepsEl = document.getElementById('welcomeSteps');
  if(stepsEl){
    stepsEl.setAttribute('aria-label', `Step ${stepIdx+1} of ${WELCOME_FEATURES.length}`);
    Array.from(stepsEl.children).forEach((dot,i) => dot.classList.toggle('active', i===stepIdx));
  }
  const nextBtn = document.getElementById('welcomeNextBtn');
  if(nextBtn) nextBtn.textContent = isLast ? "Let's go" : 'Next';
  const backBtn = document.getElementById('welcomeBackBtn');
  if(backBtn) backBtn.style.display = isFirst ? 'none' : '';
  wireWelcomeStepButtons();
}
// (Re-)wires the Next/Back buttons for the CURRENT step — called both from the modal's initial
// full render and from updateWelcomeStepContent() above, since each step's Next handler needs to
// close over that exact step's own isLast/stepIdx values.
function wireWelcomeStepButtons(){
  const stepIdx = Math.min(Math.max(state.welcomeStep, 0), WELCOME_FEATURES.length - 1);
  const isLast = stepIdx === WELCOME_FEATURES.length - 1;
  const nextBtn = document.getElementById('welcomeNextBtn');
  if(nextBtn) nextBtn.onclick = () => {
    if(isLast){ closeModal(); return; }
    state.welcomeStep = stepIdx + 1;
    updateWelcomeStepContent();
  };
  const backBtn = document.getElementById('welcomeBackBtn');
  if(backBtn) backBtn.onclick = () => { state.welcomeStep = stepIdx - 1; updateWelcomeStepContent(); };
}

// Defensive hedge: reported symptom was Back closing the app with no warning at all on a
// genuinely fresh load/sign-in, before any other tap — but only once something else had been
// tapped first did the warning reliably appear. The one difference between those two moments is
// whether a real user gesture had occurred yet, and some Android WebView/browser combinations are
// known to not always honor a history entry pushed before any gesture the same way for
// hardware-Back purposes as one pushed after one — which the boot-time arm above always is. Force
// one fresh guard entry the moment the very first real interaction happens on an idle root screen,
// regardless of what our own bookkeeping already believes (armExitGuardIfIdle's own !guardArmed
// check would otherwise skip it here, since nothing else invalidates guardArmed between boot and
// this).
//
// {once:true} alone doesn't work here and was the actual bug behind the inconsistency: it detaches
// the listener after the very FIRST pointerdown no matter what the handler does internally — and
// on a real load, that first tap very often lands while state.screen is still 'checking' (the
// loading splash, shown before auth has even resolved), which this handler deliberately ignores.
// That silently burned the one-shot hedge for nothing, leaving only the boot-time entry — exactly
// the unreliable-for-Back-purposes one this hedge exists to back up — for the rest of that whole
// page load. Removing the listener manually, only once it actually succeeds, means every
// pointerdown gets a chance until the real first interaction on vault/settings finally lands.
function armGuardOnFirstRealGesture(){
  if(state.screen === 'checking' || !isIdleRootScreen()) return;
  document.removeEventListener('pointerdown', armGuardOnFirstRealGesture, {capture: true});
  if(safePushHistoryState({seq: currentHistorySeq() + 1, guard: true})) guardArmed = true;
}
document.addEventListener('pointerdown', armGuardOnFirstRealGesture, {capture: true});

/* ---------- theme ---------- */
function currentTheme(){
  try{ return localStorage.getItem('vault-theme') || 'system'; } catch(e){ return 'system'; }
}
function applyTheme(theme){
  if(theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem('vault-theme', theme); } catch(e){}
  updateThemeColorMeta(theme);
}
// Keeps the browser/OS chrome (status bar, task-switcher header, Safari toolbar) matching whichever
// palette is actually on screen — applyTheme() only ever toggled the data-theme attribute before,
// leaving that chrome stuck on the light-mode blue even in dark mode.
function updateThemeColorMeta(theme){
  const isDark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', isDark ? '#111214' : '#1a73e8');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(currentTheme() === 'system') updateThemeColorMeta('system');
});

/* ---------- document sort preference ----------
   Same getter/setter shape as currentTheme()/applyTheme() above: a plain localStorage string,
   swallowed try/catch on both read and write, default chosen so a user who's never touched the
   control sees no change at all. 'date-added-descending' reproduces the order documents already
   come back in from Firestore (see prefetchUserMetaReads's orderBy('addedAt','desc')), which is
   today's existing on-screen order. */
function currentDocSort(){
  try{ return localStorage.getItem('vault-doc-sort') || 'date-added-descending'; } catch(e){ return 'date-added-descending'; }
}
function setDocSort(mode){
  try{ localStorage.setItem('vault-doc-sort', mode); } catch(e){}
}

/* ---------- app lock ----------
   An optional, opt-in local gate on top of the already-persistent Google sign-in — the whole
   point of staying signed in is that Vault is always one tap away, which also means anyone who
   picks up an already-unlocked phone can open it. This never touches the real security boundary
   (Google Sign-In); it's a quick re-verify layer, same idea as a banking app's PIN/biometric lock
   on top of the phone's own lock screen. Entirely device-local: the PIN hash and biometric
   credential id live in localStorage, never synced or sent anywhere, so a new device just starts
   fresh with no lock configured. */
function isAppLockEnabled(){
  try{ return localStorage.getItem('vault-lock-enabled') === 'true'; } catch(e){ return false; }
}
function hasBiometricUnlockConfigured(){
  try{ return !!localStorage.getItem('vault-lock-webauthn-id'); } catch(e){ return false; }
}
async function biometricUnlockAvailable(){
  return !!(window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
    && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false));
}
async function sha256Hex(text){
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function setAppLockPin(pin){
  const hash = await sha256Hex(pin);
  try{ localStorage.setItem('vault-lock-pin-hash', hash); localStorage.setItem('vault-lock-enabled', 'true'); } catch(e){}
}
async function verifyAppLockPin(pin){
  try{
    const stored = localStorage.getItem('vault-lock-pin-hash');
    return !!stored && stored === await sha256Hex(pin);
  } catch(e){ return false; }
}
async function setupBiometricUnlock(){
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: {name: 'Vault'},
      user: {
        id: crypto.getRandomValues(new Uint8Array(16)),
        name: (state.user && state.user.email) || 'vault-user',
        displayName: (state.user && state.user.name) || 'Vault'
      },
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required'},
      timeout: 60000
    }
  });
  const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem('vault-lock-webauthn-id', credIdB64);
  localStorage.setItem('vault-lock-enabled', 'true');
}
async function verifyBiometricUnlock(){
  const credIdB64 = localStorage.getItem('vault-lock-webauthn-id');
  if(!credIdB64) return false;
  try{
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{id: Uint8Array.from(atob(credIdB64), c => c.charCodeAt(0)), type: 'public-key'}],
        userVerification: 'required',
        timeout: 60000
      }
    });
    return true;
  } catch(e){ console.warn('Biometric unlock failed or was cancelled', e); return false; }
}
function turnOffAppLock(){
  try{
    localStorage.removeItem('vault-lock-enabled');
    localStorage.removeItem('vault-lock-pin-hash');
    localStorage.removeItem('vault-lock-webauthn-id');
  } catch(e){}
}
// Turns off just the biometric shortcut, leaving the PIN (and app lock overall) intact — the PIN
// stays as the fallback either way, so this never needs to touch vault-lock-enabled/-pin-hash.
function turnOffBiometricUnlock(){
  try{ localStorage.removeItem('vault-lock-webauthn-id'); } catch(e){}
}

/* ---------- Quick Reference encryption: crypto primitives ----------
   Optional, opt-in, client-side encryption for Quick Reference entry VALUES only (never labels —
   see quickRefMatchesSearch(), deliberately untouched, so search keeps working without unlocking
   first). The passphrase itself never leaves the browser: only a random salt and an encrypted
   "canary" (a fixed marker used solely to verify a passphrase guess, never anything reversible)
   are synced to Firestore at meta/quickRefCrypto (see loadUserData() and
   turnOnQuickRefEncryption() below) — everything else, including the derived key, stays local to
   whichever device/session typed the passphrase in. A forgotten passphrase is therefore
   permanently unrecoverable by design: no reset link, no backend override — only the destructive
   "forgot your passphrase" wipe (see resetForgottenQuickRefPassphrase()). */
const QUICKREF_CANARY_PLAINTEXT = 'vault-quickref-canary-v1';
const QUICKREF_PBKDF2_ITERATIONS = 210000; // deliberately slow — every caller that derives a key
                                            // must show a disabled/pending button state, never let
                                            // this look hung (see the setup/change/unlock modals).
const QUICKREF_KDF_LABEL = 'PBKDF2-SHA256';
const QUICKREF_MIN_PASSPHRASE_LENGTH = 8;

// Same base64 <-> ArrayBuffer idiom already used above for the WebAuthn credential id (btoa +
// String.fromCharCode to encode, atob + charCodeAt to decode) — kept identical rather than
// reaching for a different encoding approach for this feature.
function bufToBase64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToBuf(b64){
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
}

// PBKDF2-SHA256 -> a non-extractable AES-GCM-256 CryptoKey. Non-extractable means the key can
// encrypt/decrypt for the life of this session but can never itself be read back out or
// persisted — there is no code path by which the derived key could accidentally leak into
// localStorage/IndexedDB/a backend.
async function deriveQuickRefKey(passphrase, saltB64, iterations){
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: base64ToBuf(saltB64), iterations, hash: 'SHA-256'},
    baseKey,
    {name: 'AES-GCM', length: 256},
    false,
    ['encrypt', 'decrypt']
  );
}
// A fresh random IV every call, per the AES-GCM requirement that an IV never repeat under the
// same key. {iv, ct} (both base64) is the shape every encrypted Quick Reference value and the
// canary itself take on — plain enough to round-trip through JSON (Firestore, quickrefs.json).
async function encryptQuickRefString(key, plaintext){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(plaintext));
  return {iv: bufToBase64(iv), ct: bufToBase64(ct)};
}
async function decryptQuickRefString(key, encrypted){
  const plainBuf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: base64ToBuf(encrypted.iv)}, key, base64ToBuf(encrypted.ct));
  return new TextDecoder().decode(plainBuf);
}
function buildQuickRefCanary(key){
  return encryptQuickRefString(key, QUICKREF_CANARY_PLAINTEXT);
}
// AES-GCM decryption throws an OperationError on a wrong key (or corrupt data) — caught here and
// turned into a plain "false" so a wrong passphrase guess during unlock is an ordinary failed
// check, never an uncaught exception that would crash the unlock flow.
async function verifyQuickRefCanary(key, canary){
  try{
    return (await decryptQuickRefString(key, canary)) === QUICKREF_CANARY_PLAINTEXT;
  } catch(e){
    return false;
  }
}
// Shape-based detection, deliberately: a plain string is plaintext (encryption off, or this one
// entry hasn't been re-encrypted yet), an {iv,ct} object is ciphertext. Every place that reads a
// Quick Reference entry's value must go through this instead of trusting
// isQuickRefEncryptionEnabled() alone — an enable/disable/change-passphrase operation interrupted
// partway through (see the write-ordering comments on turnOnQuickRefEncryption() and
// turnOffQuickRefEncryption()) can leave some entries in one shape while the account-level flag
// already says the other, and this per-entry check is what makes that survivable instead of
// catastrophic.
function isEncryptedQuickRefValue(value){
  return !!value && typeof value === 'object' && typeof value.iv === 'string' && typeof value.ct === 'string';
}

// Whether Quick Reference encryption is currently turned on for this account — mirrors
// isAppLockEnabled()'s shape, just backed by the Firestore-synced state.qrCrypto instead of a
// localStorage flag (see Part B's data model: this needs to be known even before Drive access,
// and even fully offline via the cached copy — see cacheQrCryptoOffline()/loadOfflineQrCrypto()).
function isQuickRefEncryptionEnabled(){
  return !!(state.qrCrypto && state.qrCrypto.enabled);
}

// Display-decryption helper: a plain string (plaintext, or encryption off) is returned as-is; the
// {iv,ct} shape is decrypted with the CURRENT session's derived key. Callers are expected to have
// already checked state.qrUnlocked (renderQuickRef() forces every encrypted entry to a masked
// placeholder and redirects reveal/copy/edit to the unlock prompt while locked, so this should
// never actually be reached with a null key in normal use) — this still throws rather than
// silently returning garbage if it ever is, since decrypting is the one thing this file must never
// paper over with a fallback value.
async function quickRefDisplayValue(ref){
  if(!isEncryptedQuickRefValue(ref.value)) return ref.value;
  if(!state.qrCryptoKey) throw new Error('Quick Reference is locked.');
  return decryptQuickRefString(state.qrCryptoKey, ref.value);
}

// Whether the *current* app open needs the lock screen right now — false forever if the feature
// isn't turned on; otherwise true until a successful unlock, and true again after the page has
// sat hidden (backgrounded/switched away) past the grace period, same idea as a banking app
// re-locking after you've been away a while rather than only once per cold start.
let appLockUnlockedThisLoad = false;
let appLockHiddenAt = null;
const APP_LOCK_GRACE_MS = 2*60*1000;
// Guards the auto-biometric attempt in renderLocked() so a re-render while still locked (e.g. the
// visibilitychange listener below calling render() again) doesn't re-fire the OS biometric prompt
// on top of itself. Reset in markAppUnlocked() so the next time the app actually locks, it tries
// biometric fresh again.
let bioAutoAttemptedThisLock = false;
function isAppLockDue(){
  if(!isAppLockEnabled()) return false;
  if(!appLockUnlockedThisLoad) return true;
  return !!(appLockHiddenAt && (Date.now() - appLockHiddenAt) > APP_LOCK_GRACE_MS);
}
function markAppUnlocked(){
  appLockUnlockedThisLoad = true;
  appLockHiddenAt = null;
  bioAutoAttemptedThisLock = false;
  render();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){
    if(isAppLockEnabled()) appLockHiddenAt = Date.now();
  } else if(document.visibilityState === 'visible'){
    if(appLockHiddenAt && (Date.now() - appLockHiddenAt) > APP_LOCK_GRACE_MS) appLockUnlockedThisLoad = false;
    appLockHiddenAt = null;
    // Settings can have its own sensitive modals open (Change PIN, Delete Account, App-Lock setup)
    // and needs the same re-verify gate as the vault — omitting it here used to mean the lock never
    // engaged at all if the app was backgrounded while on Settings, since nothing else re-renders on
    // its own when the tab becomes visible again.
    //
    // Gated on isAppLockDue() too — an unconditional render() here (the original shape of this
    // fix) tore down and rebuilt whatever was already open on EVERY foreground return, lock enabled
    // or not, even though the only reason this listener touches the DOM at all is to let the lock
    // take over when it's actually due. That silently destroyed a document viewer mid-swipe-gesture
    // (a fresh renderModal() call replaces the .modal-sheet node the gesture's listeners are bound
    // to, and re-fetches the document from scratch) on something as routine as a notification
    // banner briefly stealing focus. Now it only re-renders when there's something for the lock to
    // actually do, leaving an open document/modal/gesture untouched otherwise.
    if((state.screen === 'vault' || state.screen === 'settings' || state.screen === 'quickref' || state.screen === 'upcoming') && isAppLockDue()) render();
  }
});

/* ---------- reminders ----------
   Unlike app lock, this setting has to be readable by a server-side job (the Apps Script daily
   digest trigger) with no live session, so it can't live in localStorage — it's mirrored in
   Firestore at meta/reminderSettings (loaded into state.reminderSettings in loadUserData()) plus a
   backend-only emailDigestSubscribers/{uid} index doc the digest job actually enumerates. */
function isEmailDigestEnabled(){
  return !!(state.reminderSettings && state.reminderSettings.emailDigestEnabled);
}
async function toggleEmailDigest(){
  const next = !isEmailDigestEnabled();
  const previous = state.reminderSettings;
  state.reminderSettings = {...state.reminderSettings, emailDigestEnabled: next, updatedAt: new Date().toISOString()};
  render();
  toast(next ? 'Daily email digest turned on' : 'Daily email digest turned off');
  try{
    const batch = db.batch();
    batch.set(userDoc().collection('meta').doc('reminderSettings'), state.reminderSettings, {merge: true});
    const subRef = db.collection('emailDigestSubscribers').doc(state.user.uid);
    if(next) batch.set(subRef, {email: state.user.email, updatedAt: state.reminderSettings.updatedAt});
    else batch.delete(subRef);
    await batch.commit();
  } catch(e){
    // Unlike togglePin's fire-and-forget, this rolls back on failure — a setting that controls
    // whether a background job emails the user is worth not silently diverging from Firestore.
    console.error('Failed to update email digest setting', e);
    state.reminderSettings = previous;
    render();
    toast(friendlyCloudError(e));
  }
}

// null/0 = never (the default — archiving an old behavior promise this deliberately doesn't
// change unless a user opts in). The actual deletion runs server-side, off the same daily Apps
// Script trigger the reminder digest already uses. Code.gs has no generic way to enumerate every
// signed-up account, only specific top-level "registries" of opted-in uids (emailDigestSubscribers,
// pushSubscribers) — archiveRetentionSubscribers/{uid} is the same pattern, storing the retention
// window itself so the daily job doesn't need a second read to find out how long.
async function setArchiveRetention(days){
  const previous = state.reminderSettings;
  const value = days || null;
  state.reminderSettings = {...state.reminderSettings, archiveRetentionDays: value, updatedAt: new Date().toISOString()};
  render();
  try{
    const batch = db.batch();
    batch.set(userDoc().collection('meta').doc('reminderSettings'), state.reminderSettings, {merge: true});
    const subRef = db.collection('archiveRetentionSubscribers').doc(state.user.uid);
    if(value) batch.set(subRef, {archiveRetentionDays: value, updatedAt: state.reminderSettings.updatedAt});
    else batch.delete(subRef);
    await batch.commit();
  } catch(e){
    console.error('Failed to update archive auto-delete setting', e);
    state.reminderSettings = previous;
    render();
    toast(friendlyCloudError(e));
  }
}
// Turning the setting OFF only stops future deletions — always safe, no confirmation needed.
// Turning it ON (or shortening an existing window) needs one: the daily cleanup measures age from
// archivedAt, not from whenever the setting changed, so it applies to documents already archived
// long before today just as much as to anything archived from now on — some could become eligible
// on the very next run. requestArchiveRetentionChange() is what the Settings <select> now calls;
// setArchiveRetention() itself (above) still does the actual write once confirmed.
function requestArchiveRetentionChange(days){
  const value = days || null;
  if(!value){ setArchiveRetention(null); return; }
  state.modal = 'confirmArchiveRetention';
  state.pendingArchiveRetentionDays = value;
  pushAppHistoryState();
  render();
}
// Shared by the confirmArchive/renewExpired modals — describes what actually happens to a document
// on archiving, which depends entirely on the current auto-delete setting.
function archiveModalMessage(){
  const days = state.reminderSettings.archiveRetentionDays;
  if(!days){
    return 'It stays in Vault for reference, just moved out of your active documents — nothing is deleted, and you can restore it anytime from "View archived" on the main screen.';
  }
  return `It stays in Vault for reference for now. Auto-delete is on (${archiveRetentionDaysLabel(days)}), so after that it moves to "Recently deleted" — then it's gone for good ${TRASH_RETENTION_DAYS} more days after that unless you restore it.`;
}

function isPushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function isPushEnabled(){
  return !!(state.reminderSettings && state.reminderSettings.pushEnabled);
}
// Browsers never re-prompt once denied — requestPermission() just resolves 'denied' immediately
// with no UI, so this state has to be reflected distinctly rather than left to look like a dead
// button click.
function isPushDenied(){
  return isPushSupported() && Notification.permission === 'denied';
}

// Guarded, lazy getter rather than an unconditional `firebase.messaging()` call at startup like
