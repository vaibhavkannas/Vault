<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault — your documents, secured</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1a73e8">
<script>
  // Applied before first paint so there's no flash of the wrong theme on load.
  try{
    const saved = localStorage.getItem('vault-theme');
    if(saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch(e){}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#1f1f1f;
    --ink-soft:#5f6368;
    --paper:#ffffff;
    --paper-2:#ffffff;
    --brass:#1a73e8;
    --brass-dark:#0842a0;
    --line:#dadce0;
    --danger:#c5221f;
    --danger-bg:#fce8e6;
    --success:#188038;
    --success-bg:#e6f4ea;
    --radius:16px;
    --radius-sm:8px;
    --radius-full:999px;
    --surface-container:#f1f3f4;
    --primary-container:#d3e3fd;
    --on-primary-container:#0842a0;
    --elevation-1:0 1px 2px rgba(60,64,67,0.15), 0 1px 3px 1px rgba(60,64,67,0.08);
    --elevation-2:0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    font-family:'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  /* Chrome's edge-swipe "navigate back/forward" gesture is a distinct code path from a discrete
     Back button/key press: it can skip straight past every history.pushState() entry this file
     creates (there's no different document to show a swipe-preview of for those) and land
     directly on whichever real, different page was open before this one — bypassing the popstate
     handler below entirely, no matter what it does. overscroll-behavior-x is the browser's own
     documented opt-out for exactly that gesture, applied where Chrome looks for it (the
     scrolling root, which is <html> unless something else scrolls instead). A hardware/software
     Back button still reaches popstate normally either way — this only suppresses the swipe.

     overscroll-behavior-y is the same idea for the vertical axis: without it, dragging down from
     the top of the document viewer's own pull-to-dismiss gesture (see enableSwipeToDismiss) also
     triggers Chrome's native pull-to-refresh underneath the modal — the browser watches the page's
     own scroll position for that gesture regardless of what overlay is drawn on top, so a modal
     being open doesn't suppress it on its own. Dragging further reloads the whole tab instead of
     the modal closing. This is the documented opt-out for that, same mechanism as the X-axis one. */
  html{overscroll-behavior: none;}
  body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  /* Baseline tap feedback for every button so nothing feels inert — more specific :active rules
     elsewhere (e.g. button.primary's scale(0.98)) simply override this by CSS specificity. */
  button, .doc-icon, .icon-pick-btn, .cat-toggle, .renewal-card{transition:transform 0.1s ease;}
  button:active, .doc-icon:active, .icon-pick-btn:active, .cat-toggle:active, .renewal-card:active{transform:scale(0.96);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:28%;background:var(--brass);display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-name{font-size:22px;font-weight:400;letter-spacing:0;}

  .login-screen{padding:56px 28px 40px;text-align:center;}
  /* The app-lock screen (renderLocked) adds this on top of the base rule above so it's always the
     topmost, unavoidable layer regardless of what else is in the document — a defense-in-depth
     backstop alongside renderLocked()'s own modal teardown, not a substitute for it. */
  .login-screen.login-screen--locked{position:fixed;inset:0;z-index:1000;background:var(--paper);overflow-y:auto;margin:0;}
  .seal{width:92px;height:92px;margin:0 auto 24px;border-radius:28%;background:var(--brass);display:flex;align-items:center;justify-content:center;box-shadow:var(--elevation-2);}
  .login-screen h1{font-weight:400;font-size:28px;margin:0 0 8px;}
  .checking-spinner{width:26px;height:26px;margin:20px auto 0;border:3px solid var(--surface-container);border-top-color:var(--brass);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .version-tag{text-align:center;font-size:10px;color:var(--ink-soft);opacity:0.55;margin-top:16px;font-variant-numeric:tabular-nums;letter-spacing:0.04em;text-transform:uppercase;}
  .login-screen p{color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 auto 30px;max-width:320px;}
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-full);font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;box-shadow:var(--elevation-1);}
  .google-btn:active{transform:scale(0.98);}
  .gicon{width:18px;height:18px;flex:none;}
  .demo-note{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--surface-container);border-radius:12px;padding:10px 12px;text-align:left;line-height:1.5;}
  .privacy-link{display:block;margin-top:14px;font-size:12px;color:var(--ink-soft);text-decoration:underline;}

  input[type="text"], input[type="date"], input[type="password"], select, textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--surface-container);font-size:14px;color:var(--ink);margin-bottom:12px;font-family:inherit;}
  input[type="text"]:focus, input[type="date"]:focus, input[type="password"]:focus, select:focus, textarea:focus{outline:2px solid var(--brass);outline-offset:-1px;}
  input[type="password"]{letter-spacing:0.3em;}
  button.primary{width:100%;padding:13px 16px;background:var(--brass);color:#fff;border:none;border-radius:var(--radius-full);font-size:14px;font-weight:500;cursor:pointer;}
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.5;}
  button.danger-solid{width:100%;padding:13px 16px;background:var(--danger);color:#fff;border:none;border-radius:var(--radius-full);font-size:14px;font-weight:500;cursor:pointer;}
  button.danger-solid:active{transform:scale(0.98);}
  button.danger-solid:disabled{opacity:0.5;}
  button.ghost{width:100%;padding:12px 16px;background:transparent;color:var(--brass);border:1px solid var(--line);border-radius:var(--radius-full);font-size:13.5px;font-weight:500;cursor:pointer;margin-top:8px;}
  /* svg.icon is display:block (below), which otherwise breaks an icon+text ghost button onto two
     stacked lines instead of one centered row — every other icon+text control in this app already
     sets its own flex/gap for this reason (.archive-toggle, .action-menu button, .fab .primary). */
  button.ghost.ghost-icon{display:flex;align-items:center;justify-content:center;gap:6px;}
  .error-text{color:var(--danger);font-size:12.5px;text-align:left;margin:-6px 0 12px;}

  .vault{padding:8px 16px 86px;}
  .search-bar{position:relative;margin-bottom:14px;}
  .search-bar input{margin-bottom:0;padding-left:44px;padding-right:40px;background:var(--surface-container);border-radius:var(--radius-full);box-shadow:var(--elevation-1);}
  .search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;border-radius:50%;background:none;color:var(--ink-soft);cursor:pointer;}
  .search-clear:hover{color:var(--ink);}
  .search-bar .sicon{position:absolute;left:15px;top:50%;transform:translateY(-50%);display:flex;color:var(--ink-soft);}
  .search-hint{font-size:11.5px;color:var(--ink-soft);margin:6px 2px 0;}

  .quick-actions{display:flex;gap:8px;margin-bottom:6px;}
  .quick-actions button{flex:1;padding:11px 8px;background:var(--surface-container);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);}

  .section-title{font-size:13px;font-weight:500;color:var(--ink);margin:18px 4px 9px;display:flex;align-items:center;justify-content:space-between;}
  .cat-toggle{cursor:pointer;user-select:none;}
  .cat-title-label{display:inline-flex;align-items:center;gap:7px;}
  .cat-count{font-weight:400;color:var(--ink-soft);font-size:12px;display:inline-flex;align-items:center;gap:2px;}
  .cat-chevron{display:flex;transition:transform 0.15s ease;}
  .cat-chevron.collapsed{transform:rotate(-90deg);}
  .archive-toggle{background:none;border:none;color:var(--brass);font-size:12.5px;font-weight:500;cursor:pointer;padding:4px;margin:0 0 14px;display:inline-flex;align-items:center;gap:4px;}

  .reminder-card{display:flex;align-items:center;gap:10px;background:var(--success-bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;font-size:13px;}
  .reminder-card.urgent{background:var(--danger-bg);}
  .reminder-card .rtitle{font-weight:500;flex:1;color:var(--ink);}
  .reminder-card .rdays{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .renewal-strip-wrap{position:relative;margin:0 0 20px;}
  .renewal-strip{display:flex;gap:9px;overflow-x:auto;margin:0;scrollbar-width:none;}
  .renewal-strip::-webkit-scrollbar{display:none;}
  /* Fades the right edge into the page background — the same "more content" cue Gmail and Photos
     use for horizontally-scrolling chip/card rows — but ONLY when the strip actually overflows.
     has-overflow is set after render by measuring scrollWidth vs clientWidth (see renderVault),
     since a card-count guess can't account for actual title lengths or the viewport it's on. */
  .renewal-strip-wrap.has-overflow::after{content:'';position:absolute;top:0;right:0;bottom:0;width:32px;background:linear-gradient(to right, transparent, var(--paper));pointer-events:none;}
  .renewal-card{flex:0 0 auto;min-width:148px;max-width:190px;background:var(--success-bg);border-radius:16px;padding:11px 13px;cursor:pointer;}
  .renewal-card.urgent{background:var(--danger-bg);}
  .renewal-title{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .renewal-days{font-size:11.5px;font-weight:500;color:var(--success);}
  .renewal-card.urgent .renewal-days{color:var(--danger);}

  .doc-card{background:var(--paper-2);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start;box-shadow:var(--elevation-1);}
  .doc-card.is-archived{opacity:0.65;}
  .doc-icon{width:44px;height:44px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;flex:none;position:relative;cursor:pointer;}
  .doc-icon.ocr-badge::after{content:'';position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--paper-2);}
  .doc-body{flex:1;min-width:0;}
  .doc-title{font-weight:400;font-size:15px;margin:0 0 2px;cursor:pointer;}
  .offline-badge{display:inline-flex;vertical-align:middle;color:var(--success);margin-left:4px;}
  .offline-badge svg{display:block;}
  .doc-meta{font-size:12px;color:var(--ink-soft);margin:0;}
  .doc-snippet{font-size:12px;color:var(--ink-soft);margin:4px 0 0;background:var(--surface-container);padding:6px 9px;border-radius:8px;}
  .doc-snippet mark{background:var(--primary-container);color:var(--on-primary-container);padding:0 1px;border-radius:2px;}
  .doc-expiry{font-size:11.5px;margin-top:4px;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;}
  .doc-actions{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .chip-btn{background:var(--primary-container);color:var(--on-primary-container);border:none;border-radius:8px;padding:10px 14px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;min-height:20px;}
  .chip-btn.secondary{background:none;color:var(--ink-soft);padding:10px 12px;}
  .chip-btn.danger{background:var(--danger-bg);color:var(--danger);}
  .doc-link-note{font-size:11.5px;color:var(--ink-soft);margin:4px 0 0;}
  .icon-btn{border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius-sm);padding:6px 10px;font-size:11.5px;cursor:pointer;color:var(--ink);}
  svg.icon{flex:none;display:block;}
  .icon-btn.danger{color:var(--danger);border-color:var(--danger-bg);}
  .icon-btn:disabled{opacity:0.5;cursor:default;}
  /* A checkbox styled as a track+thumb switch — the checkbox itself stays present but invisible
     (opacity:0, full-size, on top) so it keeps native keyboard/screen-reader semantics; only its
     visual is replaced by the two sibling spans. */
  .switch{position:relative;display:inline-block;width:42px;height:24px;flex:none;}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1;}
  .switch-track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background 0.15s ease;}
  .switch-thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--elevation-1);transition:transform 0.15s ease;}
  .switch input:checked ~ .switch-track{background:var(--brass);}
  .switch input:checked ~ .switch-track .switch-thumb{transform:translateX(18px);}
  .switch input:disabled ~ .switch-track{opacity:0.5;}
  .switch input:disabled{cursor:default;}
  .switch input:focus-visible ~ .switch-track{outline:2px solid var(--brass);outline-offset:2px;}
  .icon-only-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);padding:8px;line-height:1;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .icon-only-btn:hover{background:var(--surface-container);}
  .icon-only-btn.small{width:40px;height:40px;padding:0;}
  .legacy-emoji-icon{font-size:18px;line-height:1;}
  .icon-picker{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .icon-pick-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .icon-pick-btn.selected{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;}
  .action-menu-wrap{position:relative;margin-left:auto;}
  .action-menu{position:absolute;right:0;top:44px;background:var(--paper-2);border-radius:12px;box-shadow:var(--elevation-2);padding:6px;min-width:170px;z-index:20;display:flex;flex-direction:column;}
  .action-menu button{background:none;border:none;text-align:left;padding:10px 12px;font-size:13.5px;color:var(--ink);border-radius:8px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .action-menu button:hover{background:var(--surface-container);}
  .action-menu button.danger{color:var(--danger);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;}

  .fab{position:fixed;max-width:480px;margin:0 auto;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 20px;pointer-events:none;}
  .fab button{pointer-events:all;}
  .fab .primary{width:auto;height:56px;padding:0 22px;border-radius:16px;box-shadow:var(--elevation-2);display:flex;align-items:center;gap:8px;}
  .fab .camera-fab{width:56px;height:56px;flex:none;background:var(--primary-container);color:var(--on-primary-container);border:none;border-radius:16px;box-shadow:var(--elevation-2);display:flex;align-items:center;justify-content:center;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:overlayFadeIn 0.2s ease;}
  /* --paper-2 rather than --paper: in light mode they're identical (both white), but in dark mode
     --paper is the page's own background — using it here too was exactly why the sheet visually
     merged into the page behind it, with only the backdrop dimming (and not much else) marking
     where one ends and the other begins. */
  .modal-sheet{width:100%;max-width:480px;background:var(--paper-2);border-radius:28px 28px 0 0;padding:22px 20px 28px;max-height:88vh;overflow-y:auto;animation:sheetSlideUp 0.24s cubic-bezier(0.05,0.7,0.1,1);}
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes sheetSlideUp{from{transform:translateY(28px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-sheet h3{font-weight:400;font-size:20px;margin:0 0 4px;}
  .modal-sheet .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
  .pdf-pages{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .pdf-page-canvas{max-width:100%;border-radius:8px;box-shadow:var(--elevation-1);}
  label.field-label{font-size:12px;font-weight:500;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .modal-close{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .modal-close button{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:50%;}
  .modal-close button:hover{background:var(--surface-container);}
  /* Drag-to-dismiss handle: dragging content itself only ever counts as a dismiss attempt when
     it's already scrolled to the very top, so it can silently do nothing if that's ever untrue —
     the handle has no such condition, any downward drag on it always dismisses. Padding makes the
     actual touch target a proper ~44px even though the visible bar itself stays small and quiet. */
  .sheet-handle{display:flex;justify-content:center;padding:6px 0 14px;margin:-22px -20px 0;touch-action:none;cursor:grab;}
  .sheet-handle::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--line);}
  .file-drop{border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:18px;text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:14px;cursor:pointer;background:var(--surface-container);}
  .file-drop.has-file{color:var(--success);background:var(--success-bg);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333537;color:#f1f1f1;padding:12px 20px;border-radius:8px;font-size:13.5px;z-index:100;opacity:0;transition:opacity 0.25s ease, transform 0.25s ease;pointer-events:none;max-width:88%;text-align:center;box-shadow:var(--elevation-2);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .share-link-box{background:var(--surface-container);border-radius:var(--radius-sm);padding:12px;font-size:12px;word-break:break-all;color:var(--ink-soft);margin-bottom:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .share-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-container);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:12.5px;}

  /* Camera modal */
  .camera-wrap{position:relative;background:#000;border-radius:16px;overflow:hidden;margin-bottom:12px;}
  .camera-wrap video, .camera-wrap canvas{width:100%;display:block;}
  .camera-controls{display:flex;gap:10px;margin-bottom:12px;}
  .camera-controls button{flex:1;}
  .capture-btn{background:var(--brass);color:#fff;border:none;border-radius:var(--radius-full);padding:13px;font-weight:500;font-size:14px;cursor:pointer;}
  .page-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
  .page-thumb-wrap{position:relative;flex:none;}
  .page-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;display:block;}
  .page-thumb-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid var(--paper);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .progress-row{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:10px 0;}
  .progress-track{height:4px;background:var(--surface-container);border-radius:4px;overflow:hidden;margin-bottom:6px;}
  .progress-fill{height:100%;background:var(--brass);transition:width 0.2s ease;}
  .suggest-note{font-size:11.5px;color:var(--success);margin:-8px 0 12px;}
  .field-hint{font-size:11.5px;color:var(--ink-soft);margin:-8px 0 12px;line-height:1.4;}

  /* Dark mode: system preference by default, data-theme attribute forces either way.
     Values follow Material 3's dark color roles — surfaces stay near-black rather than
     inverting to a lit-up dark grey, and the primary/tonal-container pairing swaps so
     containers stay dark with light text on them, matching Google's own dark-mode apps. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8e9ea; --ink-soft:#c4c7c5; --paper:#111214; --paper-2:#1f2124;
      --brass:#8ab4f8; --brass-dark:#d3e3fd;
      --line:#48494c; --danger:#f2b8b5; --danger-bg:#601410; --success:#6dd58c; --success-bg:#0f5223;
      --surface-container:#2c2e32; --primary-container:#0b3a86; --on-primary-container:#d3e3fd;

<div class="app" id="app"></div>

<script>
/* ============================================================
   VAULT — functional prototype
   Real: OCR (Tesseract.js) with an on-device best-effort expiry-
   date guesser, full-text search over OCR'd content, camera
   capture, PDF export of captured pages, Google Sign-In (Firebase
   Auth), per-account cloud storage — Firestore holds document
   metadata, the user's own Google Drive (drive.file scope) holds
   the actual files, organized under a "Vault" folder with one
   subfolder per category.
   By design (per product decision): documents are stored as
   plain, Drive-viewable files, not encrypted — Google Sign-In is
   the only access gate, there is no separate passphrase.
   Simulated: share links — the token/expiry are real and stored
   in Firestore, but nothing resolves vault.app/shared/... since
   there's no backend to serve a document to someone who isn't
   signed into this account.
   ============================================================ */

// PDF.js renders PDF pages onto <canvas> itself rather than relying on any browser's native PDF
// plugin — the whole reason it replaced "open in a new tab" for viewing: that depended on each
// browser's own PDF handling, which turned out to vary (some browsers just downloaded the file
// instead of previewing it). Rendering with canvas behaves identically everywhere.
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const firebaseConfig = {
  apiKey: "AIzaSyC9zVPWgTekPiDUDn1YcLDInHBFRRUgW9w",
  authDomain: "elite-vault-7b00a.firebaseapp.com",
  projectId: "elite-vault-7b00a",
  storageBucket: "elite-vault-7b00a.firebasestorage.app",
  messagingSenderId: "713625816347",
  appId: "1:713625816347:web:72d45d04fbb9e6944c97be"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// Public VAPID key for Web Push (Firebase Console > Project settings > Cloud Messaging > Web Push
// certificates). Not a secret — same exposure level as firebaseConfig.apiKey above.
const FCM_VAPID_KEY = 'BN2rOcWAxDeqds9LlGU--0buUzdWu0wABgZD3OvAdrh8Pr911CxG83DKRSWFjq2lgDppPyMuRlhRM9CjtQNP4fA';

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Browsers only auto-check a registered service worker's script for updates roughly once every
    // 24 hours — fine for a passive install, but far too slow for a PWA reopened many times in the
    // same day expecting each reopen to pick up whatever was just deployed. update() explicitly
    // forces a check (a no-op, not an error, when there's nothing new) rather than waiting on the
    // browser's own throttle; every foreground return is as good a moment as any to ask.
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') reg.update().catch(() => {});
    });
  }).catch(e => console.error('Service worker registration failed', e));
}

// Firebase Auth (above) only handles identity — who's signed in. Drive *access* is a fully
// separate concern, deliberately decoupled from Firebase's own signInWithPopup credential (that
// path depends on a storage-relay iframe between this origin and the authDomain, which needs
// third-party storage access that modern Chrome — and any org-managed browser policy —
// increasingly blocks by default; when blocked, sign-in still succeeds but
// GoogleAuthProvider.credentialFromResult() silently comes back null).
//
// Drive access tokens are short-lived (~1hr) by Google's own design for a public/browser OAuth
// client — no refresh token is ever handed to client-side JS. True persistence (surviving the app
// being closed for days, with zero re-prompting) needs a refresh token, and a refresh token can
// only be requested and stored safely server-side — hence the Apps Script Web App behind
// APPS_SCRIPT_URL (see apps-script/Code.gs), which holds it and mints fresh access tokens on
// request. The two functions below are the only two ways the client ever gets a Drive access
// token now:
//   mintDriveAccessToken()   — every app open, and a periodic background refresh: asks the
//                              backend to turn the stored refresh token into a fresh access
//                              token. No Google UI at all; this is what makes reopening the app
//                              after days closed just work.
//   grantDriveAccessOneTime() — the one-time (or after a revoke) flow: pops Google's consent
//                              screen via GIS's authorization-CODE client (not the old
//                              implicit-token client — a code, not a token, is what the backend
//                              needs to exchange for a refresh token), then hands that code to
//                              the backend to store.
const GOOGLE_OAUTH_CLIENT_ID = '713625816347-61h6pgrra3ec7639kq3o8v3vdfpgmsjb.apps.googleusercontent.com';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzyWh524czh8pIMh-oaJccc6ocSvC1ZscUIBpkc4RGMKjHpX7fIvqKNLSDBv7oL-hFV0w/exec';

// Apps Script Web Apps don't speak the Firebase callable-function protocol, so this is a plain
// fetch — sent as text/plain (not application/json) specifically to stay a CORS "simple request"
// and skip a preflight OPTIONS call Apps Script has no handler for; the ID token travels inside
// the JSON body instead of an Authorization header for the same reason. Apps Script always
// responds 200 for a completed execution regardless of outcome, so success/failure is signaled by
// an `error` field in the body, not the HTTP status.
async function callDriveAuth(payload){
  const idToken = await auth.currentUser.getIdToken();
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({idToken}, payload))
  });
  const data = await res.json();
  if(data.error){
    const err = new Error(data.message || data.error);
    err.details = {reason: data.reason};
    throw err;
  }
  return data; // {accessToken, expiresIn}
}

async function mintDriveAccessToken(){
  return callDriveAuth({mode: 'mint'});
}

let gisCodeClient = null;
function grantDriveAccessOneTime(){
  return new Promise((resolve, reject) => {
    if(!gisCodeClient){
      gisCodeClient = google.accounts.oauth2.initCodeClient({
        client_id: GOOGLE_OAUTH_CLIENT_ID,
        // drive.file: read/write only the files and folders this app creates.
        // drive.metadata.readonly: read-only access to account-wide storage quota, for the
        // Settings storage display — this app still can't see the *content* of other files.
        scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.metadata.readonly',
        ux_mode: 'popup',
        access_type: 'offline', // ask Google to actually issue a refresh token, not just an access token
        prompt: 'consent',      // Google only issues a NEW refresh token when consent is freshly shown
        callback: () => {} // overwritten per-call below, immediately before requestCode()
      });
    }
    gisCodeClient.callback = (resp) => {
      if(resp.error) reject(new Error(resp.error));
      else resolve(resp.code);
    };
    gisCodeClient.error_callback = (err) => reject(new Error((err && err.type) || 'popup_failed'));
    gisCodeClient.requestCode();
  }).then(code => callDriveAuth({mode: 'exchange', code}));
}

// Try the silent path first — a stored refresh token can still be good even after signing back
// in as the same Google account post-sign-out, saving a second consent popup on top of Firebase's
// own sign-in. Only fall back to the one-time consent flow when the function says there's
// nothing to mint from (never provisioned yet, or the grant was revoked).
async function acquireDriveAccess(){
  try{
    return await mintDriveAccessToken();
  } catch(e){
    const reason = e && e.details && e.details.reason;
    if(reason === 'NO_GRANT' || reason === 'GRANT_REVOKED') return await grantDriveAccessOneTime();
    throw e;
  }
}
