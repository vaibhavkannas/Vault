<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault — your documents, secured</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1a73e8">
<script>
  // Applied before first paint so there's no flash of the wrong theme on load.
  try{
    const saved = localStorage.getItem('vault-theme');
    if(saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch(e){}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#1f1f1f;
    --ink-soft:#5f6368;
    --paper:#ffffff;
    --paper-2:#ffffff;
    --brass:#1a73e8;
    --brass-dark:#0842a0;
    --line:#dadce0;
    --danger:#c5221f;
    --danger-bg:#fce8e6;
    --success:#188038;
    --success-bg:#e6f4ea;
    --radius:16px;
    --radius-sm:8px;
    --radius-full:999px;
    --surface-container:#f1f3f4;
    --primary-container:#d3e3fd;
    --on-primary-container:#0842a0;
    --elevation-1:0 1px 2px rgba(60,64,67,0.15), 0 1px 3px 1px rgba(60,64,67,0.08);
    --elevation-2:0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    font-family:'Roboto',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  /* Baseline tap feedback for every button so nothing feels inert — more specific :active rules
     elsewhere (e.g. button.primary's scale(0.98)) simply override this by CSS specificity. */
  button, .doc-icon, .icon-pick-btn, .cat-toggle{transition:transform 0.1s ease;}
  button:active, .doc-icon:active, .icon-pick-btn:active, .cat-toggle:active{transform:scale(0.94);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:28%;background:var(--brass);display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-name{font-size:22px;font-weight:400;letter-spacing:0;}

  .login-screen{padding:56px 28px 40px;text-align:center;}
  .seal{width:92px;height:92px;margin:0 auto 24px;border-radius:28%;background:var(--brass);display:flex;align-items:center;justify-content:center;box-shadow:var(--elevation-2);}
  .login-screen h1{font-weight:400;font-size:28px;margin:0 0 8px;}
  .login-screen p{color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 auto 30px;max-width:320px;}
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-full);font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;box-shadow:var(--elevation-1);}
  .google-btn:active{transform:scale(0.98);}
  .gicon{width:18px;height:18px;flex:none;}
  .demo-note{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--surface-container);border-radius:12px;padding:10px 12px;text-align:left;line-height:1.5;}

  input[type="text"], input[type="date"], select, textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:var(--radius-sm);background:var(--surface-container);font-size:14px;color:var(--ink);margin-bottom:12px;font-family:inherit;}
  input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus{outline:2px solid var(--brass);outline-offset:-1px;}
  button.primary{width:100%;padding:13px 16px;background:var(--brass);color:#fff;border:none;border-radius:var(--radius-full);font-size:14px;font-weight:500;cursor:pointer;}
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.5;}
  button.danger-solid{width:100%;padding:13px 16px;background:var(--danger);color:#fff;border:none;border-radius:var(--radius-full);font-size:14px;font-weight:500;cursor:pointer;}
  button.danger-solid:active{transform:scale(0.98);}
  button.danger-solid:disabled{opacity:0.5;}
  button.ghost{width:100%;padding:12px 16px;background:transparent;color:var(--brass);border:1px solid var(--line);border-radius:var(--radius-full);font-size:13.5px;font-weight:500;cursor:pointer;margin-top:8px;}
  .error-text{color:var(--danger);font-size:12.5px;text-align:left;margin:-6px 0 12px;}

  .vault{padding:8px 16px 86px;}
  .search-bar{position:relative;margin-bottom:14px;}
  .search-bar input{margin-bottom:0;padding-left:44px;background:var(--surface-container);border-radius:var(--radius-full);box-shadow:var(--elevation-1);}
  .search-bar .sicon{position:absolute;left:15px;top:50%;transform:translateY(-50%);display:flex;color:var(--ink-soft);}
  .search-hint{font-size:11.5px;color:var(--ink-soft);margin:6px 2px 0;}

  .quick-actions{display:flex;gap:8px;margin-bottom:6px;}
  .quick-actions button{flex:1;padding:11px 8px;background:var(--surface-container);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);}

  .section-title{font-size:13px;font-weight:500;color:var(--ink);margin:18px 4px 9px;display:flex;align-items:center;justify-content:space-between;}
  .cat-toggle{cursor:pointer;user-select:none;}
  .cat-title-label{display:inline-flex;align-items:center;gap:7px;}
  .cat-count{font-weight:400;color:var(--ink-soft);font-size:12px;display:inline-flex;align-items:center;gap:2px;}
  .cat-chevron{display:flex;transition:transform 0.15s ease;}
  .cat-chevron.collapsed{transform:rotate(-90deg);}
  .archive-toggle{background:none;border:none;color:var(--brass);font-size:12.5px;font-weight:500;cursor:pointer;padding:4px;margin:0 0 14px;display:inline-flex;align-items:center;gap:4px;}

  .reminder-card{display:flex;align-items:center;gap:10px;background:var(--success-bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;font-size:13px;}
  .reminder-card.urgent{background:var(--danger-bg);}
  .reminder-card .rtitle{font-weight:500;flex:1;color:var(--ink);}
  .reminder-card .rdays{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .renewal-strip{display:flex;gap:9px;overflow-x:auto;margin:0 0 20px;scrollbar-width:none;}
  .renewal-strip::-webkit-scrollbar{display:none;}
  .renewal-card{flex:0 0 auto;min-width:148px;max-width:190px;background:var(--success-bg);border-radius:16px;padding:11px 13px;}
  .renewal-card.urgent{background:var(--danger-bg);}
  .renewal-title{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .renewal-days{font-size:11.5px;font-weight:500;color:var(--success);}
  .renewal-card.urgent .renewal-days{color:var(--danger);}

  .doc-card{background:var(--paper-2);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start;box-shadow:var(--elevation-1);}
  .doc-card.is-archived{opacity:0.65;}
  .doc-icon{width:44px;height:44px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;flex:none;position:relative;cursor:pointer;}
  .doc-icon.ocr-badge::after{content:'';position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--paper-2);}
  .doc-body{flex:1;min-width:0;}
  .doc-title{font-weight:400;font-size:15px;margin:0 0 2px;}
  .doc-meta{font-size:12px;color:var(--ink-soft);margin:0;}
  .doc-snippet{font-size:12px;color:var(--ink-soft);margin:4px 0 0;background:var(--surface-container);padding:6px 9px;border-radius:8px;}
  .doc-snippet mark{background:var(--primary-container);color:var(--on-primary-container);padding:0 1px;border-radius:2px;}
  .doc-expiry{font-size:11.5px;margin-top:4px;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;}
  .doc-actions{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .chip-btn{background:var(--primary-container);color:var(--on-primary-container);border:none;border-radius:8px;padding:10px 14px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;min-height:20px;}
  .chip-btn.secondary{background:none;color:var(--ink-soft);padding:10px 12px;}
  .icon-btn{border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius-sm);padding:6px 10px;font-size:11.5px;cursor:pointer;color:var(--ink);}
  svg.icon{flex:none;display:block;}
  .icon-btn.danger{color:var(--danger);border-color:var(--danger-bg);}
  .icon-only-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);padding:8px;line-height:1;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .icon-only-btn:hover{background:var(--surface-container);}
  .icon-only-btn.small{width:40px;height:40px;padding:0;}
  .legacy-emoji-icon{font-size:18px;line-height:1;}
  .icon-picker{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .icon-pick-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .icon-pick-btn.selected{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;}
  .action-menu-wrap{position:relative;margin-left:auto;}
  .action-menu{position:absolute;right:0;top:44px;background:var(--paper-2);border-radius:12px;box-shadow:var(--elevation-2);padding:6px;min-width:170px;z-index:20;display:flex;flex-direction:column;}
  .action-menu button{background:none;border:none;text-align:left;padding:10px 12px;font-size:13.5px;color:var(--ink);border-radius:8px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .action-menu button:hover{background:var(--surface-container);}
  .action-menu button.danger{color:var(--danger);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;}

  .fab{position:fixed;max-width:480px;margin:0 auto;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 20px;pointer-events:none;}
  .fab button{pointer-events:all;}
  .fab .primary{width:auto;padding:16px 22px;border-radius:16px;box-shadow:var(--elevation-2);display:flex;align-items:center;gap:8px;}
  .fab .camera-fab{width:56px;height:56px;flex:none;background:var(--primary-container);color:var(--on-primary-container);border:none;border-radius:16px;box-shadow:var(--elevation-2);display:flex;align-items:center;justify-content:center;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:overlayFadeIn 0.2s ease;}
  .modal-sheet{width:100%;max-width:480px;background:var(--paper);border-radius:28px 28px 0 0;padding:22px 20px 28px;max-height:88vh;overflow-y:auto;animation:sheetSlideUp 0.24s cubic-bezier(0.05,0.7,0.1,1);}
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes sheetSlideUp{from{transform:translateY(28px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-sheet h3{font-weight:400;font-size:20px;margin:0 0 4px;}
  .modal-sheet .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
  label.field-label{font-size:12px;font-weight:500;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .modal-close{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .modal-close button{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:50%;}
  .modal-close button:hover{background:var(--surface-container);}
  .file-drop{border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:18px;text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:14px;cursor:pointer;background:var(--surface-container);}
  .file-drop.has-file{color:var(--success);background:var(--success-bg);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333537;color:#f1f1f1;padding:12px 20px;border-radius:8px;font-size:13.5px;z-index:100;opacity:0;transition:opacity 0.25s ease, transform 0.25s ease;pointer-events:none;max-width:88%;text-align:center;box-shadow:var(--elevation-2);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .share-link-box{background:var(--surface-container);border-radius:var(--radius-sm);padding:12px;font-size:12px;word-break:break-all;color:var(--ink-soft);margin-bottom:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .share-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-container);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:12.5px;}

  /* Camera modal */
  .camera-wrap{position:relative;background:#000;border-radius:16px;overflow:hidden;margin-bottom:12px;}
  .camera-wrap video, .camera-wrap canvas{width:100%;display:block;}
  .camera-controls{display:flex;gap:10px;margin-bottom:12px;}
  .camera-controls button{flex:1;}
  .capture-btn{background:var(--brass);color:#fff;border:none;border-radius:var(--radius-full);padding:13px;font-weight:500;font-size:14px;cursor:pointer;}
  .page-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
  .page-thumb-wrap{position:relative;flex:none;}
  .page-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;display:block;}
  .page-thumb-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid var(--paper);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .progress-row{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:10px 0;}
  .progress-track{height:4px;background:var(--surface-container);border-radius:4px;overflow:hidden;margin-bottom:6px;}
  .progress-fill{height:100%;background:var(--brass);transition:width 0.2s ease;}
  .suggest-note{font-size:11.5px;color:var(--success);margin:-8px 0 12px;}

  /* Dark mode: system preference by default, data-theme attribute forces either way.
     Values follow Material 3's dark color roles — surfaces stay near-black rather than
     inverting to a lit-up dark grey, and the primary/tonal-container pairing swaps so
     containers stay dark with light text on them, matching Google's own dark-mode apps. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e3e3e3; --ink-soft:#c4c7c5; --paper:#131314; --paper-2:#1e1f20;
      --brass:#a8c7fa; --brass-dark:#d3e3fd;
      --line:#444746; --danger:#f2b8b5; --danger-bg:#601410; --success:#6dd58c; --success-bg:#0f5223;
      --surface-container:#282a2c; --primary-container:#0842a0; --on-primary-container:#d3e3fd;
      --elevation-1:0 1px 3px rgba(0,0,0,0.5); --elevation-2:0 2px 8px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --ink:#e3e3e3; --ink-soft:#c4c7c5; --paper:#131314; --paper-2:#1e1f20;
    --brass:#a8c7fa; --brass-dark:#d3e3fd;
    --line:#444746; --danger:#f2b8b5; --danger-bg:#601410; --success:#6dd58c; --success-bg:#0f5223;
    --surface-container:#282a2c; --primary-container:#0842a0; --on-primary-container:#d3e3fd;
    --elevation-1:0 1px 3px rgba(0,0,0,0.5); --elevation-2:0 2px 8px rgba(0,0,0,0.6);
  }

  /* Settings screen */
  .settings-header{display:flex;align-items:center;gap:14px;padding:20px 16px 14px;}
  .settings{padding:12px 20px 60px;}
  .settings-section{margin-bottom:28px;}
  .settings-section h4{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:0 0 10px;font-weight:500;}
  .acct-card{display:flex;align-items:center;gap:12px;background:var(--paper-2);border-radius:var(--radius);padding:14px;box-shadow:var(--elevation-1);}
  .acct-avatar{width:44px;height:44px;border-radius:50%;background:var(--brass);flex:none;object-fit:cover;}
  .acct-name{font-weight:500;font-size:14.5px;}
  .acct-email{font-size:12px;color:var(--ink-soft);}
  .storage-bar-track{height:8px;background:var(--surface-container);border-radius:4px;overflow:hidden;margin:10px 0 6px;}
  .storage-bar-fill{height:100%;background:var(--brass);}
  .settings-row{display:flex;align-items:center;justify-content:space-between;background:var(--paper-2);border-radius:var(--radius);padding:14px;margin-bottom:8px;font-size:13.5px;box-shadow:var(--elevation-1);}
  .settings-row button{flex:none;}
  .cat-manage-row{display:flex;align-items:center;gap:10px;background:var(--paper-2);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;box-shadow:var(--elevation-1);}
  .cat-manage-row .cm-icon{width:32px;height:32px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;flex:none;}
  .cat-manage-row .cm-label{flex:1;font-size:13.5px;}
  .danger-zone{border-radius:16px;padding:14px;background:var(--danger-bg);}
  .danger-zone p{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;}
  .theme-toggle-row{display:flex;gap:8px;}
  .theme-toggle-row button{flex:1;padding:11px;border-radius:var(--radius-full);border:1px solid var(--line);background:var(--paper-2);color:var(--ink);cursor:pointer;font-size:13px;font-family:inherit;}
  .theme-toggle-row button.active{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;}

  /* Responsive: wider viewports get real desktop treatment, not a stretched mobile column */
  @media (min-width:860px){
    .app{max-width:1100px;}
    .vault, .settings{padding-left:40px;padding-right:40px;}
    .search-bar{max-width:420px;}
    .doc-card-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px,1fr));gap:12px;}
    .fab{max-width:1100px;justify-content:flex-end;padding-right:40px;}
    .modal-overlay{align-items:center;}
    .modal-sheet{border-radius:16px;max-width:520px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   VAULT — functional prototype
   Real: OCR (Tesseract.js) with an on-device best-effort expiry-
   date guesser, full-text search over OCR'd content, camera
   capture, PDF export of captured pages, Google Sign-In (Firebase
   Auth), per-account cloud storage — Firestore holds document
   metadata, the user's own Google Drive (drive.file scope) holds
   the actual files, organized under a "Vault" folder with one
   subfolder per category.
   By design (per product decision): documents are stored as
   plain, Drive-viewable files, not encrypted — Google Sign-In is
   the only access gate, there is no separate passphrase.
   Simulated: share links — the token/expiry are real and stored
   in Firestore, but nothing resolves vault.app/shared/... since
   there's no backend to serve a document to someone who isn't
   signed into this account.
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyC9zVPWgTekPiDUDn1YcLDInHBFRRUgW9w",
  authDomain: "elite-vault-7b00a.firebaseapp.com",
  projectId: "elite-vault-7b00a",
  storageBucket: "elite-vault-7b00a.firebasestorage.app",
  messagingSenderId: "713625816347",
  appId: "1:713625816347:web:72d45d04fbb9e6944c97be"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(e => console.error('Service worker registration failed', e));
}

// Firebase Auth (above) only handles identity — who's signed in. The Drive access token is
// fetched separately via Google Identity Services' own token client, NOT via Firebase's
// signInWithPopup credential: that credential path depends on a storage-relay iframe between
// this origin and the authDomain, which needs third-party storage access that modern Chrome
// (and any org-managed browser policy) increasingly blocks by default — when blocked, sign-in
// still succeeds but GoogleAuthProvider.credentialFromResult() silently comes back null. GIS's
// token client doesn't have that dependency.
const GOOGLE_OAUTH_CLIENT_ID = '713625816347-61h6pgrra3ec7639kq3o8v3vdfpgmsjb.apps.googleusercontent.com';
let gisTokenClient = null;
// silent=true (default) asks for a token with zero UI — works only when there's already a valid
// grant and no third-party-storage restriction blocking it. silent=false lets GIS show whatever
// popup it actually needs (a real user gesture, e.g. a button click, must be on the call stack
// for the popup to survive the browser's popup blocker).
function requestDriveAccessToken(silent){
  if(silent === undefined) silent = true;
  return new Promise((resolve, reject) => {
    if(!gisTokenClient){
      gisTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_OAUTH_CLIENT_ID,
        // drive.file: read/write only the files and folders this app creates.
        // drive.metadata.readonly: read-only access to account-wide storage quota, for the
        // Settings storage display — this app still can't see the *content* of other files.
        scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.metadata.readonly',
        callback: () => {} // overwritten per-call below, immediately before requestAccessToken()
      });
    }
    gisTokenClient.callback = (resp) => {
      if(resp.error) reject(new Error(resp.error));
      else resolve(resp);
    };
    gisTokenClient.requestAccessToken(silent ? {prompt: ''} : {});
  });
}

function wireIconPicker(inputId){
  const input = document.getElementById(inputId);
  const wrap = document.getElementById(inputId+'Picker');
  if(!input || !wrap) return;
  wrap.querySelectorAll('[data-icon-key]').forEach(btn => {
    btn.onclick = () => {
      input.value = btn.getAttribute('data-icon-key');
      wrap.querySelectorAll('[data-icon-key]').forEach(b => b.classList.toggle('selected', b===btn));
    };
  });
}

/* ---------- back-button navigation ----------
   Without this, the browser/hardware Back button has nowhere to go within a single-page app
   that never touches history — it just exits the site from any screen. Every "deeper" view
   (Settings, the archived-documents view, any open modal) pushes one history entry; Back (or
   an in-app back control, routed through goBackOneLayer so both paths stay in sync) pops
   exactly one layer via popstate before ever reaching the browser's own "leave the page" step. */
let appHistoryDepth = 0;
// Chromium throws a SecurityError on pushState when the document's origin is the opaque "null"
// origin — which is exactly what a page opened via file:// gets (deployed https:// pages are
// unaffected). Guard every call so a blocked History API degrades cleanly instead of leaving
// appHistoryDepth/guardArmed claiming a trap exists that was never actually pushed — that desync
// is what let Back exit immediately with zero interception. Only commit the bookkeeping once the
// push has actually succeeded.
function safePushHistoryState(data){
  try{
    history.pushState(data, '', location.href);
    return true;
  } catch(e){
    console.warn('History API pushState blocked (likely a file:// origin) — the back-button exit guard cannot run in this environment; it will work once deployed to a real https:// origin.', e);
    return false;
  }
}
function pushAppHistoryState(){
  // Whatever guard was armed underneath is no longer the topmost entry — clear the flag so
  // popping back out of THIS layer is treated as an ordinary layer-peel, not as "the exit guard
  // was just consumed" (that was the bug: guardArmed stayed stale/true from the very first arm,
  // so Back from Settings/Archive incorrectly triggered the exit-confirmation).
  guardArmed = false;
  if(safePushHistoryState({vaultDepth: appHistoryDepth + 1})) appHistoryDepth++;
}
function clearTopLayerState(){
  if(state.modal){
    stopCamera();
    if(state.viewObjectUrl){ URL.revokeObjectURL(state.viewObjectUrl); state.viewObjectUrl = null; }
    state.modal = null; state.shareDocId = null; state.editDocId = null; state.deleteDocId = null;
    state.editCategoryId = null; state.viewDocId = null; state.lastGeneratedShareId = null; state.capturedPages = [];
    pendingOcrText = ''; pendingExpirySuggested = false; pendingOcrRunning = false;
  } else if(state.showArchived){
    state.showArchived = false; state.searchQuery = '';
  } else if(state.screen === 'settings'){
    state.screen = 'vault';
  }
}
function goBackOneLayer(){
  if(appHistoryDepth > 0){
    history.back(); // popstate below does the actual state cleanup + render
  } else {
    // Nothing was pushed for this layer (shouldn't normally happen) — clear it directly rather
    // than risk history.back() navigating away from the site entirely.
    clearTopLayerState();
    render();
    armExitGuardIfIdle();
  }
}

// Beyond peeling modal/Settings/Archived layers, the *idle root* screen (Vault or Login, with
// nothing else open) needs its own protection: many browsers/WebViews (notably Android) close
// the page entirely once its history stack is exhausted, which is what "closes the whole app
// from the main screen" was. Fix: keep one extra "guard" entry pushed whenever idle at root; the
// moment it gets popped, ask for confirmation instead of letting the exhaustion happen, and
// re-arm immediately so the confirmation dialog itself is protected the same way.
let guardArmed = false;
let exitConfirmed = false;
function armExitGuardIfIdle(){
  if(!guardArmed && !state.modal && !state.showArchived && state.screen !== 'settings'){
    if(safePushHistoryState({vaultDepth: appHistoryDepth + 1, guard: true})){
      appHistoryDepth++;
      guardArmed = true;
    }
  }
}
window.addEventListener('popstate', () => {
  if(appHistoryDepth > 0) appHistoryDepth--;
  if(guardArmed){
    guardArmed = false;
    if(exitConfirmed){ exitConfirmed = false; return; } // already agreed to leave — let this one through
    // Re-arm the trap FIRST, before spending any time on render() — pushState is effectively
    // instant, so this keeps the window where "no trap exists yet" as close to zero as possible.
    // A second rapid Back press landing inside that window (rather than after re-arming) is the
    // one way this could still let the app close instead of showing the dialog again.
    if(safePushHistoryState({vaultDepth: appHistoryDepth + 1, guard: true})){
      appHistoryDepth++;
      guardArmed = true;
    }
    state.modal = 'exitConfirm';
    render();
    return;
  }
  clearTopLayerState();
  render();
  armExitGuardIfIdle();
});
function cancelExitConfirm(){
  state.modal = null;
  render();
}
function confirmExitApp(){
  exitConfirmed = true;
  state.modal = null;
  render();
  // Back past every one of our own pushed entries (however many piled up from repeated
  // Back-while-the-dialog-was-showing re-arms) to the true entry that existed before we ever
  // touched history — using the tracked depth rather than a fixed guess, since history.go()
  // silently does nothing at all if the offset overshoots past what's actually there. Landing
  // here exhausts our page's own history; a plain web page has no API to force-close its own
  // tab/window (window.close() only works on windows opened by script), so an actual close from
  // here on is the platform's own back-button/WebView behavior taking over — which, on Android
  // specifically, is exactly the "exhausted history closes the app" behavior this whole feature
  // exists to gate behind a confirmation, now deliberately allowed through.
  if(appHistoryDepth > 0) history.go(-appHistoryDepth);
}

/* ---------- Google Drive ---------- */
function driveTokenValid(){ return !!(state.driveAccessToken && state.driveTokenExpiresAt && Date.now() < state.driveTokenExpiresAt); }

// Wraps fetch() with the Drive OAuth token. This token is a client-side popup grant with no
// refresh token behind it (no backend to hold one) — it expires in ~1hr, at which point every
// call here throws DRIVE_TOKEN_EXPIRED so callers can prompt the user to reconnect instead of
// surfacing a raw 401.
async function driveFetch(url, options={}){
  if(!driveTokenValid()){
    const err = new Error('Your Google Drive connection expired.');
    err.code = 'DRIVE_TOKEN_EXPIRED';
    throw err;
  }
  const res = await fetch(url, { ...options, headers: { ...(options.headers||{}), Authorization: 'Bearer ' + state.driveAccessToken } });
  if(res.status === 401){
    const err = new Error('Your Google Drive connection expired.');
    err.code = 'DRIVE_TOKEN_EXPIRED';
    throw err;
  }
  if(!res.ok){
    let detail = '';
    try{ detail = await res.text(); } catch(_){}
    throw new Error(`Drive request failed: ${res.status} ${detail}`.trim());
  }
  return res;
}

async function driveCreateFolder(name, parentId){
  const body = {name, mimeType: 'application/vnd.google-apps.folder'};
  if(parentId) body.parents = [parentId];
  const res = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const json = await res.json();
  return json.id;
}

// Files are stored as their real type (image/PDF) — not encrypted, per product decision — so
// they're directly viewable if opened in Drive itself. Google's multipart-upload endpoint is
// documented to expect the request body as multipart/related (metadata part, then content
// part, joined by a boundary) — NOT the browser's FormData/multipart-form-data format, which
// uses different per-part headers (Content-Disposition instead of a bare Content-Type). Building
// it by hand as a Blob (which can mix strings and binary content directly, no base64 needed)
// matches the documented format exactly instead of relying on Google's parser tolerating the
// wrong one. Uses XMLHttpRequest instead of fetch specifically because fetch has no
// upload-progress event — XHR's upload.onprogress is what powers the progress bar shown while
// saving a document.
function driveUpload(blob, filename, mimeType, parentFolderId, onProgress){
  return new Promise((resolve, reject) => {
    if(!driveTokenValid()){
      const err = new Error('Your Google Drive connection expired.');
      err.code = 'DRIVE_TOKEN_EXPIRED';
      reject(err);
      return;
    }
    const boundary = 'vaultpart_' + Date.now();
    const metadata = {name: filename, mimeType, parents: [parentFolderId]};
    const body = new Blob([
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`,
      `--${boundary}\r\nContent-Type: ${mimeType}\r\n\r\n`,
      blob,
      `\r\n--${boundary}--`
    ]);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart');
    xhr.setRequestHeader('Authorization', 'Bearer ' + state.driveAccessToken);
    xhr.setRequestHeader('Content-Type', `multipart/related; boundary=${boundary}`);
    if(onProgress) xhr.upload.onprogress = (e) => { if(e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300){
        resolve(JSON.parse(xhr.responseText).id);
      } else if(xhr.status === 401){
        const err = new Error('Your Google Drive connection expired.');
        err.code = 'DRIVE_TOKEN_EXPIRED';
        reject(err);
      } else {
        reject(new Error(`Drive request failed: ${xhr.status} ${xhr.responseText}`.trim()));
      }
    };
    xhr.onerror = () => reject(new Error('Network error while uploading to Drive'));
    xhr.send(body);
  });
}
// The Vault's own usage is just the sum of document sizes already known locally — no extra
// call needed. Overall quota needs the drive.metadata.readonly scope (about.get isn't covered
// by drive.file, since it's account-wide info, not something this app created).
async function driveGetStorageQuota(){
  const res = await driveFetch('https://www.googleapis.com/drive/v3/about?fields=storageQuota');
  const json = await res.json();
  return json.storageQuota; // {limit, usage, usageInDrive, ...} — limit is absent for unlimited plans
}
function formatBytes(n){
  if(!n || n<=0) return '0 B';
  const units = ['B','KB','MB','GB','TB'];
  const i = Math.min(units.length-1, Math.floor(Math.log(n)/Math.log(1024)));
  return (n/Math.pow(1024,i)).toFixed(i===0?0:1) + ' ' + units[i];
}
async function driveMoveFile(fileId, fromFolderId, toFolderId){
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${toFolderId}&removeParents=${fromFolderId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({})
  });
}
async function driveDelete(fileId){
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {method:'DELETE'});
}
function friendlyCloudError(e){
  if(e && e.code === 'DRIVE_TOKEN_EXPIRED') return 'Your Google Drive connection expired — reconnect to Google and try again.';
  return 'Something went wrong: ' + (e && e.message ? e.message : 'unknown error');
}

// Runs once per account, the first time it signs in: creates the Vault folder at Drive root
// plus one subfolder per default category, and records everything in Firestore so this never
// has to run again for this account.
async function provisionVault(){
  const vaultFolderId = await driveCreateFolder('Vault');
  const categories = [];
  for(let i=0; i<DEFAULT_CATEGORIES.length; i++){
    const c = DEFAULT_CATEGORIES[i];
    const driveFolderId = await driveCreateFolder(c.label, vaultFolderId);
    categories.push({id:c.id, label:c.label, icon:c.icon, driveFolderId, order:i});
  }
  await userDoc().collection('meta').doc('vault').set({vaultFolderId, createdAt: new Date().toISOString()});
  const batch = db.batch();
  categories.forEach(c => {
    batch.set(userDoc().collection('categories').doc(c.id), {label:c.label, icon:c.icon, driveFolderId:c.driveFolderId, order:c.order});
  });
  await batch.commit();
  state.vaultFolderId = vaultFolderId;
  state.categories = categories;
}

// Loads everything for the signed-in account. Called right after sign-in once state.user.uid
// and a valid Drive token are both ready — provisioning a brand-new account needs Drive access.
async function loadUserData(){
  try{
    // metaSnap.data().vaultFolderId is checked, not just metaSnap.exists — an account from
    // before this cloud-storage redesign has an old-shape meta/vault doc (passphrase salt and
    // canary, no vaultFolderId), which would otherwise be mistaken for an already-provisioned
    // vault and skip folder/category creation entirely.
    const metaSnap = await userDoc().collection('meta').doc('vault').get();
    if(metaSnap.exists && metaSnap.data().vaultFolderId){
      state.vaultFolderId = metaSnap.data().vaultFolderId;
      const catsSnap = await userDoc().collection('categories').orderBy('order').get();
      state.categories = catsSnap.docs.map(d => ({id:d.id, ...d.data()}));
    } else {
      await provisionVault();
    }
    const docsSnap = await userDoc().collection('documents').orderBy('addedAt', 'desc').get();
    // Same reasoning: a document written under the old encrypted schema has no plain `title`/
    // `driveFileId` fields this version relies on. Skip anything that doesn't look like the
    // current shape instead of crashing the render on undefined fields.
    state.documents = docsSnap.docs.map(d => ({id: d.id, ...d.data()})).filter(d => {
      const ok = typeof d.title === 'string' && typeof d.driveFileId === 'string';
      if(!ok) console.warn('Skipping document with an outdated/incompatible shape', d.id);
      return ok;
    });
    const sharesSnap = await userDoc().collection('shares').get();
    state.shares = sharesSnap.docs.map(d => ({id: d.id, ...d.data()}));
  } catch(e){
    console.error('Could not load vault data from the cloud', e);
    toast('Could not load your vault — check your connection and try again.');
  }
}

// Expiry dates come from <input type="date"> as plain "YYYY-MM-DD" strings with no timezone.
// Parsing those with `new Date(str)` treats them as UTC midnight, which silently shifts the
// calendar date by a day in timezones behind UTC. Parse the components as a local date instead.
function parseLocalDate(dateStr){ const [y,m,d] = dateStr.split('-').map(Number); return new Date(y, m-1, d); }
function daysUntil(dateStr){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((parseLocalDate(dateStr)-t)/86400000); }
function formatDate(iso){ return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function formatExpiryDate(dateStr){ return parseLocalDate(dateStr).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Google Calendar's "quick add" URL needs no API call and no extra OAuth scope — it just opens
// a pre-filled event-creation page that the user reviews and saves themselves.
function addToCalendarUrl(doc){
  const d = doc.expiry.replace(/-/g, '');
  const text = encodeURIComponent(`Renew: ${doc.title}`);
  const details = encodeURIComponent(`Reminder from Vault to renew "${doc.title}" (${categoryFor(doc.category).label}).`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${d}/${d}&details=${details}`;
}

// Converts a data: URL (from canvas capture or jsPDF output) into a Blob for Drive upload.
function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mime = header.match(/data:(.*?);base64/)[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type: mime});
}
function extensionForMime(mime){
  if(mime === 'application/pdf') return 'pdf';
  if(mime === 'image/png') return 'png';
  if(mime === 'image/jpeg' || mime === 'image/jpg') return 'jpg';
  return 'dat';
}
function safeFilename(title, mime){
  return title.replace(/[\\/:*?"<>|]/g, '_') + '.' + extensionForMime(mime);
}

// Best-effort: scans OCR text for a date and returns it as "YYYY-MM-DD", or null. Prefers a
// line that mentions expiry-ish keywords over the first date found anywhere. Ambiguous
// DD/MM vs MM/DD numeric dates are read as DD/MM (matches Aadhaar/licence/insurance conventions
// in India, which is what formatDate/formatExpiryDate elsewhere in this app already assume via
// 'en-IN' formatting). Always shown as an editable suggestion, never applied silently.
function guessExpiryDate(ocrText){
  if(!ocrText) return null;
  const lines = ocrText.split('\n');
  const keywordLine = lines.find(l => /expir|valid\s*(upto|until|till)|exp\s*date/i.test(l));
  const searchIn = keywordLine || ocrText;
  const monthNames = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  let m = searchIn.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/); // DD/MM/YYYY
  if(m) return validYmd(+m[3], +m[2]-1, +m[1]);

  m = searchIn.match(/\b(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/); // YYYY-MM-DD
  if(m) return validYmd(+m[1], +m[2]-1, +m[3]);

  m = searchIn.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{4})\b/i); // DD Mon YYYY
  if(m) return validYmd(+m[3], monthNames[m[2].slice(0,3).toLowerCase()], +m[1]);

  return null;
}
function validYmd(y, moIdx, d){
  if(moIdx>=0 && moIdx<=11 && d>=1 && d<=31 && y>1990 && y<2100){
    return `${y}-${String(moIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return null;
}

/* ---------- OCR ---------- */
async function runOcr(dataUrl, onProgress){
  try{
    const result = await Tesseract.recognize(dataUrl, 'eng', {
      logger: m => { if(m.status === 'recognizing text' && onProgress) onProgress(m.progress); }
    });
    return result.data.text.trim();
  } catch(e){
    console.error('OCR failed', e);
    return '';
  }
}

let actionMenuOutsideClickHandler = null;
let searchRenderTimer = null;
function matchesSearch(doc){
  if(!state.searchQuery) return {match:true, snippet:null};
  const q = state.searchQuery.toLowerCase();
  if(doc.title.toLowerCase().includes(q)) return {match:true, snippet:null};
  const text = doc.ocrText || '';
  const idx = text.toLowerCase().indexOf(q);
  if(idx === -1) return {match:false, snippet:null};
  const start = Math.max(0, idx-28);
  const end = Math.min(text.length, idx+q.length+28);
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  const snippet = escapeHtml(text.slice(start,end)).replace(re, '<mark>$1</mark>');
  return {match:true, snippet: (start>0?'…':'') + snippet + (end<text.length?'…':'')};
}

      const docId = btn.getAttribute('data-doc');
      const action = btn.getAttribute('data-menu-action');
      const doc = state.documents.find(x => x.id === docId);
      state.openActionMenu = null;
      if(action === 'edit') openEditModal(docId);
      else if(action === 'archive') toggleArchive(docId);
      else if(action === 'remind' && doc) window.open(addToCalendarUrl(doc), '_blank');
      else if(action === 'download') downloadDocument(docId);
      else if(action === 'delete') requestDeleteDocument(docId);
    };
  });

  // Close any open overflow menu on an outside click. Explicitly drop any handler from a previous
  // render before attaching a new one — render() can run more than once while the menu stays open
  // (e.g. an unrelated toast or background refresh), and {once:true} alone doesn't prevent those
  // extra renders from each attaching their own listener, which would fire and re-render multiple
  // times for a single click.
  if(actionMenuOutsideClickHandler) document.removeEventListener('click', actionMenuOutsideClickHandler);
  actionMenuOutsideClickHandler = null;
  if(state.openActionMenu){
    actionMenuOutsideClickHandler = () => { state.openActionMenu = null; actionMenuOutsideClickHandler = null; render(); };
    document.addEventListener('click', actionMenuOutsideClickHandler, {once: true});
  }

  renderModal();
}

function renderDocCard(d){

function applyExpirySuggestionIfEmpty(inputId, noteId, ocrText){
  const input = document.getElementById(inputId);
  const note = document.getElementById(noteId);
  if(!input || pendingExpirySuggested || input.value) return;
  const guess = guessExpiryDate(ocrText);
  if(guess){
    input.value = guess;
    pendingExpirySuggested = true;
    if(note){ note.textContent = 'Expiry date suggested from the scan — double-check it before saving.'; note.style.display = 'block'; }
  }
}

function setOcrProgress(pct, pageNum, total){
  const el = document.getElementById('ocrProgress');
  if(!el) return;
  el.style.display = 'block';
  const pageLabel = (pageNum && total > 1) ? `Page ${pageNum} of ${total} — ` : '';
  el.innerHTML = `<div class="progress-track"><div class="progress-fill" style="width:${Math.round(pct*100)}%"></div></div>${pageLabel}Reading text on-device… ${Math.round(pct*100)}%`;
}
// fetch() has no upload-progress event, so this is only meaningful for the XHR-based driveUpload.
function setUploadProgress(pct){
  const el = document.getElementById('ocrProgress');
  if(!el) return;
  el.style.display = 'block';
  el.innerHTML = `<div class="progress-track"><div class="progress-fill" style="width:${Math.round(pct*100)}%"></div></div>Uploading to Drive… ${Math.round(pct*100)}%`;
}

async function saveDocument(){
  const title = document.getElementById('docTitle').value.trim();
  const category = document.getElementById('docCategory').value;
  const expiry = document.getElementById('docExpiry').value;
  const errEl = document.getElementById('addErr');
  const saveBtn = document.getElementById('saveDocBtn');

  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  if(!pendingFile){ errEl.textContent='Choose a file.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try{
    await finalizeAndStoreDocument({title, category, expiry, blob: pendingFile, mimeType: pendingFile.type, ocrText: pendingOcrText, onUploadProgress: setUploadProgress});
    closeModal();
    toast(pendingOcrText ? 'Saved and indexed' : 'Saved');
  } catch(e){
    // Without this, any failure here (a huge file, a Drive error, OCR erroring in a way runOcr
    // didn't already catch) left the button stuck on "Saving…" with no way to retry.
    console.error('Save failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save document';
  }
}

async function finalizeAndStoreDocument({title, category, expiry, blob, mimeType, ocrText, onUploadProgress}){
  const cat = categoryFor(category);
  const id = 'doc_' + Date.now();
  const filename = safeFilename(title, mimeType);
  const driveFileId = await driveUpload(blob, filename, mimeType, cat.driveFolderId, onUploadProgress);
  const doc = {
    id, title, category: cat.id, expiry: expiry || null,
    driveFileId, mimeType, size: blob.size || 0,
    ocrText: ocrText || '',
    addedAt: new Date().toISOString(),
    archived: false
  };
  try{
    await persistDocument(doc);
  } catch(e){
    // The Firestore write failed after the Drive upload already succeeded — clean up the now-
    // orphaned Drive file (best-effort) rather than leaving it dangling, and don't add the
    // document to local state below: if it's not in Firestore, it isn't really saved, and the
    // UI shouldn't show it as if it were.
    try{ await driveDelete(driveFileId); } catch(cleanupErr){ console.error('Could not clean up orphaned Drive file', cleanupErr); }
    throw e;
  }
  state.documents.unshift(doc);
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => { const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
}

/* ---------- camera capture ---------- */
let pendingPageOcrTexts = []; // per-page OCR text, parallel to state.capturedPages — lets removing
                               // a page also cleanly drop just that page's text from pendingOcrText
async function startCamera(){
  const video = document.getElementById('cameraVideo');
  if(state.cameraStream){
    // Every capture re-renders the modal, which rebuilds the <video> element from scratch — the
    // stream itself is still live, so reattach it instead of requesting a brand-new one from
    // getUserMedia each time, which would leak the previous stream's tracks running unseen.
    if(video) video.srcObject = state.cameraStream;
    return;
  }
  try{
    state.cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    if(video) video.srcObject = state.cameraStream;
  } catch(e){
    const err = document.getElementById('camErr');
    if(err){ err.textContent = "Couldn't access the camera — check browser permissions."; err.style.display='block'; }
  }
}
function stopCamera(){
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(t=>t.stop()); state.cameraStream = null; }
}
function openCameraModal(){ state.modal = 'camera'; state.capturedPages = []; pendingPageOcrTexts = []; pendingOcrText = ''; pendingExpirySuggested = false; pendingOcrRunning = false; pushAppHistoryState(); render(); }

async function capturePage(){
  const video = document.getElementById('cameraVideo');
  if(!video || !video.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  state.capturedPages.push(dataUrl);
  pendingPageOcrTexts.push('');
  pendingOcrRunning = true;
  renderModal();
  const pageNum = state.capturedPages.length;
  const pageText = await runOcr(dataUrl, pct => setOcrProgress(pct, pageNum, pageNum));
  const progEl = document.getElementById('ocrProgress');
  if(progEl) progEl.style.display = 'none';
  // Re-find this page's CURRENT position rather than trusting the index captured before the
  // OCR await — another page could have been deleted in the meantime, shifting positions, and
  // writing to a stale index would land this text on the wrong page.
  const currentIndex = state.capturedPages.indexOf(dataUrl);
  if(currentIndex !== -1) pendingPageOcrTexts[currentIndex] = pageText;
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  applyExpirySuggestionIfEmpty('camExpiry', 'camExpirySuggestNote', pendingOcrText);
  pendingOcrRunning = false;
  const saveBtn = document.getElementById('saveCamBtn');
  if(saveBtn) saveBtn.disabled = false;
}

function removeCapturedPage(index){
  state.capturedPages.splice(index, 1);
  pendingPageOcrTexts.splice(index, 1);
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  renderModal();
}

async function saveCameraDocument(){
  const title = document.getElementById('camTitle').value.trim();
  const category = document.getElementById('camCategory').value;
  const expiry = document.getElementById('camExpiry').value;
  const errEl = document.getElementById('camErr');
  const saveBtn = document.getElementById('saveCamBtn');

  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  if(!state.capturedPages.length){ errEl.textContent='Capture at least one page.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  const originalLabel = saveBtn.textContent;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try{
    let blob, mimeType;
    if(state.capturedPages.length === 1){
      blob = dataUrlToBlob(state.capturedPages[0]);
      mimeType = 'image/jpeg';
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      state.capturedPages.forEach((img, i) => {
        if(i > 0) pdf.addPage();
        const props = pdf.getImageProperties(img);
        const w = pdf.internal.pageSize.getWidth();
        const h = (props.height * w) / props.width;
        pdf.addImage(img, 'JPEG', 0, 0, w, h);
      });
      blob = dataUrlToBlob(pdf.output('datauristring'));
      mimeType = 'application/pdf';
    }

    await finalizeAndStoreDocument({title, category, expiry, blob, mimeType, ocrText: pendingOcrText, onUploadProgress: setUploadProgress});
    stopCamera();
    closeModal();
    toast('Captured and saved');
  } catch(e){
    console.error('Save failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;
  }
}

/* ---------- edit / view / archive / delete ---------- */
function openEditModal(id){ state.modal = 'edit'; state.editDocId = id; pushAppHistoryState(); render(); }
async function saveEditedDocument(){
  const doc = state.documents.find(d => d.id === state.editDocId);
  if(!doc) return;
  const title = document.getElementById('editTitle').value.trim();
  const category = document.getElementById('editCategory').value;
  const expiry = document.getElementById('editExpiry').value;
  const errEl = document.getElementById('editErr');
  const saveBtn = document.getElementById('saveEditBtn');
  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  try{
    const newCat = categoryFor(category);
    const oldCat = categoryFor(doc.category);
    if(newCat.id !== oldCat.id){
      await driveMoveFile(doc.driveFileId, oldCat.driveFolderId, newCat.driveFolderId);
    }
    const updated = {...doc, title, category: newCat.id, expiry: expiry || null};
    await persistDocument(updated);
    Object.assign(doc, updated);
    closeModal();
    toast('Document updated');
  } catch(e){
    console.error('Edit failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save changes';
  }
}

// Fetches the file's actual bytes and shows them inline instead of leaving the app for Drive's
// own viewer — same alt=media fetch already used for OCR during Drive sync, just rendered here
// instead of run through Tesseract. The modal shell renders immediately (via pushAppHistoryState
// + render below); the fetch result fills in #viewFileContent once it resolves.
//
// PDFs are the one exception: an embedded <embed>/<iframe> PDF is unreliable on mobile browsers
// (most have no built-in plugin for a page-region viewer, only for a full-page/tab one), so a PDF
// is handed to the browser's own full-tab viewer instead — the one approach that behaves the same
// on desktop and mobile. That tab has to be opened synchronously, in the same click, or popup
// blockers kill it — mimeType is already known from state.documents, so this doesn't need to wait
// on the fetch below.
async function viewDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  state.modal = 'viewFile';
  state.viewDocId = id;
  pushAppHistoryState();
  render();
  const isPdf = doc.mimeType === 'application/pdf';
  const pdfTab = isPdf ? window.open('', '_blank') : null;
  if(pdfTab){
    pdfTab.document.write(`<title>${escapeHtml(doc.title)}</title><body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#5f6368;background:#fff;">Loading ${escapeHtml(doc.title)}…</body>`);
  }
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    const blob = await res.blob();
    // Closed/navigated away before the fetch resolved — nothing to fill in, and no stale blob
    // URL to leave dangling.
    if(state.modal !== 'viewFile' || state.viewDocId !== id){ if(pdfTab) pdfTab.close(); return; }
    const url = URL.createObjectURL(blob);
    state.viewObjectUrl = url;
    const contentEl = document.getElementById('viewFileContent');
    if(!contentEl) return;
    if(isPdf){
      if(pdfTab) pdfTab.location.href = url;
      contentEl.innerHTML = `<p class="search-hint">Opened in a new tab — your browser's own PDF viewer handles this more reliably than showing it inline here.</p>`;
    } else {
      contentEl.innerHTML = `<img src="${url}" alt="${escapeHtml(doc.title)}" style="max-width:100%;border-radius:8px;display:block;margin:0 auto;">`;
    }
  } catch(e){
    console.error('View failed', e);
    if(pdfTab) pdfTab.close();
    const contentEl = document.getElementById('viewFileContent');
    if(contentEl) contentEl.innerHTML = `<p class="error-text">${escapeHtml(friendlyCloudError(e))}</p>`;
  }
}

async function downloadDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = safeFilename(doc.title, doc.mimeType);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(e){
    console.error('Download failed', e);
    toast(friendlyCloudError(e));
  }
}

async function toggleArchive(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  doc.archived = !doc.archived;
  render();
  toast(doc.archived ? 'Archived' : 'Restored');
  try{ await userDoc().collection('documents').doc(id).update({archived: doc.archived}); }
  catch(e){ console.error('Failed to update archive state', e); }
}

function requestDeleteDocument(id){ state.modal = 'confirmDelete'; state.deleteDocId = id; pushAppHistoryState(); render(); }
async function confirmDeleteDocument(){
  const id = state.deleteDocId;
  const doc = state.documents.find(d => d.id === id);
  state.documents = state.documents.filter(d => d.id !== id);
  const removedShares = state.shares.filter(s => s.docId === id);
  state.shares = state.shares.filter(s => s.docId !== id);
  closeModal();
  toast('Document deleted');
  try{
    await userDoc().collection('documents').doc(id).delete();
    for(const s of removedShares) await userDoc().collection('shares').doc(s.id).delete();
    if(doc && doc.driveFileId) await driveDelete(doc.driveFileId);
  } catch(e){ console.error('Failed to remove document from storage', e); }
}

/* ---------- sharing ---------- */
function openShareModal(docId){ state.modal='share'; state.shareDocId=docId; state.lastGeneratedShareId=null; pushAppHistoryState(); render(); }
async function generateShare(docId){
  const token = Array.from(crypto.getRandomValues(new Uint8Array(9))).map(b=>b.toString(36)).join('').slice(0,14);
  const expiresAt = new Date(Date.now()+48*3600*1000).toISOString();
  const share = {id: 'share_'+Date.now(), docId, token, expiresAt, revoked:false};
  state.shares.unshift(share);
  // Drive the "here's your link" box off state instead of writing straight into #shareResult:
  // renderModal() below does a full innerHTML rebuild of the modal, which would otherwise wipe
  // out anything written directly into that node a moment earlier.
  state.lastGeneratedShareId = share.id;
  renderModal();
  try{ await userDoc().collection('shares').doc(share.id).set(share); } catch(e){ console.error('Failed to save share', e); }
}
async function revokeShare(shareId){
  const s = state.shares.find(s => s.id === shareId);
  if(s) s.revoked = true;
  renderModal();
  toast('Share revoked');
  if(s){ try{ await userDoc().collection('shares').doc(s.id).set(s); } catch(e){ console.error('Failed to save revoked share', e); } }
}

/* ---------- Drive reconnect ----------
   The Drive OAuth grant runs out in ~1hr with no silent refresh available client-side (no
   backend to hold a refresh token). This mints a fresh one via the same GIS token client used
   at sign-in — it doesn't touch the Firebase auth session or any already-loaded documents,
   since identity and Drive access are handled by separate mechanisms. */
async function reconnectDrive(){
  try{
    const tokenResp = await requestDriveAccessToken();
    state.driveAccessToken = tokenResp.access_token;
    state.driveTokenExpiresAt = Date.now() + (tokenResp.expires_in ? tokenResp.expires_in*1000 : 55*60*1000);
    toast('Reconnected to Google Drive');
    render();
  } catch(e){
    console.error('Reconnect failed', e);
    toast('Could not reconnect — please try again.');
  }
}

/* ---------- category management ---------- */
function openAddCategoryModal(){ state.modal = 'addCategory'; pushAppHistoryState(); render(); }
async function saveNewCategory(){
  const iconKey = document.getElementById('newCatIcon').value.trim() || 'doc';
  const label = document.getElementById('newCatLabel').value.trim();
  const errEl = document.getElementById('newCatErr');
  const btn = document.getElementById('saveNewCatBtn');

  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Creating…';

    const id = 'cat_' + Date.now();
    const driveFolderId = await driveCreateFolder(label, state.vaultFolderId);
    const order = state.categories.length;
    await userDoc().collection('categories').doc(id).set({label, icon: iconKey, driveFolderId, order});
    state.categories.push({id, label, icon: iconKey, driveFolderId, order});
    closeModal();
    toast('Category created');
  } catch(e){
    console.error('Create category failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';

  }

function openEditCategoryModal(id){ state.modal = 'editCategory'; state.editCategoryId = id; pushAppHistoryState(); render(); }
async function saveRenamedCategory(){
  const cat = state.categories.find(c => c.id === state.editCategoryId);
  if(!cat) return;
  const iconKey = document.getElementById('editCatIcon').value.trim() || cat.icon;
  const label = document.getElementById('editCatLabel').value.trim();
  const errEl = document.getElementById('editCatErr');
  const btn = document.getElementById('saveEditCatBtn');
  if(!label){ errEl.textContent='Enter a category name.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    if(label !== cat.label){
      // Best-effort — keeps the Drive folder's own name matching the category label so
      // browsing Drive directly still makes sense; not critical if this one call fails.
      try{
        await driveFetch(`https://www.googleapis.com/drive/v3/files/${cat.driveFolderId}`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: label})
        });
      } catch(renameErr){ console.error('Could not rename the matching Drive folder', renameErr); }
    }
    await userDoc().collection('categories').doc(cat.id).update({label, icon: iconKey});
    cat.label = label; cat.icon = iconKey;
    closeModal();
    toast('Category updated');
  } catch(e){
    console.error('Rename category failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}

async function deleteCategory(id){
  const cat = state.categories.find(c => c.id === id);
  if(!cat) return;
  if(state.categories.length <= 1){ toast('You need at least one category.'); return; }
  const inUse = state.documents.filter(d => d.category === id).length;
  if(inUse > 0){ toast(`Can't delete "${cat.label}" — ${inUse} document${inUse===1?'':'s'} still use it. Move or delete them first.`); return; }
  try{
    await userDoc().collection('categories').doc(id).delete();
    try{ await driveDelete(cat.driveFolderId); } catch(e){ console.error('Could not delete the now-empty Drive folder', e); }
    state.categories = state.categories.filter(c => c.id !== id);
    render();
    toast('Category deleted');
  } catch(e){
    console.error('Delete category failed', e);
    toast(friendlyCloudError(e));
  }
}

/* ---------- sync from Drive ----------
   Picks up files added straight into a category's Drive subfolder outside the app: the
   subfolder a file was found in becomes its category, its filename (minus extension) becomes
   its title, and OCR runs on image files so it's searchable — same as adding through the app,
   just triggered manually here instead of automatically on every load. */
function blobToDataUrl(blob){
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob); });
}

async function runSyncFromDrive(){
  const btn = document.getElementById('syncDriveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  let importedCount = 0;
  try{
    const knownIds = new Set(state.documents.map(d => d.driveFileId));
    for(const cat of state.categories){
      const q = encodeURIComponent(`'${cat.driveFolderId}' in parents and trashed=false`);
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,size)`);
      const json = await res.json();
      for(const f of (json.files || [])){
        if(knownIds.has(f.id)) continue;
        let ocrText = '';
        if(f.mimeType && f.mimeType.startsWith('image/')){
          try{
            const contentRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
            const blob = await contentRes.blob();
            const dataUrl = await blobToDataUrl(blob);
            ocrText = await runOcr(dataUrl);
          } catch(ocrErr){ console.error('Could not OCR a synced file', ocrErr); }
        }
        const title = f.name.replace(/\.[^.]+$/, '') || f.name;
        const doc = {
          id: 'doc_sync_' + Date.now() + '_' + importedCount,
          title, category: cat.id, expiry: null,
          driveFileId: f.id, mimeType: f.mimeType || 'application/octet-stream', size: +(f.size || 0),
          ocrText, addedAt: new Date().toISOString(), archived: false
        };
        await persistDocument(doc);
        state.documents.unshift(doc);
        knownIds.add(f.id);
        importedCount++;
      }
    }
    toast(importedCount ? `Imported ${importedCount} file${importedCount===1?'':'s'} from Drive` : 'Nothing new to import');
    render();
  } catch(e){
    console.error('Sync from Drive failed', e);
    toast(friendlyCloudError(e));
    if(btn){ btn.disabled = false; btn.textContent = 'Sync now'; }
  }
}

/* ---------- export ---------- */
function exportDocumentListCsv(){
  const rows = [['Title','Category','Expiry','Added','Archived','Drive link']];
  state.documents.forEach(d => {
    rows.push([d.title, categoryFor(d.category).label, d.expiry || '', formatDate(d.addedAt), d.archived ? 'Yes' : 'No', `https://drive.google.com/file/d/${d.driveFileId}/view`]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vault-documents.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported document list');
}

/* ---------- sign out / delete account ---------- */
function resetToLoggedOutState(){
  Object.assign(state, {
    screen: 'login', user: null, driveAccessToken: null, driveTokenExpiresAt: null,
    vaultFolderId: null, categories: [], documents: [], shares: [], modal: null,
    searchQuery: '', showArchived: false, collapsedCats: {}, openActionMenu: null
  });
  // A hard reset like this can happen mid-navigation (e.g. sign-out while deep in Settings) —
  // flatten our own depth/guard bookkeeping to match; the caller re-arms the guard for the fresh
  // login screen right after this.
  appHistoryDepth = 0;
  guardArmed = false;
}
function signOutUser(){
  auth.signOut().catch(e => console.error('Sign out error', e));
  resetToLoggedOutState();
  render();
  armExitGuardIfIdle();
  toast('Signed out');
}

function openDeleteAccountModal(){ state.modal = 'deleteAccount'; pushAppHistoryState(); render(); }
async function deleteEverything(){
  const btn = document.getElementById('confirmDeleteAccountBtn');
  const errEl = document.getElementById('deleteAccountErr');
  if(btn){ btn.disabled = true; btn.textContent = 'Deleting…'; }
  try{
    for(const colName of ['documents','shares','categories']){
      const snap = await userDoc().collection(colName).get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    await userDoc().collection('meta').doc('vault').delete();
    if(state.vaultFolderId){
      try{ await driveDelete(state.vaultFolderId); } catch(e){ console.error('Could not delete the Drive Vault folder', e); }
    }
    await auth.currentUser.delete();
    toast('Account and vault deleted');
    resetToLoggedOutState();
    render();
    armExitGuardIfIdle();
  } catch(e){
    console.error('Delete account failed', e);
    if(e && e.code === 'auth/requires-recent-login'){
      if(errEl){ errEl.textContent = 'For your security, Google requires a recent sign-in before deleting your account. Sign out, sign back in, then try deleting again right away.'; errEl.style.display = 'block'; }
    } else if(errEl){
      errEl.textContent = friendlyCloudError(e);
      errEl.style.display = 'block';
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Permanently delete everything'; }
  }
}

// Firebase persists the sign-in session by default, but the app never checked for it on load —
// every fresh page open showed the login screen regardless of a still-valid session, which reads
// to the user as "the app keeps logging me out." Restore silently here: if Firebase still has the
// session, reacquire the Drive token the same silent way the Sign-in button does, and only fall
// back to asking for a fresh sign-in if that silent reacquisition itself fails.
//
// authFlowInProgress guards against a real race: this listener fires on EVERY Firebase auth
// change, including right after a fresh manual sign-in succeeds — and Firebase does not guarantee
// it fires before or after signInWithPopup's own promise resolves. Without the guard, a manual
// sign-in and this restore path could run concurrently, both calling requestDriveAccessToken()
// at once; since both share one GIS token client and its single callback property, the two Google
// popups end up cross-wired with each other — sign-in visibly running through the whole dance
// twice and asking to pick an account repeatedly.
auth.onAuthStateChanged(async (user) => {
  if(!user || state.user || authFlowInProgress) return;
  authFlowInProgress = true;
  state.user = {name: user.displayName, email: user.email, uid: user.uid, photoURL: user.photoURL};
  try{
    const tokenResp = await requestDriveAccessToken(true);
    state.driveAccessToken = tokenResp.access_token;
    state.driveTokenExpiresAt = Date.now() + (tokenResp.expires_in ? tokenResp.expires_in*1000 : 55*60*1000);
    await loadUserData();
    state.screen = 'vault';
    render();
    armExitGuardIfIdle();
  } catch(e){
    console.warn('Could not silently restore Drive access — asking for a one-tap reconnect instead.', e);
    state.screen = 'reconnect';
    render();
    armExitGuardIfIdle();
  } finally {
    authFlowInProgress = false;
  }
});

// Proactively refreshes the Drive token a few minutes before it expires, so an active session
// doesn't hit a dead end mid-action — same silent request used everywhere else. If it fails (e.g.
// the browser blocks the third-party storage a silent grant depends on), the existing "reconnect"
// banner in the vault header still catches it the moment something actually needs the token.
setInterval(async () => {
  if(!state.user || !state.driveAccessToken || !state.driveTokenExpiresAt) return;
  if(state.driveTokenExpiresAt - Date.now() > 5*60*1000) return;
  try{
    const tokenResp = await requestDriveAccessToken(true);
    state.driveAccessToken = tokenResp.access_token;
    state.driveTokenExpiresAt = Date.now() + (tokenResp.expires_in ? tokenResp.expires_in*1000 : 55*60*1000);
  } catch(e){
    console.warn('Background Drive token refresh failed — falling back to the manual reconnect banner.', e);
  }
}, 60*1000);

render();
armExitGuardIfIdle();
</script>
