let changelogCheckedThisSession = false;
// Called after every path that lands on the vault screen (sign-in, silent session restore,
// reconnect, offline open) — safe to call more than once per session, since the guard below makes
// every call after the first a no-op.
function maybeShowChangelog(){
  if(changelogCheckedThisSession) return;
  changelogCheckedThisSession = true;
  try{
    // A vault provisioned for the very first time on this exact call has nothing to catch up on —
    // whatever they're seeing right now IS their baseline, so recording it silently (rather than
    // showing a new sign-up a list of changes to a version of the app they never used) is still
    // correct. But this exact moment — and only this moment, never again for this account — is
    // also precisely when introducing the app itself is actually useful, so show that instead of
    // just returning.
    if(!state.vaultWasAlreadyProvisioned){
      localStorage.setItem('vault-last-seen-version', APP_VERSION);
      state.modal = 'welcome';
      pushAppHistoryState();
      renderModal();
      return;
    }
    const lastSeen = localStorage.getItem('vault-last-seen-version');
    if(lastSeen === APP_VERSION) return;
    // No recorded version at all on this device isn't necessarily a brand-new install (this feature
    // didn't exist before a certain point — plenty of already-provisioned accounts will hit this on
    // their first open after it ships) — treat it the same as "show everything currently on file",
    // rather than assuming it means nothing changed.
    const items = CHANGELOG.filter(e => !lastSeen || e.version > lastSeen).flatMap(e => e.items);
    localStorage.setItem('vault-last-seen-version', APP_VERSION);
    if(!items.length) return;
    state.pendingChangelogItems = items;
    state.modal = 'changelog';
    pushAppHistoryState();
    renderModal();
  } catch(e){ console.error('Changelog check failed', e); }
}

// Defensive hedge: reported symptom was Back closing the app with no warning at all on a
// genuinely fresh load/sign-in, before any other tap — but only once something else had been
// tapped first did the warning reliably appear. The one difference between those two moments is
// whether a real user gesture had occurred yet, and some Android WebView/browser combinations are
// known to not always honor a history entry pushed before any gesture the same way for
// hardware-Back purposes as one pushed after one — which the boot-time arm above always is. Force
// one fresh guard entry the moment the very first real interaction happens on an idle root screen,
// regardless of what our own bookkeeping already believes (armExitGuardIfIdle's own !guardArmed
// check would otherwise skip it here, since nothing else invalidates guardArmed between boot and
// this).
//
// {once:true} alone doesn't work here and was the actual bug behind the inconsistency: it detaches
// the listener after the very FIRST pointerdown no matter what the handler does internally — and
// on a real load, that first tap very often lands while state.screen is still 'checking' (the
// loading splash, shown before auth has even resolved), which this handler deliberately ignores.
// That silently burned the one-shot hedge for nothing, leaving only the boot-time entry — exactly
// the unreliable-for-Back-purposes one this hedge exists to back up — for the rest of that whole
// page load. Removing the listener manually, only once it actually succeeds, means every
// pointerdown gets a chance until the real first interaction on vault/settings finally lands.
function armGuardOnFirstRealGesture(){
  if(state.screen === 'checking' || !isIdleRootScreen()) return;
  document.removeEventListener('pointerdown', armGuardOnFirstRealGesture, {capture: true});
  if(safePushHistoryState({seq: currentHistorySeq() + 1, guard: true})) guardArmed = true;
}
document.addEventListener('pointerdown', armGuardOnFirstRealGesture, {capture: true});

/* ---------- theme ---------- */
function currentTheme(){
  try{ return localStorage.getItem('vault-theme') || 'system'; } catch(e){ return 'system'; }
}
function applyTheme(theme){
  if(theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem('vault-theme', theme); } catch(e){}
  updateThemeColorMeta(theme);
}
// Keeps the browser/OS chrome (status bar, task-switcher header, Safari toolbar) matching whichever
// palette is actually on screen — applyTheme() only ever toggled the data-theme attribute before,
// leaving that chrome stuck on the light-mode blue even in dark mode.
function updateThemeColorMeta(theme){
  const isDark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', isDark ? '#111214' : '#1a73e8');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(currentTheme() === 'system') updateThemeColorMeta('system');
});

/* ---------- app lock ----------
   An optional, opt-in local gate on top of the already-persistent Google sign-in — the whole
   point of staying signed in is that Vault is always one tap away, which also means anyone who
   picks up an already-unlocked phone can open it. This never touches the real security boundary
   (Google Sign-In); it's a quick re-verify layer, same idea as a banking app's PIN/biometric lock
   on top of the phone's own lock screen. Entirely device-local: the PIN hash and biometric
   credential id live in localStorage, never synced or sent anywhere, so a new device just starts
   fresh with no lock configured. */
function isAppLockEnabled(){
  try{ return localStorage.getItem('vault-lock-enabled') === 'true'; } catch(e){ return false; }
}
function hasBiometricUnlockConfigured(){
  try{ return !!localStorage.getItem('vault-lock-webauthn-id'); } catch(e){ return false; }
}
async function biometricUnlockAvailable(){
  return !!(window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
    && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false));
}
async function sha256Hex(text){
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function setAppLockPin(pin){
  const hash = await sha256Hex(pin);
  try{ localStorage.setItem('vault-lock-pin-hash', hash); localStorage.setItem('vault-lock-enabled', 'true'); } catch(e){}
}
async function verifyAppLockPin(pin){
  try{
    const stored = localStorage.getItem('vault-lock-pin-hash');
    return !!stored && stored === await sha256Hex(pin);
  } catch(e){ return false; }
}
async function setupBiometricUnlock(){
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: {name: 'Vault'},
      user: {
        id: crypto.getRandomValues(new Uint8Array(16)),
        name: (state.user && state.user.email) || 'vault-user',
        displayName: (state.user && state.user.name) || 'Vault'
      },
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required'},
      timeout: 60000
    }
  });
  const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem('vault-lock-webauthn-id', credIdB64);
  localStorage.setItem('vault-lock-enabled', 'true');
}
async function verifyBiometricUnlock(){
  const credIdB64 = localStorage.getItem('vault-lock-webauthn-id');
  if(!credIdB64) return false;
  try{
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{id: Uint8Array.from(atob(credIdB64), c => c.charCodeAt(0)), type: 'public-key'}],
        userVerification: 'required',
        timeout: 60000
      }
    });
    return true;
  } catch(e){ console.warn('Biometric unlock failed or was cancelled', e); return false; }
}
function turnOffAppLock(){
  try{
    localStorage.removeItem('vault-lock-enabled');
    localStorage.removeItem('vault-lock-pin-hash');
    localStorage.removeItem('vault-lock-webauthn-id');
  } catch(e){}
}
// Turns off just the biometric shortcut, leaving the PIN (and app lock overall) intact — the PIN
// stays as the fallback either way, so this never needs to touch vault-lock-enabled/-pin-hash.
function turnOffBiometricUnlock(){
  try{ localStorage.removeItem('vault-lock-webauthn-id'); } catch(e){}
}

// Whether the *current* app open needs the lock screen right now — false forever if the feature
// isn't turned on; otherwise true until a successful unlock, and true again after the page has
// sat hidden (backgrounded/switched away) past the grace period, same idea as a banking app
// re-locking after you've been away a while rather than only once per cold start.
let appLockUnlockedThisLoad = false;
let appLockHiddenAt = null;
const APP_LOCK_GRACE_MS = 2*60*1000;
// Guards the auto-biometric attempt in renderLocked() so a re-render while still locked (e.g. the
// visibilitychange listener below calling render() again) doesn't re-fire the OS biometric prompt
// on top of itself. Reset in markAppUnlocked() so the next time the app actually locks, it tries
// biometric fresh again.
let bioAutoAttemptedThisLock = false;
function isAppLockDue(){
  if(!isAppLockEnabled()) return false;
  if(!appLockUnlockedThisLoad) return true;
  return !!(appLockHiddenAt && (Date.now() - appLockHiddenAt) > APP_LOCK_GRACE_MS);
}
function markAppUnlocked(){
  appLockUnlockedThisLoad = true;
  appLockHiddenAt = null;
  bioAutoAttemptedThisLock = false;
  render();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){
    if(isAppLockEnabled()) appLockHiddenAt = Date.now();
  } else if(document.visibilityState === 'visible'){
    if(appLockHiddenAt && (Date.now() - appLockHiddenAt) > APP_LOCK_GRACE_MS) appLockUnlockedThisLoad = false;
    appLockHiddenAt = null;
    // Settings can have its own sensitive modals open (Change PIN, Delete Account, App-Lock setup)
    // and needs the same re-verify gate as the vault — omitting it here used to mean the lock never
    // engaged at all if the app was backgrounded while on Settings, since nothing else re-renders on
    // its own when the tab becomes visible again.
    //
    // Gated on isAppLockDue() too — an unconditional render() here (the original shape of this
    // fix) tore down and rebuilt whatever was already open on EVERY foreground return, lock enabled
    // or not, even though the only reason this listener touches the DOM at all is to let the lock
    // take over when it's actually due. That silently destroyed a document viewer mid-swipe-gesture
    // (a fresh renderModal() call replaces the .modal-sheet node the gesture's listeners are bound
    // to, and re-fetches the document from scratch) on something as routine as a notification
    // banner briefly stealing focus. Now it only re-renders when there's something for the lock to
    // actually do, leaving an open document/modal/gesture untouched otherwise.
    if((state.screen === 'vault' || state.screen === 'settings' || state.screen === 'quickref') && isAppLockDue()) render();
  }
});

/* ---------- reminders ----------
   Unlike app lock, this setting has to be readable by a server-side job (the Apps Script daily
   digest trigger) with no live session, so it can't live in localStorage — it's mirrored in
   Firestore at meta/reminderSettings (loaded into state.reminderSettings in loadUserData()) plus a
   backend-only emailDigestSubscribers/{uid} index doc the digest job actually enumerates. */
function isEmailDigestEnabled(){
  return !!(state.reminderSettings && state.reminderSettings.emailDigestEnabled);
}
async function toggleEmailDigest(){
  const next = !isEmailDigestEnabled();
  const previous = state.reminderSettings;
  state.reminderSettings = {...state.reminderSettings, emailDigestEnabled: next, updatedAt: new Date().toISOString()};
  render();
  toast(next ? 'Daily email digest turned on' : 'Daily email digest turned off');
  try{
    const batch = db.batch();
    batch.set(userDoc().collection('meta').doc('reminderSettings'), state.reminderSettings, {merge: true});
    const subRef = db.collection('emailDigestSubscribers').doc(state.user.uid);
    if(next) batch.set(subRef, {email: state.user.email, updatedAt: state.reminderSettings.updatedAt});
    else batch.delete(subRef);
    await batch.commit();
  } catch(e){
    // Unlike togglePin's fire-and-forget, this rolls back on failure — a setting that controls
    // whether a background job emails the user is worth not silently diverging from Firestore.
    console.error('Failed to update email digest setting', e);
    state.reminderSettings = previous;
    render();
    toast(friendlyCloudError(e));
  }
}

// null/0 = never (the default — archiving an old behavior promise this deliberately doesn't
// change unless a user opts in). The actual deletion runs server-side, off the same daily Apps
// Script trigger the reminder digest already uses. Code.gs has no generic way to enumerate every
// signed-up account, only specific top-level "registries" of opted-in uids (emailDigestSubscribers,
// pushSubscribers) — archiveRetentionSubscribers/{uid} is the same pattern, storing the retention
// window itself so the daily job doesn't need a second read to find out how long.
async function setArchiveRetention(days){
  const previous = state.reminderSettings;
  const value = days || null;
  state.reminderSettings = {...state.reminderSettings, archiveRetentionDays: value, updatedAt: new Date().toISOString()};
  render();
  try{
    const batch = db.batch();
    batch.set(userDoc().collection('meta').doc('reminderSettings'), state.reminderSettings, {merge: true});
    const subRef = db.collection('archiveRetentionSubscribers').doc(state.user.uid);
    if(value) batch.set(subRef, {archiveRetentionDays: value, updatedAt: state.reminderSettings.updatedAt});
    else batch.delete(subRef);
    await batch.commit();
  } catch(e){
    console.error('Failed to update archive auto-delete setting', e);
    state.reminderSettings = previous;
    render();
    toast(friendlyCloudError(e));
  }
}
// Turning the setting OFF only stops future deletions — always safe, no confirmation needed.
// Turning it ON (or shortening an existing window) needs one: the daily cleanup measures age from
// archivedAt, not from whenever the setting changed, so it applies to documents already archived
// long before today just as much as to anything archived from now on — some could become eligible
// on the very next run. requestArchiveRetentionChange() is what the Settings <select> now calls;
// setArchiveRetention() itself (above) still does the actual write once confirmed.
function requestArchiveRetentionChange(days){
  const value = days || null;
  if(!value){ setArchiveRetention(null); return; }
  state.modal = 'confirmArchiveRetention';
  state.pendingArchiveRetentionDays = value;
  pushAppHistoryState();
  render();
}
// Shared by the confirmArchive/renewExpired modals — describes what actually happens to a document
// on archiving, which depends entirely on the current auto-delete setting.
function archiveModalMessage(){
  const days = state.reminderSettings.archiveRetentionDays;
  if(!days){
    return 'It stays in Vault for reference, just moved out of your active documents — nothing is deleted, and you can restore it anytime from "View archived" on the main screen.';
  }
  return `It stays in Vault for reference for now. Auto-delete is on (${archiveRetentionDaysLabel(days)}), so after that it moves to "Recently deleted" — then it's gone for good ${TRASH_RETENTION_DAYS} more days after that unless you restore it.`;
}

function isPushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function isPushEnabled(){
  return !!(state.reminderSettings && state.reminderSettings.pushEnabled);
}
// Browsers never re-prompt once denied — requestPermission() just resolves 'denied' immediately
// with no UI, so this state has to be reflected distinctly rather than left to look like a dead
// button click.
function isPushDenied(){
  return isPushSupported() && Notification.permission === 'denied';
}

// Guarded, lazy getter rather than an unconditional `firebase.messaging()` call at startup like
// auth/db above — unlike those, the Messaging SDK can throw on unsupported browsers (old Safari,
// some WebViews, Firefox private browsing), and since this whole file's code runs in one top-level
// script block, an uncaught throw here would break the entire app, not just push.
async function getMessagingIfSupported(){
  try{
    if(!isPushSupported()) return null;
    if(firebase.messaging && firebase.messaging.isSupported && !(await firebase.messaging.isSupported())) return null;
    return firebase.messaging();
  } catch(e){
    console.error('Firebase Messaging unavailable', e);
    return null;
  }
}

async function togglePushNotifications(){
  if(!isPushSupported()){ toast("Push notifications aren't supported in this browser."); return; }

  if(isPushEnabled()){
    // Turning OFF — no permission dance needed, mirrors toggleEmailDigest's delete branch exactly.
    const previous = state.reminderSettings;
    state.reminderSettings = {...state.reminderSettings, pushEnabled: false, updatedAt: new Date().toISOString()};
    render();
    toast('Push notifications turned off');
    try{
      const batch = db.batch();
      batch.set(userDoc().collection('meta').doc('reminderSettings'), state.reminderSettings, {merge: true});
      batch.delete(db.collection('pushSubscribers').doc(state.user.uid));
      await batch.commit();
    } catch(e){
      console.error('Failed to turn off push notifications', e);
      state.reminderSettings = previous;
      render();
      toast(friendlyCloudError(e));
    }
    return;
  }

  if(Notification.permission === 'denied'){
    toast('Notifications are blocked for Vault in your browser settings.');
    return;
  }

  // Must be the first await in this branch — a direct, synchronous-until-here result of the click,
  // which is what satisfies the browser's user-gesture requirement for requestPermission().
  let permission;
  try{
    permission = await Notification.requestPermission();
  } catch(e){
    console.error('Notification permission request failed', e);
    toast('Could not request notification permission.');
    return;
  }
  if(permission !== 'granted'){
    toast(permission === 'denied' ? "Notifications blocked — you can turn this on later from your browser's site settings." : 'Notification permission was dismissed.');
    render();
    return;
  }

  const messaging = await getMessagingIfSupported();
  if(!messaging){ toast('Push notifications are unavailable in this browser.'); return; }

  let token;
  try{
    const registration = await navigator.serviceWorker.ready; // already registered above
    token = await messaging.getToken({vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: registration});
    if(!token) throw new Error('No registration token returned');
  } catch(e){
    console.error('Failed to obtain FCM token', e);
    toast('Could not set up push notifications — try again.');
    return;
  }

  const previous = state.reminderSettings;
  state.reminderSettings = {...state.reminderSettings, pushEnabled: true, updatedAt: new Date().toISOString()};
  render();
  toast('Push notifications turned on');
  try{
    const batch = db.batch();
    batch.set(userDoc().collection('meta').doc('reminderSettings'), state.reminderSettings, {merge: true});
    // Keyed by uid, not by device — enabling push on a second device silently overwrites this
    // token. Fine for now: nobody's asked for multi-device support, and the fix (a token
    // subcollection) isn't worth the added complexity until someone does.
    batch.set(db.collection('pushSubscribers').doc(state.user.uid), {token, updatedAt: state.reminderSettings.updatedAt});
    await batch.commit();
  } catch(e){
    console.error('Failed to save push subscription', e);
    state.reminderSettings = previous;
    render();
    toast(friendlyCloudError(e));
  }
}

// Runs once per sign-in (called from loadUserData()), fire-and-forget. The modern Messaging SDK
// has no onTokenRefresh event any more — re-fetching on load and treating the result as
// authoritative is the documented way to pick up a rotated token. Also reconciles the reverse
// case: if push is supposed to be on but permission was since revoked (or the browser no longer
// qualifies), silently turn it back off so the backend stops retrying a subscription that can
// never work, rather than leaving state.reminderSettings claiming otherwise.
async function syncPushSubscriptionIfNeeded(){
  if(!isPushEnabled()) return;
  // Only reconcile the flag off when permission was explicitly revoked (a real "I don't want
  // this" signal) or this browser no longer supports push at all — never merely because this
  // particular device/browser was never used to grant it (Notification.permission === 'default').
  // pushEnabled is one account-wide flag with a single stored token, not per-device — treating
  // "not asked here" the same as "revoked" would silently kill a subscription that's still
  // working correctly on whichever device it actually was granted on, every time the account is
  // opened somewhere else that hasn't gone through the permission prompt yet.
  if(!isPushSupported() || Notification.permission === 'denied'){
    try{
      const batch = db.batch();
      batch.set(userDoc().collection('meta').doc('reminderSettings'), {pushEnabled: false, updatedAt: new Date().toISOString()}, {merge: true});
      batch.delete(db.collection('pushSubscribers').doc(state.user.uid));
      await batch.commit();
      state.reminderSettings.pushEnabled = false;
    } catch(e){ console.error('Failed to reconcile stale push subscription', e); }
    return;
  }
  if(Notification.permission !== 'granted') return; // not yet asked on this device — leave it alone
  const messaging = await getMessagingIfSupported();
  if(!messaging) return;
  try{
    const registration = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: registration});
    if(token) await db.collection('pushSubscribers').doc(state.user.uid).set({token, updatedAt: new Date().toISOString()}, {merge: true});
  } catch(e){ console.error('Failed to refresh push token', e); }
}

/* ---------- Google Drive ---------- */
function driveTokenValid(){ return !!(state.driveAccessToken && state.driveTokenExpiresAt && Date.now() < state.driveTokenExpiresAt); }
// A simple, always-visible signal for "is the app actually reachable right now" — combines the
// browser's own connectivity signal with the app's own offline-mode flag, since either one alone
// can be wrong in different ways (navigator.onLine can read true on a captive portal with no real
// route out; isOfflineMode only ever gets set during a cold load, not a mid-session drop).
function isAppOnline(){ return navigator.onLine && !state.isOfflineMode; }
window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());

// A ripple on tap needs one delegated, document-level listener rather than per-button wiring inside
// every renderX() function — every screen/modal rebuilds its buttons' DOM nodes from scratch on
// each render, so anything attached directly to a button would just be discarded next render.
function spawnRipple(target, clientX, clientY){
  if(prefersReducedMotion()) return;
  const rect = target.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.6;
  const span = document.createElement('span');
  span.className = 'ripple-effect';
  span.style.width = span.style.height = size + 'px';
  span.style.left = (clientX - rect.left - size / 2) + 'px';
  span.style.top = (clientY - rect.top - size / 2) + 'px';
  target.appendChild(span);
  span.addEventListener('animationend', () => span.remove());
}
document.addEventListener('pointerdown', (e) => {
  const target = e.target.closest('button.primary, .icon-only-btn');
  if(!target || target.disabled) return;
  spawnRipple(target, e.clientX, e.clientY);
});
// Five call sites (sign-in, reconnect, silent restore, and two background-refresh paths) all
// commit a fresh Drive token response into state the same way — one helper instead of five copies
// that could quietly drift apart (e.g. the 55-minute fallback margin getting updated in one place
// but not the others).
function applyDriveTokenResponse(tokenResp){
  state.driveAccessToken = tokenResp.accessToken;
  state.driveTokenExpiresAt = Date.now() + (tokenResp.expiresIn ? tokenResp.expiresIn*1000 : 55*60*1000);
}

// Wraps fetch() with the Drive OAuth token. This token is a client-side popup grant with no
// refresh token behind it (no backend to hold one) — it expires in ~1hr, at which point every
// call here throws DRIVE_TOKEN_EXPIRED so callers can prompt the user to reconnect instead of
// surfacing a raw 401.
async function driveFetch(url, options={}){
  if(!driveTokenValid()){
    const err = new Error('Your Google Drive connection expired.');
    err.code = 'DRIVE_TOKEN_EXPIRED';
    throw err;
  }
  const res = await fetch(url, { ...options, headers: { ...(options.headers||{}), Authorization: 'Bearer ' + state.driveAccessToken } });
  if(res.status === 401){
    const err = new Error('Your Google Drive connection expired.');
    err.code = 'DRIVE_TOKEN_EXPIRED';
    throw err;
  }
  if(!res.ok){
    let detail = '';
    try{ detail = await res.text(); } catch(_){}
    throw new Error(`Drive request failed: ${res.status} ${detail}`.trim());
  }
  return res;
}

async function driveCreateFolder(name, parentId){
  const body = {name, mimeType: 'application/vnd.google-apps.folder'};
  if(parentId) body.parents = [parentId];
  const res = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const json = await res.json();
  return json.id;
}
// Finds a non-trashed folder by exact name (within a given parent, or Drive's root if none given)
// — used so re-provisioning never blindly creates a duplicate when a same-named folder already
// exists (e.g. deleting the Vault account and signing up again used to always create a brand-new
// "Vault" folder, leaving the previous one behind even when it was still sitting right there).
async function driveFindFolder(name, parentId){
  const escaped = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const parentClause = parentId ? `'${parentId}' in parents` : `'root' in parents`;
  const q = encodeURIComponent(`${parentClause} and name='${escaped}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  const json = await res.json();
  return (json.files && json.files.length) ? json.files[0].id : null;
}
async function driveFindOrCreateFolder(name, parentId){
  const existing = await driveFindFolder(name, parentId);
  return existing || driveCreateFolder(name, parentId);
}
// The "Recently deleted" trash folder — a peer to the per-category subfolders inside Vault,
// created lazily on the first soft-delete or restore rather than during provisionVault() (most
// accounts may never need it). Cached on state for the rest of the session once found/created.
async function ensureDeletedFolderId(){
  if(state.deletedFolderId) return state.deletedFolderId;
  state.deletedFolderId = await driveFindOrCreateFolder('Deleted', state.vaultFolderId);
  return state.deletedFolderId;
}
// Like driveFindFolder, but returns every non-trashed match instead of just the first — used by
// runSyncFromDrive to also pick up files from a duplicate-named folder (Drive allows more than one
// folder with the same name; a re-uploaded backup folder is exactly this case), not just the one
// category folder ID already on file.
async function driveFindAllFolderIdsByName(name, parentId){
  const escaped = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const parentClause = parentId ? `'${parentId}' in parents` : `'root' in parents`;
  const q = encodeURIComponent(`${parentClause} and name='${escaped}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  const json = await res.json();
  return (json.files || []).map(f => f.id);
}
// Same query shape as driveFindFolder, but for a plain (non-folder) file by exact name — used to
// locate Vault/quickrefs.json without needing any Firestore pointer doc for it.
async function driveFindFile(name, parentId){
  const escaped = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const parentClause = parentId ? `'${parentId}' in parents` : `'root' in parents`;
  const q = encodeURIComponent(`${parentClause} and name='${escaped}' and mimeType!='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  const json = await res.json();
  return (json.files && json.files.length) ? json.files[0].id : null;
}

// Files are stored as their real type (image/PDF) — not encrypted, per product decision — so
// they're directly viewable if opened in Drive itself. Google's multipart-upload endpoint is
// documented to expect the request body as multipart/related (metadata part, then content
// part, joined by a boundary) — NOT the browser's FormData/multipart-form-data format, which
// uses different per-part headers (Content-Disposition instead of a bare Content-Type). Building
// it by hand as a Blob (which can mix strings and binary content directly, no base64 needed)
// matches the documented format exactly instead of relying on Google's parser tolerating the
// wrong one. Uses XMLHttpRequest instead of fetch specifically because fetch has no
// upload-progress event — XHR's upload.onprogress is what powers the progress bar shown while
// saving a document.
function driveUpload(blob, filename, mimeType, parentFolderId, onProgress){
  return new Promise((resolve, reject) => {
    if(!driveTokenValid()){
      const err = new Error('Your Google Drive connection expired.');
      err.code = 'DRIVE_TOKEN_EXPIRED';
      reject(err);
      return;
    }
    const boundary = 'vaultpart_' + Date.now();
    const metadata = {name: filename, mimeType, parents: [parentFolderId]};
    const body = new Blob([
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`,
      `--${boundary}\r\nContent-Type: ${mimeType}\r\n\r\n`,
      blob,
      `\r\n--${boundary}--`
    ]);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart');
    xhr.setRequestHeader('Authorization', 'Bearer ' + state.driveAccessToken);
    xhr.setRequestHeader('Content-Type', `multipart/related; boundary=${boundary}`);
    if(onProgress) xhr.upload.onprogress = (e) => { if(e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300){
        resolve(JSON.parse(xhr.responseText).id);
      } else if(xhr.status === 401){
        const err = new Error('Your Google Drive connection expired.');
        err.code = 'DRIVE_TOKEN_EXPIRED';
        reject(err);
      } else {
        reject(new Error(`Drive request failed: ${xhr.status} ${xhr.responseText}`.trim()));
      }
    };
    xhr.onerror = () => reject(new Error('Network error while uploading to Drive'));
    xhr.send(body);
  });
}
// The Vault's own usage is just the sum of document sizes already known locally — no extra
// call needed. Overall quota needs the drive.metadata.readonly scope (about.get isn't covered
// by drive.file, since it's account-wide info, not something this app created).
async function driveGetStorageQuota(){
  const res = await driveFetch('https://www.googleapis.com/drive/v3/about?fields=storageQuota');
  const json = await res.json();
  return json.storageQuota; // {limit, usage, usageInDrive, ...} — limit is absent for unlimited plans
}
// null = never fetched this session yet; {error: message} = last fetch failed. Either way, Settings'
// Storage row renders straight from this cache on every render() instead of re-fetching —
// renderSettings() itself re-runs on every settings change (theme, a toggle, anything), not just
// when the screen is first opened, so re-fetching from inside it flashed the row back to "Loading…"
// (a shorter line than the real content) and back on every single unrelated toggle, visibly
// shifting everything below it. Only refreshDriveStorageInfo() below — called once, from
// openSettingsBtn's click handler, on the actual transition into the screen — ever touches the
// network for this. Caching the error case too (not just success) matters just as much: without it,
// a failed fetch would leave every later re-render stuck showing "Loading…" forever instead of the
// error, since nothing re-triggers the fetch outside that one entry point.
let driveStorageQuotaCache = null;
function storageInfoHtml(cached, vaultBytes){
  if(cached && cached.error){
    return `Vault: ${formatBytes(vaultBytes)} · could not load overall Drive usage (${cached.error})`;
  }
  if(cached && cached.limit){
    const pct = Math.min(100, Math.round((+cached.usage / +cached.limit) * 100));
    return `
      <div class="storage-bar-track"><div class="storage-bar-fill" style="width:${pct}%"></div></div>
      <div class="search-hint">${formatBytes(+cached.usage)} of ${formatBytes(+cached.limit)} used in Drive · Vault: ${formatBytes(vaultBytes)}</div>
    `;
  }
  return `Vault: ${formatBytes(vaultBytes)} · Drive storage is unlimited on this account`;
}
async function refreshDriveStorageInfo(){
  const vaultBytes = state.documents.reduce((sum,d) => sum + (d.size||0), 0);
  try{
    driveStorageQuotaCache = await driveGetStorageQuota();
  } catch(e){
    console.error('Could not load storage quota', e);
    driveStorageQuotaCache = {error: e && e.code === 'DRIVE_TOKEN_EXPIRED' ? 'reconnect to Google' : 'check your connection'};
  }
  const el = document.getElementById('storageInfo');
  if(el) el.innerHTML = storageInfoHtml(driveStorageQuotaCache, vaultBytes);
}
function formatBytes(n){
  if(!n || n<=0) return '0 B';
  const units = ['B','KB','MB','GB','TB'];
  const i = Math.min(units.length-1, Math.floor(Math.log(n)/Math.log(1024)));
  return (n/Math.pow(1024,i)).toFixed(i===0?0:1) + ' ' + units[i];
}
async function driveMoveFile(fileId, fromFolderId, toFolderId){
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${toFolderId}&removeParents=${fromFolderId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({})
  });
}
async function driveDelete(fileId){
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {method:'DELETE'});
}
function friendlyCloudError(e){
  if(e && e.code === 'DRIVE_TOKEN_EXPIRED') return 'Your Google Drive connection expired — reconnect to Google and try again.';
  return 'Something went wrong: ' + (e && e.message ? e.message : 'unknown error');
}

/* ---------- Firestore ---------- */
function userDoc(){ return db.collection('users').doc(state.user.uid); }

// Runs once per account, the first time it signs in: creates the Vault folder at Drive root
// plus one subfolder per default category, and records everything in Firestore so this never
// has to run again for this account.
async function provisionVault(){
  const vaultFolderId = await driveFindOrCreateFolder('Vault');
  const categories = [];
  for(let i=0; i<DEFAULT_CATEGORIES.length; i++){
    const c = DEFAULT_CATEGORIES[i];
    const driveFolderId = await driveFindOrCreateFolder(c.label, vaultFolderId);
    categories.push({id:c.id, label:c.label, icon:c.icon, driveFolderId, order:i});
  }
  await userDoc().collection('meta').doc('vault').set({vaultFolderId, createdAt: new Date().toISOString()});
  const batch = db.batch();
  categories.forEach(c => {
    batch.set(userDoc().collection('categories').doc(c.id), {label:c.label, icon:c.icon, driveFolderId:c.driveFolderId, order:c.order});
  });
  await batch.commit();
  state.vaultFolderId = vaultFolderId;
  state.categories = categories;
}

/* ---------- offline document cache ----------
   Two separate object stores, deliberately out of sync with each other: metadata (title,
   category, expiry, driveFileId, ...) gets written for EVERY document on every successful online
   load (cacheAllDocumentMetadataOffline, below loadOfflineDocumentList) — that's what lets a
   fully-offline cold load still list every document by name, not just ones already opened. A
   file's actual blob only gets cached the moment that specific document is successfully viewed
   (cacheDocumentOffline) — fetching every document's full bytes just because the vault loaded
   would be wasteful and slow. state.offlineDocIds tracks which documents have a cached blob and
   are therefore actually open-able offline; renderDocCard and viewDocument both check it to tell
   "listed" apart from "viewable" rather than treating every offline card as equally open-able. */
const OFFLINE_DB_NAME = 'vault-offline-cache';
const OFFLINE_STORE = 'files';
const OFFLINE_META_STORE = 'metadata';
function openOfflineDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(OFFLINE_DB_NAME, 2);
    req.onupgradeneeded = (e) => {
      const dbInstance = req.result;
      if(!dbInstance.objectStoreNames.contains(OFFLINE_STORE)) dbInstance.createObjectStore(OFFLINE_STORE);
      if(!dbInstance.objectStoreNames.contains(OFFLINE_META_STORE)) dbInstance.createObjectStore(OFFLINE_META_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
// doc is the full document record (title, category, expiry, driveFileId, mimeType, ...) — stored
// as-is (it never contains the file bytes themselves) so an offline cold load has enough to both
// list and open it.
async function cacheDocumentOffline(doc, blob){
  try{
    const db = await openOfflineDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction([OFFLINE_STORE, OFFLINE_META_STORE], 'readwrite');
      tx.objectStore(OFFLINE_STORE).put({blob, mimeType: doc.mimeType}, doc.id);
      tx.objectStore(OFFLINE_META_STORE).put(doc, doc.id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    state.offlineDocIds.add(doc.id);
  } catch(e){ console.warn('Could not cache document for offline viewing', e); }
}
async function getOfflineDocument(id){
  try{
    const db = await openOfflineDb();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch(e){ console.warn('Could not read the offline document cache', e); return null; }
}
async function removeOfflineDocument(id){
  state.offlineDocIds.delete(id);
  try{
    const db = await openOfflineDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction([OFFLINE_STORE, OFFLINE_META_STORE], 'readwrite');
      tx.objectStore(OFFLINE_STORE).delete(id);
      tx.objectStore(OFFLINE_META_STORE).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){ console.warn('Could not remove an offline document cache entry', e); }
}
// Populates state.offlineDocIds from whatever's already cached, so cards can show the offline
// badge immediately on load rather than only after the user re-views each document this session.
async function loadOfflineDocIds(){
  try{
    const db = await openOfflineDb();
    const ids = await new Promise((resolve, reject) => {
      const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    state.offlineDocIds = new Set(ids);
  } catch(e){
    console.warn('Could not list offline-cached documents', e);
    state.offlineDocIds = new Set();
  }
}
// Used when the vault can't be loaded from Firestore at all (no connection) — reconstructs
// state.documents from whatever's been cached so far, so a fully-offline open still shows
// something instead of an empty vault.
async function loadOfflineDocumentList(){
  try{
    const db = await openOfflineDb();
    const docs = await new Promise((resolve, reject) => {
      const req = db.transaction(OFFLINE_META_STORE, 'readonly').objectStore(OFFLINE_META_STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    docs.sort((a, b) => (b.addedAt||'').localeCompare(a.addedAt||''));
    return docs;
  } catch(e){ console.warn('Could not load the offline document list', e); return []; }
}
// Keeps the metadata store in sync with EVERY document whenever the vault loads successfully
// online — not just ones that happen to get viewed (cacheDocumentOffline, above, only ever writes
// one doc at a time, paired with that same doc's file blob). Without this, a fully-offline cold
// load could only ever list documents that had previously been opened, which reads as other
// documents having silently vanished rather than merely "not cached for offline viewing" — the two
// stores are meant to be independent (see the comment at the top of this section), but until now
// only ever got written together.
async function cacheAllDocumentMetadataOffline(docs){
  try{
    const db = await openOfflineDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(OFFLINE_META_STORE, 'readwrite');
      const store = tx.objectStore(OFFLINE_META_STORE);
      store.clear();
      docs.forEach(doc => store.put(doc, doc.id));
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){ console.warn('Could not update the offline document metadata cache', e); }
}
const OFFLINE_QUICKREFS_KEY = 'vault-offline-quickrefs';
// Quick Reference has no Drive/blob dependency at all (it's plain Firestore data), so unlike
// documents there's nothing further to fetch once the list itself is available — a plain
// localStorage snapshot is enough to make it work fully offline, no IndexedDB needed for
// something this small.
function cacheQuickRefsOffline(quickRefs){
  try{ localStorage.setItem(OFFLINE_QUICKREFS_KEY, JSON.stringify(quickRefs)); } catch(e){ console.warn('Could not cache Quick Reference entries for offline use', e); }
}
function loadOfflineQuickRefs(){
  try{
    const raw = localStorage.getItem(OFFLINE_QUICKREFS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ console.warn('Could not load offline Quick Reference entries', e); return []; }
}
function clearOfflineCache(){
  state.offlineDocIds = new Set();
  try{ indexedDB.deleteDatabase(OFFLINE_DB_NAME); } catch(e){ console.warn('Could not clear the offline document cache', e); }
  try{ localStorage.removeItem(OFFLINE_QUICKREFS_KEY); } catch(e){ console.warn('Could not clear the offline Quick Reference cache', e); }
}

const QUICKREFS_DRIVE_FILENAME = 'quickrefs.json';
// Whole-file read: Quick Reference lives as one JSON file (not one Firestore doc per entry) in the
// Vault folder — reuses the same alt=media download idiom already used for documents (viewDocument,
// getDocumentBlob, runSyncFromDrive, buildDocumentsZipBlob), just parsed as JSON instead of a Blob.
async function loadQuickRefsFromDrive(){
  const fileId = await driveFindFile(QUICKREFS_DRIVE_FILENAME, state.vaultFolderId);
  if(!fileId) return {fileId: null, items: []};
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const parsed = await res.json();
  return {fileId, items: Array.isArray(parsed.items) ? parsed.items : []};
}
// Whole-file write: uploads a fresh quickrefs.json (reusing driveUpload exactly as document saves
// do), and only once that succeeds deletes the previous file, if any — the same create-before-
// delete ordering finalizeAndStoreDocument uses in reverse, so a failure between the two steps
// never leaves zero copies. This is a plain create-then-delete rather than an in-place update, which
// needs no new Drive endpoint shape beyond driveFindFile — everything else here is driveUpload/
// driveDelete as they already exist. Two tabs/devices editing concurrently can race and overwrite
// each other's write — accepted for a single-user app, same as any other last-write-wins field here.
async function saveQuickRefsToDrive(items, existingFileId){
  const blob = new Blob([JSON.stringify({version: 1, updatedAt: new Date().toISOString(), items})], {type: 'application/json'});
  const newFileId = await driveUpload(blob, QUICKREFS_DRIVE_FILENAME, 'application/json', state.vaultFolderId);
  if(existingFileId){
    try{ await driveDelete(existingFileId); } catch(e){ console.error('Could not clean up the previous quickrefs.json', e); }
  }
  return newFileId;
}
// One-time migration entry point, called from loadUserData() once state.vaultFolderId is known.
// Prefers an existing Drive file as sole source of truth; only reads (and migrates) the legacy
// Firestore users/{uid}/quickRefs collection when no Drive file exists yet, and only deletes those
// legacy docs after the Drive write is confirmed — a failure partway through leaves the Firestore
// originals untouched, so the exact same migration simply retries on the next load.
async function migrateAndLoadQuickRefs(loadDoc){
  const fromDrive = await loadQuickRefsFromDrive();
  if(fromDrive.fileId) return fromDrive;
  const legacySnap = await loadDoc().collection('quickRefs').orderBy('addedAt', 'desc').get();
  if(legacySnap.empty) return {fileId: null, items: []};
  const legacyItems = legacySnap.docs.map(d => ({id: d.id, ...d.data()}));
  try{
    const fileId = await saveQuickRefsToDrive(legacyItems, null);
    const batch = db.batch();
    legacySnap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    return {fileId, items: legacyItems};
  } catch(e){
    console.error('Quick Reference migration to Drive failed — will retry next load', e);
    return {fileId: null, items: legacyItems};
  }
}

// Loads everything for the signed-in account. Called right after sign-in once state.user.uid
// and a valid Drive token are both ready — provisioning a brand-new account needs Drive access.
async function loadUserData(){
  // Captured once, up front: state.user can go null mid-flight (a sign-out racing this same call,
  // e.g. from the periodic background token-refresh timer) — every read below goes through this
  // fixed uid, and every write to state at the end re-checks it's still the active session, rather
  // than trusting the live state.user.uid (via userDoc()) to still mean the same thing by the time
  // an awaited read comes back.
  const uid = state.user.uid;
  const loadDoc = () => db.collection('users').doc(uid);
  const stillCurrent = () => !!state.user && state.user.uid === uid;
  // Whether this exact account has ever been seen as provisioned before, independent of Firestore
  // being reachable right now — read only as a fallback in the catch block below, for a fully
  // offline load where the real Firestore check never gets a chance to run at all (see the write
  // side, right after alreadyProvisioned is actually determined).
  const everProvisionedFallback = () => { try{ return localStorage.getItem('vault-ever-provisioned-' + uid) === 'true'; } catch(e){ return false; } };
  try{
    // metaSnap doesn't depend on anything below, and nothing below except categories depends on
    // it — it used to be awaited alone, before even issuing the other reads, which cost a
    // full extra round trip on every sign-in/reopen for no reason. Firing it in the same wave
    // turns "meta, then everything else" into "everything (except categories, and Quick Reference
    // — see below) at once." Quick Reference isn't read here at all anymore: it now lives in Drive,
    // which needs state.vaultFolderId settled first, so migrateAndLoadQuickRefs() runs further down.
    const [metaSnap, docsSnap, reminderSnap] = await Promise.all([
      loadDoc().collection('meta').doc('vault').get(),
      loadDoc().collection('documents').orderBy('addedAt', 'desc').get(),
      loadDoc().collection('meta').doc('reminderSettings').get()
    ]);
    if(!stillCurrent()) return;
    // metaSnap.data().vaultFolderId is checked, not just metaSnap.exists — an account from
    // before this cloud-storage redesign has an old-shape meta/vault doc (passphrase salt and
    // canary, no vaultFolderId), which would otherwise be mistaken for an already-provisioned
    // vault and skip folder/category creation entirely.
    const alreadyProvisioned = metaSnap.exists && metaSnap.data().vaultFolderId;
    // Read by maybeShowChangelog() — a vault provisioned for the first time on this exact call has
    // no "since you last used Vault" to speak of, whatever's on screen now is its whole history.
    state.vaultWasAlreadyProvisioned = !!alreadyProvisioned;
    // Mirror to localStorage too — see everProvisionedFallback() above and the catch block below.
    if(alreadyProvisioned){ try{ localStorage.setItem('vault-ever-provisioned-' + uid, 'true'); } catch(e){} }
    let catsSnap = null;
    if(alreadyProvisioned){
      state.vaultFolderId = metaSnap.data().vaultFolderId;
      catsSnap = await loadDoc().collection('categories').orderBy('order').get();
      if(!stillCurrent()) return;
    } else {
      // Needs state.driveAccessToken already set (it creates Drive folders) — the one read that
      // can't run alongside the others above, since it's the only one Drive-dependent at all.
      await provisionVault();
      if(!stillCurrent()) return;
    }
    if(catsSnap) state.categories = catsSnap.docs.map(d => ({id:d.id, ...d.data()}));
    // Same reasoning: a document written under the old encrypted schema has no plain `title`/
    // `driveFileId` fields this version relies on. Skip anything that doesn't look like the
    // current shape instead of crashing the render on undefined fields.
    state.documents = docsSnap.docs.map(d => ({id: d.id, ...d.data()})).filter(d => {
      const ok = typeof d.title === 'string' && typeof d.driveFileId === 'string';
      if(!ok) console.warn('Skipping document with an outdated/incompatible shape', d.id);
      return ok;
    });
    state.reminderSettings = reminderSnap.exists ? reminderSnap.data() : {emailDigestEnabled: false, pushEnabled: false};
    // state.vaultFolderId is settled by now (both branches above set it) — Quick Reference lives in
    // Drive, so this is the earliest point it can be read.
    const {fileId: quickRefsFileId, items: quickRefItems} = await migrateAndLoadQuickRefs(loadDoc);
    if(!stillCurrent()) return;
    state.quickRefs = quickRefItems;
    state.quickRefsDriveFileId = quickRefsFileId;
    cacheAllDocumentMetadataOffline(state.documents); // fire-and-forget — keeps the offline list complete
    cacheQuickRefsOffline(state.quickRefs); // fire-and-forget — keeps Quick Reference usable offline
    syncPushSubscriptionIfNeeded(); // fire-and-forget — never delays the vault's own load
  } catch(e){
    console.error('Could not load vault data from the cloud', e);
    // The real Firestore check above never got to run (or didn't finish) — e.g. a fully offline
    // load. Without this fallback, state.vaultWasAlreadyProvisioned would be left at its unset
    // default (false), which maybeShowChangelog() reads as "brand-new account," incorrectly
    // showing the welcome guide on every single offline open regardless of how long this account
    // has actually used Vault.
    if(stillCurrent()) state.vaultWasAlreadyProvisioned = everProvisionedFallback();
    if(stillCurrent()) toast('Could not load your vault — check your connection and try again.');
  }
  if(stillCurrent()) await loadOfflineDocIds();
}

// Every category starts collapsed at the start of each vault session (fresh sign-in, reconnect,
// silent session restore, or offline open) — called at those specific moments, not from inside
// loadUserData() itself, since that's shared by two mid-session reconnect paths (reconnectDrive(),
// the background online-recovery check) where the user may have already deliberately expanded
// something and a reset would be surprising. Pinned has no collapse mechanism and is unaffected.
function collapseAllCategories(){
  const next = {};
  state.categories.forEach(c => { next[c.id] = true; });
  state.collapsedCats = next;
}

async function persistDocument(doc){
  await userDoc().collection('documents').doc(doc.id).set(doc);
}

// Expiry dates come from <input type="date"> as plain "YYYY-MM-DD" strings with no timezone.
// Parsing those with `new Date(str)` treats them as UTC midnight, which silently shifts the
// calendar date by a day in timezones behind UTC. Parse the components as a local date instead.
function parseLocalDate(dateStr){ const [y,m,d] = dateStr.split('-').map(Number); return new Date(y, m-1, d); }
function daysUntil(dateStr){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((parseLocalDate(dateStr)-t)/86400000); }
function formatDate(iso){ return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function formatExpiryDate(dateStr){ return parseLocalDate(dateStr).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Google Calendar's "quick add" URL needs no API call and no extra OAuth scope — it just opens
// a pre-filled event-creation page that the user reviews and saves themselves.
function addToCalendarUrl(doc){
  const d = doc.expiry.replace(/-/g, '');
  const text = encodeURIComponent(`Renew: ${doc.title}`);
  const details = encodeURIComponent(`Reminder from Vault to renew "${doc.title}" (${categoryFor(doc.category).label}).`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${d}/${d}&details=${details}`;
}

// Converts a data: URL (from canvas capture or jsPDF output) into a Blob for Drive upload.
function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mime = header.match(/data:(.*?);base64/)[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type: mime});
}
function extensionForMime(mime){
  if(mime === 'application/pdf') return 'pdf';
  if(mime === 'image/png') return 'png';
  if(mime === 'image/jpeg' || mime === 'image/jpg') return 'jpg';
  return 'dat';
}
function safeFilename(title, mime){
  return title.replace(/[\\/:*?"<>|]/g, '_') + '.' + extensionForMime(mime);
}

// Best-effort: scans OCR text for a date and returns it as "YYYY-MM-DD", or null. Prefers a
// line that mentions expiry-ish keywords over the first date found anywhere. Ambiguous
// DD/MM vs MM/DD numeric dates are read as DD/MM (matches Aadhaar/licence/insurance conventions
// in India, which is what formatDate/formatExpiryDate elsewhere in this app already assume via
// 'en-IN' formatting). Always shown as an editable suggestion, never applied silently.
function guessExpiryDate(ocrText){
  if(!ocrText) return null;
  const lines = ocrText.split('\n');
  const keywordLine = lines.find(l => /expir|valid\s*(upto|until|till)|exp\s*date/i.test(l));
  const searchIn = keywordLine || ocrText;
  const monthNames = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  let m = searchIn.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/); // DD/MM/YYYY
  if(m) return validYmd(+m[3], +m[2]-1, +m[1]);

  m = searchIn.match(/\b(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/); // YYYY-MM-DD
  if(m) return validYmd(+m[1], +m[2]-1, +m[3]);

  m = searchIn.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{4})\b/i); // DD Mon YYYY
  if(m) return validYmd(+m[3], monthNames[m[2].slice(0,3).toLowerCase()], +m[1]);

  return null;
}
function validYmd(y, moIdx, d){
  if(moIdx>=0 && moIdx<=11 && d>=1 && d<=31 && y>1990 && y<2100){
    return `${y}-${String(moIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return null;
}

// Same lightweight, best-effort spirit as guessExpiryDate above — point the category dropdown in
// the right direction from what OCR found, never silently override a choice the user already
// made. Checked in this order (first match wins), against the default category ids specifically —
// a category the user renamed or a fully custom one just won't get a suggestion, which is fine,
// this only ever pre-fills a dropdown the user can freely change anyway.
const CATEGORY_GUESS_KEYWORDS = [
  ['id', /aadhaar|aadhar|passport|pan card|voter id|permanent account number|national id|identity card/i],
  ['licence', /driving licen[cs]e|permit|registration certificate|licen[cs]e/i],
  ['insurance', /insurance|policy\s*no|premium|sum insured|policyholder/i],
  ['warranty', /warranty|guarantee|proof of purchase/i],
  ['bill', /invoice|electricity bill|utility bill|amount due|bill (?:no|number|date)|statement/i],
];
function guessCategory(ocrText){
  if(!ocrText) return null;
  for(const [id, pattern] of CATEGORY_GUESS_KEYWORDS){
    if(pattern.test(ocrText) && state.categories.some(c => c.id === id)) return id;
  }
  return null;
}

/* ---------- OCR ---------- */
async function runOcr(dataUrl, onProgress){
  try{
    const result = await Tesseract.recognize(dataUrl, 'eng', {
      logger: m => { if(m.status === 'recognizing text' && onProgress) onProgress(m.progress); }
    });
    return result.data.text.trim();
  } catch(e){
    console.error('OCR failed', e);
    return '';
  }
}

// A single page's render-and-OCR never being allowed to run forever, wrapped around the whole
// per-page step below rather than just the OCR half — a stuck/pathological PDF page render is as
// much a risk to guard against as slow OCR, and either one hanging must not leave the Save button
// disabled indefinitely. Doesn't (and can't) actually cancel a still-running PDF.js/Tesseract
// operation — it just stops the *flow* from waiting on it, which is what protects the user.
function withTimeout(promise, ms, fallbackValue){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(() => resolve(fallbackValue), ms))
  ]);
}

// Renders each page of an uploaded PDF to a canvas and OCRs it, the same way a multi-page camera
// capture already OCRs every page before combining them into one PDF (see capturePage()) — the
// only difference is these pages already exist as a PDF instead of being captured one at a time.
// Rendered well above renderPdfInto's screen-sized viewing resolution, since OCR accuracy benefits
// from more detail than a preview needs; capped so an unusually large page doesn't run OCR against
// an oversized, slow-to-process image for no real accuracy gain.
async function runOcrOnPdfFile(file, onProgress){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const pageTexts = [];
  for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){
    const text = await withTimeout(ocrOnePdfPage(pdf, pageNum, (pct) => onProgress && onProgress(pct, pageNum, pdf.numPages)), 25000, '');
    pageTexts.push(text);
  }
  return pageTexts.join('\n').trim();
}
async function ocrOnePdfPage(pdf, pageNum, onProgress){
  const page = await pdf.getPage(pageNum);
  const baseViewport = page.getViewport({scale: 1});
  const scale = Math.min(1500 / baseViewport.width, 3);
  const viewport = page.getViewport({scale});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
  return runOcr(canvas.toDataURL('image/png'), onProgress);
}

/* ---------- render root ---------- */
// Every branch below ends by calling armExitGuardIfIdle() — not just the handful of call sites
// that transition INTO one of these screens. That call is already idempotent (a no-op once
// guardArmed is true) and cheap, so doing it unconditionally on every single render() pass is a
// safety net that makes the "Back always shows the exit warning at idle root" guarantee hold no
// matter how state got here, rather than relying on every current and future code path that could
// land on the vault screen to remember to call it — which is exactly the class of bug that let the
// Quick Reference screen (missing from an exclusion list) and App Lock (tearing down a modal
// directly, bypassing the history pop that would have re-armed the guard) both fall through
// before this existed.
function renderImmediate(){
  const app = document.getElementById('app');
  if(state.screen === 'checking'){ renderChecking(app); armExitGuardIfIdle(); return; }
  if(state.screen === 'login'){ renderLogin(app); armExitGuardIfIdle(); return; }
  if(state.screen === 'reconnect'){ renderReconnect(app); armExitGuardIfIdle(); return; }
  // The lock screen intercepts any signed-in screen — vault AND Settings, which can itself have
  // sensitive modals open (Change PIN, Delete Account, App-Lock setup) — rather than being its own
  // state.screen value, so it needs no history-layer bookkeeping of its own: it's a gate on
  // rendering, not a place the user deliberately navigates. Turning the lock off is still reachable
  // once unlocked — re-verifying doesn't block that, it just requires it first, same as the vault.
  if((state.screen === 'vault' || state.screen === 'settings' || state.screen === 'quickref') && isAppLockDue()){
    // A modal (e.g. the document viewer) left open when the lock engages must be torn down here,
    // not just logically closed — its DOM node is appended directly to <body> (position:fixed,
    // painted above everything) and would otherwise keep floating on top of the lock screen with
    // live handlers still wired up (including a "Download" button that re-fetches the real file),
    // letting anyone who picks up the device skip the PIN/biometric gate entirely just by tapping
    // outside it. renderLocked() itself is only ever reached through this one line, so clearing and
    // removing it here — before the lock screen renders for the very first time — covers every
    // path into the locked state, not just a later re-render.
    if(state.modal) clearTopLayerState();
    renderModal();
    renderLocked(app);
    armExitGuardIfIdle();
    return;
  }
  if(state.screen === 'settings'){ renderSettings(app); armExitGuardIfIdle(); return; }
  if(state.screen === 'quickref'){ renderQuickRef(app); armExitGuardIfIdle(); return; }
  renderVault(app);
  armExitGuardIfIdle();
}

function prefersReducedMotion(){
  return matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// Every screen/modal render fully replaces its container's innerHTML (see renderImmediate() and
// renderModal()) rather than diffing — there's no persistent DOM node for an ordinary CSS
// transition to interpolate between old and new. The View Transitions API sidesteps that entirely:
// it snapshots the DOM before and after the callback runs and cross-fades between the two images
// itself, needing no per-element bookkeeping here. Falls straight back to the old synchronous
// behavior on unsupported browsers and when the user has asked for reduced motion.
// The very first render() of a page load has no earlier painted frame to snapshot from — Chrome's
// implementation rejects the transition's `ready` promise with InvalidStateError when it's started
// before the document has painted even once, which this flag sidesteps by just skipping straight to
// renderImmediate() that one time (there's nothing to crossfade from anyway).
let hasRenderedOnce = false;
function render(){
  if(!hasRenderedOnce || !('startViewTransition' in document) || prefersReducedMotion()){
    renderImmediate();
    hasRenderedOnce = true;
    return;
  }
  document.documentElement.classList.add('vt-pending');
  const transition = document.startViewTransition(() => renderImmediate());
  // `ready` and `finished` are independent promises — only attaching .catch to one still leaves the
  // other's rejection unhandled. Both can reject on setup failure; the DOM update from the callback
  // above has already applied regardless (per spec), so there's nothing more to do here than avoid
  // the console noise.
  transition.ready.catch(() => {});
  transition.finished.catch(() => {}).finally(() => document.documentElement.classList.remove('vt-pending'));
}

// Shown only for the brief moment before Firebase has answered "is anyone signed in" on a fresh
// page load. Without this, that moment's first paint was the full interactive login screen (its
// own "Sign in with Google" button included) flashing before a returning user's session silently
// restored — reasonably read as "did I get signed out?" even though nothing was actually wrong.
// A neutral loading state can't be misread that way.
function renderChecking(app){
  app.innerHTML = `
    <div class="login-screen">
      <div class="seal">${brandMarkSvg(50)}</div>
      <h1>Vault</h1>
      <div class="checking-spinner" aria-hidden="true"></div>
      <div class="version-tag">Version ${APP_VERSION}</div>
    </div>
  `;
}

function renderLocked(app){
  const hasBio = hasBiometricUnlockConfigured();
  app.innerHTML = `
    <div class="login-screen login-screen--locked">
      <div class="seal">${brandMarkSvg(50)}</div>
      <h1>Vault Locked</h1>
      <p>${hasBio ? 'Verifying with biometric unlock…' : 'Enter your PIN to continue.'}</p>
      ${hasBio ? `<button class="google-btn" id="bioUnlockBtn">${icon('shield',20)} Unlock with biometric</button>` : ''}
      <input type="password" inputmode="numeric" pattern="[0-9]*" id="lockPinInput" placeholder="PIN" maxlength="8" style="text-align:center;font-size:22px;letter-spacing:8px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);margin-top:10px;background:var(--surface-container);color:var(--ink);" />
      <div class="error-text" id="lockErr" style="display:none;"></div>
      <button class="primary" id="lockUnlockBtn">Unlock</button>
      <button class="ghost" id="lockSignOutBtn">Not you? Sign out</button>
      <div class="version-tag">Version ${APP_VERSION}</div>
    </div>
  `;
  const pinInput = document.getElementById('lockPinInput');
  const errEl = document.getElementById('lockErr');
  const tryPin = async () => {
    const ok = await verifyAppLockPin(pinInput.value.trim());
    if(ok) markAppUnlocked();
    else { errEl.textContent = 'Incorrect PIN.'; errEl.style.display = 'block'; pinInput.value = ''; pinInput.focus(); }
  };
  document.getElementById('lockUnlockBtn').onclick = tryPin;
  pinInput.onkeydown = (e) => { if(e.key === 'Enter') tryPin(); };
  pinInput.focus();
  const attemptBio = async () => {
    const ok = await verifyBiometricUnlock();
    if(ok) markAppUnlocked();
    else { errEl.textContent = "Biometric unlock didn't go through — try your PIN instead."; errEl.style.display = 'block'; }
  };
  const bioBtn = document.getElementById('bioUnlockBtn');
  if(bioBtn) bioBtn.onclick = attemptBio;
  // Biometric is the primary path when it's set up — try it automatically rather than making the
  // user tap a button first, falling back to the PIN (already focused above) only if it fails or
  // is cancelled. Guarded by bioAutoAttemptedThisLock so this fires once per lock, not once per
  // render (renderLocked can be invoked again while still locked, e.g. by the visibilitychange
  // listener below).
  if(hasBio && !bioAutoAttemptedThisLock){
    bioAutoAttemptedThisLock = true;
    attemptBio();
  }
  document.getElementById('lockSignOutBtn').onclick = () => signOutUser();
}

// True when running as an installed PWA (Android "Add to Home Screen" / iOS "Add to Home Screen"),
// not a regular browser tab. Used only to show a more specific hint if sign-in gets stuck there
// (see the demo-note below) — the sign-in flow itself (signInWithPopup) is the same either way.
function isStandalonePwa(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function renderLogin(app){
  app.innerHTML = `
    <div class="login-screen">
      <div class="seal">${brandMarkSvg(50)}</div>
      <h1>Vault</h1>
      <p>A secure place for your important documents — organized in your own Google Drive, and searchable by what's inside them.</p>
      <button class="google-btn" id="googleBtn">
        <svg class="gicon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.7 35.4 27 36.4 24 36.4c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.9 35.9 44 30.4 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
        Sign in with Google
      </button>
      <div class="error-text" id="loginErr" style="display:none;"></div>
      ${isStandalonePwa() ? `<div class="demo-note">Signing in from the installed app but stuck? Open this site in your regular browser and sign in there once — the installed app will pick up the same sign-in automatically the next time you open it.</div>` : ''}
      <div class="demo-note">Your documents are stored as regular files in your own Google Drive, under a "Vault" folder, and organized by category. This app can only see the files and folders it creates there.</div>
      <button type="button" class="privacy-link" id="privacyLinkBtn">Privacy Policy</button>
      <div class="version-tag">Version ${APP_VERSION}</div>
    </div>
  `;
  document.getElementById('privacyLinkBtn').onclick = () => { state.modal = 'privacy'; pushAppHistoryState(); render(); };
  document.getElementById('googleBtn').onclick = async () => {
    const btn = document.getElementById('googleBtn');
    const errEl = document.getElementById('loginErr');
    errEl.style.display = 'none';
    btn.disabled = true;
    const provider = new firebase.auth.GoogleAuthProvider();

    // Popup, not redirect: a redirect depends on state (which account is mid-sign-in) surviving
    // a full page navigation away to Google and back, via storage on this origin — and that
    // round trip turned out to be unreliable in practice for a brand-new sign-in (confirmed:
    // already-persisted sessions restored fine, since that path never leaves the page at all,
    // but a fresh interactive sign-in via redirect silently landed back on this same login screen
    // instead of completing). A popup keeps everything in this one continuous script execution
    // instead, with nothing to lose across a navigation — and it's already proven reliable here,
    // since it's what the Drive-consent step (grantDriveAccessOneTime) has used successfully the
    // whole time.
    if(authFlowInProgress) return;
    authFlowInProgress = true;
    btn.textContent = 'Signing in…';
    try{
      const result = await auth.signInWithPopup(provider);
      state.user = {name: result.user.displayName, email: result.user.email, uid: result.user.uid, photoURL: result.user.photoURL};
      const tokenResp = await acquireDriveAccess();
      applyDriveTokenResponse(tokenResp);
      // "Setting up" wrongly implied first-time provisioning on every single sign-in, including a
      // perfectly normal returning user re-authenticating after a sign-out. We don't know yet
      // whether this account has ever been provisioned (that's only certain once loadUserData()
      // itself checks Firestore), but a prior successful load on this exact device already left a
      // local record of it — good enough to get the common case right.
      let knownProvisioned = false;
      try{ knownProvisioned = localStorage.getItem('vault-ever-provisioned-' + state.user.uid) === 'true'; } catch(e){}
      btn.textContent = knownProvisioned ? 'Loading your vault…' : 'Setting up your vault…';
      await loadUserData();
      collapseAllCategories();
      state.screen = 'vault';
      render();
      armExitGuardIfIdle();
      maybeShowChangelog();
    } catch(e){
      console.error('Sign-in failed', e);
      btn.disabled = false;
      btn.textContent = 'Sign in with Google';
      // A blocked popup is a distinct, actionable case — the generic "please try again" message
      // sends the user in a loop retrying the exact same thing that will fail again until they
      // know to allow popups first. A user-cancelled popup isn't a failure worth alarming over.
      if(e && e.code === 'auth/popup-blocked'){
        errEl.textContent = "Your browser blocked the sign-in popup — allow popups for this site, then try again.";
      } else if(e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')){
        errEl.textContent = '';
        errEl.style.display = 'none';
      } else {
        errEl.textContent = 'Sign-in failed — please try again.';
      }
      if(errEl.textContent) errEl.style.display = 'block';
    } finally {
      authFlowInProgress = false;
    }
  };
  renderModal();
}

// Shown when Firebase still has the identity (so we know who's signed in) but there's no usable

function matchesSearch(doc){
  if(!state.searchQuery) return {match:true, snippet:null};
  const q = state.searchQuery.toLowerCase();
  if(doc.title.toLowerCase().includes(q)) return {match:true, snippet:null};
  const text = doc.ocrText || '';
  const idx = text.toLowerCase().indexOf(q);
  if(idx === -1) return {match:false, snippet:null};
  const start = Math.max(0, idx-28);
  const end = Math.min(text.length, idx+q.length+28);
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  const snippet = escapeHtml(text.slice(start,end)).replace(re, '<mark>$1</mark>');
  return {match:true, snippet: (start>0?'…':'') + snippet + (end<text.length?'…':'')};
}

// numbers, codes, or anything else worth having one tap away to copy, without needing a document
// attached to it. Not end-to-end encrypted (same protection level as everything else in Vault); the

  if(!state.quickRefSearchQuery) return true;
