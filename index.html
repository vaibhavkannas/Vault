    // The Enhance filter is a browser Canvas 2D `ctx.filter`, not an OpenCV op — applied as a
    // second pass over the already-warped pixels, same filter string used everywhere else.
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = outW; finalCanvas.height = outH;
    const ctx = finalCanvas.getContext('2d');
    ctx.filter = ENHANCE_FILTER;
    ctx.drawImage(warpedCanvas, 0, 0);
    return finalCanvas.toDataURL('image/jpeg', 0.92);
  } catch(e){
    console.warn('Perspective warp failed, falling back to a plain crop', e);
    return null;
  } finally {
    cleanup.forEach(m => { try{ m.delete(); } catch(e){} });
  }
}

// Fallback for when OpenCV isn't available at all (never loaded, e.g. fully offline before the
// first successful fetch): the same straight, non-perspective-corrected crop this feature always
// did, just using the free-form quad's own bounding box as the region — still correct for a photo
// taken roughly straight-on, which is the common case anyway.
function plainBoundingBoxCrop(img, quadNatural, enhanceOn){
  const xs = [quadNatural.tl.x, quadNatural.tr.x, quadNatural.bl.x, quadNatural.br.x];
  const ys = [quadNatural.tl.y, quadNatural.tr.y, quadNatural.bl.y, quadNatural.br.y];
  const sx = Math.min(...xs), sy = Math.min(...ys);
  const sw = Math.max(1, Math.max(...xs) - sx), sh = Math.max(1, Math.max(...ys) - sy);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(sw); canvas.height = Math.round(sh);
  const ctx = canvas.getContext('2d');
  if(enhanceOn) ctx.filter = ENHANCE_FILTER; // must be set before drawImage
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.92);
}

// Bakes the crop (perspective-corrected when OpenCV is available, and the enhance filter if
// enabled) onto a full-resolution canvas and replaces or appends into state.capturedPages — the
// only thing saveCameraDocument()'s jsPDF loop ever reads, so that loop needs no changes at all.
// The on-screen crop quad is converted to true source pixels via the live <img>'s natural-vs-
// rendered size ratio, so the output is never upsampled beyond what the camera actually captured.
async function confirmCrop(){
  const img = document.getElementById('cropImage');
  const q = state.cropQuad;
  const scaleX = img.naturalWidth / img.clientWidth, scaleY = img.naturalHeight / img.clientHeight;
  const toNatural = (p) => ({x: p.x * scaleX, y: p.y * scaleY});
  const quadNatural = {tl: toNatural(q.tl), tr: toNatural(q.tr), bl: toNatural(q.bl), br: toNatural(q.br)};

  const warped = await warpQuadToDataUrl(img, quadNatural, state.cropEnhanceOn);
  const dataUrl = warped || plainBoundingBoxCrop(img, quadNatural, state.cropEnhanceOn);

  const index = state.cropIndex;
  const isNewPage = index === state.capturedPages.length;
  const rawSrc = state.cropSourceDataUrl;
  const enhanceOn = state.cropEnhanceOn;
  state.cropIndex = null; state.cropSourceDataUrl = null; state.cropQuad = null;
  cropRepaintCurrentQuad = null;

  if(isNewPage){
    state.capturedPages.push(dataUrl);
    state.capturedPagesRaw.push(rawSrc);
    state.capturedPageEnhance.push(enhanceOn);
    pendingPageOcrTexts.push('');
  } else {
    state.capturedPages[index] = dataUrl; // in-place replace — saveCameraDocument() needs no change
    state.capturedPageEnhance[index] = enhanceOn;
    // capturedPagesRaw[index] deliberately untouched — a future re-edit keeps starting from the
    // real original, not from this crop's own output.
  }
  pendingOcrRunning = true;
  renderModal();
  const pageNum = isNewPage ? state.capturedPages.length : index + 1;
  const totalPages = state.capturedPages.length;

  // Same OCR/suggestion tail capturePage() used to run inline, now running on the cropped and
  // possibly-enhanced pixels instead of the raw frame.
  const pageText = await runOcr(dataUrl, pct => setOcrProgress(pct, pageNum, totalPages));
  const progEl = document.getElementById('ocrProgress');
  if(progEl) progEl.style.display = 'none';
  // Re-find this page's CURRENT position rather than trusting the index captured before the
  // OCR await — another page could have been deleted in the meantime, shifting positions, and
  // writing to a stale index would land this text on the wrong page.
  const currentIndex = state.capturedPages.indexOf(dataUrl);
  if(currentIndex !== -1) pendingPageOcrTexts[currentIndex] = pageText;
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  applyExpirySuggestionIfEmpty('camExpiry', 'camExpirySuggestNote', pendingOcrText);
  syncReminderDaysEnabled('camExpiry', 'camReminderDays', 'camReminderWrap');
  applyCategorySuggestionIfUntouched('camCategory', 'camCategorySuggestNote', pendingOcrText);
  applyTitleSuggestionIfEmpty('camTitle', 'camTitleSuggestNote', pendingOcrText);
  // Re-snapshot — a suggestion above may have just written into the title/expiry/category fields
  // directly, so this picks that up too, ready for the next renderModal().
  snapshotCamFormFields();
  pendingOcrRunning = false;
}

function cancelCrop(){
  // A brand-new capture that's cancelled was never pushed to capturedPages — nothing to roll back
  // beyond closing the overlay. Cancelling an edit of an existing page leaves its stored image
  // untouched, since confirmCrop() never ran.
  state.cropIndex = null; state.cropSourceDataUrl = null; state.cropQuad = null;
  cropRepaintCurrentQuad = null;
  renderModal();
}

function removeCapturedPage(index){
  snapshotCamFormFields();
  state.capturedPages.splice(index, 1);
  state.capturedPagesRaw.splice(index, 1);
  state.capturedPageEnhance.splice(index, 1);
  pendingPageOcrTexts.splice(index, 1);
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  renderModal();
}

async function saveCameraDocument(){
  const title = document.getElementById('camTitle').value.trim();
  const category = document.getElementById('camCategory').value;
  const expiry = document.getElementById('camExpiry').value;
  const reminderDays = expiry ? parseReminderDaysInput(document.getElementById('camReminderDays').value) : null;
  const tags = parseTagsInput(document.getElementById('camTags').value);
  const errEl = document.getElementById('camErr');
  const saveBtn = document.getElementById('saveCamBtn');

  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  if(!state.capturedPages.length){ errEl.textContent='Capture at least one page.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  const originalLabel = saveBtn.textContent;
  const renewalTargetId = state.renewalUploadTargetId;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  // Captured before anything below can change it — see saveDocument()'s identical use of this for
  // the file-upload form. A page's OCR can still be running (the user didn't wait for it) when
  // Save is tapped; pendingOcrText at that instant may be missing that page's text entirely.
  const needsBackgroundOcr = pendingOcrRunning;

  try{
    await loadJsPdfScript();
    // Always a PDF, even for a single page — a scanned document should behave like one
    // regardless of how many pages it took, not silently become a plain JPEG below 2 pages.
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    state.capturedPages.forEach((img, i) => {
      if(i > 0) pdf.addPage();
      const props = pdf.getImageProperties(img);
      const w = pdf.internal.pageSize.getWidth();
      const h = (props.height * w) / props.width;
      pdf.addImage(img, 'JPEG', 0, 0, w, h);
    });
    const blob = dataUrlToBlob(pdf.output('datauristring'));
    const mimeType = 'application/pdf';

    const newDoc = await finalizeAndStoreDocument({title, category, expiry, reminderDays, tags, blob, mimeType, ocrText: pendingOcrText, onUploadProgress: setUploadProgress});
    state.renewalUploadTargetId = null;
    stopCamera();
    closeModal();
    if(renewalTargetId){
      const linked = await linkRenewalAndArchiveOld(renewalTargetId, newDoc.id);
      toast(linked ? 'Renewed — old document archived' : 'Saved, but the old document needs archiving manually');
    } else {
      toast(needsBackgroundOcr ? 'Saved — reading text on-device in the background' : 'Captured and saved');
    }
    if(needsBackgroundOcr) extractTextForDocument(newDoc.id, true);
  } catch(e){
    console.error('Save failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;
  }
}

/* ---------- edit / view / archive / delete ---------- */
function openEditModal(id){ state.modal = 'edit'; state.editDocId = id; pushAppHistoryState(); render(); }
// A reminder schedule means nothing without an expiry date to count down to — keeps the "Remind
// me" field disabled (and cleared, so a value typed before the expiry was cleared can't sneak
// through) until one exists. Called on the expiry field's own input event AND right after any
// programmatic value assignment (OCR's applyExpirySuggestionIfEmpty sets .value directly, which
// fires no input event of its own).
// A reminder schedule means nothing without an expiry date to count down to — the whole "Remind
// me" section (label, input, hint text) stays hidden, not just disabled, until one exists, and
// its value is cleared if a filled-in expiry is ever removed so a value typed earlier can't sneak
// through unseen. Called on the expiry field's own input event AND right after any programmatic
// value assignment (OCR's applyExpirySuggestionIfEmpty sets .value directly, which fires no input
// event of its own) — and also wired to the expiry field's Clear button, for the same reason.
function syncReminderDaysEnabled(expiryId, reminderId, wrapId){
  const expiryInput = document.getElementById(expiryId);
  const reminderInput = document.getElementById(reminderId);
  const wrap = document.getElementById(wrapId);
  if(!expiryInput || !reminderInput || !wrap) return;
  const hasExpiry = !!expiryInput.value;
  wrap.style.display = hasExpiry ? '' : 'none';
  if(!hasExpiry) reminderInput.value = '';
}

// Custom per-document reminder schedule (days-before-expiry), overriding the global milestone
// list the Apps Script digest otherwise uses — e.g. a passport might warrant a 90-day heads-up,
// not just the default 14. Blank means "use the default schedule", not "remind never".
function parseReminderDaysInput(value){
  if(!value || !value.trim()) return null;
  const days = value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => Number.isFinite(n) && n >= -365 && n <= 365);
  const unique = [...new Set(days)];
  return unique.length ? unique : null;
}

// Freeform per-document labels layered on top of the fixed category — same comma-separated shape
// as parseReminderDaysInput above, just for arbitrary text instead of numbers: split, trim, drop
// empty pieces, cap each tag's length and the total count so one enormous paste can't bloat a
// document record, and de-duplicate case-insensitively (keeping whichever casing was typed first)
// so "Car" and "car" don't end up as two visually-identical tags. A tag can't contain a literal
// comma — same accepted limitation as parseReminderDaysInput's own comma-separated input.
function parseTagsInput(value){
  if(!value || !value.trim()) return [];
  const seen = new Set();
  const tags = [];
  for(const raw of value.split(',')){
    const tag = raw.trim().slice(0, 30);
    if(!tag) continue;
    const key = tag.toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    tags.push(tag);
    if(tags.length >= 20) break;
  }
  return tags;
}

async function saveEditedDocument(){
  const doc = state.documents.find(d => d.id === state.editDocId);
  if(!doc) return;
  const title = document.getElementById('editTitle').value.trim();
  const category = document.getElementById('editCategory').value;
  const expiry = document.getElementById('editExpiry').value;
  const reminderDays = expiry ? parseReminderDaysInput(document.getElementById('editReminderDays').value) : null;
  const tags = parseTagsInput(document.getElementById('editTags').value);
  const errEl = document.getElementById('editErr');
  const saveBtn = document.getElementById('saveEditBtn');
  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  try{
    const newCat = categoryFor(category);
    const oldCat = categoryFor(doc.category);
    if(newCat.id !== oldCat.id){
      await driveMoveFile(doc.driveFileId, oldCat.driveFolderId, newCat.driveFolderId);
    }
    // A targeted .update() with only the fields this form actually edits, not persistDocument()'s
    // full .set() — this doc object in memory can be stale relative to Firestore (e.g. archived,
    // pinned, keepOffline, or deletedAt changed from another tab/device since this one last loaded
    // it, since nothing here uses a realtime listener). Spreading the whole local copy into a .set()
    // would silently revert any of those fields back to what this tab last saw, discarding whatever
    // changed elsewhere.
    const changes = {title, category: newCat.id, expiry: expiry || null, reminderDays, tags};
    await userDoc().collection('documents').doc(doc.id).update(changes);
    Object.assign(doc, changes);
    closeModal();
    toast('Document updated');
  } catch(e){
    console.error('Edit failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save changes';
  }
}

// Fetches the file's actual bytes and shows them inline instead of leaving the app for Drive's
// own viewer — same alt=media fetch already used for OCR during Drive sync, just rendered here
// instead of run through Tesseract. The modal shell renders immediately (via pushAppHistoryState
// + render below); the fetch result fills in #viewFileContent once it resolves.
//
// PDFs render via PDF.js onto <canvas>, same as images render via <img> — both end up as plain
// pixels inside this same modal, so viewing behaves identically for every document type instead
// of depending on whatever PDF handling (or lack of it) the browser happens to have.
async function viewDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  state.modal = 'viewFile';
  state.viewDocId = id;
  pushAppHistoryState();
  render();
  if(state.isOfflineMode && !state.offlineDocIds.has(id)){
    // Known upfront, no need to let a doomed fetch attempt run first — this document's metadata
    // is cached (that's why it's listed at all) but its file bytes never were.
    const contentEl = document.getElementById('viewFileContent');
    if(contentEl) contentEl.innerHTML = `<p class="error-text">Not available offline — connect to view this document.</p>`;
    return;
  }
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    const blob = await res.blob();
    // Closed/navigated away before the fetch resolved — nothing to fill in, and no stale blob
    // URL to leave dangling.
    if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
    await renderViewedBlob(blob, doc, id);
    cacheDocumentOffline(doc, blob); // fire-and-forget — never blocks showing the doc
  } catch(e){
    console.error('View failed, checking the offline cache', e);
    const cached = await getOfflineDocument(id);
    if(cached && state.modal === 'viewFile' && state.viewDocId === id){
      await renderViewedBlob(cached.blob, doc, id);
      toast('Showing the offline copy — you may be disconnected');
      return;
    }
    const contentEl = document.getElementById('viewFileContent');
    if(contentEl) contentEl.innerHTML = `<p class="error-text">${escapeHtml(friendlyCloudError(e))}</p>`;
  }
}

async function renderViewedBlob(blob, doc, id){
  const url = URL.createObjectURL(blob);
  state.viewObjectUrl = url;
  const contentEl = document.getElementById('viewFileContent');
  if(!contentEl) return;
  if(doc.mimeType === 'application/pdf'){
    await renderPdfInto(contentEl, blob, id);
  } else {
    // A plain <img> tag has no promise/exception to catch when its bytes can't be decoded as an
    // image — it just fails silently, leaving the browser's own broken-image icon with no
    // explanation (the actual bug report this fixes: "shows the name and a small image icon but
    // doesn't load the actual document"). The most common real cause is a format the file's own
    // mimeType claims to be viewable but that browsers can't decode inline — HEIC/HEIF photos
    // (the default format iPhone cameras save in) are the one people actually hit, since the file
    // picker's accept="image/*" happily accepts them, but no mainstream desktop browser (and most
    // mobile ones outside Safari's own native photo views) can paint HEIC into an <img> or <canvas>.
    // Checking with a throwaway Image() first — instead of optimistically inserting the real <img>
    // and only finding out later — means never leaving a half-broken zoomable view on screen for a
    // file that was never going to render anyway; if it can't be checked and stays undecided this
    // element itself is long gone since the modal's since closed, so we bail out either way.
    const canDecode = await new Promise((resolve) => {
      const probe = new Image();
      probe.onload = () => resolve(true);
      probe.onerror = () => resolve(false);
      probe.src = url;
    });
    if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
    if(!canDecode){
      const formatLabel = (doc.mimeType || '').split('/')[1];
      contentEl.innerHTML = `<p class="error-text">This ${formatLabel ? formatLabel.toUpperCase() + ' ' : ''}image can't be previewed here — your browser can't display this format inline. Use Share or Download to open it in another app.</p>`;
      return;
    }
    contentEl.innerHTML = `<div class="view-zoom-inner"><img src="${url}" alt="${escapeHtml(doc.title)}" style="max-width:100%;border-radius:8px;display:block;margin:0 auto;"></div>`;
    wireViewFileZoom(contentEl);
  }
}

// Pinch-to-zoom, drag-to-pan (once zoomed), double-tap-to-zoom, and a reset-zoom button for the
// document viewer — the one place inside the app allowed to zoom now that the page itself can't
// (see the viewport meta tag). Gesture RECOGNITION is deliberately scoped to the whole sheet
// (#viewFileSheet), not just this content area: a second pinch finger very often lands on the
// sheet's title/handle/buttons around a small preview image, and a handler scoped to just the
// image would silently miss that finger, falling through to the browser's own native page-zoom
// instead (see isInsideZoomableViewer, which exempts this same wider boundary). The actual zoom/pan
// TRANSFORM is still only ever applied to `inner`, so visually only the document itself scales,
// never the sheet chrome around it. Panning is a manual translate()+scale() transform driven
// entirely by this code, not native scroll — see #viewFileContent's own CSS comment for why: native
// scroll interacting with a simultaneous pinch is exactly the combination some Android/Chrome
// versions handle unreliably, which is what let the whole page zoom instead of just this element.
const VIEW_ZOOM_MIN = 1, VIEW_ZOOM_MAX = 4;
function wireViewFileZoom(contentEl){
  const inner = contentEl.querySelector('.view-zoom-inner');
  if(!inner) return;
  const sheetEl = contentEl.closest('#viewFileSheet') || contentEl;
  const resetBtn = document.getElementById('viewZoomResetBtn');

  let zoom = 1, panX = 0, panY = 0;
  const apply = () => {
    inner.style.transform = (zoom === 1 && panX === 0 && panY === 0) ? '' : `translate(${panX}px, ${panY}px) scale(${zoom})`;
    if(resetBtn) resetBtn.hidden = zoom <= 1;
  };

  // .view-zoom-inner is display:inline-block specifically so its own box shrink-wraps to the real
  // content (image or stacked PDF-page canvases) instead of the full content-area width (see its
  // CSS comment) — #viewFileContent's text-align:center then centers that box whenever it's
  // narrower than the content area. That centering is a LAYOUT position, untouched by the scale()
  // transform below (transform is paint-only), so `inner`'s untransformed left edge sits this many
  // px right of #viewFileContent's own left edge. Every pan/zoom calculation below works in
  // #viewFileContent-relative coordinates (what toLocal() returns, what clientWidth/Height measure)
  // and has to account for this offset to stay correct for anything narrower than the viewer.
  const centeringOffsetX = () => (contentEl.clientWidth - inner.offsetWidth) / 2;

  // Whether there's actually anything to pan — at rest (zoom 1) a tall multi-page PDF or a tall
  // single image can already exceed the fixed 65vh content height with nothing zoomed at all, and
  // this still needs to be draggable/scrollable exactly like it would be in any PDF/image viewer,
  // not just once the user has zoomed in.
  function canPan(){
    return inner.offsetWidth * zoom > contentEl.clientWidth + 0.5 || inner.offsetHeight * zoom > contentEl.clientHeight + 0.5;
  }
  // Keeps the content from drifting past its own real edges — measured against the CONTENT area's
  // own visible box, not the wider sheet used for gesture detection above.
  function clampPan(){
    const viewW = contentEl.clientWidth, viewH = contentEl.clientHeight;
    const offsetX = centeringOffsetX();
    const scaledW = inner.offsetWidth * zoom, scaledH = inner.offsetHeight * zoom;
    // Horizontal: when the content still fits, leave it exactly at its natural centered position
    // (panX 0) rather than letting it drift — CSS centering is already doing the right thing there.
    // Once it overflows, panX is free to move between showing the true left edge and the true right
    // edge, offset by the same centering amount that's always present underneath any pan.
    panX = scaledW <= viewW ? 0 : Math.max(viewW - scaledW - offsetX, Math.min(-offsetX, panX));
    // Vertical: .view-zoom-inner has no equivalent vertical centering (block flow, not text-align),
    // so its untransformed top edge is always exactly #viewFileContent's own top edge — no offset.
    const minY = Math.min(0, viewH - scaledH);
    panY = Math.max(minY, Math.min(0, panY));
  }
  function resetZoom(){ zoom = 1; panX = 0; panY = 0; apply(); }
  // Re-anchors on the given point (in #viewFileContent-relative coordinates, i.e. what toLocal()
  // returns) so that exact spot stays visually still as zoom changes — pinching or double-tapping
  // near an edge zooms toward what your fingers are actually on, instead of the content appearing
  // to slide toward the top-left corner every time. anchorX has to be converted into `inner`'s own
  // untransformed coordinate space first (subtracting the centering offset above) before the same
  // translate math applies to panX, which operates in that space, not #viewFileContent's.
  function zoomTo(newZoom, anchorX, anchorY){
    newZoom = Math.max(VIEW_ZOOM_MIN, Math.min(VIEW_ZOOM_MAX, newZoom));
    const scaleRatio = newZoom / zoom;
    const localAnchorX = anchorX - centeringOffsetX();
    panX = localAnchorX - (localAnchorX - panX) * scaleRatio;
    panY = anchorY - (anchorY - panY) * scaleRatio;
    zoom = newZoom;
    clampPan();
    apply();
  }
  const toLocal = (clientX, clientY) => {
    const rect = contentEl.getBoundingClientRect();
    return {x: clientX - rect.left, y: clientY - rect.top};
  };

  const pointers = new Map(); // pointerId -> {x,y} in viewport coordinates
  let mode = null; // null | 'pan' | 'pinch'
  let gestureStart = null; // a snapshot taken at the start of whichever mode is currently active
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // Tracked separately from `mode`/`gestureStart` above: a single pointer that hasn't moved far
  // enough to count as a drag is a tap candidate regardless of zoom level (even at zoom 1, where
  // `mode` never becomes 'pan' since there's nothing to pan yet) — this is what double-tap below
  // actually checks.
  let tapStart = null;
  let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

  sheetEl.addEventListener('pointerdown', (e) => {
    // An actual control — close/share/download, a caching-status link, the drag-to-dismiss handle
    // — keeps behaving like a normal tap/click. This only ever engages for a gesture starting
    // somewhere else in the sheet (the image itself, or empty space around it).
    if(e.target.closest('button, a, input, select, textarea, .sheet-handle')) return;
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    // Guarded: a capture request can be rejected (e.g. the pointer already went away between this
    // event being queued and handled) — losing capture just means a finger that drifts outside the
    // sheet mid-gesture stops being tracked a little sooner than ideal, not a reason to abort the
    // whole gesture over.
    try{ sheetEl.setPointerCapture(e.pointerId); } catch(err){}
    if(pointers.size === 1){
      tapStart = {x: e.clientX, y: e.clientY};
      if(canPan()){ mode = 'pan'; gestureStart = {x: e.clientX, y: e.clientY, panX, panY}; }
    } else if(pointers.size === 2){
      tapStart = null; // a second finger joining means this was never going to be a tap
      const [a, b] = [...pointers.values()];
      const anchor = toLocal((a.x + b.x) / 2, (a.y + b.y) / 2);
      const d = dist(a, b);
      if(d > 0){ mode = 'pinch'; gestureStart = {dist: d, zoom, panX, panY, anchor}; }
      e.preventDefault();
    }
    // 3+ pointers: an accidental extra finger is still tracked (so releasing it back down to 2 is
    // handled correctly below) but doesn't change whatever gesture is already active — see the
    // pointers.size===2 branch in releasePointer, which is what actually resyncs the pinch once
    // back down to exactly two real fingers, rather than anything done here.
  });

  sheetEl.addEventListener('pointermove', (e) => {
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if(tapStart && dist(tapStart, {x: e.clientX, y: e.clientY}) > 10) tapStart = null; // moved too far to be a tap
    if(mode === 'pan' && pointers.size === 1){
      e.preventDefault();
      panX = gestureStart.panX + (e.clientX - gestureStart.x);
      panY = gestureStart.panY + (e.clientY - gestureStart.y);
      clampPan();
      apply();
    } else if(mode === 'pinch' && pointers.size === 2){
      e.preventDefault();
      const [a, b] = [...pointers.values()];
      // Reset to the gesture's own starting snapshot before each zoomTo() call, rather than
      // compounding off wherever the previous pointermove left things — keeps the math anchored to
      // the pinch's true origin instead of drifting across many rapid-fire move events.
      zoom = gestureStart.zoom; panX = gestureStart.panX; panY = gestureStart.panY;
      zoomTo(gestureStart.zoom * (dist(a, b) / gestureStart.dist), gestureStart.anchor.x, gestureStart.anchor.y);
    }
  });

  const releasePointer = (e) => {
    if(!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if(pointers.size === 0){
      mode = null;
      // pointercancel (the browser/OS aborting the touch — an edge-swipe system gesture claiming it,
      // a focus/visibility change mid-touch) isn't a deliberate release, and its coordinates aren't
      // guaranteed to reflect where the finger actually was — only a genuine pointerup counts toward
      // double-tap detection.
      if(tapStart && e.type === 'pointerup'){
        const isDoubleTap = e.timeStamp - lastTapTime < 320 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 24;
        lastTapTime = e.timeStamp; lastTapX = e.clientX; lastTapY = e.clientY;
        if(isDoubleTap){
          lastTapTime = 0; // consumed — a third quick tap starts a fresh pair, not another toggle
          if(zoom > 1) resetZoom();
          else{ const p = toLocal(e.clientX, e.clientY); zoomTo(2, p.x, p.y); }
        }
      }
      tapStart = null;
    } else if(pointers.size === 2){
      // Covers both "an accidental 3rd finger just lifted back off" and "one of an active pinch's
      // original two fingers lifted while a 3rd was also down" — either way, whichever two pointers
      // are ACTUALLY still held right now become a fresh pinch baseline from their current distance,
      // rather than reusing whatever gestureStart was snapshotted from a possibly different pointer
      // pair earlier. Without this, a stale gestureStart.dist from a no-longer-held finger pair could
      // get divided against the distance between a completely different pair, producing a sudden,
      // unrelated zoom jump.
      const [a, b] = [...pointers.values()];
      const anchor = toLocal((a.x + b.x) / 2, (a.y + b.y) / 2);
      const d = dist(a, b);
      if(d > 0){ mode = 'pinch'; gestureStart = {dist: d, zoom, panX, panY, anchor}; }
      tapStart = null;
    } else if(pointers.size === 1){
      // Dropped from 2 (or more) fingers to 1 — hand off to a fresh pan instead of just stopping, so
      // lifting a finger after a pinch doesn't feel like the gesture died.
      const [p] = [...pointers.values()];
      mode = canPan() ? 'pan' : null;
      gestureStart = {x: p.x, y: p.y, panX, panY};
      tapStart = null;
    }
  };
  sheetEl.addEventListener('pointerup', releasePointer);
  sheetEl.addEventListener('pointercancel', releasePointer);

  // Desktop-only paths. A ctrl-key'd wheel event zooms, both zooming toward the content area's own
  // center rather than the cursor — simpler, and this is a secondary path (the reported bug is
  // touch-only). A real trackpad pinch (Mac, no touchscreen involved at all) never satisfies the
  // 2-pointer path above — it's reported as its own distinct gesture, not two simultaneous touch
  // contacts. Chrome/Firefox synthesize a trackpad pinch as a ctrl-key'd wheel event (a real
  // ctrl+wheel scroll is rare enough that treating every ctrlKey wheel as a pinch is the standard,
  // accepted tradeoff); Safari instead fires its own non-standard gesturestart/gesturechange events
  // with a cumulative e.scale relative to whatever zoom was active when the gesture began.
  //
  // A plain (non-ctrl) wheel/trackpad scroll pans instead, when there's overflow to pan through —
  // the mouse/trackpad equivalent of dragging on touch, restoring what #viewFileContent's native
  // scroll used to do for free before this became a fully custom transform.
  sheetEl.addEventListener('wheel', (e) => {
    if(e.ctrlKey){
      e.preventDefault();
      zoomTo(zoom * (1 - e.deltaY * 0.01), contentEl.clientWidth / 2, contentEl.clientHeight / 2);
      return;
    }
    if(!canPan()) return;
    e.preventDefault();
    panX -= e.deltaX; panY -= e.deltaY;
    clampPan();
    apply();
  }, {passive: false});
  let gestureBaseZoom = 1;
  sheetEl.addEventListener('gesturestart', (e) => { e.preventDefault(); gestureBaseZoom = zoom; });
  sheetEl.addEventListener('gesturechange', (e) => {
    e.preventDefault();
    zoomTo(gestureBaseZoom * e.scale, contentEl.clientWidth / 2, contentEl.clientHeight / 2);
  });

  if(resetBtn) resetBtn.onclick = resetZoom;
}

async function renderPdfInto(contentEl, blob, id){
  contentEl.innerHTML = `<div class="checking-spinner" aria-hidden="true" style="margin:24px auto;"></div>`;
  const arrayBuffer = await blob.arrayBuffer();
  // Bailed out or moved to a different document while the PDF was loading/rendering.
  if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
  await loadPdfJsScript();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const wrap = document.createElement('div');
  wrap.className = 'pdf-pages';
  const targetWidth = Math.min(contentEl.clientWidth || 320, 480);
  const dpr = window.devicePixelRatio || 1;
  for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){
    if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
    const page = await pdf.getPage(pageNum);
    const baseViewport = page.getViewport({scale: 1});
    const scale = targetWidth / baseViewport.width;
    const viewport = page.getViewport({scale: scale * dpr});
    const canvas = document.createElement('canvas');
    canvas.className = 'pdf-page-canvas';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = targetWidth + 'px';
    canvas.style.height = (viewport.height / dpr) + 'px';
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    wrap.appendChild(canvas);
  }
  if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
  const inner = document.createElement('div');
  inner.className = 'view-zoom-inner';
  inner.appendChild(wrap);
  contentEl.innerHTML = '';
  contentEl.appendChild(inner);
  wireViewFileZoom(contentEl);
}

// Fetches a document's actual bytes from Drive when reachable, falling back to the offline cache
// when it isn't (or short-circuiting immediately when we already know we're offline and this one
// was never cached) — the same fallback viewDocument() already had, now shared so downloading and
// sharing a document work offline too instead of unconditionally attempting a doomed Drive fetch.
async function getDocumentBlob(doc){
  if(state.isOfflineMode && !state.offlineDocIds.has(doc.id)){
    const err = new Error("Not available offline — connect to download or share this document.");
    err.code = 'OFFLINE_NOT_CACHED';
    throw err;
  }
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    return {blob: await res.blob(), mimeType: doc.mimeType};
  } catch(e){
    const cached = await getOfflineDocument(doc.id);
    if(cached) return {blob: cached.blob, mimeType: cached.mimeType || doc.mimeType};
    throw e;
  }
}
async function downloadDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  render();
  try{
    const {blob, mimeType} = await getDocumentBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = safeFilename(doc.title, mimeType);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(e){
    console.error('Download failed', e);
    toast(e && e.code === 'OFFLINE_NOT_CACHED' ? e.message : friendlyCloudError(e));
  }
}

// The renewal strip's Archive icon sits directly on the card with no menu step guarding it (unlike
// the doc-card's ⋮ → Archive, which already takes two deliberate taps) — a single mis-tap there
// archived a document with zero chance to back out. This adds that missing confirmation.
function requestArchiveDocument(id){ state.modal = 'confirmArchive'; state.archiveDocId = id; pushAppHistoryState(); render(); }

async function toggleArchive(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  const previousArchived = doc.archived, previousArchivedAt = doc.archivedAt;
  doc.archived = !doc.archived;
  // Needed so an optional "auto-delete archived documents after N days" setting has something to
  // measure age from — restoring clears it back to null rather than leaving a stale date behind
  // from a previous archive.
  doc.archivedAt = doc.archived ? new Date().toISOString() : null;
  render();
  toast(doc.archived ? 'Archived' : 'Restored', {onAction: () => toggleArchive(id)});
  try{ await userDoc().collection('documents').doc(id).update({archived: doc.archived, archivedAt: doc.archivedAt}); }
  catch(e){
    // Was previously a silent console.error only — the flag could flip in the open tab while
    // Firestore quietly kept the old value, with no sign anything went wrong until a later reload
    // reverted it with no explanation. Same rollback-and-report shape as every other optimistic
    // toggle in this file (toggleCategoryKeepOfflineDefault, the bulk actions).
    console.error('Failed to update archive state', e);
    doc.archived = previousArchived;
    doc.archivedAt = previousArchivedAt;
    render();
    toast(friendlyCloudError(e));
  }
}

// Guided path for retiring an expired document: archives it (same effect as the generic Archive
// action) and, if the user points at whatever replaced it, records that link both directions —
// supersededBy on the old doc, supersedes on the new one — so either card can show the connection
// without an extra lookup. Kept as a distinct modal/flow (rather than just adding a picker to the
// generic Archive action) because it's specifically prompted the moment a document is actually
// overdue, which the buried ⋮ → Archive menu item never was.
function openRenewExpiredModal(id){ state.modal = 'renewExpired'; state.renewDocId = id; pushAppHistoryState(); render(); }
async function confirmRenewExpired(){
  const doc = state.documents.find(d => d.id === state.renewDocId);
  if(!doc) return;
  const replacementId = document.getElementById('renewReplacementSelect').value || null;
  const replacementDoc = replacementId ? state.documents.find(d => d.id === replacementId) : null;
  const btn = document.getElementById('confirmRenewBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Archiving…'; }
  const previousArchived = doc.archived, previousArchivedAt = doc.archivedAt || null, previousSupersededBy = doc.supersededBy || null;
  const previousSupersedes = replacementDoc ? (replacementDoc.supersedes || null) : null;
  doc.archived = true;
  doc.archivedAt = new Date().toISOString();
  if(replacementDoc){ doc.supersededBy = replacementDoc.id; replacementDoc.supersedes = doc.id; }
  try{
    const batch = db.batch();
    batch.update(userDoc().collection('documents').doc(doc.id), replacementDoc
      ? {archived: true, archivedAt: doc.archivedAt, supersededBy: replacementDoc.id}
      : {archived: true, archivedAt: doc.archivedAt});
    if(replacementDoc) batch.update(userDoc().collection('documents').doc(replacementDoc.id), {supersedes: doc.id});
    await batch.commit();
    closeModal();
    toast('Archived');
  } catch(e){
    console.error('Failed to archive with renewal link', e);
    doc.archived = previousArchived; doc.archivedAt = previousArchivedAt; doc.supersededBy = previousSupersededBy;
    if(replacementDoc) replacementDoc.supersedes = previousSupersedes;
    render();
    if(btn){ btn.disabled = false; btn.textContent = 'Archive this document'; }
    toast(friendlyCloudError(e));
  }
}

async function togglePin(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  const previous = doc.pinned;
  doc.pinned = !doc.pinned;
  render();
  toast(doc.pinned ? 'Pinned to top' : 'Unpinned', {onAction: () => togglePin(id)});
  try{ await userDoc().collection('documents').doc(id).update({pinned: doc.pinned}); }
  catch(e){
    console.error('Failed to update pin state', e);
    doc.pinned = previous;
    render();
    toast(friendlyCloudError(e));
  }
}

// Same optimistic-update-then-persist shape as togglePin above, but turning the flag ON additionally
// needs the document's blob actually cached, not just listed — which the plain flip-and-persist
// pattern alone doesn't cover. Turning it OFF is deliberately inert beyond the flag itself: never
// deletes the cached blob and never makes a network call (only the manual "free up space" action in
// Settings, or an explicit delete/purge, ever evicts a cached blob) — it just also refreshes the
// cached metadata record when one already exists, in both directions, since that record is what the
// "free up space" reclaim action reads to decide whether a document's blob is protected.
async function toggleKeepOffline(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  const previous = doc.keepOffline;
  doc.keepOffline = !doc.keepOffline;
  render();
  try{ await userDoc().collection('documents').doc(id).update({keepOffline: doc.keepOffline}); }
  catch(e){
    // Bail out here, not just log-and-continue — if the flag itself never actually saved, there is
    // nothing for the caching logic below to correctly act on (it would otherwise download and
    // cache a document Firestore still says isn't flagged keepOffline, or vice versa).
    console.error('Failed to update keep-offline state', e);
    doc.keepOffline = previous;
    render();
    toast(friendlyCloudError(e));
    return;
  }

  if(state.offlineDocIds.has(id)) await updateOfflineDocumentMetadata(doc);
  if(!doc.keepOffline) return; // OFF: flag flipped (and metadata un-protected, above) — nothing else to do

  if(state.offlineDocIds.has(id)){
    toast('Kept offline');
    return;
  }
  toast('Downloading for offline use…');
  const {succeeded, quotaExceeded} = await downloadDocumentsForKeepOffline([doc]);
  if(succeeded) toast('Available offline');
  else if(quotaExceeded) toast('Ran out of storage space — free up space in Settings and try again.');
  else toast("Couldn't download this document for offline use — check your connection and try again.");
}

// Backfills OCR text for a document that doesn't have any yet (a PDF uploaded before this app ran
// OCR on PDFs at all, an image or PDF saved before its own on-device OCR had a chance to finish —
// see saveDocument()/saveCameraDocument()'s own background-OCR use of this below, `silent: true` —
// or simply one that's never been re-uploaded since). Re-downloads the file it already has and
// runs it through the same OCR path a fresh upload uses now, then updates the saved record so
// content search picks it up without the user needing to delete and re-add the document.
// `silent` skips every toast — appropriate for this running automatically in the background right
// after a save, not for someone deliberately tapping "Extract text" and watching for a result.
async function extractTextForDocument(id, silent){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  if(!silent) toast('Reading text on-device…');
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    const blob = await res.blob();
    const ocrText = doc.mimeType === 'application/pdf'
      ? await runOcrOnPdfFile(new File([blob], safeFilename(doc.title, doc.mimeType), {type: doc.mimeType}))
      : await runOcr(await readFileAsDataURL(blob));
    // The document may have been deleted, or this exact field already updated by something else,
    // while the download+OCR above was in flight — re-check it's still worth writing rather than
    // trusting the reference captured before any of that started.
    if(!state.documents.some(d => d.id === id)) return;
    doc.ocrText = ocrText;
    render();
    await userDoc().collection('documents').doc(id).update({ocrText});
    if(!silent) toast(ocrText ? 'Text extracted — now searchable' : 'No readable text found in this document');
  } catch(e){
    console.error('Extract text failed', e);
    if(!silent) toast(friendlyCloudError(e));
  }
}

function requestDeleteDocument(id){ state.modal = 'confirmDelete'; state.deleteDocId = id; pushAppHistoryState(); render(); }
// Soft-delete: moves the Drive file into Vault/Deleted and marks deletedAt instead of removing it
// outright — matching runArchiveCleanup()'s own move-then-mark approach in Code.gs, so both "delete"
// paths in the app give the same 30-day undo window rather than one being recoverable and the other
// not. removeOfflineDocument() still runs either way: a trashed document has no business staying in
// the offline cache, and if it's later restored, viewing it again just re-caches it fresh.
async function confirmDeleteDocument(){
  const id = state.deleteDocId;
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  const btn = document.getElementById('confirmDelBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Deleting…'; }
  try{
    const deletedFolderId = await ensureDeletedFolderId();
    if(doc.driveFileId) await driveMoveFile(doc.driveFileId, categoryFor(doc.category).driveFolderId, deletedFolderId);
    const deletedAt = new Date().toISOString();
    // One atomic batch, not two sequential writes — the server-side trash-cleanup job
    // (apps-script/Code.gs) only ever looks at accounts present in trashSubscribers, so if these
    // were separate calls and the second one failed after the first succeeded, this document would
    // sit in Recently Deleted forever, never actually auto-purged despite the "gone for good in N
    // days" promise shown to the user.
    const batch = db.batch();
    batch.update(userDoc().collection('documents').doc(id), {deletedAt});
    batch.set(db.collection('trashSubscribers').doc(state.user.uid), {uid: state.user.uid, updatedAt: deletedAt});
    await batch.commit();
    doc.deletedAt = deletedAt;
    removeOfflineDocument(id);
    closeModal();
    toast(`Moved to Recently deleted — restore within ${TRASH_RETENTION_DAYS} days, or it's gone for good`);
  } catch(e){
    console.error('Failed to delete document', e);
    if(btn){ btn.disabled = false; btn.textContent = 'Move to Recently deleted'; }
    toast(friendlyCloudError(e));
  }
}
// Immediate, permanent delete from the trash view — the one place the ORIGINAL unconditional
// delete behavior still exists, for someone who's sure and doesn't want to wait out the rest of
// the trash window.
function requestPurgeDocument(id){ state.modal = 'confirmPurge'; state.purgeDocId = id; pushAppHistoryState(); render(); }
async function confirmPurgeDocument(){
  const id = state.purgeDocId;
  const doc = state.documents.find(d => d.id === id);
  state.documents = state.documents.filter(d => d.id !== id);
  closeModal();
  toast('Permanently deleted');
  removeOfflineDocument(id);
  try{
    // Drive first, Firestore record second — the reverse of the old order. This record already has
    // deletedAt set from the earlier soft-delete, so if the Firestore delete below fails, the
    // already-scheduled trash-cleanup job (apps-script/Code.gs) will simply find it again later and
    // retry both. The old order could delete the Firestore record and then have the Drive call
    // fail, leaving that file permanently orphaned in Drive with nothing anywhere left to reference
    // it, ever — the app had already told the user it was "Permanently deleted" regardless.
    if(doc && doc.driveFileId) await driveDelete(doc.driveFileId);
    await userDoc().collection('documents').doc(id).delete();
  } catch(e){
    console.error('Failed to remove document from storage', e);
    toast('Removed from Vault, but cleanup hit a problem — it will be cleared automatically later.');
  }
}
// Moves a trashed document's file back to its category folder and clears deletedAt — the reverse
// of confirmDeleteDocument(). Optimistic like togglePin/toggleArchive: flips local state and
// re-renders immediately, rolling back only if the underlying Drive/Firestore calls fail.
async function restoreDeletedDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  const previousDeletedAt = doc.deletedAt;
  doc.deletedAt = null;
  render();
  toast('Restored');
  // Firestore's deletedAt is what the scheduled trash-cleanup job (apps-script/Code.gs) actually
  // decides "permanently delete this" from — not which Drive folder the file happens to be sitting
  // in. Writing that FIRST (not the Drive move first, as this used to do) means the worst case if
  // the Drive move below then fails is just the file sitting in the wrong (Deleted) Drive folder
  // while Firestore and the app both correctly already show it as restored — the cleanup job leaves
  // it alone either way. The old order could leave a file already moved OUT of Deleted with
  // Firestore still saying deletedAt was set, if the Firestore write failed after a successful Drive
  // move — the cleanup job would still find and permanently destroy that file on schedule, despite
  // the user having just "restored" it.
  try{
    await userDoc().collection('documents').doc(id).update({deletedAt: null});
  } catch(e){
    console.error('Failed to restore document (Firestore write)', e);
    doc.deletedAt = previousDeletedAt;
    render();
    toast(friendlyCloudError(e));
    return;
  }
  try{
    const deletedFolderId = await ensureDeletedFolderId();
    if(doc.driveFileId) await driveMoveFile(doc.driveFileId, deletedFolderId, categoryFor(doc.category).driveFolderId);
  } catch(e){
    // The document IS safely restored at this point (Firestore already agrees) — only the Drive
    // folder move failed, a cosmetic mismatch, not something to revert or report as a failed
    // restore.
    console.error('Restored, but could not move the Drive file out of Deleted', e);
    toast('Restored, but couldn’t move the file out of Deleted in Drive — it’s safe, just in the wrong folder there.');
  }
}

/* ---------- bulk actions (multi-select) ----------
   An explicit multi-select mode over the document list (active OR archived — same code path for
   both) so Move/Archive/Delete can be applied to several documents at once instead of one card's
   ⋮ menu at a time. See state.selectMode/state.selectedDocIds above for the selection model. */

// Splits an array into groups of at most `size` — used below to keep a Firestore batch write
// under its real ~500-document limit, chunked at a smaller 400 as a defensive margin rather than
// relying on the exact ceiling.
function chunkArray(arr, size){
  const chunks = [];
  for(let i=0; i<arr.length; i+=size) chunks.push(arr.slice(i, i+size));
  return chunks;
}

// Turns select mode on, pushing one history layer — Back (via exitSelectMode()/goBackOneLayer()
// below) peels it the same way every other layer in this app closes. Always starts with a clean
// selection, even if some stale ids were somehow left over from a previous session.
function enterSelectMode(){
  state.selectMode = true;
  state.selectedDocIds = new Set();
  pushAppHistoryState();
  render();
}
// Routed through the app's single "go back one layer" mechanism rather than clearing
// state.selectMode itself — so the topbar's Cancel (×) button and the hardware/browser Back
// button are the exact same code path. clearTopLayerState()'s selectMode branch (see above) is
// what actually turns select mode off; this never duplicates that logic.
function exitSelectMode(){
  goBackOneLayer();
}
// Toggles one document's BARE id in/out of the selection set — see state.selectedDocIds above
// for why this is keyed by bare id, not by renderDocCard's per-instance key.
function toggleDocSelected(id){
  if(state.selectedDocIds.has(id)) state.selectedDocIds.delete(id);
  else state.selectedDocIds.add(id);
  render();
}

// The three bulk-confirm openers below deliberately do NOT call pushAppHistoryState() — unlike
// every other `state.modal = ...; pushAppHistoryState(); render();` opener in this file. They're a
// sub-step of the already-pushed select-mode layer (see enterSelectMode() above), not a new
// top-level navigation of their own: the modal branch of clearTopLayerState() (checked before the
// selectMode branch) already closes just the modal on Back, leaving select mode and the selection
// intact, and each bulk operation's own completion step below pops the select-mode layer exactly
// once on finishing. Adding a push here would need an extra Back press per modal open, AND would
// make each operation's single closing goBackOneLayer() below only close the modal instead of also
// exiting select mode — a future maintainer "fixing" this missing push as an oversight would
// reintroduce that double-pop-on-completion bug.
function requestBulkArchive(){
  if(!state.selectedDocIds.size) return;
  state.modal = 'confirmBulkArchive';
  render();
}
function requestBulkDelete(){
  if(!state.selectedDocIds.size) return;
  state.modal = 'confirmBulkDelete';
  render();
}
function requestBulkMove(){
  if(!state.selectedDocIds.size) return;
  state.modal = 'confirmBulkMove';
  render();
}

// Resolves the current selection against the FULL document list (never the filtered/visible one —
// selection must survive the search box narrowing what's on screen, see state.selectedDocIds
// above) and drops any id that no longer resolves to a document (deleted/purged by some other
// means while sitting selected) — fails safe instead of crashing on a stale id.
function resolveSelectedDocs(){
  return Array.from(state.selectedDocIds).map(id => state.documents.find(d => d.id === id)).filter(Boolean);
}

// Bulk archive/restore: "flip" is deliberate, not "set to true" — reused as-is whether the
// selection came from the active list (flips false→true, archiving) or the archived list (flips
// true→false, restoring), so select mode works identically over either list per the same
// toggleArchive() semantics a single card's ⋮ menu already uses.
async function performBulkArchive(){
  const docs = resolveSelectedDocs();
  const btn = document.getElementById('confirmBulkArchiveBtn');
  if(!docs.length){ state.modal = null; goBackOneLayer(); return; }
  const restoring = !!docs[0].archived; // every selected doc shares one archived state — see point above
  if(btn){ btn.disabled = true; btn.textContent = restoring ? 'Restoring…' : 'Archiving…'; }
  const previous = docs.map(d => ({id: d.id, archived: d.archived, archivedAt: d.archivedAt || null}));
  docs.forEach(d => {
    d.archived = !d.archived;
    d.archivedAt = d.archived ? new Date().toISOString() : null;
  });
  // Deliberately NOT rendered yet — this confirm modal is still open, and renderModal() always
  // tears down and rebuilds whatever modal is currently showing (see its own top: it unconditionally
  // removes #modalOverlay and recreates it) rather than patching one in place. Rendering here, before
  // the batch below has actually committed, would replace this very button with a fresh, un-disabled
  // one mid-flight — reopening exactly the double-submit window the disabled/"Archiving…" state
  // above exists to close. performBulkDelete()/performBulkMove() already get this right by only
  // rendering once their own async work is fully done; this mirrors that, rendering only after the
  // batch commits (success) or fails (below) — never while it's still in flight.
  try{
    for(const chunk of chunkArray(docs, 400)){
      const batch = db.batch();
      chunk.forEach(d => batch.update(userDoc().collection('documents').doc(d.id), {archived: d.archived, archivedAt: d.archivedAt}));
      await batch.commit();
    }
    render();
    toast(restoring ? `Restored ${docs.length} document${docs.length===1?'':'s'}` : `Archived ${docs.length} document${docs.length===1?'':'s'}`);
    // Only clear+pop if this modal is still the one we opened — if the user already backed out of
    // it (Back/Escape/backdrop tap) while this was in flight, that Back press already popped the
    // select-mode layer itself, and doing it again here would pop one layer too many.
    if(state.modal === 'confirmBulkArchive'){ state.modal = null; goBackOneLayer(); }
  } catch(e){
    console.error('Bulk archive failed', e);
    previous.forEach(p => {
      const d = state.documents.find(x => x.id === p.id);
      if(d){ d.archived = p.archived; d.archivedAt = p.archivedAt; }
    });
    render();
    if(btn){ btn.disabled = false; btn.textContent = restoring ? 'Restore' : 'Archive'; }
    toast(friendlyCloudError(e));
  }
}

// Bulk delete: same soft-delete-into-"Vault/Deleted" move as confirmDeleteDocument(), but the
// per-document Drive move runs concurrently via a settled-results call (not a plain Promise.all)
// so one document's failure can't abort the rest — then only the succeeded subset gets its
// deletedAt written, in one atomic batch (chunked defensively, see chunkArray above).
async function performBulkDelete(){
  const docs = resolveSelectedDocs();
  const btn = document.getElementById('confirmBulkDeleteBtn');
  if(!docs.length){ state.modal = null; goBackOneLayer(); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Deleting…'; }
  try{
    const deletedFolderId = await ensureDeletedFolderId();
    const results = await Promise.allSettled(docs.map(d =>
      d.driveFileId ? driveMoveFile(d.driveFileId, categoryFor(d.category).driveFolderId, deletedFolderId) : Promise.resolve()
    ));
    const succeeded = docs.filter((d,i) => results[i].status === 'fulfilled');
    const failed = docs.length - succeeded.length;
    if(succeeded.length){
      const deletedAt = new Date().toISOString();
      // trashSubscribers is folded into every chunk's own batch (not written once, separately,
      // after all chunks commit) — same reasoning as confirmDeleteDocument's single-document path:
      // if that separate write failed after the chunks above already succeeded, these documents
      // would sit in Recently Deleted forever, since the cleanup job only visits accounts actually
      // present in trashSubscribers. Repeating the same idempotent .set() across chunks is harmless.
      for(const chunk of chunkArray(succeeded, 400)){
        const batch = db.batch();
        chunk.forEach(d => batch.update(userDoc().collection('documents').doc(d.id), {deletedAt}));
        batch.set(db.collection('trashSubscribers').doc(state.user.uid), {uid: state.user.uid, updatedAt: deletedAt});
        await batch.commit();
      }
      succeeded.forEach(d => { d.deletedAt = deletedAt; removeOfflineDocument(d.id); });
    }
    render();
    toast(failed
      ? `Deleted ${succeeded.length} of ${docs.length} — ${failed} couldn't be moved, still in your vault`
      : `Moved ${succeeded.length} document${succeeded.length===1?'':'s'} to Recently deleted`);
    if(state.modal === 'confirmBulkDelete'){ state.modal = null; goBackOneLayer(); }
  } catch(e){
    console.error('Bulk delete failed', e);
    render();
    if(btn){ btn.disabled = false; btn.textContent = 'Move to Recently deleted'; }
    toast(friendlyCloudError(e));
  }
}

// Bulk move to a different category: same settled-results Drive move as performBulkDelete()
// above, then a category field batch write for the succeeded subset only. Any selected document
// already in the target category is a no-op — skipped up front, never touched.
async function performBulkMove(){
  const targetSelect = document.getElementById('bulkMoveCategorySelect');
  const targetCat = categoryFor(targetSelect ? targetSelect.value : undefined);
  const allDocs = resolveSelectedDocs();
  const docs = allDocs.filter(d => d.category !== targetCat.id);
  const btn = document.getElementById('confirmBulkMoveBtn');
  if(!allDocs.length){ state.modal = null; goBackOneLayer(); return; }
  if(!docs.length){
    state.modal = null;
    toast(`Already in ${targetCat.label}`);
    goBackOneLayer();
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = 'Moving…'; }
  try{
    const results = await Promise.allSettled(docs.map(d => {
      const oldCat = categoryFor(d.category);
      return d.driveFileId ? driveMoveFile(d.driveFileId, oldCat.driveFolderId, targetCat.driveFolderId) : Promise.resolve();
    }));
    const succeeded = docs.filter((d,i) => results[i].status === 'fulfilled');
    const failed = docs.length - succeeded.length;
    if(succeeded.length){
      for(const chunk of chunkArray(succeeded, 400)){
        const batch = db.batch();
        chunk.forEach(d => batch.update(userDoc().collection('documents').doc(d.id), {category: targetCat.id}));
        await batch.commit();
      }
      succeeded.forEach(d => { d.category = targetCat.id; });
    }
    render();
    toast(failed
      ? `Moved ${succeeded.length} of ${docs.length} to ${targetCat.label} — ${failed} couldn't be moved`
      : `Moved ${succeeded.length} document${succeeded.length===1?'':'s'} to ${targetCat.label}`);
    if(state.modal === 'confirmBulkMove'){ state.modal = null; goBackOneLayer(); }
  } catch(e){
    console.error('Bulk move failed', e);
    render();
    if(btn){ btn.disabled = false; btn.textContent = 'Move'; }
    toast(friendlyCloudError(e));
  }
}

/* ---------- sharing ---------- */
function openShareModal(docId){ state.modal='share'; state.shareDocId=docId; pushAppHistoryState(); render(); }
// Hands the actual file to the OS share sheet (Messages, Email, WhatsApp, whatever the user has).
// The fake vault.app/shared/... link feature that used to sit alongside this was removed entirely
// — there was never a backend that could actually resolve it for an unauthenticated recipient.
// getDocumentBlob() below already resolves from the offline cache when there's no connection (the
// same source the document viewer itself reads from to display it at all — see renderViewedBlob),
// so this works offline for exactly the same documents the user can already open offline, with no
// extra logic needed here for that.
//
// btnId/errElId are parameterized (not hardcoded) so more than one place in the UI can trigger this
// with its own loading/error feedback — the dedicated Share modal (shareFileBtn/shareFileErr) and
// the document viewer's own Share button (which has no separate error slot, so it falls back to a
// toast) both call this same function rather than duplicating the share logic.
async function shareDocumentFile(docId, btnId = 'shareFileBtn', errElId = 'shareFileErr'){
  const doc = state.documents.find(d => d.id === docId);
  if(!doc) return;
  const btn = btnId ? document.getElementById(btnId) : null;
  const errEl = errElId ? document.getElementById(errElId) : null;
  const originalBtnHtml = btn ? btn.innerHTML : null; // restored as-is in finally, whatever it said
  if(errEl) errEl.style.display = 'none';
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const {blob, mimeType} = await getDocumentBlob(doc);
    const file = new File([blob], safeFilename(doc.title, mimeType), {type: mimeType});
    if(navigator.canShare && navigator.canShare({files: [file]})){
      await navigator.share({files: [file], title: doc.title});
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = safeFilename(doc.title, mimeType);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Sharing files isn't supported here — downloaded instead");
    }
  } catch(e){
    if(e && e.name === 'AbortError') return; // user dismissed the native share sheet — not an error
    console.error('Share file failed', e);
    const message = e && e.code === 'OFFLINE_NOT_CACHED' ? e.message : friendlyCloudError(e);
    if(errEl){ errEl.textContent = message; errEl.style.display = 'block'; } else { toast(message); }
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = originalBtnHtml; }
  }
}

/* ---------- Drive reconnect ----------
   Shown as a banner in the vault header when the current access token has expired mid-session.
   Should be rare now — the background refresh timer and the mint-on-every-load path normally
   keep this from ever being needed — but if it is, this mints a fresh token from the stored
   refresh token (or, on the rarer NO_GRANT/GRANT_REVOKED case, falls back to the one-time
   consent popup, still within this same click's gesture). Doesn't touch the Firebase auth
   session or any already-loaded documents, since identity and Drive access are separate. */
async function reconnectDrive(){
  // Without this, a slow attempt (acquireDriveAccess() can mean a real network round trip, and
  // Apps Script's own cold-start latency has been known to run into several seconds) looked
  // completely dead — same click, same label, nothing on screen changing — which read as "the
  // button doesn't work" even when it was still genuinely in progress.
  const btn = document.getElementById('reconnectDriveBtn');
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Reconnecting…'; }
  try{
    const tokenResp = await acquireDriveAccess();
    applyDriveTokenResponse(tokenResp);
    if(state.isOfflineMode){
      state.isOfflineMode = false;
      state.offlineReason = null;
      await loadUserData(); // replaces the limited offline-cache list with the real, full one
    }
    toast('Reconnected to Google Drive');
    render();
  } catch(e){
    console.error('Reconnect failed', e);
    // Refreshes the offline banner's reason too, not just the toast — the retry may have failed
    // for a different reason than the original cold-open failure (or just confirms the same one).
    if(state.isOfflineMode){ state.offlineReason = describeDriveAuthError(e); render(); }
    else if(btn){ btn.disabled = false; btn.textContent = originalLabel; } // render() above already redraws a fresh button in the isOfflineMode case; this restores it when render() isn't called at all
    toast(state.isOfflineMode ? 'Still offline — try again once you have a connection.' : 'Could not reconnect — please try again.');
  }
}

/* ---------- category management ---------- */
function openAddCategoryModal(){ state.modal = 'addCategory'; pushAppHistoryState(); render(); }
function openAppLockSetupModal(){ state.modal = 'appLockSetup'; pushAppHistoryState(); render(); }
async function saveNewCategory(){
  const iconKey = document.getElementById('newCatIcon').value.trim() || 'doc';
  const label = document.getElementById('newCatLabel').value.trim();
  const errEl = document.getElementById('newCatErr');
  const btn = document.getElementById('saveNewCatBtn');
  if(!label){ errEl.textContent='Enter a category name.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const id = 'cat_' + Date.now();
    const driveFolderId = await driveCreateFolder(label, state.vaultFolderId);
    const order = Math.max(-1, ...state.categories.map(c => c.order)) + 1;
    // Defaults on: a category you've just deliberately created is very likely one you'll want
    // available offline from the start, same reasoning as the stock categories every new account
    // starts with — off is still one tap away in Settings for anyone who wants it that way.
    await userDoc().collection('categories').doc(id).set({label, icon: iconKey, driveFolderId, order, keepOfflineDefault: true});
    state.categories.push({id, label, icon: iconKey, driveFolderId, order, keepOfflineDefault: true});
    cacheCategoriesOffline(state.categories); // fire-and-forget — keeps the offline snapshot (see paintFromLocalCacheIfAny) from going stale
    closeModal();
    toast('Category created');
  } catch(e){
    console.error('Create category failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create category';
  }
}

function openEditCategoryModal(id){ state.modal = 'editCategory'; state.editCategoryId = id; pushAppHistoryState(); render(); }
async function saveRenamedCategory(){
  const cat = state.categories.find(c => c.id === state.editCategoryId);
  if(!cat) return;
  const iconKey = document.getElementById('editCatIcon').value.trim() || cat.icon;
  const label = document.getElementById('editCatLabel').value.trim();
  const errEl = document.getElementById('editCatErr');
  const btn = document.getElementById('saveEditCatBtn');
  if(!label){ errEl.textContent='Enter a category name.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    if(label !== cat.label){
      // Best-effort — keeps the Drive folder's own name matching the category label so
      // browsing Drive directly still makes sense; not critical if this one call fails.
      try{
        await driveFetch(`https://www.googleapis.com/drive/v3/files/${cat.driveFolderId}`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: label})
        });
      } catch(renameErr){ console.error('Could not rename the matching Drive folder', renameErr); }
    }
    await userDoc().collection('categories').doc(cat.id).update({label, icon: iconKey});
    cat.label = label; cat.icon = iconKey;
    cacheCategoriesOffline(state.categories); // fire-and-forget — keeps the offline snapshot (see paintFromLocalCacheIfAny) from going stale
    closeModal();
    toast('Category updated');
  } catch(e){
    console.error('Rename category failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}

async function deleteCategory(id){
  const cat = state.categories.find(c => c.id === id);
  if(!cat) return;
  if(state.categories.length <= 1){ toast('You need at least one category.'); return; }
  const inUse = state.documents.filter(d => d.category === id).length;
  if(inUse > 0){ toast(`Can't delete "${cat.label}" — ${inUse} document${inUse===1?'':'s'} still use it. Move or delete them first.`); return; }
  try{
    await userDoc().collection('categories').doc(id).delete();
    try{ await driveDelete(cat.driveFolderId); } catch(e){ console.error('Could not delete the now-empty Drive folder', e); }
    state.categories = state.categories.filter(c => c.id !== id);
    cacheCategoriesOffline(state.categories); // fire-and-forget — keeps the offline snapshot (see paintFromLocalCacheIfAny) from going stale
    render();
    toast('Category deleted');
  } catch(e){
    console.error('Delete category failed', e);
    toast(friendlyCloudError(e));
  }
}

// Blocks a second reorder write from firing while one is still being committed — a fast enough
// double-click on an up/down arrow can otherwise beat the disabled-button re-render below, letting
// two overlapping batch writes race each other and leave `order` corrupted. Deliberately a plain
// module-level flag, not part of `state` — it's transient click-guard bookkeeping the rest of the
// app never needs to reason about, same idea as silentDriveRetryInFlight above.
let categoryReorderInFlight = false;

// Swaps the category at `id` with its neighbor in the given direction (-1 = up, +1 = down) and
// persists the result as a single atomic multi-document write, same batch pattern as
// saveNewCategory/toggleEmailDigest above. Unlike those optimistic updates, this deliberately does
// NOT touch state.categories until the write actually succeeds — a failed reorder should visibly
// snap back to exactly the prior order, not sit on a locally-applied order Firestore never agreed
// to.
async function moveCategoryOrder(id, direction){
  if(categoryReorderInFlight) return;
  const idx = state.categories.findIndex(c => c.id === id);
  if(idx === -1) return;
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= state.categories.length) return;

  const reordered = state.categories.slice();
  [reordered[idx], reordered[swapIdx]] = [reordered[swapIdx], reordered[idx]];

  categoryReorderInFlight = true;
  render(); // re-renders with every row's arrows disabled to show the pending state

  try{
    // Renumbers ALL categories to clean sequential integers, not just the two swapped — this makes
    // the write self-healing against any historical gaps or duplicates in the stored `order` field.
    const batch = db.batch();
    reordered.forEach((c,i) => batch.update(userDoc().collection('categories').doc(c.id), {order: i}));
    await batch.commit();
    reordered.forEach((c,i) => { c.order = i; });
    state.categories = reordered;
    cacheCategoriesOffline(state.categories); // fire-and-forget — keeps the offline snapshot (see paintFromLocalCacheIfAny) from going stale
  } catch(e){
    console.error('Failed to reorder categories', e);
    toast(friendlyCloudError(e));
    // No mutation on failure — state.categories is untouched, so the render() in `finally` below
    // redraws the on-screen order exactly as it was before this click.
  } finally {
    categoryReorderInFlight = false;
    render();
  }
}

// Optimistic like the other settings switches (e.g. bioUnlockSwitch above): flips local state and
// persists, rolling back with a toast only if the write fails. Governs ONLY documents added to this
// category from this moment on (see finalizeAndStoreDocument / runSyncFromDrive, the only two
// places that read it) — flipping it, in either direction, never touches documents already in the
// category.
async function toggleCategoryKeepOfflineDefault(catId, checked){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat) return;
  const previous = !!cat.keepOfflineDefault;
  cat.keepOfflineDefault = checked;
  try{
    await userDoc().collection('categories').doc(catId).update({keepOfflineDefault: checked});
    cacheCategoriesOffline(state.categories); // fire-and-forget — keeps the offline snapshot (see paintFromLocalCacheIfAny) from going stale
  } catch(e){
    console.error('Failed to update category keep-offline default', e);
    cat.keepOfflineDefault = previous;
    render();
    toast(friendlyCloudError(e));
    return;
  }
  // Turning this on is exactly the moment the user has said "I want this category available
  // offline" — without this, that only ever applied to documents added from now on, leaving
  // whatever was already in the category behind until the separate retry link (or the confirm
  // step reused here) was found and used on its own. Reusing requestCacheCategoryDocuments means
  // the same size-estimate confirmation the standalone action already had still applies here.
  if(checked){
    const pendingCount = state.documents.filter(d => d.category === catId && !d.deletedAt && !state.offlineDocIds.has(d.id)).length;
    if(pendingCount > 0){ requestCacheCategoryDocuments(catId); return; }
  }
  // No render() otherwise — same reasoning as bioUnlockSwitch above: the checkbox already shows
  // its own new state natively, and nothing else on screen reads keepOfflineDefault right now.
}

// CatIds with an in-progress "cache existing documents" bulk download (see cacheCategoryDocuments
// below) — deliberately a plain module-level set, not part of `state`, same click-guard bookkeeping
// idea as categoryReorderInFlight above. Keeps that category's row/button/status visible for the
// whole run even as its own live pending-count shrinks toward 0 partway through.
let categoryCacheRunningIds = new Set();

function requestCacheCategoryDocuments(catId){ state.modal = 'confirmCacheCategory'; state.cacheCategoryId = catId; pushAppHistoryState(); render(); }

// Runs the shared keep-offline downloader (see the "deliberate keep-offline downloads" section,
// above loadUserData) over one category's not-yet-cached, non-deleted documents — a one-time bulk
// action, independent of that category's keepOfflineDefault switch (which only ever affects
// documents created after it's turned on). The progress line mirrors buildDocumentsZipBlob's own
// onProgress callback for the ZIP export/backup feature.
async function cacheCategoryDocuments(catId){
  const targets = state.documents.filter(d => d.category === catId && !d.deletedAt && !state.offlineDocIds.has(d.id));
  if(!targets.length) return;
  categoryCacheRunningIds.add(catId);
  render();
  const {succeeded, failed, quotaExceeded} = await downloadDocumentsForKeepOffline(targets, (i, total) => {
    const statusEl = document.getElementById('cacheCatStatus-' + catId);
    if(statusEl) statusEl.textContent = `Caching ${i} of ${total}…`;
  });
  categoryCacheRunningIds.delete(catId);
  render();
  if(quotaExceeded) toast(`Ran out of storage space — cached ${succeeded} of ${targets.length} before storage filled up.`);
  else if(failed) toast(`Cached ${succeeded} of ${targets.length} — ${failed} couldn't be downloaded`);
  else toast(`Cached ${succeeded} document${succeeded===1?'':'s'} for offline use`);
}

// Reclaims space from the offline cache without forgetting anything: deletes only the cached BYTES
// (the OFFLINE_STORE entry) for every document whose own cached metadata record says keepOffline
// isn't true — the OFFLINE_META_STORE record is left completely alone, so the document stays listed
// as known-offline-by-name, just without content, exactly the "incidental copy" this button is
// scoped to. Uses each metadata record's own `size` field for the reported total rather than
// re-reading every blob just to measure it — approximate, per the button's own "up to" framing.
async function reclaimIncidentalOfflineSpace(){
  try{
    const db = await openOfflineDb();
    const metaRecords = await new Promise((resolve, reject) => {
      const req = db.transaction(OFFLINE_META_STORE, 'readonly').objectStore(OFFLINE_META_STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    const reclaimable = metaRecords.filter(m => !m.keepOffline && state.offlineDocIds.has(m.id));
    if(!reclaimable.length) return {count: 0, bytes: 0};
    await new Promise((resolve, reject) => {
      const tx = db.transaction(OFFLINE_STORE, 'readwrite');
      const store = tx.objectStore(OFFLINE_STORE);
      reclaimable.forEach(m => store.delete(m.id));
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    reclaimable.forEach(m => state.offlineDocIds.delete(m.id));
    const bytes = reclaimable.reduce((sum,m) => sum + (m.size||0), 0);
    return {count: reclaimable.length, bytes};
  } catch(e){
    console.warn('Could not free up incidental offline storage', e);
    return {count: 0, bytes: 0};
  }
}

/* ---------- sync from Drive ----------
   Picks up files added straight into a category's Drive subfolder outside the app: the
   subfolder a file was found in becomes its category, its filename (minus extension) becomes
   its title, and OCR runs on image files so it's searchable — same as adding through the app,
   just triggered manually here instead of automatically on every load. */
async function runSyncFromDrive(){
  const btn = document.getElementById('syncDriveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  let importedCount = 0;
  try{
    const knownIds = new Set(state.documents.map(d => d.driveFileId));
    for(const cat of state.categories){
      // Matching by driveFolderId alone misses a very real case: re-uploading an exported backup's
      // category folder (e.g. from the "Download" zip in Settings, unzipped and dragged back into
      // Drive) creates a NEW, separate folder with the same name rather than merging into the
      // existing one — Drive allows duplicate folder names, and there's no way to "re-attach" an
      // upload to a specific existing folder ID by name alone. Checking for any other same-named
      // folder directly under the Vault root (besides the one already on file) and pulling from
      // those too is what makes that reasonably work, as long as the name matches exactly.
      const folderIds = new Set([cat.driveFolderId]);
      try{
        const extraIds = await driveFindAllFolderIdsByName(cat.label, state.vaultFolderId);
        extraIds.forEach(id => folderIds.add(id));
      } catch(e){ console.error('Could not check for other same-named category folders', e); }
      for(const folderId of folderIds){
      const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,size)`);
