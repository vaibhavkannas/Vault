async function finalizeAndStoreDocument({title, category, expiry, reminderDays, blob, mimeType, ocrText, onUploadProgress}){
  const cat = categoryFor(category);
  const id = 'doc_' + Date.now();
  const filename = safeFilename(title, mimeType);
  const driveFileId = await driveUpload(blob, filename, mimeType, cat.driveFolderId, onUploadProgress);
  const doc = {
    id, title, category: cat.id, expiry: expiry || null, reminderDays: reminderDays || null,
    driveFileId, mimeType, size: blob.size || 0,
    ocrText: ocrText || '',
    addedAt: new Date().toISOString(),
    archived: false
  };
  try{
    await persistDocument(doc);
  } catch(e){
    // The Firestore write failed after the Drive upload already succeeded — clean up the now-
    // orphaned Drive file (best-effort) rather than leaving it dangling, and don't add the
    // document to local state below: if it's not in Firestore, it isn't really saved, and the
    // UI shouldn't show it as if it were.
    try{ await driveDelete(driveFileId); } catch(cleanupErr){ console.error('Could not clean up orphaned Drive file', cleanupErr); }
    throw e;
  }
  state.documents.unshift(doc);
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => { const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
}

/* ---------- camera capture ---------- */
let pendingPageOcrTexts = []; // per-page OCR text, parallel to state.capturedPages — lets removing
                               // a page also cleanly drop just that page's text from pendingOcrText
// Every capturePage()/removeCapturedPage() call rebuilds this modal's whole innerHTML (to show the
// new thumbnail, or reflect a removed page), which would otherwise silently reset every text field
// back to its default each time — not just the category <select> this was originally written for.
// These track whatever's currently in each field (typed by hand or filled by a suggestion) so the
// template below can restore them across that rebuild; snapshotCamFormFields() reads the live DOM
// right before each renderModal() call, so anything typed since the last capture is preserved too,
// not just what a suggestion already wrote in.
let pendingCamTitle = '';
let pendingCamCategory = null;
let pendingCamExpiry = '';
let pendingCamReminderDaysText = '';
function snapshotCamFormFields(){
  const t = document.getElementById('camTitle'), c = document.getElementById('camCategory'),
        e = document.getElementById('camExpiry'), r = document.getElementById('camReminderDays');
  if(t) pendingCamTitle = t.value;
  if(c) pendingCamCategory = c.value;
  if(e) pendingCamExpiry = e.value;
  if(r) pendingCamReminderDaysText = r.value;
}
async function startCamera(){
  const video = document.getElementById('cameraVideo');
  if(state.cameraStream){
    // Every capture re-renders the modal, which rebuilds the <video> element from scratch — the
    // stream itself is still live, so reattach it instead of requesting a brand-new one from
    // getUserMedia each time, which would leak the previous stream's tracks running unseen.
    if(video) video.srcObject = state.cameraStream;
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    // The camera modal (or the whole app, via the app-lock teardown) can close while this permission
    // prompt is still pending — unlike every other async modal-content loader here (viewDocument,
    // renderPdfInto), this one used to skip re-checking relevance after its await, so a stream
    // granted after the fact was stored and left running with nothing left to ever call
    // stopCamera() on it, live behind whatever's on screen now (including a locked device).
    if(state.modal !== 'camera'){ stream.getTracks().forEach(t => t.stop()); return; }
    state.cameraStream = stream;
    if(video) video.srcObject = state.cameraStream;
  } catch(e){
    const err = document.getElementById('camErr');
    if(err){ err.textContent = "Couldn't access the camera — check browser permissions."; err.style.display='block'; }
  }
}
function stopCamera(){
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(t=>t.stop()); state.cameraStream = null; }
}
function openCameraModal(){ state.modal = 'camera'; state.capturedPages = []; pendingPageOcrTexts = []; pendingOcrText = ''; pendingExpirySuggested = false; pendingCategorySuggested = false; categoryManuallyChanged = false; pendingCamTitle = ''; pendingCamCategory = null; pendingCamExpiry = ''; pendingCamReminderDaysText = ''; pendingOcrRunning = false; pushAppHistoryState(); render(); }

async function capturePage(){
  const video = document.getElementById('cameraVideo');
  if(!video || !video.videoWidth) return;
  snapshotCamFormFields();
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  state.capturedPages.push(dataUrl);
  pendingPageOcrTexts.push('');
  pendingOcrRunning = true;
  renderModal();
  const pageNum = state.capturedPages.length;
  const pageText = await runOcr(dataUrl, pct => setOcrProgress(pct, pageNum, pageNum));
  const progEl = document.getElementById('ocrProgress');
  if(progEl) progEl.style.display = 'none';
  // Re-find this page's CURRENT position rather than trusting the index captured before the
  // OCR await — another page could have been deleted in the meantime, shifting positions, and
  // writing to a stale index would land this text on the wrong page.
  const currentIndex = state.capturedPages.indexOf(dataUrl);
  if(currentIndex !== -1) pendingPageOcrTexts[currentIndex] = pageText;
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  applyExpirySuggestionIfEmpty('camExpiry', 'camExpirySuggestNote', pendingOcrText);
  applyCategorySuggestionIfUntouched('camCategory', 'camCategorySuggestNote', pendingOcrText);
  // Re-snapshot — a suggestion above may have just written into the expiry/category fields
  // directly, so this picks that up too, ready for the next capturePage()'s own renderModal().
  snapshotCamFormFields();
  pendingOcrRunning = false;
  const saveBtn = document.getElementById('saveCamBtn');
  if(saveBtn) saveBtn.disabled = false;
}

function removeCapturedPage(index){
  snapshotCamFormFields();
  state.capturedPages.splice(index, 1);
  pendingPageOcrTexts.splice(index, 1);
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  renderModal();
}

async function saveCameraDocument(){
  const title = document.getElementById('camTitle').value.trim();
  const category = document.getElementById('camCategory').value;
  const expiry = document.getElementById('camExpiry').value;
  const reminderDays = parseReminderDaysInput(document.getElementById('camReminderDays').value);
  const errEl = document.getElementById('camErr');
  const saveBtn = document.getElementById('saveCamBtn');

  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  if(!state.capturedPages.length){ errEl.textContent='Capture at least one page.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  const originalLabel = saveBtn.textContent;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try{
    let blob, mimeType;
    if(state.capturedPages.length === 1){
      blob = dataUrlToBlob(state.capturedPages[0]);
      mimeType = 'image/jpeg';
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      state.capturedPages.forEach((img, i) => {
        if(i > 0) pdf.addPage();
        const props = pdf.getImageProperties(img);
        const w = pdf.internal.pageSize.getWidth();
        const h = (props.height * w) / props.width;
        pdf.addImage(img, 'JPEG', 0, 0, w, h);
      });
      blob = dataUrlToBlob(pdf.output('datauristring'));
      mimeType = 'application/pdf';
    }

    await finalizeAndStoreDocument({title, category, expiry, reminderDays, blob, mimeType, ocrText: pendingOcrText, onUploadProgress: setUploadProgress});
    stopCamera();
    closeModal();
    toast('Captured and saved');
  } catch(e){
    console.error('Save failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;
  }
}

function openEditModal(id){ state.modal = 'edit'; state.editDocId = id; pushAppHistoryState(); render(); }
// Custom per-document reminder schedule (days-before-expiry), overriding the global milestone
// list the Apps Script digest otherwise uses — e.g. a passport might warrant a 90-day heads-up,
// not just the default 14. Blank means "use the default schedule", not "remind never".
function parseReminderDaysInput(value){
  if(!value || !value.trim()) return null;
  const days = value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => Number.isFinite(n) && n >= -365 && n <= 365);
  const unique = [...new Set(days)];
  return unique.length ? unique : null;
}

// Fetches the file's actual bytes and shows them inline instead of leaving the app for Drive's
// own viewer — same alt=media fetch already used for OCR during Drive sync, just rendered here
// instead of run through Tesseract. The modal shell renders immediately (via pushAppHistoryState
// + render below); the fetch result fills in #viewFileContent once it resolves.
//
// PDFs render via PDF.js onto <canvas>, same as images render via <img> — both end up as plain
// pixels inside this same modal, so viewing behaves identically for every document type instead
// of depending on whatever PDF handling (or lack of it) the browser happens to have.
async function viewDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  state.modal = 'viewFile';
  state.viewDocId = id;
  pushAppHistoryState();
  render();
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    const blob = await res.blob();
    // Closed/navigated away before the fetch resolved — nothing to fill in, and no stale blob
    // URL to leave dangling.
    if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
    await renderViewedBlob(blob, doc, id);
    cacheDocumentOffline(doc, blob); // fire-and-forget — never blocks showing the doc
  } catch(e){
    console.error('View failed, checking the offline cache', e);
    const cached = await getOfflineDocument(id);
    if(cached && state.modal === 'viewFile' && state.viewDocId === id){
      await renderViewedBlob(cached.blob, doc, id);
      toast('Showing the offline copy — you may be disconnected');
      return;
    }
    const contentEl = document.getElementById('viewFileContent');
    if(contentEl) contentEl.innerHTML = `<p class="error-text">${escapeHtml(friendlyCloudError(e))}</p>`;
  }
}

async function renderViewedBlob(blob, doc, id){
  const url = URL.createObjectURL(blob);
  state.viewObjectUrl = url;
  const contentEl = document.getElementById('viewFileContent');
  if(!contentEl) return;
  if(doc.mimeType === 'application/pdf'){
    await renderPdfInto(contentEl, blob, id);
  } else {
    contentEl.innerHTML = `<img src="${url}" alt="${escapeHtml(doc.title)}" style="max-width:100%;border-radius:8px;display:block;margin:0 auto;">`;
  }
}

async function renderPdfInto(contentEl, blob, id){
  contentEl.innerHTML = `<div class="checking-spinner" aria-hidden="true" style="margin:24px auto;"></div>`;
  const arrayBuffer = await blob.arrayBuffer();
  // Bailed out or moved to a different document while the PDF was loading/rendering.
  if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const wrap = document.createElement('div');
  wrap.className = 'pdf-pages';
  const targetWidth = Math.min(contentEl.clientWidth || 320, 480);
  const dpr = window.devicePixelRatio || 1;
  for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){
    if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
    const page = await pdf.getPage(pageNum);
    const baseViewport = page.getViewport({scale: 1});
    const scale = targetWidth / baseViewport.width;
    const viewport = page.getViewport({scale: scale * dpr});
    const canvas = document.createElement('canvas');
    canvas.className = 'pdf-page-canvas';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = targetWidth + 'px';
    canvas.style.height = (viewport.height / dpr) + 'px';
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    wrap.appendChild(canvas);
  }
  if(state.modal !== 'viewFile' || state.viewDocId !== id) return;
  contentEl.innerHTML = '';
  contentEl.appendChild(wrap);
}

async function downloadDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = safeFilename(doc.title, doc.mimeType);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(e){
    console.error('Download failed', e);
    toast(friendlyCloudError(e));
  }
}

async function toggleArchive(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  doc.archived = !doc.archived;
  render();
  toast(doc.archived ? 'Archived' : 'Restored');
  try{ await userDoc().collection('documents').doc(id).update({archived: doc.archived}); }
  catch(e){ console.error('Failed to update archive state', e); }
}

// Guided path for retiring an expired document: archives it (same effect as the generic Archive
// action) and, if the user points at whatever replaced it, records that link both directions —
// supersededBy on the old doc, supersedes on the new one — so either card can show the connection
// without an extra lookup. Kept as a distinct modal/flow (rather than just adding a picker to the
// generic Archive action) because it's specifically prompted the moment a document is actually
// overdue, which the buried ⋮ → Archive menu item never was.
function openRenewExpiredModal(id){ state.modal = 'renewExpired'; state.renewDocId = id; pushAppHistoryState(); render(); }
async function confirmRenewExpired(){
  const doc = state.documents.find(d => d.id === state.renewDocId);
  if(!doc) return;
  const replacementId = document.getElementById('renewReplacementSelect').value || null;
  const replacementDoc = replacementId ? state.documents.find(d => d.id === replacementId) : null;
  const btn = document.getElementById('confirmRenewBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Archiving…'; }
  const previousArchived = doc.archived, previousSupersededBy = doc.supersededBy || null;
  const previousSupersedes = replacementDoc ? (replacementDoc.supersedes || null) : null;
  doc.archived = true;
  if(replacementDoc){ doc.supersededBy = replacementDoc.id; replacementDoc.supersedes = doc.id; }
  try{
    const batch = db.batch();
    batch.update(userDoc().collection('documents').doc(doc.id), replacementDoc
      ? {archived: true, supersededBy: replacementDoc.id}
      : {archived: true});
    if(replacementDoc) batch.update(userDoc().collection('documents').doc(replacementDoc.id), {supersedes: doc.id});
    await batch.commit();
    closeModal();
    toast('Archived');
  } catch(e){
    console.error('Failed to archive with renewal link', e);
    doc.archived = previousArchived; doc.supersededBy = previousSupersededBy;
    if(replacementDoc) replacementDoc.supersedes = previousSupersedes;
    render();
    if(btn){ btn.disabled = false; btn.textContent = 'Archive this document'; }
    toast(friendlyCloudError(e));
  }
}

async function togglePin(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc) return;
  doc.pinned = !doc.pinned;
  render();
  toast(doc.pinned ? 'Pinned to top' : 'Unpinned');
  try{ await userDoc().collection('documents').doc(id).update({pinned: doc.pinned}); }
  catch(e){ console.error('Failed to update pin state', e); }
}

// Backfills OCR text for a PDF that was uploaded before this app ran OCR on PDFs at all (or one
// that simply hasn't been re-uploaded since) — re-downloads the file it already has and runs it
// through the same per-page OCR path a fresh PDF upload uses now, then updates the saved record so
// content search picks it up without the user needing to delete and re-add the document.
async function extractTextForDocument(id){
  const doc = state.documents.find(d => d.id === id);
  if(!doc || doc.mimeType !== 'application/pdf') return;
  toast('Reading text on-device…');
  try{
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
    const blob = await res.blob();
    const file = new File([blob], safeFilename(doc.title, doc.mimeType), {type: doc.mimeType});
    const ocrText = await runOcrOnPdfFile(file);
    doc.ocrText = ocrText;
    render();
    await userDoc().collection('documents').doc(id).update({ocrText});
    toast(ocrText ? 'Text extracted — now searchable' : 'No readable text found in this document');
  } catch(e){
    console.error('Extract text failed', e);
    toast(friendlyCloudError(e));
  }
}

function requestDeleteDocument(id){ state.modal = 'confirmDelete'; state.deleteDocId = id; pushAppHistoryState(); render(); }
async function confirmDeleteDocument(){
  const id = state.deleteDocId;
  const doc = state.documents.find(d => d.id === id);
  state.documents = state.documents.filter(d => d.id !== id);
  const removedShares = state.shares.filter(s => s.docId === id);
  state.shares = state.shares.filter(s => s.docId !== id);
  closeModal();
  toast('Document deleted');
  removeOfflineDocument(id);
  try{
    await userDoc().collection('documents').doc(id).delete();
    for(const s of removedShares) await userDoc().collection('shares').doc(s.id).delete();
    if(doc && doc.driveFileId) await driveDelete(doc.driveFileId);
  } catch(e){ console.error('Failed to remove document from storage', e); }
}

/* ---------- sharing ---------- */
function openShareModal(docId){ state.modal='share'; state.shareDocId=docId; state.lastGeneratedShareId=null; pushAppHistoryState(); render(); }
async function generateShare(docId){
  const token = Array.from(crypto.getRandomValues(new Uint8Array(9))).map(b=>b.toString(36)).join('').slice(0,14);
  const expiresAt = new Date(Date.now()+48*3600*1000).toISOString();
  const share = {id: 'share_'+Date.now(), docId, token, expiresAt, revoked:false};
  state.shares.unshift(share);
  // Drive the "here's your link" box off state instead of writing straight into #shareResult:
  // renderModal() below does a full innerHTML rebuild of the modal, which would otherwise wipe
  // out anything written directly into that node a moment earlier.
  state.lastGeneratedShareId = share.id;
  renderModal();
  try{ await userDoc().collection('shares').doc(share.id).set(share); } catch(e){ console.error('Failed to save share', e); }
}
async function revokeShare(shareId){
  const s = state.shares.find(s => s.id === shareId);
  if(s) s.revoked = true;
  renderModal();
  toast('Share revoked');
  if(s){ try{ await userDoc().collection('shares').doc(s.id).set(s); } catch(e){ console.error('Failed to save revoked share', e); } }
}

/* ---------- Drive reconnect ----------
   Shown as a banner in the vault header when the current access token has expired mid-session.
   Should be rare now — the background refresh timer and the mint-on-every-load path normally
   keep this from ever being needed — but if it is, this mints a fresh token from the stored
   refresh token (or, on the rarer NO_GRANT/GRANT_REVOKED case, falls back to the one-time
   consent popup, still within this same click's gesture). Doesn't touch the Firebase auth
   session or any already-loaded documents, since identity and Drive access are separate. */
async function reconnectDrive(){
  try{
    const tokenResp = await acquireDriveAccess();
    state.driveAccessToken = tokenResp.accessToken;
    state.driveTokenExpiresAt = Date.now() + (tokenResp.expiresIn ? tokenResp.expiresIn*1000 : 55*60*1000);
    if(state.isOfflineMode){
      state.isOfflineMode = false;
      await loadUserData(); // replaces the limited offline-cache list with the real, full one
    }
    toast('Reconnected to Google Drive');
    render();
  } catch(e){
    console.error('Reconnect failed', e);
    toast(state.isOfflineMode ? 'Still offline — try again once you have a connection.' : 'Could not reconnect — please try again.');
  }
}

/* ---------- category management ---------- */
function openAddCategoryModal(){ state.modal = 'addCategory'; pushAppHistoryState(); render(); }
function openAppLockSetupModal(){ state.modal = 'appLockSetup'; pushAppHistoryState(); render(); }
async function saveNewCategory(){
  const iconKey = document.getElementById('newCatIcon').value.trim() || 'doc';
  const label = document.getElementById('newCatLabel').value.trim();
  const errEl = document.getElementById('newCatErr');
  const btn = document.getElementById('saveNewCatBtn');
  if(!label){ errEl.textContent='Enter a category name.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const id = 'cat_' + Date.now();
    const driveFolderId = await driveCreateFolder(label, state.vaultFolderId);
    const order = state.categories.length;
    await userDoc().collection('categories').doc(id).set({label, icon: iconKey, driveFolderId, order});
    state.categories.push({id, label, icon: iconKey, driveFolderId, order});
    closeModal();
    toast('Category created');
  } catch(e){
    console.error('Create category failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create category';
  }
}

function openEditCategoryModal(id){ state.modal = 'editCategory'; state.editCategoryId = id; pushAppHistoryState(); render(); }
async function saveRenamedCategory(){
  const cat = state.categories.find(c => c.id === state.editCategoryId);
  if(!cat) return;
  const iconKey = document.getElementById('editCatIcon').value.trim() || cat.icon;
  const label = document.getElementById('editCatLabel').value.trim();
  const errEl = document.getElementById('editCatErr');
  const btn = document.getElementById('saveEditCatBtn');
  if(!label){ errEl.textContent='Enter a category name.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    if(label !== cat.label){
      // Best-effort — keeps the Drive folder's own name matching the category label so
      // browsing Drive directly still makes sense; not critical if this one call fails.
      try{
        await driveFetch(`https://www.googleapis.com/drive/v3/files/${cat.driveFolderId}`, {
          method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: label})
        });
      } catch(renameErr){ console.error('Could not rename the matching Drive folder', renameErr); }
    }
    await userDoc().collection('categories').doc(cat.id).update({label, icon: iconKey});
    cat.label = label; cat.icon = iconKey;
    closeModal();
    toast('Category updated');
  } catch(e){
    console.error('Rename category failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}

async function deleteCategory(id){
  const cat = state.categories.find(c => c.id === id);
  if(!cat) return;
  if(state.categories.length <= 1){ toast('You need at least one category.'); return; }
  const inUse = state.documents.filter(d => d.category === id).length;
  if(inUse > 0){ toast(`Can't delete "${cat.label}" — ${inUse} document${inUse===1?'':'s'} still use it. Move or delete them first.`); return; }
  try{
    await userDoc().collection('categories').doc(id).delete();
    try{ await driveDelete(cat.driveFolderId); } catch(e){ console.error('Could not delete the now-empty Drive folder', e); }
    state.categories = state.categories.filter(c => c.id !== id);
    render();
    toast('Category deleted');
  } catch(e){
    console.error('Delete category failed', e);
    toast(friendlyCloudError(e));
  }
}

/* ---------- sync from Drive ----------
   Picks up files added straight into a category's Drive subfolder outside the app: the
   subfolder a file was found in becomes its category, its filename (minus extension) becomes
   its title, and OCR runs on image files so it's searchable — same as adding through the app,
   just triggered manually here instead of automatically on every load. */
function blobToDataUrl(blob){
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob); });
}

async function runSyncFromDrive(){
  const btn = document.getElementById('syncDriveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  let importedCount = 0;
  try{
    const knownIds = new Set(state.documents.map(d => d.driveFileId));
    for(const cat of state.categories){
      const q = encodeURIComponent(`'${cat.driveFolderId}' in parents and trashed=false`);
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,size)`);
      const json = await res.json();
      for(const f of (json.files || [])){
        if(knownIds.has(f.id)) continue;
        let ocrText = '';
        if(f.mimeType && f.mimeType.startsWith('image/')){
          try{
            const contentRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
            const blob = await contentRes.blob();
            const dataUrl = await blobToDataUrl(blob);
            ocrText = await runOcr(dataUrl);
          } catch(ocrErr){ console.error('Could not OCR a synced file', ocrErr); }
        }
        const title = f.name.replace(/\.[^.]+$/, '') || f.name;
        const doc = {
          id: 'doc_sync_' + Date.now() + '_' + importedCount,
          title, category: cat.id, expiry: null,
          driveFileId: f.id, mimeType: f.mimeType || 'application/octet-stream', size: +(f.size || 0),
          ocrText, addedAt: new Date().toISOString(), archived: false
        };
        await persistDocument(doc);
        state.documents.unshift(doc);
        knownIds.add(f.id);
        importedCount++;
      }
    }
    toast(importedCount ? `Imported ${importedCount} file${importedCount===1?'':'s'} from Drive` : 'Nothing new to import');
    render();
  } catch(e){
    console.error('Sync from Drive failed', e);
    toast(friendlyCloudError(e));
    if(btn){ btn.disabled = false; btn.textContent = 'Sync now'; }
  }
}

/* ---------- export ---------- */
function exportDocumentListCsv(){
  const rows = [['Title','Category','Expiry','Added','Archived','Drive link']];
  state.documents.forEach(d => {
    rows.push([d.title, categoryFor(d.category).label, d.expiry || '', formatDate(d.addedAt), d.archived ? 'Yes' : 'No', `https://drive.google.com/file/d/${d.driveFileId}/view`]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vault-documents.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported document list');
}

// A single portable copy of everything — active and archived alike, since the point of a backup
// is completeness, not just what's currently in view — zipped client-side (JSZip) rather than
// triggering one download per file, which browsers commonly throttle or block outright past a
// handful in quick succession. One bad/unreachable file is skipped, not fatal to the rest.
async function exportAllDocuments(){
  if(!state.documents.length){ toast('No documents to export'); return; }
  const btn = document.getElementById('exportAllBtn');
  const statusEl = document.getElementById('exportAllStatus');
  if(btn) btn.disabled = true;
  const zip = new JSZip();
  const usedNames = new Set();
  let done = 0, failed = 0;
  for(const doc of state.documents){
    if(statusEl) statusEl.textContent = `Fetching ${done + failed + 1} of ${state.documents.length}…`;
    try{
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
      const blob = await res.blob();
      let name = safeFilename(doc.title, doc.mimeType);
      if(usedNames.has(name)){
        // Two documents can share a title (or the same sanitized filename) — number the later one
        // rather than letting JSZip silently fold them into a single entry.
        const dot = name.lastIndexOf('.');
        let i = 2, candidate;
        do{ candidate = dot === -1 ? `${name} (${i})` : `${name.slice(0,dot)} (${i})${name.slice(dot)}`; i++; } while(usedNames.has(candidate));
        name = candidate;
      }
      usedNames.add(name);
      zip.file(name, blob);
      done++;
    } catch(e){
      console.error('Export: could not fetch ' + doc.title, e);
      failed++;
    }
  }
  if(!done){
    if(btn) btn.disabled = false;
    if(statusEl) statusEl.textContent = '';
    toast("Couldn't fetch any documents — check your connection and try again.");
    return;
  }
  if(statusEl) statusEl.textContent = 'Building zip…';
  const content = await zip.generateAsync({type: 'blob'});
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url; a.download = `vault-export-${new Date().toISOString().slice(0,10)}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  if(btn) btn.disabled = false;
  if(statusEl) statusEl.textContent = '';
  toast(failed ? `Exported ${done} of ${state.documents.length} — ${failed} couldn't be fetched` : `Exported ${done} document${done===1?'':'s'}`);
}

/* ---------- sign out / delete account ---------- */
function resetToLoggedOutState(){
  Object.assign(state, {
    screen: 'login', user: null, driveAccessToken: null, driveTokenExpiresAt: null,
    vaultFolderId: null, categories: [], documents: [], shares: [], modal: null,
    searchQuery: '', showArchived: false, collapsedCats: {}, openActionMenu: null
  });
  // Deliberately not touching history/guard bookkeeping here: an earlier version force-reset a
  // depth counter to 0, which lied whenever the guard was actually still armed (an idle sign-out
  // leaves a real, still-there guard entry on top of the stack) — that lie was the root cause
  // behind Back eventually being able to exhaust the real stack. guardArmed already reflects
  // reality accurately at all times now, so leaving it alone and letting the caller's
  // armExitGuardIfIdle() react to the real, current state is what keeps it correct.
}
function signOutUser(){
  auth.signOut().catch(e => console.error('Sign out error', e));
  resetToLoggedOutState();
  render();
  armExitGuardIfIdle();
  toast('Signed out');
}

function openDeleteAccountModal(){ state.modal = 'deleteAccount'; pushAppHistoryState(); render(); }
async function deleteEverything(){
  const btn = document.getElementById('confirmDeleteAccountBtn');
  const errEl = document.getElementById('deleteAccountErr');
  if(btn){ btn.disabled = true; btn.textContent = 'Deleting…'; }
  try{
    for(const colName of ['documents','shares','categories']){
      const snap = await userDoc().collection(colName).get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    await userDoc().collection('meta').doc('vault').delete();
    if(state.vaultFolderId){
      try{ await driveDelete(state.vaultFolderId); } catch(e){ console.error('Could not delete the Drive Vault folder', e); }
    }
    await auth.currentUser.delete();
    toast('Account and vault deleted');
    clearOfflineCache();
    resetToLoggedOutState();
    render();
    armExitGuardIfIdle();
  } catch(e){
    console.error('Delete account failed', e);
    if(e && e.code === 'auth/requires-recent-login'){
      if(errEl){ errEl.textContent = 'For your security, Google requires a recent sign-in before deleting your account. Sign out, sign back in, then try deleting again right away.'; errEl.style.display = 'block'; }
    } else if(errEl){
      errEl.textContent = friendlyCloudError(e);
      errEl.style.display = 'block';
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Permanently delete everything'; }
  }
}

// Opens the vault using only what's already cached locally, for when there's genuinely no
// connection to either Firestore or Drive. loadUserData() is tried first — best-effort, since it
// might still partly succeed (e.g. Firestore reachable but Drive/Apps Script specifically down) —
// and only replaced with the offline cache's own document list if that came back empty.
async function enterOfflineVault(){
  state.isOfflineMode = true;
  await loadUserData();
  if(state.documents.length === 0){
    state.documents = await loadOfflineDocumentList();
    await loadOfflineDocIds();
  }
  collapseAllCategories();
  state.screen = 'vault';
  render();
  armExitGuardIfIdle();
}

// Firebase persists the sign-in session by default, but the app never checked for it on load —
// every fresh page open showed the login screen regardless of a still-valid session, which reads
// to the user as "the app keeps logging me out." Restore silently here: if Firebase still has the
// session, reacquire the Drive token the same silent way the Sign-in button does, and only fall
// back to asking for a fresh sign-in if that silent reacquisition itself fails.
//
// authFlowInProgress guards against a race this listener is otherwise exposed to: it fires on
// every Firebase auth change, and nothing stops two changes (e.g. this restore firing alongside a
// later reconnect attempt) from being processed concurrently — both racing to set state.user, and
// if both ended up needing the one-time consent popup at once, cross-wiring each other's popup via
// the shared gisCodeClient callback.
auth.onAuthStateChanged(async (user) => {
  if(!user){
    // Definitively no session to restore — stop showing the loading splash and show the real
    // sign-in screen. Skip the redundant re-render if we're already showing it (e.g. this fires
    // again after an explicit sign-out, which already set state.screen = 'login' itself).
    if(state.screen === 'checking'){ state.screen = 'login'; render(); armExitGuardIfIdle(); }
    return;
  }
  if(state.user || authFlowInProgress) return;
  authFlowInProgress = true;
  state.user = {name: user.displayName, email: user.email, uid: user.uid, photoURL: user.photoURL};
  try{
    // mintDriveAccessToken() alone (not acquireDriveAccess()) — a cold open should never pop a
    // consent screen unprompted; NO_GRANT/GRANT_REVOKED routes to the "Welcome back" screen
    // instead, where the user's own tap is what makes the popup a real, gesture-backed one.
    const tokenResp = await mintDriveAccessToken();
    state.driveAccessToken = tokenResp.accessToken;
    state.driveTokenExpiresAt = Date.now() + (tokenResp.expiresIn ? tokenResp.expiresIn*1000 : 55*60*1000);
    await loadUserData();
    collapseAllCategories();
    state.screen = 'vault';
    render();
    armExitGuardIfIdle();
  } catch(e){
    // NO_GRANT/GRANT_REVOKED is a real permissions problem only a fresh consent popup can fix —
    // genuinely nothing to do with connectivity. Anything else here (a network error reaching the
    // Apps Script backend, most commonly no connection at all) gets the offline fallback instead:
    // showing "reconnect" for a plain connectivity hiccup would misdiagnose it as a permissions
    // issue, and there's nothing to actually reconnect to when there's no network to reach.
    const reason = e && e.details && e.details.reason;
    if(reason === 'NO_GRANT' || reason === 'GRANT_REVOKED'){
      console.warn('Drive grant missing or revoked — asking for a one-tap reconnect.', e);
      state.screen = 'reconnect';
      render();
      armExitGuardIfIdle();
    } else {
      console.warn('Could not reach Drive — opening with previously cached documents only.', e);
      await enterOfflineVault();
    }
  } finally {
    authFlowInProgress = false;
  }
});

// Proactively refreshes the Drive token a few minutes before it expires, so an active session
// doesn't hit a dead end mid-action. mintDriveAccessToken() itself is cheap to call often — the
// Cloud Function returns its cached access token directly when one is still fresh, only actually
// round-tripping to Google when a real refresh is due — so this doesn't need its own expiry check
// before calling it.
setInterval(async () => {
  // Deliberately no `|| !state.driveAccessToken` guard: a session that opened in offline mode
  // (see enterOfflineVault()) has no token at all yet, and this same periodic check doubles as
  // that session's only route back out of offline mode once a connection actually comes back.
  if(!state.user) return;
  try{
    const tokenResp = await mintDriveAccessToken();
    state.driveAccessToken = tokenResp.accessToken;
    state.driveTokenExpiresAt = Date.now() + (tokenResp.expiresIn ? tokenResp.expiresIn*1000 : 55*60*1000);
    if(state.isOfflineMode){
      state.isOfflineMode = false;
      await loadUserData(); // replaces the limited offline-cache list with the real, full one
      render();
      toast('Back online — vault refreshed');
    }
  } catch(e){
    console.warn('Background Drive token refresh failed' + (state.isOfflineMode ? ' — still offline.' : ' — falling back to the manual reconnect banner.'), e);
  }
}, 5*60*1000);

render();
armExitGuardIfIdle();
</script>
