      const json = await res.json();
      for(const f of (json.files || [])){
        if(knownIds.has(f.id)) continue;
        let ocrText = '';
        let syncedBlob = null; // reused below for keepOffline caching if this was an image (OCR already fetched it)
        if(f.mimeType && f.mimeType.startsWith('image/')){
          try{
            const contentRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
            syncedBlob = await contentRes.blob();
            const dataUrl = await readFileAsDataURL(syncedBlob);
            ocrText = await runOcr(dataUrl);
          } catch(ocrErr){ console.error('Could not OCR a synced file', ocrErr); }
        }
        const title = f.name.replace(/\.[^.]+$/, '') || f.name;
        const doc = {
          id: 'doc_sync_' + Date.now() + '_' + importedCount,
          title, category: cat.id, expiry: null,
          tags: [], // nothing in a raw synced file to derive tags from
          driveFileId: f.id, mimeType: f.mimeType || 'application/octet-stream', size: +(f.size || 0),
          ocrText, addedAt: new Date().toISOString(), archived: false,
          keepOffline: !!cat.keepOfflineDefault // see finalizeAndStoreDocument's own comment on this field
        };
        await persistDocument(doc);
        state.documents.unshift(doc);
        knownIds.add(f.id);
        importedCount++;
        // Same reasoning as finalizeAndStoreDocument: a keep-offline-by-default category means this
        // synced-in file should actually be cached now, not just flagged until some later reload.
        // Non-image files never fetched a blob above (no OCR to run), so fetch it here instead —
        // one extra round trip only for the files that actually need it.
        if(doc.keepOffline){
          try{
            if(!syncedBlob){
              const contentRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
              syncedBlob = await contentRes.blob();
            }
            await cacheDocumentOffline(doc, syncedBlob);
          } catch(cacheErr){ console.error('Could not cache a synced keep-offline file', cacheErr); }
        }
      }
      }
    }
    toast(importedCount ? `Imported ${importedCount} file${importedCount===1?'':'s'} from Drive` : 'Nothing new to import');
    render();
    // The one settings action that can actually change what Storage reports — newly-imported
    // files change the Vault total, and (unlike every other settings toggle) are worth a fresh
    // read of the account-wide total too, in case something else changed it meanwhile.
    refreshDriveStorageInfo();
  } catch(e){
    console.error('Sync from Drive failed', e);
    toast(friendlyCloudError(e));
    if(btn){ btn.disabled = false; btn.textContent = 'Sync now'; }
  }
}

/* ---------- export ---------- */
function exportDocumentListCsv(){
  const rows = [['Title','Category','Expiry','Tags','Added','Archived','Drive link']];
  state.documents.forEach(d => {
    // Semicolon-joined, not comma-joined — a comma inside this one cell would otherwise be
    // indistinguishable from the CSV's own column delimiter once opened in a spreadsheet.
    rows.push([d.title, categoryFor(d.category).label, d.expiry || '', (d.tags||[]).join('; '), formatDate(d.addedAt), d.archived ? 'Yes' : 'No', `https://drive.google.com/file/d/${d.driveFileId}/view`]);
  });
  // A cell starting with =, +, -, or @ opens as a live formula in Excel/Sheets — prefix a leading
  // apostrophe (a spreadsheet's own documented escape) so a synced Drive filename can't smuggle one
  // in; quote-doubling alone only protects the CSV syntax itself, not what a spreadsheet does with
  // the resulting cell content.
  const csv = rows.map(r => r.map(v => {
    const s = String(v);
    const safe = /^[=+\-@]/.test(s) ? `'${s}` : s;
    return `"${safe.replace(/"/g,'""')}"`;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vault-documents.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported document list');
}

// Builds the full backup zip and returns its Blob (plus how many documents made it in) without
// touching any specific DOM element — shared between the Settings "Download" button and the
// optional pre-delete-account backup step, each of which handles its own UI feedback differently.
// Active and archived documents alike, since the point of a backup is completeness, not just
// what's currently in view. One bad/unreachable file is skipped, not fatal to the rest.
async function buildDocumentsZipBlob(onProgress){
  // JSZip is lazy-loaded (see loadJsZipScript() above) — if that fails (offline on a first-ever
  // use, CDN unreachable), report it the exact same way a per-document fetch failure already is:
  // {blob: null, done: 0, failed: state.documents.length}. Every existing caller (exportAllDocuments,
  // deleteEverything's pre-delete backup step) already treats that shape as "nothing could be backed
  // up" and shows its own appropriate error, so this needs no caller changes.
  try{ await loadJsZipScript(); } catch(e){
    console.error('JSZip unavailable', e);
    return {blob: null, done: 0, failed: state.documents.length};
  }
  const zip = new JSZip();
  // Per-category, not one global set — mirroring Drive's own layout means uniqueness only needs
  // to hold within a folder, same as Drive itself only requires. Folder names come from the exact
  // same category labels Drive already uses, so re-uploading a category's files (not the folder
  // itself — see runSyncFromDrive's own name-matching fallback) into the matching Vault subfolder
  // in Drive is what makes Sync able to pick this backup back up later.
  const usedNamesByCategory = {};
  let done = 0, failed = 0;
  // One entry per document that actually made it into the zip (see vault-manifest.json below) —
  // built alongside the per-document loop rather than derived from state.documents afterward, so
  // it can record the *exact* zip path (catLabel/name, including any " (2)" de-duplication suffix
  // below) each document actually landed at, which is what lets a later import match a manifest
  // entry back to its file with a plain zip.file(entry.filename) lookup.
  const manifestEntries = [];
  for(const doc of state.documents){
    if(onProgress) onProgress(done + failed + 1, state.documents.length);
    try{
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.driveFileId}?alt=media`);
      const blob = await res.blob();
      const catLabel = categoryFor(doc.category).label;
      const usedNames = usedNamesByCategory[catLabel] || (usedNamesByCategory[catLabel] = new Set());
      let name = safeFilename(doc.title, doc.mimeType);
      if(usedNames.has(name)){
        // Two documents can share a title (or the same sanitized filename) — number the later one
        // rather than letting JSZip silently fold them into a single entry.
        const dot = name.lastIndexOf('.');
        let i = 2, candidate;
        do{ candidate = dot === -1 ? `${name} (${i})` : `${name.slice(0,dot)} (${i})${name.slice(dot)}`; i++; } while(usedNames.has(candidate));
        name = candidate;
      }
      usedNames.add(name);
      const zipPath = `${catLabel}/${name}`;
      zip.file(zipPath, blob);
      manifestEntries.push({
        id: doc.id, title: doc.title, category: doc.category,
        expiry: doc.expiry || null, reminderDays: doc.reminderDays || null,
        tags: doc.tags || [], pinned: !!doc.pinned, keepOffline: !!doc.keepOffline,
        archived: !!doc.archived, addedAt: doc.addedAt, filename: zipPath
      });
      done++;
    } catch(e){
      console.error('Export: could not fetch ' + doc.title, e);
      failed++;
    }
  }
  // Quick Reference lives in Drive as its own file now, not something this per-document fetch loop
  // touches — added directly here instead, so both this export and the pre-delete-account backup
  // (buildDocumentsZipBlob is shared by both) capture it too, at the zip root alongside the
  // per-category document folders.
  if(state.quickRefs.length){
    zip.file('quickrefs.json', JSON.stringify({version: 1, exportedAt: new Date().toISOString(), items: state.quickRefs}, null, 2));
  }
  // vault-manifest.json is what turns this from "just the raw files" into a restorable structured
  // backup — see handleImportBackupFileChosen()/performBackupImport() below, the only things that
  // ever read it back. Three things are deliberately left out of each entry: driveFileId
  // (meaningless once re-uploaded to a brand-new Drive file on import), ocrText (regenerable —
  // cheap to redo on next view/edit if the file gets re-processed, and dropping it keeps this
  // manifest small even for a large vault), and anything from Quick Reference or share links,
  // which are separate features with their own data this backup format was never meant to cover.
  zip.file('vault-manifest.json', JSON.stringify({version: 1, exportedAt: new Date().toISOString(), documents: manifestEntries}, null, 2));
  if(!done && !state.quickRefs.length) return {blob: null, done, failed};
  const blob = await zip.generateAsync({type: 'blob'});
  return {blob, done, failed};
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function exportAllDocuments(){
  if(!state.documents.length){ toast('No documents to export'); return; }
  const btn = document.getElementById('exportAllBtn');
  const statusEl = document.getElementById('exportAllStatus');
  if(btn) btn.disabled = true;
  const {blob, done, failed} = await buildDocumentsZipBlob((i, total) => { if(statusEl) statusEl.textContent = `Fetching ${i} of ${total}…`; });
  if(!done){
    if(btn) btn.disabled = false;
    if(statusEl) statusEl.textContent = '';
    toast("Couldn't fetch any documents — check your connection and try again.");
    return;
  }
  if(statusEl) statusEl.textContent = 'Building zip…';
  downloadBlob(blob, `vault-export-${new Date().toISOString().slice(0,10)}.zip`);
  if(btn) btn.disabled = false;
  if(statusEl) statusEl.textContent = '';
  toast(failed ? `Exported ${done} of ${state.documents.length} — ${failed} couldn't be fetched` : `Exported ${done} document${done===1?'':'s'}`);
}

/* ---------- import (restore from backup) ----------
   The read side of buildDocumentsZipBlob's vault-manifest.json (see that function's own comment
   for what a manifest entry deliberately does and doesn't carry). This is necessarily a re-import,
   not an in-place restore — the original Drive file behind each document is long gone by the time
   anyone actually needs a backup, so every restored document gets a brand-new id and a brand-new
   Drive upload, same as any other new document created through this app. */

// Parsed result of a chosen backup zip, held here — not in `state` — between choosing the file and
// confirming the import in the 'confirmImportBackup' modal, same reasoning as pendingFile above: a
// JSZip instance isn't meaningful to carry through state's own render-triggering assignments.
// Cleared in clearTopLayerState() whenever that modal closes any way other than confirming.
let pendingImportZip = null;
let pendingImportManifest = null;
// Guards the "Choose file" control against re-entry while a restore is already running — the
// single-action equivalent of categoryCacheRunningIds for the per-category cache button.
let importBackupRunning = false;

async function handleImportBackupFileChosen(e){
  const f = e.target.files[0];
  e.target.value = ''; // lets choosing the exact same path again re-fire 'change' (e.g. a retry)
  if(!f) return;
  const btn = document.getElementById('importBackupBtn');
  const statusEl = document.getElementById('importBackupStatus');
  if(btn) btn.disabled = true;
  if(statusEl) statusEl.textContent = 'Reading backup…';
  let zip, manifestDocs;
  try{
    await loadJsZipScript();
    zip = await JSZip.loadAsync(f);
    const manifestFile = zip.file('vault-manifest.json');
    const parsed = manifestFile ? JSON.parse(await manifestFile.async('string')) : null;
    // Anything other than the expected {documents: [...]} shape (no manifest at all, a manifest
    // that isn't valid JSON, or one that parsed but isn't shaped like ours) is treated the same
    // way: this isn't a Vault backup, full stop — not a partial/best-effort import attempt.
    if(!parsed || !Array.isArray(parsed.documents)) throw new Error('NOT_A_VAULT_BACKUP');
    manifestDocs = parsed.documents;
  } catch(err){
    console.error('Could not read backup zip', err);
    if(btn) btn.disabled = false;
    if(statusEl) statusEl.textContent = '';
    toast("This doesn't look like a Vault backup — couldn't find a valid manifest in that ZIP.");
    return;
  }
  if(btn) btn.disabled = false;
  if(statusEl) statusEl.textContent = '';
  if(!manifestDocs.length){ toast('Nothing to import — that backup has no documents in it.'); return; }
  pendingImportZip = zip;
  pendingImportManifest = manifestDocs;
  state.modal = 'confirmImportBackup';
  pushAppHistoryState();
  render();
}

// Restores documents from an already-parsed backup (see handleImportBackupFileChosen and the
// 'confirmImportBackup' modal above) — sequentially, one document at a time like
// buildDocumentsZipBlob's own export loop, so this never holds more than one file's bytes in memory
// regardless of how large the vault being restored is, and so the progress line below can say
// exactly which document is in flight. Each entry is caught individually: one corrupt/missing file
// inside an otherwise-good backup can't abort the rest.
async function performBackupImport(zip, manifest){
  if(!zip || !manifest || !manifest.length) return;
  importBackupRunning = true;
  render();
  let done = 0, skipped = 0, failed = 0;
  for(let i=0; i<manifest.length; i++){
    const entry = manifest[i];
    const statusEl = document.getElementById('importBackupStatus');
    if(statusEl) statusEl.textContent = `Restoring ${i+1} of ${manifest.length}…`;
    if(!entry || !entry.filename || !entry.title){ failed++; continue; }
    try{
      // categoryFor() already falls back to a real, existing category (see its own comment) when
      // entry.category no longer exists in this vault — e.g. the category was deleted since the
      // backup was taken — so this never crashes or drops the document over a stale category id.
      const cat = categoryFor(entry.category);
      // Same title + resolved category + original addedAt is treated as "this looks like the same
      // document already here" — checked against `cat.id` (the resolved category), not the raw
      // entry.category, so re-running the same import twice resolves to the same match both times
      // even when the original category no longer exists.
      const alreadyPresent = state.documents.some(d => d.title === entry.title && d.category === cat.id && d.addedAt === entry.addedAt);
      if(alreadyPresent){ skipped++; continue; }
      const zipEntry = zip.file(entry.filename);
      if(!zipEntry){ failed++; continue; }
      const blob = await zipEntry.async('blob');
      const mimeType = mimeTypeFromFilename(entry.filename);
      const driveFileId = await driveUpload(blob, safeFilename(entry.title, mimeType), mimeType, cat.driveFolderId);
      const doc = {
        id: 'doc_restore_' + Date.now() + '_' + i,
        title: entry.title, category: cat.id,
        expiry: entry.expiry || null, reminderDays: entry.reminderDays || null,
        tags: entry.tags || [],
        driveFileId, mimeType, size: blob.size || 0,
        ocrText: '', // not in the manifest — see buildDocumentsZipBlob's own comment on why
        addedAt: entry.addedAt || new Date().toISOString(), // preserved, not re-stamped — a restored
                                                              // vault should still sort/display by
                                                              // when a document was originally added
        archived: !!entry.archived,
        pinned: !!entry.pinned,
        keepOffline: !!entry.keepOffline
      };
      await persistDocument(doc);
      state.documents.unshift(doc);
      done++;
    } catch(err){
      console.error('Could not restore a document from backup', entry, err);
      failed++;
    }
  }
  importBackupRunning = false;
  render();
  if(!skipped && !failed){
    toast(`Restored ${done} document${done===1?'':'s'}`);
  } else {
    const bits = [];
    if(skipped) bits.push(`${skipped} already present`);
    if(failed) bits.push(`${failed} couldn't be restored`);
    toast(`Restored ${done} of ${manifest.length} — ${bits.join(', ')}`);
  }
}

/* ---------- sign out / delete account ---------- */
function resetToLoggedOutState(){
  Object.assign(state, {
    screen: 'login', user: null, driveAccessToken: null, driveTokenExpiresAt: null,
    vaultFolderId: null, deletedFolderId: null, categories: [], documents: [], modal: null, quickRefsDriveFileId: null,
    searchQuery: '', showArchived: false, showDeleted: false, collapsedCats: {},
    collapsedSettingsGroups: defaultCollapsedSettingsGroups(), // fresh collapsed defaults for the next sign-in — see that function's own comment
    openActionMenu: null, openCategoryMenu: null, upcomingReturnScreen: null, isOfflineMode: false, offlineReason: null, reconnectReason: null,
    selectMode: false, selectedDocIds: new Set(), // no stale bulk-select state should survive into the next signed-in session
    keepOfflineInFlightIds: new Set(), // no stale "downloading" markers should survive into the next signed-in session
    // A derived Quick Reference encryption key is exactly the kind of in-memory secret that must
    // never survive a sign-out — reset alongside everything else session-scoped here.
    qrCrypto: {enabled: false}, qrCryptoKey: null, qrUnlocked: false, qrUnlockThen: null, qrEditDecryptedValue: null,
    welcomeStep: 0
  });
  quickRefRevealedPlain.clear();
  // Deliberately not touching history/guard bookkeeping here: an earlier version force-reset a
  // depth counter to 0, which lied whenever the guard was actually still armed (an idle sign-out
  // leaves a real, still-there guard entry on top of the stack) — that lie was the root cause
  // behind Back eventually being able to exhaust the real stack. guardArmed already reflects
  // reality accurately at all times now, so leaving it alone and letting the caller's
  // armExitGuardIfIdle() react to the real, current state is what keeps it correct.
}
function signOutUser(){
  auth.signOut().catch(e => console.error('Sign out error', e));
  resetToLoggedOutState();
  // The offline cache (documents, categories, Quick Reference — see paintFromLocalCacheIfAny) is
  // plain localStorage/IndexedDB with no per-account namespacing, shared by whoever signs in next on
  // this same browser. Without this, signing out on a shared/borrowed device and someone else
  // signing in with a different Google account would briefly paint the PREVIOUS person's cached
  // document titles and categories on screen during that next cold start, before the real load
  // replaces it — a real privacy leak, not just stale data. clearOfflineCache() was previously only
  // ever called for full account deletion; sign-out needs the same cleanup for the same reason.
  clearOfflineCache();
  render();
  armExitGuardIfIdle();
  toast('Signed out');
}

function openDeleteAccountModal(){ state.modal = 'deleteAccount'; pushAppHistoryState(); render(); }
async function deleteEverything(){
  const btn = document.getElementById('confirmDeleteAccountBtn');
  const errEl = document.getElementById('deleteAccountErr');
  const backupCheckbox = document.getElementById('deleteBackupFirst');
  const wantsBackup = backupCheckbox ? backupCheckbox.checked : false;
  if(btn){ btn.disabled = true; btn.textContent = wantsBackup ? 'Backing up…' : 'Deleting…'; }
  // Checked by default (see the deleteAccount modal) — an irreversible action is exactly where
  // opt-out is the safer default, not opt-in. A failed backup blocks the delete entirely rather
  // than silently proceeding anyway; the user can still uncheck it and confirm again if they'd
  // rather skip the backup than fix whatever broke it.
  if(wantsBackup && state.documents.length){
    const {blob, done, failed} = await buildDocumentsZipBlob((i, total) => { if(btn) btn.textContent = `Backing up ${i} of ${total}…`; });
    if(!done){
      if(btn){ btn.disabled = false; btn.textContent = 'Permanently delete everything'; }
      errEl.textContent = "Couldn't back up your documents — check your connection, or uncheck the backup option to delete without one.";
      errEl.style.display = 'block';
      return;
    }
    downloadBlob(blob, `vault-export-${new Date().toISOString().slice(0,10)}.zip`);
    if(failed) toast(`Backed up ${done} of ${state.documents.length} documents — ${failed} couldn't be fetched`);
    if(btn) btn.textContent = 'Deleting…';
  }
  try{
    for(const colName of ['documents','categories','quickRefs']){
      const snap = await userDoc().collection(colName).get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    await userDoc().collection('meta').doc('vault').delete();
    await userDoc().collection('meta').doc('reminderSettings').delete();
    await userDoc().collection('meta').doc('quickRefCrypto').delete();
    await db.collection('emailDigestSubscribers').doc(state.user.uid).delete();
    await db.collection('pushSubscribers').doc(state.user.uid).delete();
    await db.collection('archiveRetentionSubscribers').doc(state.user.uid).delete();
    await db.collection('trashSubscribers').doc(state.user.uid).delete();
    // Best-effort, but no longer a SILENT best-effort — a failure here used to be swallowed to
    // just a console.error while the UI still claimed unconditional success, leaving an orphaned
    // Drive folder with no indication anything was left behind.
    let driveFolderDeleteFailed = false;
    if(state.vaultFolderId){
      try{ await driveDelete(state.vaultFolderId); } catch(e){ console.error('Could not delete the Drive Vault folder', e); driveFolderDeleteFailed = true; }
    }
    try{ localStorage.removeItem('vault-ever-provisioned-' + state.user.uid); } catch(e){}
    await auth.currentUser.delete();
    toast(driveFolderDeleteFailed
      ? 'Account deleted — your Drive "Vault" folder could not be removed automatically; delete it manually from Drive if you want it gone.'
      : 'Account and vault deleted');
    clearOfflineCache();
    resetToLoggedOutState();
    render();
    armExitGuardIfIdle();
  } catch(e){
    console.error('Delete account failed', e);
    // By this point everything else above (Firestore data, the Drive folder) is already gone —
    // only auth.currentUser.delete() itself failed, because Firebase blocks deleting the account
    // record without a *recent* sign-in (a defense against a stale/stolen session doing something
    // this sensitive). Previously this just told the user to sign all the way out and back in —
    // real friction for one missing step. Re-authenticating right here, with the same Google popup
    // already familiar from signing in, confirms it's really them without ever signing them out,
    // so the one remaining step (deleting the auth record) can finish immediately after.
    if(e && e.code === 'auth/requires-recent-login'){
      if(btn) btn.textContent = "Confirming it's really you…";
      try{
        await auth.currentUser.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
        await auth.currentUser.delete();
        toast('Account and vault deleted');
        clearOfflineCache();
        resetToLoggedOutState();
        render();
        armExitGuardIfIdle();
        return;
      } catch(reauthErr){
        console.error('Re-authentication before delete failed', reauthErr);
        if(errEl){ errEl.textContent = "Couldn't confirm it was you — try again, or sign out and back in first."; errEl.style.display = 'block'; }
        if(btn){ btn.disabled = false; btn.textContent = 'Permanently delete everything'; }
        return;
      }
    }
    if(errEl){
      errEl.textContent = friendlyCloudError(e);
      errEl.style.display = 'block';
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Permanently delete everything'; }
  }
}

// Opens the vault using only what's already cached locally, for when there's genuinely no
// connection to either Firestore or Drive. loadUserData() is tried first — best-effort, since it
// might still partly succeed (e.g. Firestore reachable but Drive/Apps Script specifically down) —
// and only replaced with the offline cache's own document list if that came back empty.
async function enterOfflineVault(){
  state.isOfflineMode = true;
  await loadUserData();
  if(state.documents.length === 0){
    state.documents = await loadOfflineDocumentList();
    await loadOfflineDocIds();
  }
  if(state.quickRefs.length === 0) state.quickRefs = loadOfflineQuickRefs();
  collapseAllCategories();
  state.screen = 'vault';
  render();
  armExitGuardIfIdle();
  maybeShowChangelog();
}

// Cold-open only: paints the vault screen immediately from whatever's cached locally (documents,
// categories, Quick Reference — see their own offline-cache functions above), while the real Drive
// token + Firestore load continues in the background. Without this, every single cold open stared
// at a blank "checking" splash for however long that round trip happened to take — usually a couple
// seconds, but Apps Script's own cold-start latency can occasionally push it to 20-30s, with nothing
// to look at even though the last-synced vault was sitting right there in local storage the whole
// time. Returns whether it actually painted anything — false only for a genuinely first-ever open on
// this device, where nothing's cached yet to show (the blank splash is the correct, unavoidable
// experience exactly once, until this device has synced at least one real load). The real load below
// still runs exactly as before either way and replaces whatever's on screen once it lands — this is
// purely a perceived-speed improvement, never a change to what data ends up authoritative.
async function paintFromLocalCacheIfAny(uid){
  const cachedDocs = await loadOfflineDocumentList();
  const cachedCategories = loadOfflineCategories();
  if(!cachedDocs.length && !cachedCategories.length) return false;
  if(!state.user || state.user.uid !== uid) return false; // signed out (or switched accounts) while reading the cache
  state.documents = cachedDocs;
  state.categories = cachedCategories;
  state.quickRefs = loadOfflineQuickRefs();
  await loadOfflineDocIds();
  // Re-checked, not just assumed still true from the guard above — that was before a SECOND await
  // (this one), a real window for a sign-out (e.g. from another tab sharing the same Firebase
  // session) to land in between. Without this, a sign-out landing exactly here would already have
  // shown the login screen, only for this call to resume right after and silently paint the stale
  // cached vault back over it.
  if(!state.user || state.user.uid !== uid) return false;
  collapseAllCategories();
  state.screen = 'vault';
  render();
  armExitGuardIfIdle();
  return true;
}

// Firebase persists the sign-in session by default, but the app never checked for it on load —
// every fresh page open showed the login screen regardless of a still-valid session, which reads
// to the user as "the app keeps logging me out." Restore silently here: if Firebase still has the
// session, reacquire the Drive token the same silent way the Sign-in button does, and only fall
// back to asking for a fresh sign-in if that silent reacquisition itself fails.
//
// authFlowInProgress guards against a race this listener is otherwise exposed to: it fires on
// every Firebase auth change, and nothing stops two changes (e.g. this restore firing alongside a
// later reconnect attempt) from being processed concurrently — both racing to set state.user, and
// if both ended up needing the one-time consent popup at once, cross-wiring each other's popup via
// the shared gisCodeClient callback.
auth.onAuthStateChanged(async (user) => {
  if(!user){
    // Definitively no session to restore — stop showing the loading splash and show the real
    // sign-in screen. Skip the redundant re-render if we're already showing it (e.g. this fires
    // again after an explicit sign-out, which already set state.screen = 'login' itself).
    if(state.screen === 'checking'){ state.screen = 'login'; render(); armExitGuardIfIdle(); }
    return;
  }
  if(state.user || authFlowInProgress) return;
  authFlowInProgress = true;
  state.user = {name: user.displayName, email: user.email, uid: user.uid, photoURL: user.photoURL};
  // mintDriveAccessTokenWithRetry() alone (not acquireDriveAccess()) — a cold open should never
  // pop a consent screen unprompted; NO_GRANT/GRANT_REVOKED routes to the "Welcome back" screen
  // instead, where the user's own tap is what makes the popup a real, gesture-backed one. The
  // retry (not just a plain mint) matters specifically here: this is the one call standing between
  // "app just opened" and either a real vault or a false "offline" — see the function's own
  // comment for why a cold open is exactly when a transient network hiccup is most likely.
  // Fired in parallel with the Firestore reads loadUserData() needs (see prefetchUserMetaReads)
  // instead of one after the other — the two hit independent backends with no dependency
  // between them for a returning user, so there's no reason the slower of the two (typically
  // the Apps Script round trip) should delay the other from even starting. Kicked off before
  // paintFromLocalCacheIfAny() below (not after) so neither promise loses time to that local read.
  const tokenPromise = mintDriveAccessTokenWithRetry();
  // Lets driveFetch() (see its own comment) wait for THIS specific attempt instead of failing
  // immediately if something tries to reach Drive while it's still in flight — e.g. tapping a
  // just-uploaded document during the brief window paintFromLocalCacheIfAny() below can leave open
  // before this resolves. Deliberately swallows the outcome (.catch(()=>{})): driveFetch only needs
  // to know the attempt has settled one way or another, then re-checks driveTokenValid() itself —
  // it has no separate use for the resolved value or a rejection here.
  coldStartTokenSettled = tokenPromise.then(() => {}, () => {});
  const metaReadsPromise = prefetchUserMetaReads(user.uid);
  await paintFromLocalCacheIfAny(user.uid);
  try{
    const tokenResp = await tokenPromise;
    applyDriveTokenResponse(tokenResp);
    await loadUserData(metaReadsPromise);
    collapseAllCategories();
    state.screen = 'vault';
    render();
    armExitGuardIfIdle();
    maybeShowChangelog();
  } catch(e){
    // NO_GRANT/GRANT_REVOKED is a real permissions problem only a fresh consent popup can fix —
    // genuinely nothing to do with connectivity. Anything else here (a network error reaching the
    // Apps Script backend, most commonly no connection at all) gets the offline fallback instead:
    // showing "reconnect" for a plain connectivity hiccup would misdiagnose it as a permissions
    // issue, and there's nothing to actually reconnect to when there's no network to reach.
    const reason = e && e.details && e.details.reason;
    if(reason === 'NO_GRANT' || reason === 'GRANT_REVOKED'){
      console.warn('Drive grant missing or revoked — asking for a one-tap reconnect.', e);
      state.reconnectReason = reason; // see renderReconnect()'s own comment on why this matters
      state.screen = 'reconnect';
      render();
      armExitGuardIfIdle();
    } else {
      console.warn('Could not reach Drive — opening with previously cached documents only.', e);
      state.offlineReason = describeDriveAuthError(e);
      await enterOfflineVault();
    }
  } finally {
    authFlowInProgress = false;
    coldStartTokenSettled = null;
  }
});

// Proactively refreshes the Drive token a few minutes before it expires, so an active session
// doesn't hit a dead end mid-action. mintDriveAccessToken() itself is cheap to call often — the
// Cloud Function returns its cached access token directly when one is still fresh, only actually
// round-tripping to Google when a real refresh is due — so this doesn't need its own expiry check
// before calling it.
setInterval(async () => {
  // Deliberately no `|| !state.driveAccessToken` guard: a session that opened in offline mode
  // (see enterOfflineVault()) has no token at all yet, and this same periodic check doubles as
  // that session's only route back out of offline mode once a connection actually comes back.
  if(!state.user) return;
  const wasShowingReconnectBanner = !state.isOfflineMode && !driveTokenValid();
  try{
    const tokenResp = await mintDriveAccessToken();
    applyDriveTokenResponse(tokenResp);
    if(state.isOfflineMode){
      state.isOfflineMode = false;
      state.offlineReason = null;
      await loadUserData(); // replaces the limited offline-cache list with the real, full one
      render();
      toast('Back online — vault refreshed');
    } else if(wasShowingReconnectBanner){
      // The urgent "Reconnect" banner was up when this tick started — reflect the fix immediately
      // instead of leaving it on screen until some unrelated re-render happens to clear it.
      // renderImmediate(), not render(): same reasoning as attemptSilentDriveRefresh() — this is a
      // silent background fix landing at an arbitrary moment, not something to animate the whole
      // screen (document list included) around.
      renderImmediate();
    }
  } catch(e){
    console.warn('Background Drive token refresh failed' + (state.isOfflineMode ? ' — still offline.' : ' — falling back to the manual reconnect banner.'), e);
    // Keeps the offline banner's reason current if this silent retry still can't reach the
    // backend (e.g. still the same blocked network) rather than leaving it showing whatever the
    // original cold-open failure said, which may no longer be the actual/full picture.
    if(state.isOfflineMode) state.offlineReason = describeDriveAuthError(e);
  }
}, 5*60*1000);

render();
armExitGuardIfIdle();
</script>
