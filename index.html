  // invoked again while still locked, e.g. by the visibilitychange listener below).
  if(hasBio && !bioAutoAttemptedThisLock){
    bioAutoAttemptedThisLock = true;
    attemptBio();
  } else if(!hasBio){
    pinInput.focus();
  }
  document.getElementById('lockSignOutBtn').onclick = () => signOutUser();
}

// True when running as an installed PWA (Android "Add to Home Screen" / iOS "Add to Home Screen"),
// not a regular browser tab. Used only to show a more specific hint if sign-in gets stuck there
// (see the demo-note below) — the sign-in flow itself (signInWithPopup) is the same either way.
function isStandalonePwa(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function renderLogin(app){
  app.innerHTML = `
    <div class="login-screen">
      <div class="seal">${brandMarkSvg(50)}</div>
      <h1>Vault</h1>
      <p>A secure place for your important documents — organized in your own Google Drive, and searchable by what's inside them.</p>
      <button class="google-btn" id="googleBtn">
        <svg class="gicon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.7 35.4 27 36.4 24 36.4c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.9 35.9 44 30.4 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
        Sign in with Google
      </button>
      <div class="error-text" id="loginErr" style="display:none;"></div>
      ${isStandalonePwa() ? `<div class="demo-note">Signing in from the installed app but stuck? Open this site in your regular browser and sign in there once — the installed app will pick up the same sign-in automatically the next time you open it.</div>` : ''}
      <div class="demo-note">Your documents are stored as regular files in your own Google Drive, under a "Vault" folder, and organized by category. This app can only see the files and folders it creates there.</div>
      <button type="button" class="privacy-link" id="privacyLinkBtn">Privacy Policy</button>
      <div class="version-tag">Version ${APP_VERSION}</div>
    </div>
  `;
  document.getElementById('privacyLinkBtn').onclick = () => { state.modal = 'privacy'; pushAppHistoryState(); render(); };
  document.getElementById('googleBtn').onclick = async () => {
    const btn = document.getElementById('googleBtn');
    const errEl = document.getElementById('loginErr');
    errEl.style.display = 'none';
    btn.disabled = true;
    const provider = new firebase.auth.GoogleAuthProvider();

    // Popup, not redirect: a redirect depends on state (which account is mid-sign-in) surviving
    // a full page navigation away to Google and back, via storage on this origin — and that
    // round trip turned out to be unreliable in practice for a brand-new sign-in (confirmed:
    // already-persisted sessions restored fine, since that path never leaves the page at all,
    // but a fresh interactive sign-in via redirect silently landed back on this same login screen
    // instead of completing). A popup keeps everything in this one continuous script execution
    // instead, with nothing to lose across a navigation — and it's already proven reliable here,
    // since it's what the Drive-consent step (grantDriveAccessOneTime) has used successfully the
    // whole time.
    if(authFlowInProgress) return;
    authFlowInProgress = true;
    btn.textContent = 'Signing in…';
    try{
      const result = await auth.signInWithPopup(provider);
      state.user = {name: result.user.displayName, email: result.user.email, uid: result.user.uid, photoURL: result.user.photoURL};
      // Fired alongside the Drive check below rather than after it — see prefetchUserMetaReads.
      // This is the path a person actually watches and judges "how fast is sign-in" by, so it's the
      // highest-value place for the two independent network legs to run concurrently instead of
      // back to back.
      const metaReadsPromise = prefetchUserMetaReads(state.user.uid);
      // Deliberately mintDriveAccessToken() alone here, not acquireDriveAccess() — a brand-new
      // account (or one whose grant was revoked) always needs grantDriveAccessOneTime()'s consent
      // popup, and calling that automatically right here, this many awaits past the original click,
      // is exactly what used to get silently blocked by the browser's popup heuristics (it no longer
      // reliably counts as "triggered by a user gesture" by this point). Routing to the 'reconnect'
      // screen instead means that popup only ever opens from ITS OWN button's own fresh click.
      let tokenResp;
      try{
        tokenResp = await mintDriveAccessToken();
      } catch(driveErr){
        const reason = driveErr && driveErr.details && driveErr.details.reason;
        if(reason === 'NO_GRANT' || reason === 'GRANT_REVOKED'){
          // GRANT_REVOKED (as opposed to NO_GRANT) means this account genuinely had a grant before
          // — a real signal renderReconnect() can use instead of relying only on this DEVICE's own
          // localStorage history, which is blank the very first time a returning user signs in on a
          // new device/browser (see that screen's own comment).
          state.reconnectReason = reason;
          state.screen = 'reconnect';
          render();
          armExitGuardIfIdle();
          return;
        }
        throw driveErr;
      }
      applyDriveTokenResponse(tokenResp);
      // "Setting up" wrongly implied first-time provisioning on every single sign-in, including a
      // perfectly normal returning user re-authenticating after a sign-out. We don't know yet
      // whether this account has ever been provisioned (that's only certain once loadUserData()
      // itself checks Firestore), but a prior successful load on this exact device already left a
      // local record of it — good enough to get the common case right.
      let knownProvisioned = false;
      try{ knownProvisioned = localStorage.getItem('vault-ever-provisioned-' + state.user.uid) === 'true'; } catch(e){}
      btn.textContent = knownProvisioned ? 'Loading your vault…' : 'Setting up your vault…';
      await loadUserData(metaReadsPromise);
      collapseAllCategories();
      state.screen = 'vault';
      render();
      armExitGuardIfIdle();
      maybeShowChangelog();
    } catch(e){
      console.error('Sign-in failed', e);
      // The NO_GRANT/GRANT_REVOKED Drive case is handled above and never reaches here — but a
      // DIFFERENT Drive-mint failure (rethrown as `driveErr` above, e.g. the transient network-hiccup
      // case mintDriveAccessTokenWithRetry() exists for elsewhere, deliberately not used on this
      // interactive path) still lands here, alongside the Firestore reads or loadUserData() itself
      // hitting a network error. Either way, with state.user already set, routing to the reconnect
      // screen still makes sense as a safety net: state.user is real, so a retry only needs to redo
      // whatever's left, not repeat signInWithPopup from scratch.
      if(state.user){
        state.screen = 'reconnect';
        render();
        armExitGuardIfIdle();
        return;
      }
      btn.disabled = false;
      btn.textContent = 'Sign in with Google';
      // A blocked popup is a distinct, actionable case — the generic "please try again" message
      // sends the user in a loop retrying the exact same thing that will fail again until they
      // know to allow popups first. A user-cancelled popup isn't a failure worth alarming over.
      if(e && e.code === 'auth/popup-blocked'){
        errEl.textContent = "Your browser blocked the sign-in popup — allow popups for this site, then try again.";
      } else if(e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')){
        errEl.textContent = '';
        errEl.style.display = 'none';
      } else {
        errEl.textContent = 'Sign-in failed — please try again.';
      }
      if(errEl.textContent) errEl.style.display = 'block';
    } finally {
      authFlowInProgress = false;
    }
  };
  renderModal();
}

// Shown when Firebase still has the identity (so we know who's signed in) but there's no usable
// Drive grant on file — either this account has never granted Drive access before (every brand-new
// sign-up lands here now — see the login screen's own handler for why that consent popup is never
// auto-chained after signInWithPopup), or a previously-granted one was revoked (e.g. from
// myaccount.google.com/permissions). This is the *only* remaining "please reconnect" screen in the
// app: everyday reopens mint a fresh access token from the stored refresh token silently, with no
// screen like this involved at all.
function renderReconnect(app){
  // Same "has this device seen this account provisioned before" check the login screen uses for its
  // own button text — a brand-new sign-up reads oddly as "Welcome back," so this screen greets and
  // explains itself differently depending on which case it actually is. That localStorage flag is
  // per-DEVICE, though, and only ever gets set after a full successful load on THIS device — a
  // returning user who's fully provisioned elsewhere but signing in on a new device/browser (or one
  // that just cleared site data) would fail that check despite genuinely being a returning user.
  // state.reconnectReason closes that gap: GRANT_REVOKED (as opposed to NO_GRANT) can only happen to
  // an account that had a grant to revoke in the first place, which is itself proof of a real,
  // previously-provisioned account — a signal that doesn't depend on this device's own history.
  let knownProvisioned = state.reconnectReason === 'GRANT_REVOKED';
  if(!knownProvisioned){ try{ knownProvisioned = localStorage.getItem('vault-ever-provisioned-' + state.user.uid) === 'true'; } catch(e){} }
  const heading = knownProvisioned ? 'Welcome back' : 'One more step';
  const body = knownProvisioned
    ? `Signed in as <strong>${escapeHtml(state.user.email)}</strong>. Grant Drive access to pick up where you left off — same Google account, just a one-time permissions confirmation.`
    : `Signed in as <strong>${escapeHtml(state.user.email)}</strong>. Vault keeps your documents as regular files in your own Google Drive, so it needs your permission once to create and use a private "Vault" folder there.`;
  app.innerHTML = `
    <div class="login-screen">
      <div class="seal">${brandMarkSvg(50)}</div>
      <h1>${heading}</h1>
      <p>${body}</p>
      <button class="primary" id="reconnectContinueBtn">Continue</button>
      <div class="error-text" id="reconnectErr" style="display:none;"></div>
      <button class="ghost" id="reconnectSignOutBtn">Not you? Sign out</button>
      <div class="version-tag">Version ${APP_VERSION}</div>
    </div>
  `;
  document.getElementById('reconnectContinueBtn').onclick = completeReconnect;
  document.getElementById('reconnectSignOutBtn').onclick = () => signOutUser();
  renderModal();
}
async function completeReconnect(){
  const btn = document.getElementById('reconnectContinueBtn');
  const errEl = document.getElementById('reconnectErr');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Connecting…';
  try{
    // Fired alongside the consent popup exchange below rather than after it — see
    // prefetchUserMetaReads. The popup itself needs the user's own click to open at all, but the
    // Firestore reads don't depend on its result, so there's no reason to wait for it to resolve
    // before even starting them.
    const metaReadsPromise = prefetchUserMetaReads(state.user.uid);
    const tokenResp = await grantDriveAccessOneTime();
    applyDriveTokenResponse(tokenResp);
    btn.textContent = 'Loading your vault…';
    await loadUserData(metaReadsPromise);
    collapseAllCategories();
    state.screen = 'vault';
    render();
    armExitGuardIfIdle();
    maybeShowChangelog();
  } catch(e){
    console.error('Reconnect failed', e);
    btn.disabled = false;
    btn.textContent = 'Continue';
    // Google Identity Services reports a blocked popup as error type 'popup_failed_to_open' (see
    // grantDriveAccessOneTime()'s error_callback) — distinct wording from the generic case for the
    // same reason the login screen's own popup-blocked message exists: this is an actionable, fixable
    // problem (allow popups for this site) rather than "something went wrong, try again" looping the
    // user into the exact same failure.
    errEl.textContent = (e && e.message === 'popup_failed_to_open')
      ? "Your browser blocked the Drive permissions popup — allow popups for this site, then try again."
      : 'Could not reconnect to Google Drive — please try again.';
    errEl.style.display = 'block';
  }
}

// A clickable, chevron-decorated h4 for one of Settings' five collapsible groups (see
// renderSettings() below) — reuses the same base h4 look every other Settings heading already has

}

let actionMenuOutsideClickHandler = null;
let categoryMenuOutsideClickHandler = null;
let searchRenderTimer = null;
function matchesSearch(doc){
  if(!state.searchQuery) return {match:true, snippet:null};
  const q = state.searchQuery.toLowerCase();
  if(doc.title.toLowerCase().includes(q)) return {match:true, snippet:null};
  const text = doc.ocrText || '';
  const idx = text.toLowerCase().indexOf(q);
  if(idx !== -1){
    const start = Math.max(0, idx-28);
    const end = Math.min(text.length, idx+q.length+28);
    const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    const snippet = escapeHtml(text.slice(start,end)).replace(re, '<mark>$1</mark>');
    return {match:true, snippet: (start>0?'…':'') + snippet + (end<text.length?'…':'')};
  }
  // Every document created before tags shipped has no tags field at all — (doc.tags || []) keeps
  // those matching (or not) exactly as they did before this branch existed.
  const matchedTag = (doc.tags || []).find(t => t.toLowerCase().includes(q));
  if(matchedTag){
    const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return {match:true, snippet: 'Tag: ' + escapeHtml(matchedTag).replace(re, '<mark>$1</mark>')};
  }
  return {match:false, snippet:null};
}

// ---------- Quick Reference ----------
// A standalone list of label/value pairs, deliberately independent of any document — for account
// numbers, codes, or anything else worth having one tap away to copy, without needing a document
// attached to it. Not end-to-end encrypted (same protection level as everything else in Vault); the
// caution note on the screen itself says so plainly rather than only in a one-time dialog someone
// could tap past without reading.
function quickRefMatchesSearch(ref){
  if(!state.quickRefSearchQuery) return true;
  // Only ref.label is ever matched here — Quick Reference VALUES are what gets encrypted, never
  // labels (see Part 25 of the encryption design), specifically so search keeps working without
  // needing to unlock first. Deliberately untouched by the encryption work below.
  return ref.label.toLowerCase().includes(state.quickRefSearchQuery.toLowerCase());
}

// Decrypted plaintext for entries currently revealed on screen, keyed by id — a display-only
// cache (never persisted anywhere, unlike state.revealedQuickRefIds which just tracks which ids
// are toggled open). Needed because decrypting is async but render() is synchronous: the reveal
// button's click handler decrypts once and stashes the result here, and the next render() just
// reads it back out. Cleared whenever the session locks (lockQuickRefSession()) and on sign-out.
let quickRefRevealedPlain = new Map();

function renderQuickRef(app){
  const filtered = state.quickRefs.filter(quickRefMatchesSearch);
  const qrEncrypted = isQuickRefEncryptionEnabled();
  app.innerHTML = `
    <div class="settings-header">
      <button class="icon-only-btn" id="backToVaultBtn" aria-label="Back">${icon('back',22)}</button>
      <h1 class="brand-name">Quick Reference</h1>
      ${qrEncrypted ? `
        <button class="icon-only-btn" id="qrLockToggleBtn" style="margin-left:auto;" aria-label="${state.qrUnlocked ? 'Lock Quick Reference' : 'Unlock Quick Reference'}" title="${state.qrUnlocked ? 'Lock now' : 'Unlock'}">${icon('key',20)}</button>
      ` : ''}
    </div>
    <div class="settings">
      ${qrEncrypted ? `
        <p class="quickref-caution">Values are encrypted on this device with your Quick Reference passphrase before they're saved — labels stay plain so search keeps working without unlocking.</p>
        ${!state.qrUnlocked ? `
          <button type="button" class="quickref-caution" id="qrLockedBanner" style="display:flex;align-items:center;gap:8px;width:100%;border:none;font:inherit;text-align:left;cursor:pointer;">${icon('key',15)} Locked — tap to unlock</button>
        ` : ''}
      ` : `
        <p class="quickref-caution">Stored the same way as your documents — not end-to-end encrypted like a dedicated password manager. Fine for convenience; for your most sensitive credentials, use a password manager instead.</p>
      `}
      <div class="search-bar">
        <span class="sicon">${icon('search',18)}</span>
        <input type="text" id="quickRefSearchInput" placeholder="Search by label" value="${escapeHtml(state.quickRefSearchQuery)}" />
        ${state.quickRefSearchQuery ? `<button type="button" class="search-clear" id="quickRefSearchClearBtn" aria-label="Clear search">×</button>` : ''}
      </div>
      ${state.quickRefs.length === 0 ? `
        <div class="empty-state">Nothing saved yet.<br>Add an account number, code, or anything else you'll want to copy later.</div>
      ` : filtered.length === 0 ? `
        <div class="empty-state">No entries match "${escapeHtml(state.quickRefSearchQuery)}".</div>
      ` : filtered.map((ref,i) => {
        // Shape-based, per entry — never trust the account-level qrEncrypted flag alone here (an
        // interrupted enable/disable/change-passphrase can leave some entries plaintext and some
        // ciphertext at the same time; see isEncryptedQuickRefValue()'s own comment).
        const entryEncrypted = isEncryptedQuickRefValue(ref.value);
        const lockedEntry = entryEncrypted && !state.qrUnlocked;
        const revealed = !lockedEntry && state.revealedQuickRefIds.has(ref.id);
        const displayText = !revealed ? '••••••••' : escapeHtml(entryEncrypted ? (quickRefRevealedPlain.get(ref.id) || '') : ref.value);
        return `
        <div class="quickref-row" style="--i:${i}">
          <div class="qr-main">
            <p class="quickref-label">${escapeHtml(ref.label)}</p>
            <p class="quickref-value">${displayText}</p>
          </div>
          <div class="quickref-actions">
            <button class="icon-only-btn small" data-reveal-qr="${ref.id}" aria-label="${lockedEntry ? 'Unlock to show value' : (revealed ? 'Hide value' : 'Show value')}">${icon(lockedEntry ? 'key' : (revealed ? 'eyeOff' : 'eye'), 18)}</button>
            <button class="icon-only-btn small" data-copy-qr="${ref.id}" aria-label="Copy value">${icon('copy', 17)}</button>
            <button class="icon-only-btn small" data-edit-qr="${ref.id}" aria-label="Edit">${icon('edit', 17)}</button>
            <button class="icon-only-btn small" data-delete-qr="${ref.id}" aria-label="Delete">${icon('trash', 17)}</button>
          </div>
        </div>
      `; }).join('')}
    </div>
    <div class="fab">
      <button class="primary" id="addQuickRefBtn">${icon('plus',20)} Add</button>
    </div>
  `;
  document.getElementById('backToVaultBtn').onclick = () => goBackOneLayer();
  document.getElementById('addQuickRefBtn').onclick = () => openQuickRefForm(null);
  const lockToggleBtn = document.getElementById('qrLockToggleBtn');
  if(lockToggleBtn) lockToggleBtn.onclick = () => {
    if(state.qrUnlocked) lockQuickRefSession();
    else openQuickRefUnlock(null);
  };
  const lockedBanner = document.getElementById('qrLockedBanner');
  if(lockedBanner) lockedBanner.onclick = () => openQuickRefUnlock(null);
  const searchInput = document.getElementById('quickRefSearchInput');
  searchInput.oninput = (e) => {
    state.quickRefSearchQuery = e.target.value;
    // renderImmediate(), not render() — a view-transition crossfade on every keystroke would flash
    // the whole screen instead of feeling like normal as-you-type filtering.
    renderImmediate();
    const fresh = document.getElementById('quickRefSearchInput');
    if(fresh){ fresh.focus(); fresh.setSelectionRange(fresh.value.length, fresh.value.length); }
  };
  const clearBtn = document.getElementById('quickRefSearchClearBtn');
  if(clearBtn) clearBtn.onclick = () => { state.quickRefSearchQuery = ''; render(); };
  document.querySelectorAll('[data-reveal-qr]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-reveal-qr');
      const ref = state.quickRefs.find(r => r.id === id);
      if(!ref) return;
      // Redirects to the unlock prompt instead of the normal reveal toggle — see Part C.11.
      if(isEncryptedQuickRefValue(ref.value) && !state.qrUnlocked){ openQuickRefUnlock({action:'reveal', id}); return; }
      if(state.revealedQuickRefIds.has(id)){
        state.revealedQuickRefIds.delete(id);
        quickRefRevealedPlain.delete(id);
        render();
        return;
      }
      if(isEncryptedQuickRefValue(ref.value)){
        try{ quickRefRevealedPlain.set(id, await quickRefDisplayValue(ref)); }
        catch(e){ console.error('Could not decrypt entry for display', e); toast("Couldn't decrypt this entry."); return; }
      }
      state.revealedQuickRefIds.add(id);
      render();
    };
  });
  document.querySelectorAll('[data-copy-qr]').forEach(btn => {
    btn.onclick = () => copyQuickRefValue(btn.getAttribute('data-copy-qr'));
  });
  document.querySelectorAll('[data-edit-qr]').forEach(btn => {
    btn.onclick = () => openQuickRefForm(btn.getAttribute('data-edit-qr'));
  });
  document.querySelectorAll('[data-delete-qr]').forEach(btn => {
    btn.onclick = () => requestDeleteQuickRef(btn.getAttribute('data-delete-qr'));
  });
  renderModal();
}

// Shape- and lock-aware, per Part C.13: plaintext copies exactly as before; encrypted-and-unlocked
// decrypts first; encrypted-and-locked opens the unlock prompt instead of copying (and resumes
// straight into the copy once unlocked — see handleQuickRefUnlockSubmit()).
async function copyQuickRefValue(id){
  const ref = state.quickRefs.find(r => r.id === id);
  if(!ref) return;
  if(isEncryptedQuickRefValue(ref.value) && !state.qrUnlocked){ openQuickRefUnlock({action:'copy', id}); return; }
  try{
    await navigator.clipboard.writeText(await quickRefDisplayValue(ref));
    toast(`Copied "${ref.label}"`);
  } catch(e){
    console.error('Clipboard write failed', e);
    toast("Couldn't copy — your browser may be blocking clipboard access.");
  }
}

// Gated on encryption + lock state for BOTH a brand-new entry and an existing one (Part C.14): an
// existing entry whose value is already ciphertext is never opened for editing without decrypting
// it first, and — since saveQuickRef() below always needs a live key to encrypt whatever gets
// typed — a brand-new entry isn't opened either while the session is locked. Either way, this
// guarantees the quickRefForm modal can never actually be open while encryption is on and the
// session is locked, which is what keeps saveQuickRef()'s own lock check (below) a pure defensive
// backstop rather than something normal use ever has to route through.
async function openQuickRefForm(id){
  if(isQuickRefEncryptionEnabled() && !state.qrUnlocked){ openQuickRefUnlock({action:'edit', id}); return; }
  const existing = id ? state.quickRefs.find(r => r.id === id) : null;
  if(existing && isEncryptedQuickRefValue(existing.value)){
    // Decrypted into transient state for the form's render code to read (opening the form is a
    // synchronous render, but decrypting is async) — cleared in clearTopLayerState() like every
    // other transient per-modal field.
    try{ state.qrEditDecryptedValue = await quickRefDisplayValue(existing); }
    catch(e){ console.error('Could not decrypt entry for editing', e); toast("Couldn't decrypt this entry to edit it."); return; }
  } else {
    state.qrEditDecryptedValue = null;
  }
  state.modal = 'quickRefForm'; state.editQuickRefId = id; pushAppHistoryState(); render();
}

async function saveQuickRef(){
  const label = document.getElementById('qrLabelInput').value.trim();
  const value = document.getElementById('qrValueInput').value;
  const errEl = document.getElementById('qrFormErr');
  const saveBtn = document.getElementById('saveQrBtn');
  if(!label){ errEl.textContent = 'Enter a label.'; errEl.style.display = 'block'; return; }
  if(!value){ errEl.textContent = 'Enter a value.'; errEl.style.display = 'block'; return; }
  // Defense in depth, not a normal path: openQuickRefForm() above already refuses to open this
  // very form while encryption is on and the session is locked, so this should be unreachable in
  // ordinary use — but this must never write a plaintext value for an account that's supposed to
  // be encrypted just because some future path opened the form without that gate.
  if(isQuickRefEncryptionEnabled() && !state.qrUnlocked){
    errEl.textContent = 'Quick Reference is locked — close this and unlock it first.';
    errEl.style.display = 'block';
    return;
  }
  await performSaveQuickRef(state.editQuickRefId, label, value, errEl, saveBtn);
}

// Split out of saveQuickRef() so it can be called standalone too — not currently needed since
// openQuickRefForm()'s gate keeps the form from ever being open while locked, but kept as the one
// place that actually writes a Quick Reference entry, so encryption-on-save (Part C.15) has
// exactly one implementation regardless of caller.
async function performSaveQuickRef(id, label, value, errEl, saveBtn){
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
  const existing = id ? state.quickRefs.find(r => r.id === id) : null;
  // Encrypt the typed value instead of writing the plain string, whenever encryption is on — the
  // caller (saveQuickRef()) already guaranteed state.qrCryptoKey is set before this runs.
  const storedValue = isQuickRefEncryptionEnabled() ? await encryptQuickRefString(state.qrCryptoKey, value) : value;
  const ref = existing
    ? {...existing, label, value: storedValue}
    : {id: 'qr_' + Date.now(), label, value: storedValue, addedAt: new Date().toISOString()};
  // Whole-file write: state.quickRefs is already fully loaded in memory (see loadUserData()), so
  // building the complete next-items array here and overwriting quickrefs.json with it in one go
  // is the "read-modify-write" a single shared JSON file (rather than one Firestore doc per entry)
  // requires.
  const nextItems = existing ? state.quickRefs.map(r => r.id === ref.id ? ref : r) : [ref, ...state.quickRefs];
  try{
    state.quickRefsDriveFileId = await saveQuickRefsToDrive(nextItems, state.quickRefsDriveFileId);
    if(existing) Object.assign(existing, ref);
    else state.quickRefs.unshift(ref);
    cacheQuickRefsOffline(state.quickRefs);
    quickRefRevealedPlain.set(ref.id, value); // the just-typed plaintext, so re-revealing it needs no redundant decrypt
    closeModal();
    toast(existing ? 'Updated' : 'Saved');
  } catch(e){
    console.error('Failed to save quick reference', e);
    if(errEl){ errEl.textContent = friendlyCloudError(e); errEl.style.display = 'block'; }
    else toast(friendlyCloudError(e));
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
  }
}

function requestDeleteQuickRef(id){ state.modal = 'confirmDeleteQuickRef'; state.editQuickRefId = id; pushAppHistoryState(); render(); }
async function confirmDeleteQuickRef(){
  const id = state.editQuickRefId;
  const before = state.quickRefs;
  const beforeFileId = state.quickRefsDriveFileId;
  state.quickRefs = state.quickRefs.filter(r => r.id !== id);
  state.revealedQuickRefIds.delete(id);
  quickRefRevealedPlain.delete(id);
  closeModal();
  toast('Deleted');
  try{
    // state.quickRefs here is already the post-filter array (the filter ran above) — exactly what
    // should replace quickrefs.json.
    state.quickRefsDriveFileId = await saveQuickRefsToDrive(state.quickRefs, beforeFileId);
    cacheQuickRefsOffline(state.quickRefs);
  } catch(e){
    console.error('Failed to delete quick reference', e);
    state.quickRefs = before;
    state.quickRefsDriveFileId = beforeFileId;
    render();
    toast(friendlyCloudError(e));
  }
}

/* ---------- Quick Reference encryption: unlock / lock / enable / disable ---------- */

function lockQuickRefSession(){
  state.qrCryptoKey = null;
  state.qrUnlocked = false;
  state.revealedQuickRefIds.clear();
  quickRefRevealedPlain.clear();
  toast('Quick Reference locked');
  render();
}

// Opens the unlock prompt. `intent` (optional) is what to resume once the passphrase checks out —
// {action:'edit'|'copy'|'reveal', id} to finish the action that triggered the lock in the first
// place, {action:'disable'} to proceed straight into turning encryption off, or null/undefined
// for a plain unlock with nothing to resume (the header lock/unlock button, the "Locked" banner).
function openQuickRefUnlock(intent){
  state.qrUnlockThen = intent || null;
  state.modal = 'quickRefUnlock';
  pushAppHistoryState();
  render();
}

// Opens the combined enable/change-passphrase modal (state.modal === 'quickRefCryptoSetup') — see
// renderModal() for the form itself, which reads isQuickRefEncryptionEnabled() to decide whether
// it's a fresh turn-on or a change (and asks for the current passphrase first only in the latter
// case).
function openQuickRefCryptoSetupModal(){ state.modal = 'quickRefCryptoSetup'; pushAppHistoryState(); render(); }

// Core check: derives a key from the typed passphrase against the stored/cached salt+iterations
// and verifies it against the stored/cached canary. Works fully offline (falls back to the
// localStorage-cached copy — see cacheQrCryptoOffline()/loadOfflineQrCrypto() — whenever
// state.qrCrypto itself hasn't got salt/canary yet, e.g. a fully offline first load; see Part B.8).
// Returns false on a wrong passphrase rather than throwing — AES-GCM's OperationError is already
// swallowed inside verifyQuickRefCanary().
async function attemptQuickRefUnlock(passphrase){
  const cached = (state.qrCrypto && state.qrCrypto.salt) ? state.qrCrypto : loadOfflineQrCrypto();
  if(!cached || !cached.salt || !cached.canary) throw new Error('No encryption settings found to unlock against.');
  const key = await deriveQuickRefKey(passphrase, cached.salt, cached.iterations || QUICKREF_PBKDF2_ITERATIONS);
  const ok = await verifyQuickRefCanary(key, cached.canary);
  if(!ok) return false;
  state.qrCryptoKey = key;
  state.qrUnlocked = true;
  return true;
}

// The 'quickRefUnlock' modal's submit handler — see renderModal(). Shows a disabled/pending button
// state while deriving (PBKDF2 at 210,000 iterations is deliberately slow — see
// deriveQuickRefKey()), an inline "Incorrect passphrase" message on a wrong guess (never a thrown
// exception), and on success resumes whatever state.qrUnlockThen asked for.
async function handleQuickRefUnlockSubmit(){
  const input = document.getElementById('qrUnlockPassphrase');
  const errEl = document.getElementById('qrUnlockErr');
  const btn = document.getElementById('qrUnlockBtn');
  const passphrase = input.value;
  if(!passphrase){ errEl.textContent = 'Enter your passphrase.'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Unlocking…';
  let ok;
  try{
    ok = await attemptQuickRefUnlock(passphrase);
  } catch(e){
    console.error('Quick Reference unlock failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Unlock';
    return;
  }
  if(!ok){
    errEl.textContent = 'Incorrect passphrase.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Unlock';
    return;
  }
  const resumeIntent = state.qrUnlockThen;
  state.qrUnlockThen = null;
  toast('Quick Reference unlocked');
  // The 'edit' resume deliberately does NOT go through closeModal() — see
  // resumeQuickRefEditAfterUnlock()'s own comment for why swapping straight to the form (reusing
  // this same history layer) instead of popping-then-pushing-again is what keeps this safe.
  // Every other resume path (or no resume at all) has no follow-up modal to open, so closing this
  // one the normal way is fine.
  if(resumeIntent && resumeIntent.action === 'edit'){
    await resumeQuickRefEditAfterUnlock(resumeIntent.id);
    return;
  }
  // No further render() of our own below in the plain/copy/reveal cases — closeModal() (an async
  // history.back()) already ends in exactly one render() once its popstate fires, and that's after
  // state.qrCryptoKey/qrUnlocked (and, for 'reveal', revealedQuickRefIds) are already updated, so
  // it paints the correct final state on its own. Calling render() again ourselves in between would
  // just rebuild the very unlock modal that's already in the middle of closing, for no benefit.
  closeModal();
  if(resumeIntent && resumeIntent.action === 'copy') copyQuickRefValue(resumeIntent.id);
  else if(resumeIntent && resumeIntent.action === 'disable') performTurnOffQuickRefEncryption();
  else if(resumeIntent && resumeIntent.action === 'reveal'){
    const ref = state.quickRefs.find(r => r.id === resumeIntent.id);
    if(ref){
      try{ quickRefRevealedPlain.set(ref.id, await quickRefDisplayValue(ref)); state.revealedQuickRefIds.add(ref.id); }
      catch(e){ console.error('Could not decrypt entry for display', e); }
    }
  }
}

// Resumes straight into the edit form after a successful unlock, WITHOUT popping the history
// layer the unlock prompt pushed and then pushing a fresh one for the form (i.e. NOT
// closeModal() followed by a new openQuickRefForm() call). That close-then-reopen shape would
// race our own history.pushState() (inside the form's push, fired once the decrypt below
// resolves) against the browser's still-in-flight history.back() from the close — a real hazard
// this file's own extensive back-button bookkeeping (see pushAppHistoryState()/goBackOneLayer())
// is careful to avoid elsewhere. Reusing the single already-pushed layer instead means one Back
// press from the resumed form correctly returns straight to the Quick Reference list, same as it
// would have if the form had opened unlocked in the first place.
async function resumeQuickRefEditAfterUnlock(id){
  const existing = id ? state.quickRefs.find(r => r.id === id) : null;
  if(existing && isEncryptedQuickRefValue(existing.value)){
    try{ state.qrEditDecryptedValue = await quickRefDisplayValue(existing); }
    catch(e){ console.error('Could not decrypt entry for editing', e); toast("Couldn't decrypt this entry to edit it."); closeModal(); return; }
  } else {
    state.qrEditDecryptedValue = null;
  }
  state.modal = 'quickRefForm';
  state.editQuickRefId = id;
  render();
}

// Re-encrypts every Quick Reference entry with `key` (decrypting first with `decryptKey` if an
// entry is already the {iv,ct} shape) and saves the whole list to Drive in one write. Shared by
// turnOnQuickRefEncryption() (decryptKey unused — entries are plain strings) and
// changeQuickRefPassphrase() (decryptKey is the OLD key, key is the new one). The caller is
// responsible for the write-ordering rule: the new Firestore crypto doc must already be committed
// before this is ever called.
async function reencryptAllQuickRefsAndSave(key, decryptKey){
  if(!state.quickRefs.length) return state.quickRefs;
  const items = [];
  for(const ref of state.quickRefs){
    const plain = isEncryptedQuickRefValue(ref.value) ? await decryptQuickRefString(decryptKey || key, ref.value) : ref.value;
    items.push({...ref, value: await encryptQuickRefString(key, plain)});
  }
  state.quickRefsDriveFileId = await saveQuickRefsToDrive(items, state.quickRefsDriveFileId);
  state.quickRefs = items;
  cacheQuickRefsOffline(state.quickRefs);
  return items;
}
// Mirror of the above for turning encryption off: decrypts every entry back to a plain string.
async function decryptAllQuickRefsAndSavePlain(key){
  if(!state.quickRefs.length) return state.quickRefs;
  const items = [];
  for(const ref of state.quickRefs){
    items.push({...ref, value: isEncryptedQuickRefValue(ref.value) ? await decryptQuickRefString(key, ref.value) : ref.value});
  }
  state.quickRefsDriveFileId = await saveQuickRefsToDrive(items, state.quickRefsDriveFileId);
  state.quickRefs = items;
  cacheQuickRefsOffline(state.quickRefs);
  return items;
}

// Turns encryption ON for a freshly chosen passphrase (Part D.16 — the write-ordering rule that
// matters most). The new Firestore crypto doc is written FIRST; only once that succeeds does this
// re-encrypt existing entries and save them to Drive. If the Drive write fails or is interrupted
// after only the Firestore doc succeeded, every entry is still a plain string (see
// isEncryptedQuickRefValue()) and therefore still correctly readable — just not yet actually
// encrypted, safely retryable later with this exact same passphrase. Reversing this order —
// ciphertext committed to Drive with no salt/canary recorded anywhere yet — would be permanently
// unreadable, including by the correct passphrase. Zero entries skips straight to just saving the
// crypto doc, per Part D's own edge case.
async function turnOnQuickRefEncryption(passphrase){
  const salt = bufToBase64(crypto.getRandomValues(new Uint8Array(16)));
  const iterations = QUICKREF_PBKDF2_ITERATIONS;
  const key = await deriveQuickRefKey(passphrase, salt, iterations);
  const canary = await buildQuickRefCanary(key);
  const doc = {enabled: true, salt, canary, iterations, kdf: QUICKREF_KDF_LABEL, updatedAt: new Date().toISOString()};
  await userDoc().collection('meta').doc('quickRefCrypto').set(doc);
  state.qrCrypto = doc;
  cacheQrCryptoOffline(doc);
  state.qrCryptoKey = key;
  state.qrUnlocked = true;
  await reencryptAllQuickRefsAndSave(key, key);
}

// Turns encryption OFF (Part D.17 — the exact mirror-image ordering of turning it on, for the
// same reason). Every entry is decrypted and the plaintext list written to Drive FIRST; only once
// that succeeds is the Firestore crypto doc deleted. Deleting the salt/canary first and then
// failing the plaintext write would strand any not-yet-converted entry with no key material left
// to ever decrypt it again. Requires the session to already be unlocked — callers gate this (see
// requestTurnOffQuickRefEncryption()).
async function turnOffQuickRefEncryption(){
  await decryptAllQuickRefsAndSavePlain(state.qrCryptoKey);
  await userDoc().collection('meta').doc('quickRefCrypto').delete();
  state.qrCrypto = {enabled: false};
  cacheQrCryptoOffline(state.qrCrypto);
  state.qrCryptoKey = null;
  state.qrUnlocked = false;
}

function requestTurnOffQuickRefEncryption(){
  if(!state.qrUnlocked){ openQuickRefUnlock({action:'disable'}); return; }
  performTurnOffQuickRefEncryption();
}
async function performTurnOffQuickRefEncryption(){
  try{
    await turnOffQuickRefEncryption();
    toast('Quick Reference encryption turned off');
  } catch(e){
    console.error('Failed to turn off Quick Reference encryption', e);
    toast(friendlyCloudError(e));
  }
  render();
}

// Changes the passphrase (Part D.18): requires unlocking with the OLD one first (verified against
// the existing canary, same check attemptQuickRefUnlock() does). Deliberately NOT the same
// write-ordering as turnOnQuickRefEncryption() — that function is safe to write its Firestore doc
// first only because its "before" state is plain text, which stays correctly readable regardless
// of what Firestore says (see isEncryptedQuickRefValue()). Here, the "before" state is ALREADY
// ciphertext that only the OLD salt/canary correctly describes, so the old Firestore doc must stay
// in place until the data has actually finished migrating: re-encrypt everything under the new key
// and save it to Drive FIRST (a failure here leaves the old Firestore doc and the old ciphertext
// both untouched and mutually consistent — safely retryable with the same old passphrase), and only
// once that succeeds does this commit the new salt/canary to Firestore. Reversing this order would
// risk the account becoming unlockable-with-the-new-passphrase but undecryptable, if the Drive
// re-encrypt fails or is interrupted after the new Firestore doc already committed. Returns false
// (never throws) when the current passphrase is wrong, so the modal can show an inline error same
// as the unlock modal does.
async function changeQuickRefPassphrase(oldPassphrase, newPassphrase){
  const cached = (state.qrCrypto && state.qrCrypto.salt) ? state.qrCrypto : loadOfflineQrCrypto();
  const oldKey = await deriveQuickRefKey(oldPassphrase, cached.salt, cached.iterations || QUICKREF_PBKDF2_ITERATIONS);
  if(!(await verifyQuickRefCanary(oldKey, cached.canary))) return false;
  const salt = bufToBase64(crypto.getRandomValues(new Uint8Array(16)));
  const iterations = QUICKREF_PBKDF2_ITERATIONS;
  const newKey = await deriveQuickRefKey(newPassphrase, salt, iterations);
  const canary = await buildQuickRefCanary(newKey);
  await reencryptAllQuickRefsAndSave(newKey, oldKey);
  const doc = {enabled: true, salt, canary, iterations, kdf: QUICKREF_KDF_LABEL, updatedAt: new Date().toISOString()};
  await userDoc().collection('meta').doc('quickRefCrypto').set(doc);
  state.qrCrypto = doc;
  cacheQrCryptoOffline(doc);
  state.qrCryptoKey = newKey;
  state.qrUnlocked = true;
  return true;
}

// The destructive "forgot your passphrase" reset (Part D.19): there is no way to recover a
// forgotten passphrase, so the only way forward is deleting the existing (permanently unreadable)
// Quick Reference file and the Firestore crypto doc entirely, leaving Quick Reference empty and
// unencrypted going forward. The modal that calls this (state.modal === 'quickRefForgotPassphrase')
// mirrors the exact typed-confirmation shape the 'deleteAccount' modal already uses.
async function resetForgottenQuickRefPassphrase(){
  if(state.quickRefsDriveFileId){
    try{ await driveDelete(state.quickRefsDriveFileId); }
    catch(e){ console.error('Could not delete the old (unrecoverable) Quick Reference file', e); }
  }
  await userDoc().collection('meta').doc('quickRefCrypto').delete();
  state.qrCrypto = {enabled: false};
  cacheQrCryptoOffline(state.qrCrypto);
  state.qrCryptoKey = null;
  state.qrUnlocked = false;
  state.quickRefs = [];
  state.quickRefsDriveFileId = null;
  state.revealedQuickRefIds.clear();
  quickRefRevealedPlain.clear();
  cacheQuickRefsOffline(state.quickRefs);
}

/* ---------- document sort ----------
   Applies the current sort-mode preference (see currentDocSort() above) to the documents WITHIN
   one section -- the Pinned list, or a single category's grouped list, in renderVault() below.
   Never applied to the Renewals strip (its own fixed, hardcoded soonest-expiry-first order) or to
   Recently Deleted (its own separate, already-correct sort) -- and never changes which section a
   document appears under or the order of the sections themselves (categories keep the order their
   `order` field gives them; see the category-reorder feature in Settings). Pure: returns a new
   array, never mutates `docs`. */
function sortDocumentsForDisplay(docs, mode){
  const sorted = docs.slice();
  if(mode === 'expiry-ascending'){
    // No-expiry documents always sort to the very end, regardless of direction -- there's no
    // sensible position for "no date" among real ones, and treating a missing expiry as some
    // default date would silently misplace it (and risks comparing against undefined/null).
    sorted.sort((a,b) => {
      if(!a.expiry && !b.expiry) return 0;
      if(!a.expiry) return 1;
      if(!b.expiry) return -1;
      return a.expiry.localeCompare(b.expiry);
    });
  } else if(mode === 'alphabetical'){
    sorted.sort((a,b) => (a.title||'').toLowerCase().localeCompare((b.title||'').toLowerCase()));
  } else {
    // 'date-added-descending' (the default) -- same comparator loadOfflineDocumentList() already
    // uses, and the order documents already come back from Firestore in, so this reproduces
    // today's on-screen order exactly for anyone who never touches the sort control.
    sorted.sort((a,b) => (b.addedAt||'').localeCompare(a.addedAt||''));
  }
  return sorted;
}

function renderVault(app){
  if(state.showDeleted) return renderDeletedView(app);
  // Try to self-heal before ever showing "Reconnect" — see attemptSilentDriveRefresh(). Fire-and-
  // forget: render() must stay synchronous, and a successful attempt re-renders itself.
  // authFlowInProgress is excluded here for the same reason it's excluded from the banner below —
  // see that condition's own comment.
  if(!state.isOfflineMode && !driveTokenValid() && !authFlowInProgress) attemptSilentDriveRefresh();
  // Soft-deleted documents (see confirmDeleteDocument/runArchiveCleanup) never show in the normal
  // active/archived views regardless of their archived flag — they only ever appear in the
  // "Recently deleted" view above.
  const visibleDocs = state.documents.filter(d => !d.deletedAt).filter(d => !!d.archived === state.showArchived);
  const filtered = visibleDocs.map(d => ({...d, ...matchesSearch(d)})).filter(d => d.match);
  const upcoming = state.documents
    .filter(d => d.expiry && !d.archived && !d.deletedAt)
    .map(d => ({...d, days: daysUntil(d.expiry)}))
    .filter(d => d.days<=60 && d.days>=-EXPIRED_REMINDER_GRACE_DAYS)
    .sort((a,b)=>a.days-b.days);

  // Pinned documents get their own section above everything else, including Renewals — unlike
  // Renewals (system-computed from expiry dates), a pin is the user's own explicit "I reach for
  // this one" signal, so it takes priority. Also still shown in their own category section below
  // (categories collapse by default now, so the repeat costs nothing visually until someone
  // expands that section) — excluding pinned docs from their category used to mean pinning your
  // only document in a category made that category vanish from the list entirely, since its count
  // was computed only from unpinned docs.
  const docSort = currentDocSort();
  const pinnedDocs = sortDocumentsForDisplay(filtered.filter(d => d.pinned), docSort);

  const grouped = {};
  filtered.forEach(d => { (grouped[d.category] = grouped[d.category] || []).push(d); });
  // Sorting happens within each category's own list only — never changes which category a document
  // groups under, and never touches knownCatOrder/catOrder below (that's the section order itself,
  // driven separately by each category's `order` field — see Settings' category reorder feature).
  Object.keys(grouped).forEach(cat => { grouped[cat] = sortDocumentsForDisplay(grouped[cat], docSort); });
  const knownCatOrder = state.categories.map(c=>c.id).filter(c => grouped[c] && grouped[c].length);
  // Categories aren't part of the offline cache (see the offline document cache section above) —
  // in offline mode state.categories is empty, which would otherwise silently drop every document
  // from view here even though `grouped` has them. Anything left over renders under whatever
  // categoryFor()'s own fallback resolves to, rather than vanishing.
  const leftoverCats = Object.keys(grouped).filter(c => !knownCatOrder.includes(c));
  const catOrder = knownCatOrder.concat(leftoverCats);

  const archivedCount = state.documents.filter(d => d.archived && !d.deletedAt).length;
  const deletedCount = state.documents.filter(d => d.deletedAt).length;

  // One {key, entries} section per document-card-grid the template below renders (Pinned, plus one
  // per category) — used after the innerHTML assignment to reconcile each grid's actual children
  // instead of re-rendering them via the template. Grid keys here must exactly match the
  // data-grid-key values the template emits below.
  const gridSections = [];
  if(pinnedDocs.length) gridSections.push({key: 'pinned', entries: pinnedDocs.map((d,i) => ({doc: d, opts: {showCategory: true, i, instanceKey: 'pinned:'+d.id}}))});
  catOrder.forEach(cat => {
    gridSections.push({key: 'cat:'+cat, entries: grouped[cat].map((d,i) => ({doc: d, opts: {i, instanceKey: 'cat:'+cat+':'+d.id}}))});
  });
  // Must run BEFORE the innerHTML assignment below wipes out the currently-rendered grids — see
  // captureExistingDocGrids().
  const existingDocGrids = captureExistingDocGrids(app);

  // The "Google Drive connection expired" banner below was designed for a token expiring
  // MID-session (rare — the background refresh timer normally catches that first) and assumed
  // driveTokenValid() was always already true the first time this screen ever rendered, since the
  // old cold-start flow never showed the vault until after a token was already applied.
  // paintFromLocalCacheIfAny() changed that: it paints this exact screen from local cache WHILE the
  // real cold-start connect is still in flight, during which driveTokenValid() is legitimately
  // false for a normal, working reason — not because anything actually expired. The banner's own
  // condition (below) excludes authFlowInProgress (true for that flow's entire duration, see
  // auth.onAuthStateChanged) to tell the two cases apart; without that, this alarming banner — and
  // the "online" dot right next to it in the header, which reads general network reachability, not
  // Drive-token status — contradicted each other on every single cold open.
  app.innerHTML = `
    <header class="topbar">
      <div class="brand"><div class="brand-mark">${brandMarkSvg(20)}</div><h1 class="brand-name">Vault</h1><span class="conn-indicator ${isAppOnline() ? 'online' : 'offline'}" title="${isAppOnline() ? 'Online' : escapeHtml(state.offlineReason || 'Offline')}" role="status" aria-label="${isAppOnline() ? 'Online' : escapeHtml(state.offlineReason || 'Offline')}"><span class="conn-dot"></span>${isAppOnline() ? '' : '<span class="conn-label">Offline</span>'}</span></div>
      ${state.selectMode ? `
        <div class="topbar-actions select-mode-bar">
          <span class="select-count-label">${state.selectedDocIds.size} selected</span>
          <button class="icon-only-btn" id="exitSelectModeBtn" aria-label="Cancel selection" title="Cancel">×</button>
        </div>
      ` : `
        <div class="topbar-actions">
          <button class="icon-only-btn" id="openQuickRefBtn" aria-label="Quick Reference" title="Quick Reference">${icon('clipboard',22)}</button>
          <button class="icon-only-btn" id="openSettingsBtn" aria-label="Settings" title="Settings">${icon('settings',22)}</button>
          ${filtered.length ? `<button class="icon-only-btn" id="enterSelectModeBtn" aria-label="Select documents" title="Select">${icon('select',22)}</button>` : ''}
        </div>
      `}
    </header>
    <div class="vault">
      ${state.isOfflineMode ? `
        <div class="reminder-card">
          <span class="rtitle">You're offline — only documents you've viewed before can be opened${state.offlineReason ? `<br><span class="cat-offline-hint">${escapeHtml(state.offlineReason)}</span>` : ''}</span>
          <button class="icon-btn" id="reconnectDriveBtn">Retry</button>
        </div>
      ` : (!driveTokenValid() && !authFlowInProgress) ? `
        <div class="reminder-card urgent">
          <span class="rtitle">Google Drive connection expired</span>
          <button class="icon-btn" id="reconnectDriveBtn">Reconnect</button>
        </div>
      ` : ''}
      <div class="search-bar">
        <span class="sicon">${icon('search',18)}</span>
        <input type="text" id="searchInput" placeholder="Search titles, text, or tags" value="${escapeHtml(state.searchQuery)}" />
        ${state.searchQuery ? `<button type="button" class="search-clear" id="searchClearBtn" aria-label="Clear search">×</button>` : ''}
      </div>
      ${state.searchQuery ? `<div class="search-hint">${filtered.length} result${filtered.length===1?'':'s'} for "${escapeHtml(state.searchQuery)}"</div>` : ''}

      <div class="sort-row">
        <span>Sort</span>
        <select id="docSortSelect" aria-label="Sort documents by">
          <option value="date-added-descending" ${docSort==='date-added-descending' ? 'selected' : ''}>Date added</option>
          <option value="expiry-ascending" ${docSort==='expiry-ascending' ? 'selected' : ''}>Expiry date</option>
          <option value="alphabetical" ${docSort==='alphabetical' ? 'selected' : ''}>Alphabetical</option>
        </select>
      </div>

      ${pinnedDocs.length ? `
        <h2 class="section-title">Pinned</h2>
        <div class="doc-card-grid" data-grid-key="pinned"></div>
      ` : ''}

      ${!state.searchQuery && !state.showArchived && !state.selectMode && upcoming.length ? `
        <h2 class="section-title">
          <span>Renewals</span>
          <button type="button" class="privacy-link" id="seeAllUpcomingBtn" style="display:inline;margin:0;">See all</button>
        </h2>
        <div class="renewal-strip-wrap">
          <div class="renewal-strip">
            ${upcoming.map((d,i) => `
              <div class="renewal-card ${d.days<=7?'urgent':''}" data-renewal-doc="${d.id}" role="button" tabindex="0" style="--i:${i}">
                <div class="renewal-title">${escapeHtml(d.title)}</div>
                <div class="renewal-days">${d.days<0?'Expired':d.days===0?'Due today':d.days+' day'+(d.days===1?'':'s')+' left'}</div>
                <div class="renewal-actions">
                  <button class="icon-only-btn small" data-renewal-renew="${d.id}" aria-label="Renew ${escapeHtml(d.title)}" title="Renew">${icon('restore',14)}</button>
                  <button class="icon-only-btn small" data-renewal-archive="${d.id}" aria-label="Archive ${escapeHtml(d.title)}" title="Archive">${icon('archive',14)}</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>` : ''}

      ${visibleDocs.length === 0 ? `
        <div class="empty-state">${state.showArchived ? 'No archived documents.' : 'No documents yet.<br>Add your first one below.'}</div>
      ` : filtered.length === 0 ? `
        <div class="empty-state">No documents match "${escapeHtml(state.searchQuery)}".</div>
      ` : catOrder.map(cat => {
        const meta = categoryFor(cat);
        // A category's remembered collapsed state is ignored while searching — a match hidden
        // inside a collapsed category defeats the point of searching at all — but never written
        // back, so clearing the search restores exactly whatever was collapsed before.
        const isCollapsed = !state.searchQuery && state.collapsedCats[cat];
        return `
        <h2 class="section-title cat-toggle" data-cat="${cat}" role="button" tabindex="0" aria-expanded="${!isCollapsed}">
          <span class="cat-title-label">${categoryIconHtml(meta,15)} ${escapeHtml(meta.label)}</span>
          <span class="cat-count">${grouped[cat].length}<span class="cat-chevron ${isCollapsed ? 'collapsed' : ''}">${icon('chevronDown',15)}</span></span>
        </h2>
        <div class="doc-card-grid-wrap ${isCollapsed ? 'is-collapsed' : ''}" data-cat-panel="${cat}"><div class="doc-card-grid-inner ${isCollapsed ? '' : 'overflow-visible'}"><div class="doc-card-grid" data-grid-key="cat:${cat}"></div></div></div>
      `; }).join('')}
      ${state.showArchived
        ? `<button class="archive-toggle" id="archiveToggleBtn">${icon('back',14)} Back to active documents</button>`
        : archivedCount ? `<button class="archive-toggle" id="archiveToggleBtn">View archived (${archivedCount})</button>` : ''}
      ${!state.showArchived && deletedCount ? `<button class="archive-toggle" id="deletedToggleBtn">Recently deleted (${deletedCount})</button>` : ''}
      <div class="vault-spacer" aria-hidden="true"></div>
      <div class="version-tag">Version ${APP_VERSION}</div>
    </div>
    ${state.selectMode ? `
      <div class="fab bulk-action-bar">
        <button class="chip-btn" id="bulkMoveBtn" ${state.selectedDocIds.size ? '' : 'disabled'}>${icon('folder',16)} Move</button>
        <button class="chip-btn" id="bulkArchiveBtn" ${state.selectedDocIds.size ? '' : 'disabled'}>${icon(state.showArchived?'restore':'archive',16)} ${state.showArchived ? 'Restore' : 'Archive'}</button>
        <button class="chip-btn danger" id="bulkDeleteBtn" ${state.selectedDocIds.size ? '' : 'disabled'}>${icon('trash',16)} Delete</button>
      </div>
    ` : !state.showArchived ? `
      <div class="fab">
        <button class="camera-fab" id="cameraFabBtn" aria-label="Capture with camera">${icon('camera',22)}</button>
        <button class="primary" id="addDocBtn">${icon('plus',20)} Add document</button>
      </div>
    ` : ''}
  `;

  // Swap each just-templated empty grid placeholder for its old, populated element (if any) and
  // reconcile its children against gridSections — see the big comment above wireDocCardEvents()
  // for why, and reconcileDocGridsAfterRender()/reconcileDocCardGrid() for how.
  reconcileDocGridsAfterRender(app, existingDocGrids, gridSections);

  const renewalStripEl = document.querySelector('.renewal-strip');
  if(renewalStripEl){
    const wrap = renewalStripEl.parentElement;
    if(wrap && renewalStripEl.scrollWidth > renewalStripEl.clientWidth + 1) wrap.classList.add('has-overflow');
  }

  // openSettingsBtn/openQuickRefBtn/enterSelectModeBtn only exist in the topbar's non-select-mode
  // branch above (and exitSelectModeBtn only in its select-mode branch), unlike every other
  // element wired below that's unconditionally in the template — each needs the same null-guard
  // the FAB/archive-toggle buttons already use here for the same reason.
  const openSettingsBtn = document.getElementById('openSettingsBtn');
  if(openSettingsBtn) openSettingsBtn.onclick = () => { state.screen = 'settings'; pushAppHistoryState(); render(); refreshDriveStorageInfo(); };
  const openQuickRefBtn = document.getElementById('openQuickRefBtn');
  if(openQuickRefBtn) openQuickRefBtn.onclick = () => { state.screen = 'quickref'; pushAppHistoryState(); render(); };
  // Only rendered alongside the Renewals section itself (see the template above), same reasoning
  // as openSettingsBtn/openQuickRefBtn's null-guards.
  const seeAllUpcomingBtn = document.getElementById('seeAllUpcomingBtn');
  if(seeAllUpcomingBtn) seeAllUpcomingBtn.onclick = () => { state.upcomingReturnScreen = state.screen; state.screen = 'upcoming'; pushAppHistoryState(); render(); };
  const enterSelectModeBtn = document.getElementById('enterSelectModeBtn');
  if(enterSelectModeBtn) enterSelectModeBtn.onclick = () => enterSelectMode();
  const exitSelectModeBtn = document.getElementById('exitSelectModeBtn');
  if(exitSelectModeBtn) exitSelectModeBtn.onclick = () => exitSelectMode();
  const bulkMoveBtn = document.getElementById('bulkMoveBtn');
  if(bulkMoveBtn) bulkMoveBtn.onclick = () => requestBulkMove();
  const bulkArchiveBtn = document.getElementById('bulkArchiveBtn');
  if(bulkArchiveBtn) bulkArchiveBtn.onclick = () => requestBulkArchive();
  const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
  if(bulkDeleteBtn) bulkDeleteBtn.onclick = () => requestBulkDelete();
  const docSortSelect = document.getElementById('docSortSelect');
  if(docSortSelect) docSortSelect.onchange = () => { setDocSort(docSortSelect.value); render(); };
  const addBtn = document.getElementById('addDocBtn');
  if(addBtn) addBtn.onclick = () => openAddModal();
  const camBtn = document.getElementById('cameraFabBtn');
  if(camBtn) camBtn.onclick = () => openCameraModal();
  const reconnectBtn = document.getElementById('reconnectDriveBtn');
  if(reconnectBtn) reconnectBtn.onclick = reconnectDrive;
  const archiveToggleBtn = document.getElementById('archiveToggleBtn');
  if(archiveToggleBtn) archiveToggleBtn.onclick = () => {
    if(state.showArchived){
      goBackOneLayer();
    } else {
      state.showArchived = true; state.searchQuery = '';
      pushAppHistoryState();
      render();
    }
  };
  const deletedToggleBtn = document.getElementById('deletedToggleBtn');
  if(deletedToggleBtn) deletedToggleBtn.onclick = () => {
    state.showDeleted = true;
    pushAppHistoryState();
    render();
  };

  const searchInput = document.getElementById('searchInput');
  searchInput.oninput = (e) => {
    state.searchQuery = e.target.value;
    // Debounced: render() rebuilds the whole document list, which can be noticeably slower than
    // a keystroke on a large vault — waiting for a short pause in typing keeps every keystroke
    // itself snappy instead of rebuilding the DOM on each one.
    clearTimeout(searchRenderTimer);
    searchRenderTimer = setTimeout(() => {
      // renderImmediate(), not render() — same reasoning as the quick-ref search box: a
      // view-transition crossfade shouldn't play on every debounce tick while typing.
      renderImmediate();
      // That just rebuilt the whole vault view via innerHTML, destroying the input we're typing
      // into — re-query the freshly created one and refocus it, or the on-screen keyboard drops
      // (focusing the old, now-detached node is a silent no-op).
      const freshInput = document.getElementById('searchInput');
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(freshInput.value.length, freshInput.value.length); }
    }, 150);
  };
  const searchClearBtn = document.getElementById('searchClearBtn');
  if(searchClearBtn) searchClearBtn.onclick = () => {
    clearTimeout(searchRenderTimer);
    state.searchQuery = '';
    render();
    const freshInput = document.getElementById('searchInput');
    if(freshInput) freshInput.focus();
  };

  // Tapping a tag chip overwrites the search box with that tag's text outright — same immediate,
  // non-debounced render() as the search-clear button above, not the typing path's 150ms debounce.
  // Deliberately a plain overwrite, never combined with whatever was already in the search box.
  document.querySelectorAll('[data-filter-tag]').forEach(btn => {
    btn.onclick = () => {
      clearTimeout(searchRenderTimer);
      state.searchQuery = btn.getAttribute('data-filter-tag');
      render();
    };
  });

  document.querySelectorAll('.cat-toggle').forEach(el => {
    // Mutates the already-rendered DOM directly instead of calling render() — collapse/expand used
    // to work by omitting the category's whole doc-card-grid from the next render() pass, which
    // meant the panel (and the .cat-chevron rotation CSS already sitting unused above) never had a
    // persistent node to actually animate; toggling a class on the existing nodes here is what
    // finally lets both transitions play. state.collapsedCats stays the source of truth so a later
    // full render() (e.g. after adding a document) still computes the right collapsed state.
    const toggle = () => {
      const c = el.getAttribute('data-cat');
      const collapsed = !state.collapsedCats[c];
      state.collapsedCats[c] = collapsed;
      const panel = document.querySelector(`.doc-card-grid-wrap[data-cat-panel="${c}"]`);
      if(panel){
        panel.classList.toggle('is-collapsed', collapsed);
        const inner = panel.querySelector('.doc-card-grid-inner');
        if(inner){
          if(collapsed){
            // Collapsing: clip right away so the shrink animation looks right from its first frame
            // — waiting for a transitionend here would leave content briefly un-clipped mid-shrink.
            inner.classList.remove('overflow-visible');
          } else {
            // Expanding: stay clipped through the whole grow animation (same reasoning, reversed),
            // only allowing an open action menu to overlap the next card down once this category
            // has actually finished settling open, not before.
            const onDone = (e) => {
              if(e.target === panel && e.propertyName === 'grid-template-rows'){
                inner.classList.add('overflow-visible');
                panel.removeEventListener('transitionend', onDone);
              }
            };
            panel.addEventListener('transitionend', onDone);
          }
        }
      }
      const chevron = el.querySelector('.cat-chevron');
      if(chevron) chevron.classList.toggle('collapsed', collapsed);
      el.setAttribute('aria-expanded', String(!collapsed));
    };
    el.onclick = toggle;
    el.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  });

  // Renewal cards were purely informational — a highlighted "3 days left" with nothing to do
  // about it. Tapping one now opens that document directly, same as tapping its card icon below.
  document.querySelectorAll('[data-renewal-doc]').forEach(el => {
    const open = () => viewDocument(el.getAttribute('data-renewal-doc'));
    el.onclick = open;
    el.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  });
  document.querySelectorAll('[data-renewal-archive]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); requestArchiveDocument(btn.getAttribute('data-renewal-archive')); };
  });
  document.querySelectorAll('[data-renewal-renew]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); openRenewExpiredModal(btn.getAttribute('data-renewal-renew')); };
  });

  wireDocCardEvents();

  renderModal();
}

// Wires every interaction a rendered document card (renderDocCard's output) can have — opening it,
// view/share/renew, opening and closing its ⋮ overflow menu, and (select mode) its selection
// checkbox — so both renderVault() and renderUpcoming() get identical card behavior from one
// definition instead of two copies drifting apart. Pure DOM wiring: closes over nothing but
// module-level state (`state`, `actionMenuOutsideClickHandler`), so it needs no arguments and no
// screen-specific context from its caller.
function wireDocCardEvents(){
  // A pinned document's card renders twice — once in the Pinned section, once again in its own
  // category section — so wiring by id (getElementById only ever finds the first match in document
  // order) silently left the second copy dead. querySelectorAll wires every matching element
  // regardless of how many times a given doc's card appears on the page.
  document.querySelectorAll('[data-open-doc]').forEach(el => {
    const open = () => viewDocument(el.getAttribute('data-open-doc'));
    el.onclick = open;
    el.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  });
  // While select mode is active, renderDocCard swaps a card's data-open-doc icon/title (and its
  // own checkbox) to data-select-doc instead — the normal "open this document" tap target toggles
  // selection in select mode rather than opening the viewer. The checkbox binds via onchange (same
  // convention as the other bare checkboxes in this file, e.g. data-cat-keep-offline-default);
  // the icon/title divs bind via onclick+onkeydown like every other role="button" tap target above.
  document.querySelectorAll('[data-select-doc]').forEach(el => {
    const toggle = () => toggleDocSelected(el.getAttribute('data-select-doc'));
    if(el.tagName === 'INPUT'){
      el.onchange = toggle;
    } else {
      el.onclick = toggle;
      el.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
    }
  });
  document.querySelectorAll('[data-view-doc]').forEach(el => {
    el.onclick = () => viewDocument(el.getAttribute('data-view-doc'));
  });
  document.querySelectorAll('[data-share-doc]').forEach(el => {
    el.onclick = () => openShareModal(el.getAttribute('data-share-doc'));
  });
  document.querySelectorAll('[data-renew-doc]').forEach(el => {
    el.onclick = () => openRenewExpiredModal(el.getAttribute('data-renew-doc'));
  });
  document.querySelectorAll('[data-menu-toggle]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const key = el.getAttribute('data-menu-toggle'); // per-card-render instance key, not a bare doc id
      state.openActionMenu = state.openActionMenu === key ? null : key;
      render();
    };
  });

  document.querySelectorAll('[data-menu-action]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const docId = btn.getAttribute('data-doc');
      const action = btn.getAttribute('data-menu-action');
      const doc = state.documents.find(x => x.id === docId);
      state.openActionMenu = null;
      if(action === 'pin') togglePin(docId);
      else if(action === 'keepOffline') toggleKeepOffline(docId);
      else if(action === 'edit') openEditModal(docId);
      else if(action === 'extractText') extractTextForDocument(docId);
      else if(action === 'archive') toggleArchive(docId);
      else if(action === 'remind' && doc){ window.open(addToCalendarUrl(doc), '_blank'); render(); }
      else if(action === 'download') downloadDocument(docId);
      else if(action === 'delete') requestDeleteDocument(docId);
    };
  });

  // Close any open overflow menu on an outside click. Explicitly drop any handler from a previous
  // render before attaching a new one — render() can run more than once while the menu stays open
  // (e.g. an unrelated toast or background refresh), and {once:true} alone doesn't prevent those
  // extra renders from each attaching their own listener, which would fire and re-render multiple
  // times for a single click.
  if(actionMenuOutsideClickHandler) document.removeEventListener('click', actionMenuOutsideClickHandler);
  actionMenuOutsideClickHandler = null;
  if(state.openActionMenu){
    actionMenuOutsideClickHandler = () => {
      const openKey = state.openActionMenu; // per-card-render instance key, not a bare doc id
      state.openActionMenu = null;
      actionMenuOutsideClickHandler = null;
      // A plain click ANYWHERE ELSE in the app while a menu happens to be open is an extremely
      // common, mostly incidental interaction — a full render() here (rebuilding the ENTIRE
      // document list just to close one small dropdown) was expensive enough on a real phone to
      // look like the whole app was refreshing on every unrelated tap. Removing just this one
      // menu (and fixing up the toggle button's own state) is the same targeted-DOM-update
      // approach category-collapse already uses instead of a full render().
      const menuEl = document.getElementById('actionMenu-' + openKey);
      if(menuEl) menuEl.remove();
      const toggleBtn = document.querySelector(`[data-menu-toggle="${openKey}"]`);
      if(toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
    };
    document.addEventListener('click', actionMenuOutsideClickHandler, {once: true});
  }
}

// ---------- document-card-grid keyed reconciliation ----------
// renderVault() and renderUpcoming() both used to rebuild their entire document-card grid(s) via
// one big innerHTML template on every single render() — pinning a document, toggling a checkbox in
// select mode, searching, changing sort — destroying and recreating every visible card even for a
// one-document change. This section extends the same "targeted DOM update instead of full rebuild"
// spirit that category-collapse/expand and the action-menu outside-click handler above already use
// (neither of which goes through render() at all) to the card grids themselves, the same keyed
// reconciliation technique React/Vue use for lists. See renderVault()/renderUpcoming() for how a
// grid container's placeholder gets swapped for its old, populated element before this runs.

// instanceKey -> the exact HTML string renderDocCard(doc, opts) produced for it last time it was
// reconciled. Shared (module-level, not per-screen) since a document can be reconciled from either
// renderVault() (pinned and/or its category section) or renderUpcoming() (its bucket), each under
// its own distinct instanceKey — see reconcileDocCardGrid()'s cache lookup below. A stale entry
// left behind when a whole screen changes (so its grids never went through reconcileDocCardGrid on
// the way out) is harmlessly cleaned up the next time that same section IS reconciled again, via
// the leftover-removal pass at the bottom of that function.
const docCardHtmlCache = new Map();

// Parses one renderDocCard() HTML string into a real, detached DOM node.
function buildDocCardNode(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = html.trim();
  return tpl.content.firstElementChild;
}

// Reconciles one document-card-grid element's actual children against `entries` — the ordered list
// of {doc, opts} pairs that belong in it for this render, in the exact order they should appear —
// instead of the innerHTML-based full rebuild every other part of a render still does.
//
// Each entry's stable identity across renders is opts.instanceKey (falling back to the doc's own
// id, same convention renderDocCard itself uses internally). For each entry: if a current child of
// `gridEl` is already tagged with that instanceKey (via renderDocCard's own data-card-key attribute)
// AND the cached HTML this function last rendered for that key is unchanged, that exact DOM node is
// left completely alone — not even a class-list touch — which is the entire point of this exercise.
// Otherwise (new key, or its rendered HTML actually differs — a tag/sort/keep-offline-badge/
// select-mode-checkbox/pin change, a menu opening, etc. all naturally change renderDocCard's output
// for that instanceKey) a fresh node is built from the newly rendered HTML and swapped in.
//
// CRITICAL: every entry — unchanged nodes included — still gets moved into its correct final
// position below. Changing "Sort by" leaves every individual card's rendered HTML byte-for-byte
// identical (same doc, same instanceKey; renderDocCard's output no longer depends on list position
// at all now that the dead --i ordering variable is gone — see renderDocCard) and only the desired
// ORDER of the same set of cards changes, so a reconciler that repositioned only newly-created or
// changed nodes would silently fail to visually reorder anything.
//
// Finally, any leftover child whose key is no longer present in `entries` (the document was
// deleted, archived out of view, moved to a different category/bucket, etc.) is removed from the
// grid and dropped from docCardHtmlCache too, so that cache doesn't grow forever over a long
// session.
function reconcileDocCardGrid(gridEl, entries){
  const existingByKey = new Map();
  Array.from(gridEl.children).forEach(child => {
    const key = child.getAttribute('data-card-key');
    if(key !== null) existingByKey.set(key, child);
  });
  const usedKeys = new Set();
  let afterNode = null; // each entry's node gets moved to immediately follow this one, in order
  entries.forEach(({doc, opts}) => {
    const key = opts.instanceKey || doc.id;
    usedKeys.add(key);
    const html = renderDocCard(doc, opts);
    let node = existingByKey.get(key);
    if(!node || docCardHtmlCache.get(key) !== html){
      // Rebuilding: if a stale node for this same key was already sitting in the grid (its content
      // changed — a menu toggle, a pin/tag/keep-offline change, anything), it must be removed here,
      // not just left for insertBefore below to sort out — insertBefore only ever ADDS the new node
      // to the DOM, it has no idea the old one (a completely different element reference) is meant
      // to be replaced. Leaving it would orphan the stale node as a permanent duplicate: it's still
      // tagged with this same data-card-key, so the leftover-removal pass at the bottom (which only
      // removes keys NOT in usedKeys) would never touch it either, since this key IS in usedKeys.
      const staleNode = node;
      node = buildDocCardNode(html);
      docCardHtmlCache.set(key, html);
      if(staleNode) staleNode.remove();
    }
    const wantedNext = afterNode ? afterNode.nextSibling : gridEl.firstChild;
    if(wantedNext !== node) gridEl.insertBefore(node, wantedNext);
    afterNode = node;
  });
  existingByKey.forEach((node, key) => {
    if(!usedKeys.has(key)){
      node.remove();
      docCardHtmlCache.delete(key);
    }
  });
}

// Shared by renderVault()/renderUpcoming(): captures every document-card-grid container currently
// in `app` (tagged with data-grid-key — see both render functions), keyed by that attribute's
// value, BEFORE the caller's own innerHTML assignment wipes them out. Naturally empty/irrelevant on
// a first render or a screen change — a grid key from a totally different screen never matches
// anything captured here — so no "did the screen change" special-casing is needed.
function captureExistingDocGrids(app){
  const map = new Map();
  app.querySelectorAll('[data-grid-key]').forEach(el => map.set(el.getAttribute('data-grid-key'), el));
  return map;
}

// Shared by renderVault()/renderUpcoming(): called once right after the caller's own innerHTML
// assignment has just created a fresh, EMPTY placeholder `<div data-grid-key="...">` for each
// section in `gridSections` ({key, entries}). For each one, swaps in the matching old, already-
// populated grid element captured by captureExistingDocGrids() (if any — a brand new section has
// none, and the freshly-created empty placeholder is used as-is), then reconciles that grid's
// children against `entries` via reconcileDocCardGrid().
function reconcileDocGridsAfterRender(app, existingGrids, gridSections){
  const freshPlaceholders = new Map();
  app.querySelectorAll('[data-grid-key]').forEach(el => freshPlaceholders.set(el.getAttribute('data-grid-key'), el));
  gridSections.forEach(({key, entries}) => {
    const placeholder = freshPlaceholders.get(key);
    if(!placeholder) return; // shouldn't happen — every gridSections key has a matching template placeholder
    const oldGrid = existingGrids.get(key);
    let gridEl = placeholder;
    if(oldGrid){
      placeholder.replaceWith(oldGrid);
      gridEl = oldGrid;
    }
    reconcileDocCardGrid(gridEl, entries);
  });
}

// The trash view — deliberately a separate, simpler render path from renderVault() rather than a
// third value threaded through visibleDocs/catOrder/etc.: it's not a daily-use screen (no search,
// no pinning, no categories, no add-document FAB), just a flat list of what's awaiting restore or
// permanent removal, so reusing the active/archived view's full machinery would add branching
// there for no real benefit here.
function renderDeletedView(app){
  const deletedDocs = state.documents.filter(d => d.deletedAt).sort((a,b) => new Date(b.deletedAt) - new Date(a.deletedAt));
  app.innerHTML = `
    <div class="settings-header">
      <button class="icon-only-btn" id="backFromDeletedBtn" aria-label="Back">${icon('back',22)}</button>
      <h1 class="brand-name">Recently deleted</h1>
    </div>
    <div class="settings">
