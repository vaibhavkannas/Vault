      <p class="quickref-caution">Documents here are permanently deleted ${TRASH_RETENTION_DAYS} days after being moved here, unless you restore them first.</p>
      ${deletedDocs.length === 0 ? `<div class="empty-state">Nothing here.</div>` : deletedDocs.map((d,i) => {
        const meta = categoryFor(d.category);
        const daysLeft = Math.max(0, TRASH_RETENTION_DAYS - daysSinceIso(d.deletedAt));
        return `
        <div class="doc-card" style="--i:${i}">
          <div class="doc-icon">${categoryIconHtml(meta,21)}</div>
          <div class="doc-body">
            <p class="doc-title">${escapeHtml(d.title)}</p>
            <p class="doc-meta">${escapeHtml(meta.label)} · Deleted ${formatDate(d.deletedAt)} · ${daysLeft} day${daysLeft===1?'':'s'} left to restore</p>
            <div class="doc-actions">
              <button class="chip-btn" data-restore-doc="${d.id}">Restore</button>
              <button class="chip-btn danger" data-purge-doc="${d.id}">Delete now</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  document.getElementById('backFromDeletedBtn').onclick = () => goBackOneLayer();
  document.querySelectorAll('[data-restore-doc]').forEach(btn => {
    btn.onclick = () => restoreDeletedDocument(btn.getAttribute('data-restore-doc'));
  });
  document.querySelectorAll('[data-purge-doc]').forEach(btn => {
    btn.onclick = () => requestPurgeDocument(btn.getAttribute('data-purge-doc'));
  });
  renderModal();
}

// Small escaped chip per tag, for display atop a document card — data-filter-tag carries the raw
// tag text so the vault's event wiring (see renderVault) can turn a tap into "search for this tag".
// Returns '' for an absent/empty array so a document with no tags (i.e. every document that existed
// before this feature shipped) renders pixel-identical to today — always call with (d.tags || []),
// never d.tags directly.
function renderTagChipsHtml(tags){
  if(!tags || !tags.length) return '';
  return `<div class="tag-chip-row">${tags.map(t => `<button type="button" class="tag-chip" data-filter-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}</div>`;
}

function renderDocCard(d, opts){
  opts = opts || {};
  const meta = categoryFor(d.category);
  let expiryBadge = '';
  let isExpired = false;
  if(d.expiry){
    const days = daysUntil(d.expiry);
    isExpired = days<0;
    const style = isExpired ? 'background:var(--danger-bg);color:var(--danger);' : days<=7 ? 'background:var(--danger-bg);color:var(--danger);' : days<=30 ? 'background:var(--warning-bg);color:var(--warning);' : 'background:var(--success-bg);color:var(--success);';
    expiryBadge = `<span class="doc-expiry" style="${style}">${isExpired ? 'Expired' : 'Expires'} ${formatExpiryDate(d.expiry)}</span>`;
  }
  // A pinned doc renders twice (once here, once again under its own category — see the
  // Pinned/grouped call sites), sharing the same d.id. instanceKey disambiguates the two DOM
  // instances so opening one card's ⋮ menu doesn't also flag the other instance's menu as open.
  const instanceKey = opts.instanceKey || d.id;
  const menuOpen = state.openActionMenu === instanceKey;
  // Denormalized both directions (see confirmRenewExpired) so either end of the pair can show a
  // note with no extra lookup beyond the already-loaded state.documents list.
  const supersededByDoc = d.supersededBy ? state.documents.find(x => x.id === d.supersededBy) : null;
  const supersedesDoc = d.supersedes ? state.documents.find(x => x.id === d.supersedes) : null;
  const linkNote = supersededByDoc ? `<p class="doc-link-note">→ Replaced by ${escapeHtml(supersededByDoc.title)}</p>`
    : supersedesDoc ? `<p class="doc-link-note">→ Replaces ${escapeHtml(supersedesDoc.title)}</p>` : '';
  // In offline mode, a document's Firestore metadata can be known (and worth listing, so it isn't
  // misleadingly invisible) without its file bytes being cached — those are two separate stores,
  // see the offline-cache comment above. Distinguish the two rather than letting every card look
  // equally open-able when only some actually are.
  const offlineUnavailable = state.isOfflineMode && !state.offlineDocIds.has(d.id);
  // Four states, each with its own visible label: a document deliberately kept offline (and
  // actually cached) reads as protected ("Kept offline"), one currently being downloaded for that
  // same deliberate reason shows an in-flight indicator instead of looking identical to "not cached
  // at all" mid-download, and a document merely opened once while online — cached as an incidental
  // side effect, with no guarantee it stays that way — reads as "Offline for now" rather than
  // looking identical to the protected state. That distinction (automatic-and-evictable vs
  // deliberate-and-permanent) is the actual point of the Keep Offline toggle, and a bare icon with
  // only a tooltip never conveyed it on a touchscreen with no hover.
  const isKeepOfflineDownloading = state.keepOfflineInFlightIds.has(d.id);
  let offlineBadgeHtml = '';
  if(isKeepOfflineDownloading){
    offlineBadgeHtml = `<span class="offline-badge downloading with-label" title="Caching for offline use…" aria-label="Caching for offline use">${icon('download',12)} Caching…</span>`;
  } else if(d.keepOffline && state.offlineDocIds.has(d.id)){
    offlineBadgeHtml = `<span class="offline-badge with-label" title="Kept offline — won't be cleared to free up space" aria-label="Kept offline — won't be cleared to free up space">${icon('download',12)} Kept offline</span>`;
  } else if(state.offlineDocIds.has(d.id)){
    // A visible label, not just a tooltip — the previous bare-icon badge and "Kept offline" looked
    // identical in meaning at a glance, and a tooltip alone never reaches a touchscreen user (no
    // hover on mobile, which is exactly where this was actually confusing someone). "Offline for
    // now" next to "Kept offline" makes the temporary-vs-protected contrast visible with no tap or
    // hover needed — same with-label styling as the other three states, no new CSS.
    offlineBadgeHtml = `<span class="offline-badge with-label" title="Offline for now — may be cleared to free up space" aria-label="Offline for now — may be cleared to free up space">${icon('download',12)} Offline for now</span>`;
  } else if(offlineUnavailable){
    offlineBadgeHtml = `<span class="offline-badge unavailable">Not available offline</span>`;
  }
  // Select mode replaces the "open this document" tap target (the icon + title) with a "toggle
  // this document's checkbox" one instead — reads state.selectedDocIds by d's own BARE id (see
  // that field's comment in the state object for why), never by instanceKey, so a pinned doc's
  // two on-screen copies always agree with zero extra synchronization code.
  const selected = state.selectMode && state.selectedDocIds.has(d.id);
  const openOrSelectAttr = state.selectMode ? `data-select-doc="${d.id}"` : `data-open-doc="${d.id}"`;
  return `
    <div class="doc-card ${d.archived ? 'is-archived' : ''} ${offlineUnavailable ? 'is-offline-unavailable' : ''} ${selected ? 'is-selected' : ''}" data-card-key="${instanceKey}">
      ${state.selectMode ? `<input type="checkbox" class="doc-select-checkbox" data-select-doc="${d.id}" ${selected ? 'checked' : ''} aria-label="Select ${escapeHtml(d.title)}" />` : ''}
      <div class="doc-icon ${d.ocrText ? 'ocr-badge' : ''}" ${openOrSelectAttr} role="button" tabindex="0" aria-label="${state.selectMode ? 'Select' : 'View'} ${escapeHtml(d.title)}">${categoryIconHtml(meta,21)}</div>
      <div class="doc-body">
        <p class="doc-title" ${openOrSelectAttr} role="button" tabindex="0">${escapeHtml(d.title)}${offlineBadgeHtml}</p>
        <p class="doc-meta">${opts.showCategory ? `${escapeHtml(meta.label)} · ` : ''}Added ${formatDate(d.addedAt)}${d.archived ? ' · archived' : ''}</p>
        ${renderTagChipsHtml(d.tags || [])}
        ${d.snippet ? `<p class="doc-snippet">${d.snippet}</p>` : ''}
        ${expiryBadge}
        ${linkNote}
        ${state.selectMode ? '' : `
        <div class="doc-actions">
          <button class="chip-btn" data-view-doc="${d.id}">View</button>
          <button class="chip-btn secondary" data-share-doc="${d.id}">Share</button>
          ${isExpired && !d.archived ? `<button class="chip-btn danger" data-renew-doc="${d.id}">Renew</button>` : ''}
          <div class="action-menu-wrap">
            <button class="icon-only-btn small" data-menu-toggle="${instanceKey}" aria-label="More actions" aria-haspopup="true" aria-expanded="${menuOpen}">${icon('more',18)}</button>
            ${menuOpen ? `
              <div class="action-menu" id="actionMenu-${instanceKey}">
                <button data-menu-action="pin" data-doc="${d.id}">${icon('star',15)} ${d.pinned ? 'Unpin' : 'Pin to top'}</button>
                <button data-menu-action="keepOffline" data-doc="${d.id}">${icon('download',15)} ${d.keepOffline ? 'Stop keeping offline' : 'Keep offline'}</button>
                <button data-menu-action="edit" data-doc="${d.id}">${icon('edit',15)} Edit</button>
                ${!d.ocrText ? `<button data-menu-action="extractText" data-doc="${d.id}">${icon('search',15)} Extract text</button>` : ''}
                <button data-menu-action="archive" data-doc="${d.id}">${icon(d.archived?'restore':'archive',15)} ${d.archived ? 'Restore' : 'Archive'}</button>
                ${d.expiry ? `<button data-menu-action="remind" data-doc="${d.id}">${icon('calendar',15)} Add reminder</button>` : ''}
                <button data-menu-action="download" data-doc="${d.id}">${icon('download',15)} Download</button>
                <button class="danger" data-menu-action="delete" data-doc="${d.id}">${icon('trash',15)} Delete</button>
              </div>
            ` : ''}
          </div>
        </div>
        `}
      </div>
    </div>
  `;
}

/* ---------- upcoming renewals (all categories) ----------
   A dedicated, all-categories view of every non-archived, non-deleted document with an expiry
   date — reachable from the vault's Renewals section via its "See all" link (only present when
   the strip itself is: no search, not viewing archived, not in select mode, and at least one
   document actually upcoming) and from Settings' "View upcoming renewals" row, which stays
   reachable regardless of any of that. Unlike the Renewals strip — fixed at its own 60-day/
   30-day-grace window with no way to see further out or narrow in — this screen lets that window
   itself be widened or narrowed, and groups results into labeled buckets instead of one flat
   scroll-past strip. */
// Transient, session-only UI preference for which window this screen shows — never persisted
// (unlike e.g. currentDocSort()'s localStorage-backed choice), so like every other plain
// top-level `let` of this kind (categoryReorderInFlight, quickRefRevealedPlain, ...) it simply
// resets to its default the moment the page reloads, by virtue of this script re-running from
// the top rather than any explicit reset code.
let upcomingWindowDays = 60; // 30 | 60 | 90

function renderUpcoming(app){
  const windowDays = upcomingWindowDays;
  // Recomputed fresh from state.documents on every single render — never a separately cached
  // list — so a document that becomes archived/deleted while this screen is open simply stops
  // matching on the very next render, with no invalidation code needed. Same plain truthiness
  // check on d.expiry the Renewals strip itself already uses (see renderVault's `upcoming`) to
  // exclude documents with no expiry at all, and the same EXPIRED_REMINDER_GRACE_DAYS cutoff for
  // how far past expiry a document still counts as "Overdue" rather than dropping off entirely.
  const docs = state.documents
    .filter(d => d.expiry && !d.archived && !d.deletedAt)
    .map(d => ({...d, days: daysUntil(d.expiry)}))
    .filter(d => d.days<=windowDays && d.days>=-EXPIRED_REMINDER_GRACE_DAYS)
    .sort((a,b)=>a.days-b.days);

  // Each bucket's predicate slices the already-sorted `docs` array, so "soonest first within and
  // across buckets" falls out for free with no separate per-bucket sort. The 60/90-day buckets are
  // additionally gated on the selected window so a 30-day view never shows an (always-empty, given
  // the days<=windowDays filter above) "Next 60 days" header at all.
  const buckets = [
    {label: 'Overdue', test: d => d.days<0},
    {label: 'This week', test: d => d.days>=0 && d.days<=7},
    {label: 'This month', test: d => d.days>7 && d.days<=30},
    {label: 'Next 60 days', test: d => d.days>30 && d.days<=60, minWindow: 60},
    {label: 'Next 90 days', test: d => d.days>60 && d.days<=90, minWindow: 90},
  ]
    .filter(b => !b.minWindow || windowDays>=b.minWindow)
    .map(b => ({label: b.label, docs: docs.filter(b.test)}))
    .filter(b => b.docs.length);

  // One {key, entries} section per bucket's document-card-grid — same purpose as renderVault()'s
  // gridSections above. Prefixed distinctly from renderVault()'s own grid keys ('pinned', 'cat:...')
  // so the two screens' keys can never collide in the shared docCardHtmlCache/DOM lookups even
  // though a document can appear in both at once (once here, once — under its own separate
  // instanceKey — in the vault's Pinned/category sections).
  const gridSections = buckets.map(b => ({key: 'upcoming-bucket:'+b.label, entries: b.docs.map((d,i) => ({doc: d, opts: {showCategory: true, i, instanceKey: 'upcoming:'+d.id}}))}));
  // Must run BEFORE the innerHTML assignment below wipes out the currently-rendered grids — see
  // captureExistingDocGrids().
  const existingDocGrids = captureExistingDocGrids(app);

  app.innerHTML = `
    <div class="settings-header">
      <button class="icon-only-btn" id="backToVaultBtn" aria-label="Back">${icon('back',22)}</button>
      <h1 class="brand-name">Upcoming renewals</h1>
    </div>
    <div class="settings">
      <div class="theme-toggle-row">
        <button data-upcoming-window="30" class="${windowDays===30?'active':''}" aria-pressed="${windowDays===30}">30 days</button>
        <button data-upcoming-window="60" class="${windowDays===60?'active':''}" aria-pressed="${windowDays===60}">60 days</button>
        <button data-upcoming-window="90" class="${windowDays===90?'active':''}" aria-pressed="${windowDays===90}">90 days</button>
      </div>
      ${buckets.length === 0 ? `
        <div class="empty-state">Nothing expiring in the next ${windowDays} days.</div>
      ` : buckets.map(b => `
        <div class="section-title">${b.label}</div>
        <div class="doc-card-grid" data-grid-key="upcoming-bucket:${b.label}"></div>
      `).join('')}
    </div>
  `;

  // Swap each just-templated empty grid placeholder for its old, populated element (if any) and
  // reconcile its children against gridSections — see reconcileDocGridsAfterRender()/
  // reconcileDocCardGrid() above wireDocCardEvents().
  reconcileDocGridsAfterRender(app, existingDocGrids, gridSections);

  document.getElementById('backToVaultBtn').onclick = () => goBackOneLayer();
  // A filter change, not a navigation — re-renders this screen's own content in place with no new
  // history layer, so one Back press always lands straight back on the vault no matter how many
  // times the window was switched.
  document.querySelectorAll('[data-upcoming-window]').forEach(btn => {
    btn.onclick = () => { upcomingWindowDays = +btn.getAttribute('data-upcoming-window'); render(); };
  });

  wireDocCardEvents();
  renderModal();
}

/* ---------- add document (file upload) ---------- */
let pendingFile = null;
let pendingOcrText = '';
let pendingExpirySuggested = false;
let pendingCategorySuggested = false;
let pendingTitleSuggested = false;
let categoryManuallyChanged = false;
// Set when pendingFile turns out to be a password-protected PDF (see the fileInput onchange
// handler's PDF branch and runOcrOnPdfFile's onOpened callback) — a document Vault can never
// actually open is worse than useless here: it can't be previewed, OCR'd, or searched, so it's
// rejected at upload time rather than saved and left to fail confusingly later when viewed. Holds
// the exact message to show; empty string means "not blocked." saveDocument() checks this
// synchronously as a defense-in-depth backstop, not just the Save button's disabled attribute.
let pendingFileBlockedReason = '';
// No longer blocks Save — the user shouldn't have to wait for on-device OCR just to save a
// document. Still tracked so saveDocument()/saveCameraDocument() know whether to kick off
// extractTextForDocument() as a background backfill once OCR (which keeps running either way)
// actually finishes, since text search wouldn't otherwise pick up whatever it hadn't found yet.
let pendingOcrRunning = false;

// The 'add' modal accepts either an image or a PDF upload, either of which is about to need OCR
// (runOcr / runOcrOnPdfFile) the moment a file is picked — so, like wireCropOverlay() warming
// OpenCV early for the crop screen, kick off both loaders here non-blockingly (swallowing any
// rejection) so they're very likely already loaded by the time they're actually awaited.
function openAddModal(){ state.modal = 'add'; state.renewalUploadTargetId = null; pendingFile = null; pendingOcrText = ''; pendingExpirySuggested = false; pendingCategorySuggested = false; pendingTitleSuggested = false; categoryManuallyChanged = false; pendingOcrRunning = false; pendingFileBlockedReason = ''; pushAppHistoryState(); render(); loadTesseractScript().catch(() => {}); loadPdfJsScript().catch(() => {}); }
// Opens the same 'add' modal, but flagged so saveDocument() links the new file to oldDocId as its
// replacement and archives oldDocId once the upload succeeds — the direct "upload now" path from
// the Renew flow, rather than only being able to pick an already-existing document as the reason.
function openAddModalForRenewal(oldDocId){ state.modal = 'add'; state.renewalUploadTargetId = oldDocId; pendingFile = null; pendingOcrText = ''; pendingExpirySuggested = false; pendingCategorySuggested = false; pendingTitleSuggested = false; categoryManuallyChanged = false; pendingOcrRunning = false; pendingFileBlockedReason = ''; pushAppHistoryState(); render(); loadTesseractScript().catch(() => {}); loadPdfJsScript().catch(() => {}); }
function closeModal(){
  goBackOneLayer();
}
// Escape-to-close, plus a focus trap so Tab/Shift+Tab cycle within the open modal instead of
// escaping into the (aria-hidden) page behind it — neither existed at all before this.
document.addEventListener('keydown', (e) => {
  if(!state.modal) return;
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key !== 'Tab') return;
  const sheet = document.querySelector('.modal-sheet');
  if(!sheet) return;
  const focusable = sheet.querySelectorAll('input, select, textarea, button, [tabindex]:not([tabindex="-1"])');
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

// Pull-down-to-dismiss for the document viewer: dragging down while already scrolled to the very
// top of the sheet drags the sheet itself down instead of doing nothing (or rubber-banding), and
// releasing past a threshold closes it — the same gesture Google Photos/Instagram use for a
// full-content viewer, as an additional way to close beyond the X button and the outside-tap
// added earlier. Scoped to just this one modal (via the caller only invoking it for viewFile) —
// dragging from the top of an add/edit form, for instance, should just scroll, not risk dismissing
// unsaved input.
//
// Dragging the content area is gated on being scrolled to the very top — reasonable in principle
// (otherwise it'd fight ordinary scrolling), but it means the gesture can go silently dead from
// anywhere it isn't exactly true, with nothing on screen to explain why. `handle`, when passed, is
// a small dedicated grab bar with no such condition: a drag starting there always counts, the same
// guaranteed contract every native bottom sheet's handle gives you, independent of scroll state.
function enableSwipeToDismiss(sheet, handle){
  let startY = 0, dragging = false, pointerId = null, lastY = 0, lastT = 0, velocity = 0;
  const DISMISS_THRESHOLD_PX = 90;
  const FADE_DISTANCE_PX = 300; // backdrop reaches its floor opacity after this much drag
  const EXIT_DURATION_MIN_MS = 120, EXIT_DURATION_MAX_MS = 260;

  const begin = (e) => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    startY = e.clientY;
    lastY = e.clientY;
    lastT = e.timeStamp;
    velocity = 0;
    pointerId = e.pointerId;
    dragging = false;
  };

  // Deliberately NOT attached to the whole sheet — it used to arm from a pointerdown anywhere in
  // the content area (gated only on being scrolled to the top), so an ordinary tap-and-drag on a
  // button or list item up there could get misread as the start of a dismiss gesture. Only a
  // press starting on the dedicated handle can ever begin this now; pointermove/pointerup below
  // stay on `sheet` (not `handle`) since the drag naturally leaves the small handle bar within the
  // first moment of downward movement, and both still fire from there via ordinary event bubbling
  // — `handle` is inside `sheet`, so nothing about the rest of the gesture needs to change.
  if(handle){
    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      begin(e);
    });
  }

  sheet.addEventListener('pointermove', (e) => {
    if(pointerId === null || e.pointerId !== pointerId) return;
    const deltaY = e.clientY - startY;
    if(!dragging){
      if(deltaY <= 0) return; // hasn't moved down yet — not a dismiss attempt
      dragging = true;
      sheet.setPointerCapture(pointerId);
      // Suppresses the browser's own scroll/rubber-band/pull-to-refresh handling for the rest of
      // this gesture. Once armed, this stays in effect until the finger actually lifts (see
      // below) — a real finger's path isn't perfectly monotonic, and re-toggling this mid-drag on
      // every tiny backward jitter was handing the gesture back to the browser before release,
      // which is why the sheet used to move a little and then stop responding.
      sheet.style.touchAction = 'none';
    }
    const dt = e.timeStamp - lastT;
    if(dt > 0) velocity = (e.clientY - lastY) / dt;
    lastY = e.clientY;
    lastT = e.timeStamp;
    const clamped = Math.max(0, deltaY);
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${clamped}px)`;
    const overlay = sheet.parentElement;
    if(overlay) overlay.style.opacity = String(1 - 0.6 * Math.min(1, clamped / FADE_DISTANCE_PX));
  });

  const endDrag = (e) => {
    if(pointerId === null || e.pointerId !== pointerId) return;
    const deltaY = e.clientY - startY;
    const wasDragging = dragging;
    dragging = false;
    pointerId = null;
    sheet.style.touchAction = '';
    if(!wasDragging) return;
    const overlay = sheet.parentElement;
    // Only where the finger actually ended up decides whether to dismiss — never speed on its own.
    // A quick flick used to close the sheet outright even when the very next thing the user did was
    // drag back up to cancel: reversing direction always wins now, exactly like Google Photos or
    // Instagram, since deltaY here is the FINAL position at release, not a snapshot from mid-drag.
    if(deltaY > DISMISS_THRESHOLD_PX){
      // window.innerHeight rather than the sheet's own measured height — the sheet's bottom edge
      // already sits at the viewport bottom (the overlay is flex-end aligned), so a full viewport
      // height of travel is always enough to clear it, and doesn't depend on a getBoundingClientRect
      // reading staying accurate through the animation (mobile browser chrome show/hide can nudge
      // the effective viewport mid-gesture).
      const remaining = Math.max(window.innerHeight - deltaY, 80);
      // Finishes the drag in the same direction rather than cutting the DOM away the instant the
      // threshold is crossed — a fast swipe keeps moving fast off-screen, a slow drag that just
      // cleared the threshold gets a brisk but unhurried finish. velocity is px/ms from the last
      // tracked move; the 0.6 floor keeps a barely-past-threshold, nearly-stationary release from
      // producing a sluggish animation.
      const speed = Math.max(velocity, 0.6);
      const durationMs = Math.min(EXIT_DURATION_MAX_MS, Math.max(EXIT_DURATION_MIN_MS, remaining / speed));
      sheet.style.transition = `transform ${durationMs}ms cubic-bezier(0.2,0.6,0.3,1)`;
      sheet.style.transform = `translateY(${deltaY + remaining}px)`;
      // The backdrop is deliberately left at whatever opacity the drag already left it at, rather
      // than also animating it to fully transparent in parallel — a separate opacity transition
      // reaching 0 even slightly before the transform reached its own endpoint (different easing
      // curves settle at different real times despite the same declared duration) exposed the page
      // underneath through the fully-dimmed backdrop for the last few ms of the slide, before the
      // sheet had actually cleared it. It now disappears in one step alongside the sheet itself,
      // when closeModal() removes the whole overlay — by which point the sheet is already gone.
      setTimeout(closeModal, durationMs);
    } else {
      sheet.style.transition = 'transform 0.2s cubic-bezier(0.2,0.8,0.2,1)';
      sheet.style.transform = '';
      if(overlay){
        overlay.style.transition = 'opacity 0.2s ease';
        overlay.style.opacity = '';
      }
    }
  };
  sheet.addEventListener('pointerup', endDrag);
  sheet.addEventListener('pointercancel', endDrag);
}

function categoryOptionsHtml(selected){
  return state.categories.map(c => `<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.label)}</option>`).join('');
}

function switchHtml(id, checked, disabled, ariaLabel){
  return `<label class="switch"><input type="checkbox" id="${id}" ${checked?'checked':''} ${disabled?'disabled':''} aria-label="${escapeHtml(ariaLabel || '')}"><span class="switch-track"><span class="switch-thumb"></span></span></label>`;
}
// Same markup as switchHtml above, but keyed by a data attribute instead of a fixed id — one of
// these renders per category, so a plain id (switchHtml's usual approach, fine for every other
// single-instance switch on this screen) would collide across categories.
function catKeepOfflineSwitchHtml(cat){
  return `<label class="switch"><input type="checkbox" data-cat-keep-offline-default="${cat.id}" ${cat.keepOfflineDefault ? 'checked' : ''} aria-label="${escapeHtml('Keep ' + cat.label + ' documents offline by default')}"><span class="switch-track"><span class="switch-thumb"></span></span></label>`;
}

function renderModal(){
  const existing = document.getElementById('modalOverlay');
  if(existing) existing.remove();
  const appEl = document.getElementById('app');
  if(!state.modal){ if(appEl) appEl.removeAttribute('aria-hidden'); return; }
  if(appEl) appEl.setAttribute('aria-hidden', 'true');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  // Applies to every modal type below — a tap on the dimmed backdrop (not the sheet itself)
  // closes it, same as viewFile used to do on its own before this was made universal.
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  if(state.modal === 'add'){
    const renewalTarget = state.renewalUploadTargetId ? state.documents.find(d => d.id === state.renewalUploadTargetId) : null;
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-close"><button id="closeModalBtn" aria-label="Close">×</button></div>
        <h3>${renewalTarget ? 'Upload replacement document' : 'Add a document'}</h3>
        <p class="sub">${renewalTarget ? `This replaces "${escapeHtml(renewalTarget.title)}" — once saved, that document is archived and linked to this one.` : `OCR runs on-device to make it searchable and to suggest an expiry date.`}</p>
        <span class="field-label" id="fileDropLabel">File</span>
        <div class="file-drop" id="fileDrop" role="button" tabindex="0" aria-labelledby="fileDropLabel">Choose a file</div>
        <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none;" />
        <div class="search-hint" id="pdfNote" style="display:none;">Multi-page PDFs are OCR'd one page at a time, so this can take a little longer.</div>
        <div class="progress-row" id="ocrProgress" style="display:none;"></div>
        <label class="field-label" for="docTitle">Document title</label>
        <input type="text" id="docTitle" placeholder="e.g. Aadhaar card" value="${renewalTarget ? escapeHtml(renewalTarget.title) : ''}" />
        <div class="suggest-note" id="titleSuggestNote" style="display:none;"></div>
        <label class="field-label" for="docCategory">Category</label>
        <select id="docCategory">${categoryOptionsHtml(renewalTarget ? renewalTarget.category : undefined)}</select>
        <div class="suggest-note" id="categorySuggestNote" style="display:none;"></div>
        <label class="field-label" for="docExpiry">Expiry date (optional)</label>
        <div class="expiry-row">
          <input type="date" id="docExpiry" />
          <button type="button" class="icon-btn" id="docExpiryClearBtn">Clear</button>
        </div>
        <div class="suggest-note" id="expirySuggestNote" style="display:none;"></div>
        <div id="docReminderWrap" style="display:none;">
          <label class="field-label" for="docReminderDays">Remind me (days before expiry, optional)</label>
          <input type="text" id="docReminderDays" placeholder="e.g. 90, 30, 7" />
          <p class="field-hint">Default schedule: ${DEFAULT_REMINDER_SCHEDULE_LABEL}. Once expired, you'll hear about it every day until you archive it.</p>
        </div>
        <label class="field-label" for="docTags">Tags (optional)</label>
        <input type="text" id="docTags" placeholder="e.g. car, warranty, 2026" />
        <div class="error-text" id="addErr" style="display:none;"></div>
        <button class="primary" id="saveDocBtn">${renewalTarget ? 'Save & archive old document' : 'Save document'}</button>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('fileDrop').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileDrop').onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); document.getElementById('fileInput').click(); } };
    document.getElementById('docCategory').onchange = () => { categoryManuallyChanged = true; };
    syncReminderDaysEnabled('docExpiry', 'docReminderDays', 'docReminderWrap');
    document.getElementById('docExpiry').addEventListener('input', () => syncReminderDaysEnabled('docExpiry', 'docReminderDays', 'docReminderWrap'));
    document.getElementById('docExpiryClearBtn').onclick = () => {
      const input = document.getElementById('docExpiry');
      input.value = '';
      syncReminderDaysEnabled('docExpiry', 'docReminderDays', 'docReminderWrap');
    };
    document.getElementById('fileInput').onchange = async (e) => {
      const f = e.target.files[0];
      if(!f) return;
      pendingFile = f;
      pendingOcrText = '';
      pendingExpirySuggested = false;
      pendingCategorySuggested = false;
      pendingTitleSuggested = false;
      pendingFileBlockedReason = ''; // clears any block left over from a previously picked file
      const addErrEl = document.getElementById('addErr');
      if(addErrEl) addErrEl.style.display = 'none';
      const drop = document.getElementById('fileDrop');
      drop.textContent = f.name; drop.classList.add('has-file');
      document.getElementById('pdfNote').style.display = f.type === 'application/pdf' ? 'block' : 'none';
      // Deliberately doesn't disable Save while this runs — see saveDocument()'s own background-OCR
      // fallback below, which is what lets someone save immediately without waiting for on-device
      // OCR to finish at all. The progress bar and expiry/category suggestions are still worth
      // showing if they do wait, just not required to. The one exception is the PDF branch's own
      // brief disable below, which only lasts until we know the file actually opens — see its
      // comment for why that's a real guarantee, not just an optimistic race, without reintroducing
      // a wait for full OCR.
      if(f.type.startsWith('image/')){
        pendingOcrRunning = true;
        const dataUrl = await readFileAsDataURL(f);
        pendingOcrText = await runOcr(dataUrl, setOcrProgress);
        document.getElementById('ocrProgress').style.display = 'none';
        applyExpirySuggestionIfEmpty('docExpiry', 'expirySuggestNote', pendingOcrText);
        syncReminderDaysEnabled('docExpiry', 'docReminderDays', 'docReminderWrap');
        applyCategorySuggestionIfUntouched('docCategory', 'categorySuggestNote', pendingOcrText);
        applyTitleSuggestionIfEmpty('docTitle', 'titleSuggestNote', pendingOcrText);
        pendingOcrRunning = false;
      } else if(f.type === 'application/pdf'){
        pendingOcrRunning = true;
        // Held disabled only until runOcrOnPdfFile's onOpened callback fires — that's the fast
        // getDocument() parse/decrypt step, not the slow page-by-page OCR loop after it, so this
        // never waits on anything OCR itself would take a while on. Closes the narrow window where
        // a reflexively-fast tap on Save could otherwise land before a password-protected PDF has
        // even been detected as such — saveDocument() also checks pendingFileBlockedReason directly
        // as a second, synchronous backstop regardless of this button state.
        const saveBtn = document.getElementById('saveDocBtn');
        if(saveBtn) saveBtn.disabled = true;
        try{
          pendingOcrText = await runOcrOnPdfFile(f, setOcrProgress, () => { if(saveBtn) saveBtn.disabled = false; });
          applyExpirySuggestionIfEmpty('docExpiry', 'expirySuggestNote', pendingOcrText);
          syncReminderDaysEnabled('docExpiry', 'docReminderDays', 'docReminderWrap');
          applyCategorySuggestionIfUntouched('docCategory', 'categorySuggestNote', pendingOcrText);
          applyTitleSuggestionIfEmpty('docTitle', 'titleSuggestNote', pendingOcrText);
        } catch(err){
          if(err && err.name === 'PasswordException'){
            pendingFileBlockedReason = "This PDF is password-protected — remove the password and re-upload.";
            if(addErrEl){ addErrEl.textContent = pendingFileBlockedReason; addErrEl.style.display = 'block'; }
            // saveBtn stays disabled — onOpened never fired for a file that never actually opened.
          } else {
            console.error('PDF OCR failed', err);
            if(saveBtn) saveBtn.disabled = false; // the file itself is fine, just OCR/text-extraction failed — still savable, same as before
          }
        }
        document.getElementById('ocrProgress').style.display = 'none';
        pendingOcrRunning = false;
      }
    };
    document.getElementById('saveDocBtn').onclick = saveDocument;
  }

        <label class="field-label" for="editExpiry">Expiry date (optional)</label>

          <p class="field-hint">Default schedule: ${DEFAULT_REMINDER_SCHEDULE_LABEL}. Once expired, you'll hear about it every day until you archive it.</p>
        </div>

        <div class="error-text" id="editErr" style="display:none;"></div>
        <button class="primary" id="saveEditBtn">Save changes</button>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('saveEditBtn').onclick = saveEditedDocument;
    document.getElementById('editExpiry').addEventListener('input', () => syncReminderDaysEnabled('editExpiry', 'editReminderDays', 'editReminderWrap'));
    document.getElementById('editExpiryClearBtn').onclick = () => {

  if(state.modal === 'confirmDelete'){

        // But leaving the form exactly as it looked pre-save reads as a silent failure — the PIN

        // update the existing DOM in place to say so before handing off to the biometric step.

        const titleEl = document.getElementById('lockSetupTitle');

      // different browser or a platform quirk, would otherwise leave the vault with no way back
      // in). Require the PIN to be saved first as its own explicit step, rather than silently

      if(!localStorage.getItem('vault-lock-pin-hash')){

    document.body.appendChild(overlay);

    const phraseInput = document.getElementById('deleteConfirmPhrase');
    const confirmBtn = document.getElementById('confirmDeleteAccountBtn');
    phraseInput.oninput = () => { confirmBtn.disabled = phraseInput.value.trim() !== 'DELETE'; };
    confirmBtn.onclick = deleteEverything;
  }

  const sheetEl = overlay.querySelector('.modal-sheet');
  if(sheetEl){
    sheetEl.setAttribute('role', 'dialog');

    // Generic across every modal rather than hand-wiring each one's own <h3> with a unique id — only
    // one modal is ever open at a time, so a single shared id here is always safe, and this is what

    const heading = sheetEl.querySelector('h3');
    if(heading){

    if(focusTarget) focusTarget.focus();
  }
}

function applyExpirySuggestionIfEmpty(inputId, noteId, ocrText){
  const input = document.getElementById(inputId);
  const note = document.getElementById(noteId);
  if(!input || pendingExpirySuggested || input.value) return;
  const guess = guessExpiryDate(ocrText);
  if(guess){
    input.value = guess;
    pendingExpirySuggested = true;
    if(note){ note.textContent = 'Expiry date suggested from the scan — double-check it before saving.'; note.style.display = 'block'; }
  }
}

// A <select> always has SOME value (unlike the expiry input, which starts empty), so "should this
// suggestion apply" can't be answered by checking the current value the way applyExpirySuggestion-
// IfEmpty does — categoryManuallyChanged tracks whether the user has actually touched the dropdown
// themselves since this modal opened, via the 'change' listener wired alongside this call.
function applyCategorySuggestionIfUntouched(selectId, noteId, ocrText){
  const select = document.getElementById(selectId);
  const note = document.getElementById(noteId);
  if(!select || pendingCategorySuggested || categoryManuallyChanged) return;
  const guess = guessCategory(ocrText);
  if(guess){
    select.value = guess;
    pendingCategorySuggested = true;
    if(note){ note.textContent = "Category suggested from the scan — change it if that's not right."; note.style.display = 'block'; }
  }
}

// Same plain "input.value is empty" guard as applyExpirySuggestionIfEmpty above (not the
// category one's separate manually-changed flag) — a text input's emptiness is itself enough
// signal for "untouched", and it's exactly what already keeps this from overwriting a title the
// user typed themselves, or a renewal flow's pre-filled title (openAddModalForRenewal/
// openCameraModalForRenewal both pre-fill docTitle/camTitle before OCR ever runs).
function applyTitleSuggestionIfEmpty(inputId, noteId, ocrText){
  const input = document.getElementById(inputId);
  const note = document.getElementById(noteId);
  if(!input || pendingTitleSuggested || input.value) return;
  const guess = guessTitle(ocrText);
  if(guess){
    input.value = guess;
    pendingTitleSuggested = true;
    if(note){ note.textContent = "Title suggested from the scan — edit it if that's not right."; note.style.display = 'block'; }
  }
}

function setUploadProgress(pct){

async function saveDocument(){
  const title = document.getElementById('docTitle').value.trim();
  const category = document.getElementById('docCategory').value;
  const expiry = document.getElementById('docExpiry').value;
  // A reminder schedule with no expiry to count down to doesn't mean anything — the field is kept
  // disabled/cleared while expiry is empty (see syncReminderDaysEnabled), this is the save-time
  // backstop against that same case.
  const reminderDays = expiry ? parseReminderDaysInput(document.getElementById('docReminderDays').value) : null;
  const tags = parseTagsInput(document.getElementById('docTags').value);
  const errEl = document.getElementById('addErr');
  const saveBtn = document.getElementById('saveDocBtn');
  const renewalTargetId = state.renewalUploadTargetId;
  const defaultBtnLabel = renewalTargetId ? 'Save & archive old document' : 'Save document';

  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  if(!pendingFile){ errEl.textContent='Choose a file.'; errEl.style.display='block'; return; }
  // Synchronous backstop, independent of the Save button's disabled attribute (see the fileInput
  // onchange handler's PDF branch) — a password-protected PDF can't be previewed, OCR'd, or
  // searched once saved, so this refuses to store one no matter how Save ended up getting triggered.
  if(pendingFileBlockedReason){ errEl.textContent = pendingFileBlockedReason; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  // Captured before anything below can change it — if OCR hadn't finished the moment Save was
  // clicked, pendingOcrText passed to finalizeAndStoreDocument() is whatever partial/empty text
  // existed at that instant, not necessarily the final result (OCR keeps running independently of
  // this save). extractTextForDocument() re-reads the saved file fresh once OCR (whenever it
  // actually finishes) is done, and is the source of truth for this case either way.
  const needsBackgroundOcr = pendingOcrRunning;

  try{
    const newDoc = await finalizeAndStoreDocument({title, category, expiry, reminderDays, tags, blob: pendingFile, mimeType: pendingFile.type, ocrText: pendingOcrText, onUploadProgress: setUploadProgress});
    state.renewalUploadTargetId = null;
    closeModal();
    if(renewalTargetId){
      const linked = await linkRenewalAndArchiveOld(renewalTargetId, newDoc.id);
      toast(linked ? 'Renewed — old document archived' : 'Saved, but the old document needs archiving manually');
    } else {
      toast(needsBackgroundOcr ? 'Saved — reading text on-device in the background' : (pendingOcrText ? 'Saved and indexed' : 'Saved'));
    }
    if(needsBackgroundOcr) extractTextForDocument(newDoc.id, true);
  } catch(e){
    // Without this, any failure here (a huge file, a Drive error, OCR erroring in a way runOcr
    // didn't already catch) left the button stuck on "Saving…" with no way to retry.
    console.error('Save failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = defaultBtnLabel;
  }
}

// Links a just-uploaded replacement to the document it replaces (supersedes/supersededBy, both
// directions — see confirmRenewExpired) and archives the old one. Kept separate from
// finalizeAndStoreDocument's own try/catch: by the time this runs, the new file is already safely
// saved, so a failure here is "archive the old one yourself" territory, not a failed save.
async function linkRenewalAndArchiveOld(oldId, newId){
  const oldDoc = state.documents.find(d => d.id === oldId);
  const newDoc = state.documents.find(d => d.id === newId);
  if(!oldDoc || !newDoc) return false;
  const archivedAt = new Date().toISOString();
  oldDoc.archived = true; oldDoc.archivedAt = archivedAt; oldDoc.supersededBy = newDoc.id;
  newDoc.supersedes = oldDoc.id;
  try{
    const batch = db.batch();
    batch.update(userDoc().collection('documents').doc(oldDoc.id), {archived: true, archivedAt, supersededBy: newDoc.id});
    batch.update(userDoc().collection('documents').doc(newDoc.id), {supersedes: oldDoc.id});
    await batch.commit();
    render();
    return true;
  } catch(e){
    console.error('Failed to link renewal / archive old document', e);
    oldDoc.archived = false; oldDoc.archivedAt = null; oldDoc.supersededBy = null;
    newDoc.supersedes = null;
    render();
    return false;
  }
}

async function finalizeAndStoreDocument({title, category, expiry, reminderDays, tags, blob, mimeType, ocrText, onUploadProgress}){
  const cat = categoryFor(category);
  const id = 'doc_' + Date.now();
  const filename = safeFilename(title, mimeType);
  const driveFileId = await driveUpload(blob, filename, mimeType, cat.driveFolderId, onUploadProgress);
  const doc = {
    id, title, category: cat.id, expiry: expiry || null, reminderDays: reminderDays || null,
    tags: tags || [],
    driveFileId, mimeType, size: blob.size || 0,
    ocrText: ocrText || '',
    addedAt: new Date().toISOString(),
    archived: false,
    // Governs only THIS document, fixed at creation time — a category's keepOfflineDefault
    // changing later never reaches back to retroactively touch documents already created under it.
    keepOffline: !!cat.keepOfflineDefault
  };
  try{
    await persistDocument(doc);
  } catch(e){
    // The Firestore write failed after the Drive upload already succeeded — clean up the now-
    // orphaned Drive file (best-effort) rather than leaving it dangling, and don't add the
    // document to local state below: if it's not in Firestore, it isn't really saved, and the
    // UI shouldn't show it as if it were.
    try{ await driveDelete(driveFileId); } catch(cleanupErr){ console.error('Could not clean up orphaned Drive file', cleanupErr); }
    throw e;
  }
  state.documents.unshift(doc);
  // A category with "keep offline by default" on means THIS exact moment — right after upload —
  // is when the new document should actually become available offline, not just flagged as such in
  // its metadata until autoDownloadKeepOfflineDocuments happens to run on some later full reload.
  // The blob is already in memory from the upload above, so this is a local IndexedDB write, not a
  // second network round trip — cheap enough to await so the very next render already shows it
  // correctly as "Kept offline" instead of briefly (and incorrectly) looking uncached. A failure
  // here (e.g. storage quota) is non-fatal to the save itself, same as every other keep-offline
  // caching path — the document is already safely created either way.
  if(doc.keepOffline) await cacheDocumentOffline(doc, blob);
  return doc;
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => { const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
}

/* ---------- camera capture ---------- */
let pendingPageOcrTexts = []; // per-page OCR text, parallel to state.capturedPages — lets removing
                               // a page also cleanly drop just that page's text from pendingOcrText
// Every capturePage()/removeCapturedPage() call rebuilds this modal's whole innerHTML (to show the
// new thumbnail, or reflect a removed page), which would otherwise silently reset every text field
// back to its default each time — not just the category <select> this was originally written for.
// These track whatever's currently in each field (typed by hand or filled by a suggestion) so the
// template below can restore them across that rebuild; snapshotCamFormFields() reads the live DOM
// right before each renderModal() call, so anything typed since the last capture is preserved too,
// not just what a suggestion already wrote in.
let pendingCamTitle = '';
let pendingCamCategory = null;
let pendingCamExpiry = '';
let pendingCamReminderDaysText = '';
let pendingCamTagsText = '';
function snapshotCamFormFields(){
  const t = document.getElementById('camTitle'), c = document.getElementById('camCategory'),
        e = document.getElementById('camExpiry'), r = document.getElementById('camReminderDays'),
        g = document.getElementById('camTags');
  if(t) pendingCamTitle = t.value;
  if(c) pendingCamCategory = c.value;
  if(e) pendingCamExpiry = e.value;
  if(r) pendingCamReminderDaysText = r.value;
  if(g) pendingCamTagsText = g.value;
}
async function startCamera(){
  const video = document.getElementById('cameraVideo');
  // iOS force-terminates any in-page camera track the instant the tab/installed PWA is
  // backgrounded — locking the screen, switching apps, a call, Control Center, or the app's own
  // App-Lock grace timer firing while this modal is still open. state.cameraStream stays a
  // truthy MediaStream across that (nothing here used to ever notice), so without this check the
  // reuse path below would reattach a dead, permanently black/frozen stream on returning to the
  // foreground instead of asking for a fresh one.
  if(state.cameraStream){
    const track = state.cameraStream.getVideoTracks()[0];
    if(!track || track.readyState !== 'live') state.cameraStream = null;
  }
  if(state.cameraStream){
    // Every capture re-renders the modal, which rebuilds the <video> element from scratch — the
    // stream itself is still live, so reattach it instead of requesting a brand-new one from
    // getUserMedia each time, which would leak the previous stream's tracks running unseen.
    if(video) video.srcObject = state.cameraStream;
    return;
  }
  try{
    // aspectRatio is a request, not a guarantee — the displayed box stays a fixed size regardless
    // (see .camera-wrap's CSS), this just steers the negotiated stream closer to that box so
    // object-fit:cover has less to crop.
    //
    // width/height `ideal` matter a lot more than they look: with no resolution constraint at all,
    // browsers commonly negotiate a low default (often well under 1280x720) even on a camera
    // capable of several times that — capturePage() just captures whatever video.videoWidth/Height
    // the browser handed back, so a low-res stream here silently caps every photo's real clarity
    // regardless of how good the actual camera is. `ideal` (not `min`/exact) still degrades
    // gracefully on a camera that genuinely can't do this — it asks for the best available instead
    // of forcing a failure.
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', aspectRatio:{ideal: 3/4}, width:{ideal: 3000}, height:{ideal: 4000}}});
    // The camera modal (or the whole app, via the app-lock teardown) can close while this permission
    // prompt is still pending — unlike every other async modal-content loader here (viewDocument,
    // renderPdfInto), this one used to skip re-checking relevance after its await, so a stream
    // granted after the fact was stored and left running with nothing left to ever call
    // stopCamera() on it, live behind whatever's on screen now (including a locked device).
    if(state.modal !== 'camera'){ stream.getTracks().forEach(t => t.stop()); return; }
    state.cameraStream = stream;
    if(video) video.srcObject = state.cameraStream;
  } catch(e){
    const err = document.getElementById('camErr');
    if(err){ err.textContent = "Couldn't access the camera — check browser permissions."; err.style.display='block'; }
    const fallbackBtn = document.getElementById('camUploadFallbackBtn');
    if(fallbackBtn) fallbackBtn.style.display = '';
  }
}
function stopCamera(){
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(t=>t.stop()); state.cameraStream = null; }
}

  pendingCamReminderDaysText = ''; pendingCamTagsText = ''; pendingOcrRunning = false; pushAppHistoryState(); render();

// OpenCV.js is only needed for this one screen (the crop step's perspective correction), so it's
// loaded lazily on first use rather than blocking every app cold-start with an ~8MB script tag
// like the always-needed libraries loaded up in <head>. The service worker still caches it (see
// sw.js CACHE_FIRST_URLS) once it's been fetched once, so every use after the first works offline.
const OPENCV_JS_URL = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js';
let openCvScriptPromise = null;
function loadOpenCvScript(){
  if(openCvScriptPromise) return openCvScriptPromise;
  openCvScriptPromise = new Promise((resolve, reject) => {
    if(typeof cv !== 'undefined'){ resolve(); return; }
    const script = document.createElement('script');
    script.src = OPENCV_JS_URL;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('opencv_load_failed'));
    document.head.appendChild(script);
  });
  return openCvScriptPromise;
}
// Resolves once cv.Mat etc. are actually callable — the script loading is only step one; OpenCV.js
// then does its own async WASM compilation before it's ready (cv['onRuntimeInitialized']). Rejects
// after a timeout rather than hanging forever if that never fires (e.g. a corrupted cached response).
function waitForOpenCvReady(){
  return loadOpenCvScript().then(() => new Promise((resolve, reject) => {
    if(typeof cv === 'undefined'){ reject(new Error('opencv_unavailable')); return; }
    if(cv.Mat){ resolve(); return; }
    cv['onRuntimeInitialized'] = () => resolve();
    setTimeout(() => reject(new Error('opencv_timeout')), 20000);
  }));
}

// Standard "scan a document" contour pipeline: grayscale → blur → Canny edges → find the largest
// convex 4-point contour. Runs on a downscaled copy for speed (detection doesn't need full
// resolution), then scales the found points back up to the source image's own natural pixel space.
// Returns null (never throws past its own boundary) whenever nothing plausible is found — the
// crop screen's default centered box is always a safe fallback the user can still adjust by hand.
// cv.imread() on a live <img> element reads whatever size it's currently RENDERED at (CSS width/
// height), not its natural resolution — and the crop screen's <img> is deliberately shrunk to fit
// the modal (see .crop-stage img's max-width/max-height). Drawing it onto an offscreen canvas at
// its natural size first is what actually gets OpenCV the full-resolution pixels to work with.
function imageToNaturalCanvas(imgEl){
  const canvas = document.createElement('canvas');
  canvas.width = imgEl.naturalWidth;
  canvas.height = imgEl.naturalHeight;
  canvas.getContext('2d').drawImage(imgEl, 0, 0, canvas.width, canvas.height);
  return canvas;
}

// Automatic edge-detection (Canny + contour search via OpenCV.js) was tried here and removed: on
// real-world photos — uneven lighting, a desk/background close in color to the paper, a document
// not filling the frame — it routinely failed to find a clean 4-point contour and silently fell
// back to the plain centered default box below, which looks identical regardless of the actual
// photo. That read as "auto-crop always cropping the same predefined frame," which is exactly what
// was happening. Rather than keep tuning a classic CV heuristic blind (no way to test against real
// devices/lighting from here), the effort went into making the manual crop itself precise and easy
// to use instead — see the loupe in wireCropOverlay() below. Perspective correction (warpQuadToDataUrl)
// still runs on whatever quad the user ends up with, auto- or hand-placed, so straightening/deskew
// isn't lost — only the automatic guess at where the corners start is gone.

// Set by wireCropOverlay() so drag handlers can trigger a repaint without a full renderModal(),
// which would tear down the drag gesture state this same screen already owns.
let cropRepaintCurrentQuad = null;

// Loupe sizing: 110px wide, ZOOM 2.5x is enough to see exactly where an edge/corner sits relative to
// the document without the circle feeling cramped. It no longer needs its own offset from the touch
// point — CROP_HANDLE_OFFSET_* below already keeps the finger clear of the actual crop point, so the
// loupe just centers directly on it (see updateMagnifier).
const CROP_MAG_SIZE = 110, CROP_MAG_ZOOM = 2.5;

// A corner/edge handle is deliberately never placed exactly under the dragging finger: it floats a
// fixed distance toward the frame's center instead, so the point actually being placed — and the
// border on the far side of it — stays visible for the whole drag rather than living under the
// fingertip. The offset always points the same direction for a given handle (inward, toward the
// frame's middle), so unlike a finger-following loupe it never has to flip mid-gesture — a tl corner
// drags down-right of the finger the whole time, a top edge drags below it the whole time, and so
// on. DIAG is the per-axis offset for a free corner (actual on-screen distance is DIAG*sqrt(2) ≈
// 99px); AXIS is the single-axis offset for an edge handle, which only ever needs to clear the finger
// along one dimension.
const CROP_HANDLE_OFFSET_DIAG = 70, CROP_HANDLE_OFFSET_AXIS = 92;

// Wires the crop step's drag interactions: a default centered quad on first paint, a plain
// move-drag on the quad itself, a free per-corner drag on each corner handle — unlike an
// axis-aligned box, each corner moves independently so an angled photo can be corrected to its real
// edges, not just cropped to a straight rectangle — and an edge-midpoint drag on each of 4
// additional handles, which moves BOTH corners on that side together for nudging a whole edge at
// once. Each corner/edge handle also floats at a fixed inward offset from the actual dragging finger
// (see CROP_HANDLE_OFFSET_*/HANDLE_OFFSET below) — not just the loupe — so both the handle and the
// border stay visible for the whole drag instead of living under the fingertip; a loupe
// (showMagnifier/updateMagnifier below) then zooms in on that same offset point for extra precision.
// The stage is an inline-block
// wrapper sized to the image's own rendered box (see the .crop-stage CSS), so stage.clientWidth/
// Height are exactly the image's on-screen size and every point here lands directly in the image's
// own coordinate space — no letterboxing offset math needed.
//
// Drag updates are read-cached and rAF-batched: stage.clientWidth/Height never actually changes
// mid-drag, so re-reading it on every pointermove (once for clamping, again inside paintQuad, again
// inside updateMagnifier) was forcing a fresh synchronous layout reflow each time a DOM write from
// an earlier read-write pair in the same tick invalidated the browser's cached layout — classic
// layout thrashing, and the direct cause of the drag feeling laggy. It's read once per gesture
// (onPointerDown) instead. Separately, raw pointermove can fire faster than the display repaints
// (touchscreens routinely report 60-120Hz), so doing a full paint+reflow on every single event was
// also just wasted work between frames — the handler now only records the latest pointer position
// and lets one requestAnimationFrame per frame do the actual quad/paint/magnifier update.
function wireCropOverlay(){
  waitForOpenCvReady().catch(() => {}); // warm OpenCV early so it's ready by the time confirmCrop() needs it for perspective correction
  const img = document.getElementById('cropImage');
  const stage = document.getElementById('cropStage');
  const svg = document.getElementById('cropMask');
  const maskPath = document.getElementById('cropMaskPath');
  const quadPoly = document.getElementById('cropQuadPoly');
  const handles = {
    tl: stage.querySelector('.crop-handle[data-handle="tl"]'),
    tr: stage.querySelector('.crop-handle[data-handle="tr"]'),
    bl: stage.querySelector('.crop-handle[data-handle="bl"]'),
    br: stage.querySelector('.crop-handle[data-handle="br"]')
  };
  // Edge-midpoint handles: dragging one moves BOTH corners on that edge together (by the same
  // delta), for nudging a whole side into place rather than one corner at a time — each maps to
  // the two corners it actually moves.
  const edgeHandles = {
    top: stage.querySelector('.crop-handle[data-handle="top"]'),
    right: stage.querySelector('.crop-handle[data-handle="right"]'),
    bottom: stage.querySelector('.crop-handle[data-handle="bottom"]'),
    left: stage.querySelector('.crop-handle[data-handle="left"]')
  };
  const EDGE_CORNERS = {top: ['tl', 'tr'], right: ['tr', 'br'], bottom: ['bl', 'br'], left: ['tl', 'bl']};
  // Fixed, inward-pointing offset per handle — see the comment on CROP_HANDLE_OFFSET_DIAG/AXIS above.
  const D = CROP_HANDLE_OFFSET_DIAG, A = CROP_HANDLE_OFFSET_AXIS;
  const HANDLE_OFFSET = {
    tl: {x: D, y: D}, tr: {x: -D, y: D}, bl: {x: D, y: -D}, br: {x: -D, y: -D},
    top: {x: 0, y: A}, bottom: {x: 0, y: -A}, left: {x: A, y: 0}, right: {x: -A, y: 0}
  };
  // The offset above can't just be added unconditionally: a corner sitting near the stage's own
  // edge (e.g. cropping right up against the actual left edge of the document) needs the finger to
  // land at raw-position + offset past that edge to place it there — but on a real touchscreen the
  // stage very often runs almost flush with the screen's own edge, so there is no physical room for
  // a finger to go that far past it. Without this, those positions were simply unreachable (reported
  // as "can't drag to the left-most corner"). Instead of a flat add, the offset ramps down to 0 over
  // exactly its own magnitude as the raw (un-offset) point nears the edge the offset points away
  // from, so the handle can still land exactly on that edge — it just coincides with the finger
  // there, same as before this whole feature, instead of asking the finger to leave the screen.
  function reachableOffset(p, o, extent){
    if(!o) return 0;
    if(o > 0) return o * clamp(p / o, 0, 1);
    return o * clamp((extent - p) / (-o), 0, 1);
  }
  const magnifier = document.getElementById('cropMagnifier');
  const magnifierTail = document.getElementById('cropMagnifierTail');
  if(state.cropEnhanceOn) img.style.filter = ENHANCE_FILTER;
  // Set once, here, instead of on every showMagnifier() call — this is the actual, measured root
  // cause of "first touch on a crop handle feels laggy" (confirmed by direct timing, not guessed):
  // a real phone photo's data: URL can run into the many-megabytes range, and assigning THAT full
  // string to a CSS background-image is a genuinely slow, synchronous, string-length-proportional
  // operation — NOT a cheap property set, and NOT something the browser skips on repeat identical
  // assignments either (measured as consistently slow on every call, not just the first). The
  // previous fix attempt (warming OpenCV.js earlier) targeted the wrong cost entirely — OpenCV's
  // compile has nothing to do with this drag interaction at all; it's only ever used later, by
  // confirmCrop()'s perspective correction. Doing this assignment once, here, during setup (which
  // already has some slack before the user's first touch, same reasoning as that OpenCV warm-up)
  // means onPointerDown's first (and every) call to showMagnifier() below is just a display toggle.
  if(magnifier) magnifier.style.backgroundImage = `url("${state.cropSourceDataUrl}")`;

  // Cached once per gesture (onPointerDown) / once at initial layout (initQuad), not re-read on
  // every pointermove — see the note above. The SVG viewBox only depends on this, so it's set here
  // too rather than redundantly on every paintQuad() call.
  let stageW = 0, stageH = 0;
  function refreshStageSize(){
    stageW = stage.clientWidth; stageH = stage.clientHeight;
    svg.setAttribute('viewBox', '0 0 ' + stageW + ' ' + stageH);
  }

  function paintQuad(){
    const q = state.cropQuad;
    const w = stageW, h = stageH;
    maskPath.setAttribute('d',
      'M0,0 H' + w + ' V' + h + ' H0 Z ' +
      'M' + q.tl.x + ',' + q.tl.y + ' L' + q.bl.x + ',' + q.bl.y + ' L' + q.br.x + ',' + q.br.y + ' L' + q.tr.x + ',' + q.tr.y + ' Z');
    quadPoly.setAttribute('points', q.tl.x + ',' + q.tl.y + ' ' + q.tr.x + ',' + q.tr.y + ' ' + q.br.x + ',' + q.br.y + ' ' + q.bl.x + ',' + q.bl.y);
    Object.keys(handles).forEach(k => { handles[k].style.left = q[k].x + 'px'; handles[k].style.top = q[k].y + 'px'; });
    Object.keys(edgeHandles).forEach(k => {
      const [a, b] = EDGE_CORNERS[k];
      edgeHandles[k].style.left = (q[a].x + q[b].x) / 2 + 'px';
      edgeHandles[k].style.top = (q[a].y + q[b].y) / 2 + 'px';
    });
  }
  cropRepaintCurrentQuad = paintQuad;

  function defaultQuad(){
    const w = stageW, h = stageH;
    const mx = w * 0.05, my = h * 0.05; // centered box, 5% margin each side — same as the old default
    return {tl: {x: mx, y: my}, tr: {x: w - mx, y: my}, bl: {x: mx, y: h - my}, br: {x: w - mx, y: h - my}};
  }
  function initQuad(){
    if(state.cropQuad){ refreshStageSize(); paintQuad(); return; }
    // A data: URL image can already have img.complete===true (no network fetch needed to decode
    // it) before the browser has actually LAID OUT this freshly-inserted element — reading
    // clientWidth/Height synchronously at that exact point can still see 0, collapsing the whole
    // default quad onto a single point. A single requestAnimationFrame is only guaranteed to run
    // before the NEXT paint, not after one has actually happened yet — nesting a second one inside
    // the first is the standard way to guarantee a real layout/paint has completed first, regardless
    // of which of the two paths below reached here.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if(state.cropQuad) return;
      refreshStageSize();
      state.cropQuad = defaultQuad();
      paintQuad();
    }));
  }
  if(img.complete && img.naturalWidth) initQuad(); else img.onload = initQuad;

  let dragMode = null; // 'move' | 'tl' | 'tr' | 'bl' | 'br' | 'top' | 'right' | 'bottom' | 'left' | null
  let startPointer = {x: 0, y: 0};
  let startQuad = null;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));

  // The point the loupe should mirror: a corner handle's own point, or an edge handle's midpoint
  // between the two corners it drags together — i.e. wherever the visible handle actually sits.
  function dragPointFor(mode, quad){
    if(EDGE_CORNERS[mode]){
      const [a, b] = EDGE_CORNERS[mode];
      return {x: (quad[a].x + quad[b].x) / 2, y: (quad[a].y + quad[b].y) / 2};
    }
    return quad[mode];
  }
  function showMagnifier(){
    if(!magnifier) return;
    magnifier.style.opacity = '1';
    if(magnifierTail) magnifierTail.style.opacity = '1';
  }
  function hideMagnifier(){
    if(magnifier) magnifier.style.opacity = '0';
    if(magnifierTail) magnifierTail.style.opacity = '0';
  }
  function updateMagnifier(pt){
    if(!magnifier) return;
    const half = CROP_MAG_SIZE / 2;
    let mx = clamp(pt.x, half, stageW - half);
    let my = clamp(pt.y, half, stageH - half);
    magnifier.style.left = (mx - half) + 'px';
    magnifier.style.top = (my - half) + 'px';
    magnifier.style.backgroundSize = (stageW * CROP_MAG_ZOOM) + 'px ' + (stageH * CROP_MAG_ZOOM) + 'px';
    magnifier.style.backgroundPosition = (-(pt.x * CROP_MAG_ZOOM - half)) + 'px ' + (-(pt.y * CROP_MAG_ZOOM - half)) + 'px';
    // The tether from the loupe's edge to the actual touch point — see .crop-magnifier-tail's own
    // comment for why this exists. mx/my (the loupe's CENTER, already clamped above) and pt (the
    // real touch point) are rarely a clean vertical line once clamping has shifted the loupe away
    // from directly above/below the point (near the stage's left/right edges) — computing the real
    // angle rather than assuming "always straight down" keeps the line actually pointing at pt in
    // that case instead of visibly missing it.
    if(magnifierTail){
      const dx = pt.x - mx, dy = pt.y - my;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      const edgeX = mx + Math.cos(angle * Math.PI / 180) * half;
      const edgeY = my + Math.sin(angle * Math.PI / 180) * half;
      magnifierTail.style.left = edgeX + 'px';
      magnifierTail.style.top = edgeY + 'px';
      magnifierTail.style.width = Math.max(0, dist - half) + 'px';
      magnifierTail.style.transform = `rotate(${angle}deg)`;
    }
  }

  function onPointerDown(mode, e){
    e.preventDefault(); e.stopPropagation();
    dragMode = mode;
    startPointer = {x: e.clientX, y: e.clientY};
    startQuad = JSON.parse(JSON.stringify(state.cropQuad));
    refreshStageSize(); // stage size is fixed for the whole gesture — one read here, reused for every move
    // Guarded: a capture request can be rejected (e.g. the pointer already went away between this
    // event being queued and handled) — losing capture just means a finger that drifts outside the
    // stage mid-gesture stops being tracked a little sooner than ideal, not a reason to abort the
    // whole drag over.
    try{ stage.setPointerCapture(e.pointerId); } catch(err){}
    // No loupe for a whole-quad move — there's no single precise point to zoom in on, and the
    // finger isn't hiding an edge/corner the way it does for the other drag modes.
    if(mode !== 'move'){
      latestDx = 0; latestDy = 0;
      applyDragMove(); // snaps the handle straight to its offset position, before any finger movement
      showMagnifier();
    }
  }
  quadPoly.addEventListener('pointerdown', (e) => onPointerDown('move', e));
  Object.keys(handles).forEach(k => handles[k].addEventListener('pointerdown', (e) => onPointerDown(k, e)));
  Object.keys(edgeHandles).forEach(k => edgeHandles[k].addEventListener('pointerdown', (e) => onPointerDown(k, e)));

  // Keyboard equivalent of a drag — every handle now carries tabindex="0" (see the crop screen's
  // markup) so a keyboard-only user (no mouse/trackpad) can actually adjust an imperfect
  // auto-detected quad instead of only being able to accept it as-is or abandon the crop entirely.
  // No HANDLE_OFFSET here: that offset exists purely to keep a dragging FINGER clear of the point it
  // controls — there's no finger to keep clear of on a keyboard nudge, so this moves the point
  // directly, straight to the pressed position.
  const CROP_KEY_STEP = 4, CROP_KEY_STEP_FAST = 20; // Shift held = a bigger jump per press
  const ARROW_KEY_DELTA = {ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0]};
  function onHandleKeyDown(mode, e){
    const dir = ARROW_KEY_DELTA[e.key];
    if(!dir) return;
    e.preventDefault();
    refreshStageSize();
    const step = e.shiftKey ? CROP_KEY_STEP_FAST : CROP_KEY_STEP;
    const dx = dir[0] * step, dy = dir[1] * step;
    if(EDGE_CORNERS[mode]){
      const [a, b] = EDGE_CORNERS[mode];
      state.cropQuad = {...state.cropQuad,
        [a]: {x: clamp(state.cropQuad[a].x + dx, 0, stageW), y: clamp(state.cropQuad[a].y + dy, 0, stageH)},
        [b]: {x: clamp(state.cropQuad[b].x + dx, 0, stageW), y: clamp(state.cropQuad[b].y + dy, 0, stageH)}
      };
    } else {
      state.cropQuad = {...state.cropQuad, [mode]: {
        x: clamp(state.cropQuad[mode].x + dx, 0, stageW),
        y: clamp(state.cropQuad[mode].y + dy, 0, stageH)
      }};
    }
    paintQuad();
  }
  Object.keys(handles).forEach(k => handles[k].addEventListener('keydown', (e) => onHandleKeyDown(k, e)));
  Object.keys(edgeHandles).forEach(k => edgeHandles[k].addEventListener('keydown', (e) => onHandleKeyDown(k, e)));

  // The actual per-frame work: compute the new quad from the latest recorded pointer delta, paint
  // it, and update the loupe. Runs at most once per animation frame (scheduled below), regardless
  // of how many raw pointermove events arrived since the last one.
  let latestDx = 0, latestDy = 0, moveRafPending = false;
  function applyDragMove(){
    moveRafPending = false;
    if(!dragMode) return; // the drag may have already ended by the time this frame runs
    const dx = latestDx, dy = latestDy;
    if(dragMode === 'move'){
      // Clamp the whole quad's bounding box, same spirit as the old rectangle's move-drag, so it
      // can't be dragged off the edge of the image.
      const xs = Object.values(startQuad).map(p => p.x), ys = Object.values(startQuad).map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const cdx = clamp(dx, -minX, stageW - maxX), cdy = clamp(dy, -minY, stageH - maxY);
      const q = {};
      Object.keys(startQuad).forEach(k => { q[k] = {x: startQuad[k].x + cdx, y: startQuad[k].y + cdy}; });
      state.cropQuad = q;
    } else if(EDGE_CORNERS[dragMode]){
      // An edge handle moves its two corners together, by the same delta — nudging a whole side
      // (e.g. correcting a wonky top edge) without disturbing the other two corners at all. Each
      // corner is still clamped individually, so one side of the pair hitting the stage edge
      // doesn't block the other from continuing to move. HANDLE_OFFSET shifts both by the same
      // amount, inward, so the edge itself renders clear of the dragging finger — the shared delta is
      // computed once from the edge's own midpoint (reachableOffset), so both corners shift in
      // parallel rather than skewing relative to each other.
      const [a, b] = EDGE_CORNERS[dragMode];
      const off = HANDLE_OFFSET[dragMode];
      const pax = startQuad[a].x + dx, pay = startQuad[a].y + dy;
      const pbx = startQuad[b].x + dx, pby = startQuad[b].y + dy;
      const deltaX = reachableOffset((pax + pbx) / 2, off.x, stageW);
      const deltaY = reachableOffset((pay + pby) / 2, off.y, stageH);
      state.cropQuad = {...state.cropQuad,
        [a]: {x: clamp(pax + deltaX, 0, stageW), y: clamp(pay + deltaY, 0, stageH)},
        [b]: {x: clamp(pbx + deltaX, 0, stageW), y: clamp(pby + deltaY, 0, stageH)}
      };
    } else {
      // A single corner follows the pointer, clamped to the stage bounds — free-form, not
      // constrained to a rectangle, which is the whole point of a real scanner-style crop. Offset
      // inward by HANDLE_OFFSET (via reachableOffset) so the corner itself renders clear of the
      // dragging finger without making the stage's own edges undraggable-to.
      const off = HANDLE_OFFSET[dragMode];
      const px = startQuad[dragMode].x + dx, py = startQuad[dragMode].y + dy;
      state.cropQuad = {...state.cropQuad, [dragMode]: {
        x: clamp(px + reachableOffset(px, off.x, stageW), 0, stageW),
        y: clamp(py + reachableOffset(py, off.y, stageH), 0, stageH)
      }};
    }
    paintQuad();
    if(dragMode !== 'move') updateMagnifier(dragPointFor(dragMode, state.cropQuad));
  }

  stage.addEventListener('pointermove', (e) => {
    if(!dragMode) return;
    latestDx = e.clientX - startPointer.x;
    latestDy = e.clientY - startPointer.y;
    if(!moveRafPending){
      moveRafPending = true;
      requestAnimationFrame(applyDragMove);
    }
  });
  const endDrag = () => { dragMode = null; hideMagnifier(); };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
}

// Grabs the raw video frame and opens the crop step on it rather than storing it directly — OCR
// and the suggestion logic that used to run right here now run at the end of confirmCrop() instead,
// on the cropped/enhanced pixels, which is a free accuracy improvement (no background/margins).
// ImageCapture.takePhoto() can return a meaningfully higher-resolution still than the live video
// stream itself provides, on browsers/devices that support it — many phone cameras have a separate,
// higher-resolution "photo" mode distinct from whatever resolution they stream continuous video at,
// and getUserMedia's own width/height constraints only ever steer the latter. Falls back to the
// plain video-frame-to-canvas capture (the only thing this ever did before) on anything that
// doesn't support it — notably iOS Safari — so this can only ever match or beat that, never do worse.
async function captureFrameAsDataUrl(video){
  try{
    const track = state.cameraStream && state.cameraStream.getVideoTracks()[0];
    if(track && typeof ImageCapture !== 'undefined'){
      const capture = new ImageCapture(track);
      const blob = await capture.takePhoto();
      return await readFileAsDataURL(blob);
    }
  } catch(e){
    console.warn('ImageCapture.takePhoto() unavailable — using the live video frame instead.', e);
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  return canvas.toDataURL('image/jpeg', 0.9);
}

async function capturePage(){
  const video = document.getElementById('cameraVideo');
  if(!video || !video.videoWidth) return;
  snapshotCamFormFields();
  const dataUrl = await captureFrameAsDataUrl(video);
  state.cropIndex = state.capturedPages.length; // "append" position — not pushed yet
  state.cropSourceDataUrl = dataUrl;
  state.cropEnhanceOn = true;
  state.cropQuad = null; // computed on first paint, once the image's on-screen size is known
  renderModal();
}

// Re-opens the crop step for an already-captured page, seeded from its untouched original capture
// rather than its current (possibly already cropped/enhanced) stored image — otherwise repeated
// edits would compound quality loss each time.
function openCropForExistingPage(index){
  state.cropIndex = index;
  state.cropSourceDataUrl = state.capturedPagesRaw[index];
  state.cropEnhanceOn = !!state.capturedPageEnhance[index];
  state.cropQuad = null; // re-editing starts from a fresh centered quad, not the exact previous one
  renderModal();
}

const ENHANCE_FILTER = 'contrast(1.4) brightness(1.08) saturate(0.9)';

// Perspective-warps the quad's 4 corners (in true source pixels) to a flat rectangle via OpenCV —
// this is what actually straightens an angled photo, not just crops it. Output size is picked from
// the quad's own longest top/bottom and left/right edges (the standard "scan a document" sizing
// heuristic), so a near-rectangular quad produces an output close to its own real resolution.
// Returns null whenever OpenCV isn't available/ready — confirmCrop() below always falls back to a
// plain bounding-box crop in that case, so the feature keeps working, online or off, just without
// the deskew.
async function warpQuadToDataUrl(img, quadNatural, enhanceOn){
  if(typeof cv === 'undefined' || !cv.Mat) return null;
  const cleanup = [];
  const track = (m) => { cleanup.push(m); return m; };
  try{
    const src = track(cv.imread(imageToNaturalCanvas(img)));
    const {tl, tr, bl, br} = quadNatural;
    const widthTop = Math.hypot(tr.x - tl.x, tr.y - tl.y);
    const widthBottom = Math.hypot(br.x - bl.x, br.y - bl.y);
    const heightLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
    const heightRight = Math.hypot(br.x - tr.x, br.y - tr.y);
    const outW = Math.max(1, Math.round(Math.max(widthTop, widthBottom)));
    const outH = Math.max(1, Math.round(Math.max(heightLeft, heightRight)));

    const srcTri = track(cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]));
    const dstTri = track(cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW, 0, outW, outH, 0, outH]));
    const M = track(cv.getPerspectiveTransform(srcTri, dstTri));
    const dst = track(new cv.Mat());
    cv.warpPerspective(src, dst, M, new cv.Size(outW, outH), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

    const warpedCanvas = document.createElement('canvas');
    warpedCanvas.width = outW; warpedCanvas.height = outH;
    cv.imshow(warpedCanvas, dst);
    if(!enhanceOn) return warpedCanvas.toDataURL('image/jpeg', 0.92);
