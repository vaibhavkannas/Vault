function openQuickRefForm(id){ state.modal = 'quickRefForm'; state.editQuickRefId = id; pushAppHistoryState(); render(); }

async function saveQuickRef(){
  const label = document.getElementById('qrLabelInput').value.trim();
  const value = document.getElementById('qrValueInput').value;
  const errEl = document.getElementById('qrFormErr');
  const saveBtn = document.getElementById('saveQrBtn');
  if(!label){ errEl.textContent = 'Enter a label.'; errEl.style.display = 'block'; return; }
  if(!value){ errEl.textContent = 'Enter a value.'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  const existing = state.editQuickRefId ? state.quickRefs.find(r => r.id === state.editQuickRefId) : null;
  const ref = existing
    ? {...existing, label, value}
    : {id: 'qr_' + Date.now(), label, value, addedAt: new Date().toISOString()};
  // Whole-file write: state.quickRefs is already fully loaded in memory (see loadUserData()), so
  // building the complete next-items array here and overwriting quickrefs.json with it in one go
  // is the "read-modify-write" a single shared JSON file (rather than one Firestore doc per entry)
  // requires.
  const nextItems = existing ? state.quickRefs.map(r => r.id === ref.id ? ref : r) : [ref, ...state.quickRefs];
  try{
    state.quickRefsDriveFileId = await saveQuickRefsToDrive(nextItems, state.quickRefsDriveFileId);
    if(existing) Object.assign(existing, ref);
    else state.quickRefs.unshift(ref);
    cacheQuickRefsOffline(state.quickRefs);
    closeModal();
    toast(existing ? 'Updated' : 'Saved');
  } catch(e){
    console.error('Failed to save quick reference', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
}

function requestDeleteQuickRef(id){ state.modal = 'confirmDeleteQuickRef'; state.editQuickRefId = id; pushAppHistoryState(); render(); }
async function confirmDeleteQuickRef(){
  const id = state.editQuickRefId;
  const before = state.quickRefs;
  const beforeFileId = state.quickRefsDriveFileId;
  state.quickRefs = state.quickRefs.filter(r => r.id !== id);
  state.revealedQuickRefIds.delete(id);
  closeModal();
  toast('Deleted');
  try{
    // state.quickRefs here is already the post-filter array (the filter ran above) — exactly what
    // should replace quickrefs.json.
    state.quickRefsDriveFileId = await saveQuickRefsToDrive(state.quickRefs, beforeFileId);
    cacheQuickRefsOffline(state.quickRefs);
  } catch(e){
    console.error('Failed to delete quick reference', e);
    state.quickRefs = before;
    state.quickRefsDriveFileId = beforeFileId;
    render();
    toast(friendlyCloudError(e));
  }
}

function renderVault(app){
  if(state.showDeleted) return renderDeletedView(app);
  // Soft-deleted documents (see confirmDeleteDocument/runArchiveCleanup) never show in the normal
  // active/archived views regardless of their archived flag — they only ever appear in the
  // "Recently deleted" view above.
  const visibleDocs = state.documents.filter(d => !d.deletedAt).filter(d => !!d.archived === state.showArchived);
  const filtered = visibleDocs.map(d => ({...d, ...matchesSearch(d)})).filter(d => d.match);
  const upcoming = state.documents
    .filter(d => d.expiry && !d.archived && !d.deletedAt)
    .map(d => ({...d, days: daysUntil(d.expiry)}))
    .filter(d => d.days<=60 && d.days>=-EXPIRED_REMINDER_GRACE_DAYS)
    .sort((a,b)=>a.days-b.days);

  // Pinned documents get their own section above everything else, including Renewals — unlike
  // Renewals (system-computed from expiry dates), a pin is the user's own explicit "I reach for
  // this one" signal, so it takes priority. Also still shown in their own category section below
  // (categories collapse by default now, so the repeat costs nothing visually until someone
  // expands that section) — excluding pinned docs from their category used to mean pinning your
  // only document in a category made that category vanish from the list entirely, since its count
  // was computed only from unpinned docs.
  const pinnedDocs = filtered.filter(d => d.pinned);

  const grouped = {};
  filtered.forEach(d => { (grouped[d.category] = grouped[d.category] || []).push(d); });
  const knownCatOrder = state.categories.map(c=>c.id).filter(c => grouped[c] && grouped[c].length);
  // Categories aren't part of the offline cache (see the offline document cache section above) —
  // in offline mode state.categories is empty, which would otherwise silently drop every document
  // from view here even though `grouped` has them. Anything left over renders under whatever
  // categoryFor()'s own fallback resolves to, rather than vanishing.
  const leftoverCats = Object.keys(grouped).filter(c => !knownCatOrder.includes(c));
  const catOrder = knownCatOrder.concat(leftoverCats);

  const archivedCount = state.documents.filter(d => d.archived && !d.deletedAt).length;
  const deletedCount = state.documents.filter(d => d.deletedAt).length;

  app.innerHTML = `
    <header class="topbar">
      <div class="brand"><div class="brand-mark">${brandMarkSvg(20)}</div><div class="brand-name">Vault</div><span class="conn-indicator ${isAppOnline() ? 'online' : 'offline'}" title="${isAppOnline() ? 'Online' : 'Offline'}" aria-label="${isAppOnline() ? 'Online' : 'Offline'}"></span></div>

        <button class="icon-only-btn" id="openSettingsBtn" aria-label="Settings" title="Settings">${icon('settings',22)}</button>
      </div>
    </header>
    <div class="vault">
      ${state.isOfflineMode ? `
        <div class="reminder-card">
          <span class="rtitle">You're offline — only documents you've viewed before can be opened</span>
          <button class="icon-btn" id="reconnectDriveBtn">Retry</button>
        </div>
      ` : !driveTokenValid() ? `
        <div class="reminder-card urgent">
          <span class="rtitle">Google Drive connection expired</span>
          <button class="icon-btn" id="reconnectDriveBtn">Reconnect</button>
        </div>
      ` : ''}
      <div class="search-bar">
        <span class="sicon">${icon('search',18)}</span>
        <input type="text" id="searchInput" placeholder="Search titles or text inside documents" value="${escapeHtml(state.searchQuery)}" />
        ${state.searchQuery ? `<button type="button" class="search-clear" id="searchClearBtn" aria-label="Clear search">×</button>` : ''}
      </div>
      ${state.searchQuery ? `<div class="search-hint">${filtered.length} result${filtered.length===1?'':'s'} for "${escapeHtml(state.searchQuery)}"</div>` : ''}

      ${pinnedDocs.length ? `
        <div class="section-title">Pinned</div>
        <div class="doc-card-grid">${pinnedDocs.map((d,i) => renderDocCard(d, {showCategory: true, i})).join('')}</div>
      ` : ''}

      ${!state.searchQuery && !state.showArchived && upcoming.length ? `
        <div class="section-title">Renewals</div>
        <div class="renewal-strip-wrap">
          <div class="renewal-strip">
            ${upcoming.map((d,i) => `
              <div class="renewal-card ${d.days<=7?'urgent':''}" data-renewal-doc="${d.id}" role="button" tabindex="0" style="--i:${i}">
                <div class="renewal-title">${escapeHtml(d.title)}</div>
                <div class="renewal-days">${d.days<0?'Expired':d.days===0?'Due today':d.days+' day'+(d.days===1?'':'s')+' left'}</div>
                <div class="renewal-actions">
                  <button class="icon-only-btn small" data-renewal-renew="${d.id}" aria-label="Renew ${escapeHtml(d.title)}" title="Renew">${icon('restore',14)}</button>
                  <button class="icon-only-btn small" data-renewal-archive="${d.id}" aria-label="Archive ${escapeHtml(d.title)}" title="Archive">${icon('archive',14)}</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>` : ''}

      ${visibleDocs.length === 0 ? `
        <div class="empty-state">${state.showArchived ? 'No archived documents.' : 'No documents yet.<br>Add your first one below.'}</div>
      ` : filtered.length === 0 ? `
        <div class="empty-state">No documents match "${escapeHtml(state.searchQuery)}".</div>
      ` : catOrder.map(cat => {
        const meta = categoryFor(cat);
        // A category's remembered collapsed state is ignored while searching — a match hidden
        // inside a collapsed category defeats the point of searching at all — but never written
        // back, so clearing the search restores exactly whatever was collapsed before.
        const isCollapsed = !state.searchQuery && state.collapsedCats[cat];

        <div class="section-title cat-toggle" data-cat="${cat}" role="button" tabindex="0" aria-expanded="${!isCollapsed}">
          <span class="cat-title-label">${categoryIconHtml(meta,15)} ${escapeHtml(meta.label)}</span>
          <span class="cat-count">${grouped[cat].length}<span class="cat-chevron ${isCollapsed ? 'collapsed' : ''}">${icon('chevronDown',15)}</span></span>
        </div>
        <div class="doc-card-grid-wrap ${isCollapsed ? 'is-collapsed' : ''}" data-cat-panel="${cat}"><div class="doc-card-grid-inner"><div class="doc-card-grid">${grouped[cat].map((d,i) => renderDocCard(d, {i})).join('')}</div></div></div>
      `; }).join('')}
      ${archivedCount ? `<button class="archive-toggle" id="archiveToggleBtn">${state.showArchived ? `${icon('back',14)} Back to active documents` : `View archived (${archivedCount})`}</button>` : ''}
      ${!state.showArchived && deletedCount ? `<button class="archive-toggle" id="deletedToggleBtn">Recently deleted (${deletedCount})</button>` : ''}
      <div class="version-tag">Version ${APP_VERSION}</div>
    </div>
    ${!state.showArchived ? `
      <div class="fab">
        <button class="camera-fab" id="cameraFabBtn" aria-label="Capture with camera">${icon('camera',22)}</button>
        <button class="primary" id="addDocBtn">${icon('plus',20)} Add document</button>
      </div>
    ` : ''}
  `;

  const renewalStripEl = document.querySelector('.renewal-strip');
  if(renewalStripEl){
    const wrap = renewalStripEl.parentElement;
    if(wrap && renewalStripEl.scrollWidth > renewalStripEl.clientWidth + 1) wrap.classList.add('has-overflow');
  }

  document.getElementById('openSettingsBtn').onclick = () => { state.screen = 'settings'; pushAppHistoryState(); render(); refreshDriveStorageInfo(); };
  document.getElementById('openQuickRefBtn').onclick = () => { state.screen = 'quickref'; pushAppHistoryState(); render(); };
  const addBtn = document.getElementById('addDocBtn');
  if(addBtn) addBtn.onclick = () => openAddModal();
  const camBtn = document.getElementById('cameraFabBtn');
  if(camBtn) camBtn.onclick = () => openCameraModal();
  const reconnectBtn = document.getElementById('reconnectDriveBtn');
  if(reconnectBtn) reconnectBtn.onclick = reconnectDrive;
  const archiveToggleBtn = document.getElementById('archiveToggleBtn');
  if(archiveToggleBtn) archiveToggleBtn.onclick = () => {
    if(state.showArchived){
      goBackOneLayer();
    } else {
      state.showArchived = true; state.searchQuery = '';
      pushAppHistoryState();
      render();
    }
  };
  const deletedToggleBtn = document.getElementById('deletedToggleBtn');
  if(deletedToggleBtn) deletedToggleBtn.onclick = () => {
    state.showDeleted = true;
    pushAppHistoryState();
    render();
  };

  const searchInput = document.getElementById('searchInput');
  searchInput.oninput = (e) => {
    state.searchQuery = e.target.value;
    // Debounced: render() rebuilds the whole document list, which can be noticeably slower than
    // a keystroke on a large vault — waiting for a short pause in typing keeps every keystroke
    // itself snappy instead of rebuilding the DOM on each one.
    clearTimeout(searchRenderTimer);
    searchRenderTimer = setTimeout(() => {
      // renderImmediate(), not render() — same reasoning as the quick-ref search box: a
      // view-transition crossfade shouldn't play on every debounce tick while typing.
      renderImmediate();
      // That just rebuilt the whole vault view via innerHTML, destroying the input we're typing
      // into — re-query the freshly created one and refocus it, or the on-screen keyboard drops
      // (focusing the old, now-detached node is a silent no-op).
      const freshInput = document.getElementById('searchInput');
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(freshInput.value.length, freshInput.value.length); }
    }, 150);
  };
  const searchClearBtn = document.getElementById('searchClearBtn');
  if(searchClearBtn) searchClearBtn.onclick = () => {
    clearTimeout(searchRenderTimer);
    state.searchQuery = '';
    render();
    const freshInput = document.getElementById('searchInput');
    if(freshInput) freshInput.focus();
  };

  document.querySelectorAll('.cat-toggle').forEach(el => {
    // Mutates the already-rendered DOM directly instead of calling render() — collapse/expand used
    // to work by omitting the category's whole doc-card-grid from the next render() pass, which
    // meant the panel (and the .cat-chevron rotation CSS already sitting unused above) never had a
    // persistent node to actually animate; toggling a class on the existing nodes here is what
    // finally lets both transitions play. state.collapsedCats stays the source of truth so a later
    // full render() (e.g. after adding a document) still computes the right collapsed state.
    const toggle = () => {
      const c = el.getAttribute('data-cat');
      const collapsed = !state.collapsedCats[c];
      state.collapsedCats[c] = collapsed;
      const panel = document.querySelector(`.doc-card-grid-wrap[data-cat-panel="${c}"]`);
      if(panel) panel.classList.toggle('is-collapsed', collapsed);
      const chevron = el.querySelector('.cat-chevron');
      if(chevron) chevron.classList.toggle('collapsed', collapsed);
      el.setAttribute('aria-expanded', String(!collapsed));
    };
    el.onclick = toggle;
    el.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  });

  // Renewal cards were purely informational — a highlighted "3 days left" with nothing to do
  // about it. Tapping one now opens that document directly, same as tapping its card icon below.
  document.querySelectorAll('[data-renewal-doc]').forEach(el => {
    const open = () => viewDocument(el.getAttribute('data-renewal-doc'));
    el.onclick = open;
    el.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  });
  document.querySelectorAll('[data-renewal-archive]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); requestArchiveDocument(btn.getAttribute('data-renewal-archive')); };
  });
  document.querySelectorAll('[data-renewal-renew]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); openRenewExpiredModal(btn.getAttribute('data-renewal-renew')); };
  });

  // A pinned document's card renders twice — once in the Pinned section, once again in its own
  // category section — so wiring by id (getElementById only ever finds the first match in document
  // order) silently left the second copy dead. querySelectorAll wires every matching element
  // regardless of how many times a given doc's card appears on the page.
  document.querySelectorAll('[data-open-doc]').forEach(el => {
    const open = () => viewDocument(el.getAttribute('data-open-doc'));
    el.onclick = open;
    el.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  });
  document.querySelectorAll('[data-view-doc]').forEach(el => {
    el.onclick = () => viewDocument(el.getAttribute('data-view-doc'));
  });
  document.querySelectorAll('[data-share-doc]').forEach(el => {
    el.onclick = () => openShareModal(el.getAttribute('data-share-doc'));
  });
  document.querySelectorAll('[data-renew-doc]').forEach(el => {
    el.onclick = () => openRenewExpiredModal(el.getAttribute('data-renew-doc'));
  });
  document.querySelectorAll('[data-menu-toggle]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-menu-toggle');
      state.openActionMenu = state.openActionMenu === id ? null : id;
      render();
    };
  });

  document.querySelectorAll('[data-menu-action]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const docId = btn.getAttribute('data-doc');
      const action = btn.getAttribute('data-menu-action');
      const doc = state.documents.find(x => x.id === docId);
      state.openActionMenu = null;
      if(action === 'pin') togglePin(docId);
      else if(action === 'edit') openEditModal(docId);
      else if(action === 'extractText') extractTextForDocument(docId);
      else if(action === 'archive') toggleArchive(docId);
      else if(action === 'remind' && doc){ window.open(addToCalendarUrl(doc), '_blank'); render(); }
      else if(action === 'download') downloadDocument(docId);
      else if(action === 'delete') requestDeleteDocument(docId);
    };
  });

  // Close any open overflow menu on an outside click. Explicitly drop any handler from a previous
  // render before attaching a new one — render() can run more than once while the menu stays open
  // (e.g. an unrelated toast or background refresh), and {once:true} alone doesn't prevent those
  // extra renders from each attaching their own listener, which would fire and re-render multiple
  // times for a single click.
  if(actionMenuOutsideClickHandler) document.removeEventListener('click', actionMenuOutsideClickHandler);
  actionMenuOutsideClickHandler = null;
  if(state.openActionMenu){
    actionMenuOutsideClickHandler = () => { state.openActionMenu = null; actionMenuOutsideClickHandler = null; render(); };
    document.addEventListener('click', actionMenuOutsideClickHandler, {once: true});
  }

  renderModal();
}

// The trash view — deliberately a separate, simpler render path from renderVault() rather than a
// third value threaded through visibleDocs/catOrder/etc.: it's not a daily-use screen (no search,
// no pinning, no categories, no add-document FAB), just a flat list of what's awaiting restore or
// permanent removal, so reusing the active/archived view's full machinery would add branching
// there for no real benefit here.
function renderDeletedView(app){
  const deletedDocs = state.documents.filter(d => d.deletedAt).sort((a,b) => new Date(b.deletedAt) - new Date(a.deletedAt));
  app.innerHTML = `
    <div class="settings-header">
      <button class="icon-only-btn" id="backFromDeletedBtn" aria-label="Back">${icon('back',22)}</button>
      <div class="brand-name">Recently deleted</div>
    </div>
    <div class="settings">
      <p class="quickref-caution">Documents here are permanently deleted ${TRASH_RETENTION_DAYS} days after being moved here, unless you restore them first.</p>
      ${deletedDocs.length === 0 ? `<div class="empty-state">Nothing here.</div>` : deletedDocs.map((d,i) => {
        const meta = categoryFor(d.category);
        const daysLeft = Math.max(0, TRASH_RETENTION_DAYS - daysSinceIso(d.deletedAt));
        return `
        <div class="doc-card" style="--i:${i}">
          <div class="doc-icon">${categoryIconHtml(meta,21)}</div>
          <div class="doc-body">
            <p class="doc-title">${escapeHtml(d.title)}</p>
            <p class="doc-meta">${escapeHtml(meta.label)} · Deleted ${formatDate(d.deletedAt)} · ${daysLeft} day${daysLeft===1?'':'s'} left to restore</p>
            <div class="doc-actions">
              <button class="chip-btn" data-restore-doc="${d.id}">Restore</button>
              <button class="chip-btn danger" data-purge-doc="${d.id}">Delete now</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  document.getElementById('backFromDeletedBtn').onclick = () => goBackOneLayer();
  document.querySelectorAll('[data-restore-doc]').forEach(btn => {
    btn.onclick = () => restoreDeletedDocument(btn.getAttribute('data-restore-doc'));
  });
  document.querySelectorAll('[data-purge-doc]').forEach(btn => {
    btn.onclick = () => requestPurgeDocument(btn.getAttribute('data-purge-doc'));
  });
  renderModal();
}

function renderDocCard(d, opts){
  opts = opts || {};
  const meta = categoryFor(d.category);
  let expiryBadge = '';
  let isExpired = false;
  if(d.expiry){
    const days = daysUntil(d.expiry);
    isExpired = days<0;
    const style = isExpired ? 'background:var(--danger-bg);color:var(--danger);' : days<=7 ? 'background:var(--danger-bg);color:var(--danger);' : days<=30 ? 'background:var(--warning-bg);color:var(--warning);' : 'background:var(--success-bg);color:var(--success);';
    expiryBadge = `<span class="doc-expiry" style="${style}">${isExpired ? 'Expired' : 'Expires'} ${formatExpiryDate(d.expiry)}</span>`;
  }
  const menuOpen = state.openActionMenu === d.id;
  // Denormalized both directions (see confirmRenewExpired) so either end of the pair can show a
  // note with no extra lookup beyond the already-loaded state.documents list.
  const supersededByDoc = d.supersededBy ? state.documents.find(x => x.id === d.supersededBy) : null;
  const supersedesDoc = d.supersedes ? state.documents.find(x => x.id === d.supersedes) : null;
  const linkNote = supersededByDoc ? `<p class="doc-link-note">→ Replaced by ${escapeHtml(supersededByDoc.title)}</p>`
    : supersedesDoc ? `<p class="doc-link-note">→ Replaces ${escapeHtml(supersedesDoc.title)}</p>` : '';
  // In offline mode, a document's Firestore metadata can be known (and worth listing, so it isn't
  // misleadingly invisible) without its file bytes being cached — those are two separate stores,
  // see the offline-cache comment above. Distinguish the two rather than letting every card look
  // equally open-able when only some actually are.
  const offlineUnavailable = state.isOfflineMode && !state.offlineDocIds.has(d.id);
  return `
    <div class="doc-card ${d.archived ? 'is-archived' : ''} ${offlineUnavailable ? 'is-offline-unavailable' : ''}" style="--i:${opts.i||0}">
      <div class="doc-icon ${d.ocrText ? 'ocr-badge' : ''}" data-open-doc="${d.id}" role="button" tabindex="0" aria-label="View ${escapeHtml(d.title)}">${categoryIconHtml(meta,21)}</div>
      <div class="doc-body">
        <p class="doc-title" data-open-doc="${d.id}" role="button" tabindex="0">${escapeHtml(d.title)}${state.offlineDocIds.has(d.id) ? `<span class="offline-badge" title="Available offline" aria-label="Available offline">${icon('download',12)}</span>` : offlineUnavailable ? `<span class="offline-badge unavailable">Not available offline</span>` : ''}</p>
        <p class="doc-meta">${opts.showCategory ? `${escapeHtml(meta.label)} · ` : ''}Added ${formatDate(d.addedAt)}${d.archived ? ' · archived' : ''}</p>
        ${d.snippet ? `<p class="doc-snippet">${d.snippet}</p>` : ''}
        ${expiryBadge}
        ${linkNote}
        <div class="doc-actions">
          <button class="chip-btn" data-view-doc="${d.id}">View</button>
          <button class="chip-btn secondary" data-share-doc="${d.id}">Share</button>
          ${isExpired && !d.archived ? `<button class="chip-btn danger" data-renew-doc="${d.id}">Renew</button>` : ''}
          <div class="action-menu-wrap">
            <button class="icon-only-btn small" data-menu-toggle="${d.id}" aria-label="More actions" aria-haspopup="true" aria-expanded="${menuOpen}">${icon('more',18)}</button>
            ${menuOpen ? `
              <div class="action-menu" id="actionMenu-${d.id}">
                <button data-menu-action="pin" data-doc="${d.id}">${icon('star',15)} ${d.pinned ? 'Unpin' : 'Pin to top'}</button>
                <button data-menu-action="edit" data-doc="${d.id}">${icon('edit',15)} Edit</button>
                ${d.mimeType === 'application/pdf' && !d.ocrText ? `<button data-menu-action="extractText" data-doc="${d.id}">${icon('search',15)} Extract text</button>` : ''}
                <button data-menu-action="archive" data-doc="${d.id}">${icon(d.archived?'restore':'archive',15)} ${d.archived ? 'Restore' : 'Archive'}</button>
                ${d.expiry ? `<button data-menu-action="remind" data-doc="${d.id}">${icon('calendar',15)} Add reminder</button>` : ''}
                <button data-menu-action="download" data-doc="${d.id}">${icon('download',15)} Download</button>
                <button class="danger" data-menu-action="delete" data-doc="${d.id}">${icon('trash',15)} Delete</button>
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

let pendingFile = null;
let pendingOcrText = '';
let pendingExpirySuggested = false;
let pendingCategorySuggested = false;
let categoryManuallyChanged = false;
let pendingOcrRunning = false; // guards against saving before background OCR finishes

function openAddModal(){ state.modal = 'add'; state.renewalUploadTargetId = null; pendingFile = null; pendingOcrText = ''; pendingExpirySuggested = false; pendingCategorySuggested = false; categoryManuallyChanged = false; pendingOcrRunning = false; pushAppHistoryState(); render(); }
// Opens the same 'add' modal, but flagged so saveDocument() links the new file to oldDocId as its
// replacement and archives oldDocId once the upload succeeds — the direct "upload now" path from
// the Renew flow, rather than only being able to pick an already-existing document as the reason.
function openAddModalForRenewal(oldDocId){ state.modal = 'add'; state.renewalUploadTargetId = oldDocId; pendingFile = null; pendingOcrText = ''; pendingExpirySuggested = false; pendingCategorySuggested = false; categoryManuallyChanged = false; pendingOcrRunning = false; pushAppHistoryState(); render(); }
function closeModal(){
  goBackOneLayer();
}
// Escape-to-close, plus a focus trap so Tab/Shift+Tab cycle within the open modal instead of
// escaping into the (aria-hidden) page behind it — neither existed at all before this.
document.addEventListener('keydown', (e) => {
  if(!state.modal) return;
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key !== 'Tab') return;
  const sheet = document.querySelector('.modal-sheet');
  if(!sheet) return;
  const focusable = sheet.querySelectorAll('input, select, textarea, button, [tabindex]:not([tabindex="-1"])');
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

// Pull-down-to-dismiss for the document viewer: dragging down while already scrolled to the very
// top of the sheet drags the sheet itself down instead of doing nothing (or rubber-banding), and
// releasing past a threshold closes it — the same gesture Google Photos/Instagram use for a
// full-content viewer, as an additional way to close beyond the X button and the outside-tap
// added earlier. Scoped to just this one modal (via the caller only invoking it for viewFile) —
// dragging from the top of an add/edit form, for instance, should just scroll, not risk dismissing
// unsaved input.
//
// Dragging the content area is gated on being scrolled to the very top — reasonable in principle
// (otherwise it'd fight ordinary scrolling), but it means the gesture can go silently dead from
// anywhere it isn't exactly true, with nothing on screen to explain why. `handle`, when passed, is
// a small dedicated grab bar with no such condition: a drag starting there always counts, the same
// guaranteed contract every native bottom sheet's handle gives you, independent of scroll state.
function enableSwipeToDismiss(sheet, handle){
  let startY = 0, dragging = false, pointerId = null, lastY = 0, lastT = 0, velocity = 0;
  const DISMISS_THRESHOLD_PX = 90;
  const FADE_DISTANCE_PX = 300; // backdrop reaches its floor opacity after this much drag
  const EXIT_DURATION_MIN_MS = 120, EXIT_DURATION_MAX_MS = 260;

  const begin = (e) => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    startY = e.clientY;
    lastY = e.clientY;
    lastT = e.timeStamp;
    velocity = 0;
    pointerId = e.pointerId;
    dragging = false;
  };

  // Deliberately NOT attached to the whole sheet — it used to arm from a pointerdown anywhere in
  // the content area (gated only on being scrolled to the top), so an ordinary tap-and-drag on a
  // button or list item up there could get misread as the start of a dismiss gesture. Only a
  // press starting on the dedicated handle can ever begin this now; pointermove/pointerup below
  // stay on `sheet` (not `handle`) since the drag naturally leaves the small handle bar within the
  // first moment of downward movement, and both still fire from there via ordinary event bubbling
  // — `handle` is inside `sheet`, so nothing about the rest of the gesture needs to change.
  if(handle){
    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      begin(e);
    });
  }

  sheet.addEventListener('pointermove', (e) => {
    if(pointerId === null || e.pointerId !== pointerId) return;
    const deltaY = e.clientY - startY;
    if(!dragging){
      if(deltaY <= 0) return; // hasn't moved down yet — not a dismiss attempt
      dragging = true;
      sheet.setPointerCapture(pointerId);
      // Suppresses the browser's own scroll/rubber-band/pull-to-refresh handling for the rest of
      // this gesture. Once armed, this stays in effect until the finger actually lifts (see
      // below) — a real finger's path isn't perfectly monotonic, and re-toggling this mid-drag on
      // every tiny backward jitter was handing the gesture back to the browser before release,
      // which is why the sheet used to move a little and then stop responding.
      sheet.style.touchAction = 'none';
    }
    const dt = e.timeStamp - lastT;
    if(dt > 0) velocity = (e.clientY - lastY) / dt;
    lastY = e.clientY;
    lastT = e.timeStamp;
    const clamped = Math.max(0, deltaY);
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${clamped}px)`;
    const overlay = sheet.parentElement;
    if(overlay) overlay.style.opacity = String(1 - 0.6 * Math.min(1, clamped / FADE_DISTANCE_PX));
  });

  const endDrag = (e) => {
    if(pointerId === null || e.pointerId !== pointerId) return;
    const deltaY = e.clientY - startY;
    const wasDragging = dragging;
    dragging = false;
    pointerId = null;
    sheet.style.touchAction = '';
    if(!wasDragging) return;
    const overlay = sheet.parentElement;
    // Only where the finger actually ended up decides whether to dismiss — never speed on its own.
    // A quick flick used to close the sheet outright even when the very next thing the user did was
    // drag back up to cancel: reversing direction always wins now, exactly like Google Photos or
    // Instagram, since deltaY here is the FINAL position at release, not a snapshot from mid-drag.
    if(deltaY > DISMISS_THRESHOLD_PX){
      // window.innerHeight rather than the sheet's own measured height — the sheet's bottom edge
      // already sits at the viewport bottom (the overlay is flex-end aligned), so a full viewport
      // height of travel is always enough to clear it, and doesn't depend on a getBoundingClientRect
      // reading staying accurate through the animation (mobile browser chrome show/hide can nudge
      // the effective viewport mid-gesture).
      const remaining = Math.max(window.innerHeight - deltaY, 80);
      // Finishes the drag in the same direction rather than cutting the DOM away the instant the
      // threshold is crossed — a fast swipe keeps moving fast off-screen, a slow drag that just
      // cleared the threshold gets a brisk but unhurried finish. velocity is px/ms from the last
      // tracked move; the 0.6 floor keeps a barely-past-threshold, nearly-stationary release from
      // producing a sluggish animation.
      const speed = Math.max(velocity, 0.6);
      const durationMs = Math.min(EXIT_DURATION_MAX_MS, Math.max(EXIT_DURATION_MIN_MS, remaining / speed));
      sheet.style.transition = `transform ${durationMs}ms cubic-bezier(0.2,0.6,0.3,1)`;
      sheet.style.transform = `translateY(${deltaY + remaining}px)`;
      // The backdrop is deliberately left at whatever opacity the drag already left it at, rather
      // than also animating it to fully transparent in parallel — a separate opacity transition
      // reaching 0 even slightly before the transform reached its own endpoint (different easing
      // curves settle at different real times despite the same declared duration) exposed the page
      // underneath through the fully-dimmed backdrop for the last few ms of the slide, before the
      // sheet had actually cleared it. It now disappears in one step alongside the sheet itself,
      // when closeModal() removes the whole overlay — by which point the sheet is already gone.
      setTimeout(closeModal, durationMs);
    } else {
      sheet.style.transition = 'transform 0.2s cubic-bezier(0.2,0.8,0.2,1)';
      sheet.style.transform = '';
      if(overlay){
        overlay.style.transition = 'opacity 0.2s ease';
        overlay.style.opacity = '';
      }
    }
  };
  sheet.addEventListener('pointerup', endDrag);
  sheet.addEventListener('pointercancel', endDrag);
}

function categoryOptionsHtml(selected){
  return state.categories.map(c => `<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.label)}</option>`).join('');
}

function switchHtml(id, checked, disabled, ariaLabel){
  return `<label class="switch"><input type="checkbox" id="${id}" ${checked?'checked':''} ${disabled?'disabled':''} aria-label="${escapeHtml(ariaLabel || '')}"><span class="switch-track"><span class="switch-thumb"></span></span></label>`;
}

function renderModal(){
  const existing = document.getElementById('modalOverlay');
  if(existing) existing.remove();
  const appEl = document.getElementById('app');
  if(!state.modal){ if(appEl) appEl.removeAttribute('aria-hidden'); return; }
  if(appEl) appEl.setAttribute('aria-hidden', 'true');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  // Applies to every modal type below — a tap on the dimmed backdrop (not the sheet itself)
  // closes it, same as viewFile used to do on its own before this was made universal.
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  if(state.modal === 'add'){
    const renewalTarget = state.renewalUploadTargetId ? state.documents.find(d => d.id === state.renewalUploadTargetId) : null;
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-close"><button id="closeModalBtn" aria-label="Close">×</button></div>
        <h3>${renewalTarget ? 'Upload replacement document' : 'Add a document'}</h3>

      pendingFile = f;

      pendingCategorySuggested = false;

        if(saveBtn) saveBtn.disabled = true;
        const dataUrl = await readFileAsDataURL(f);

function applyExpirySuggestionIfEmpty(inputId, noteId, ocrText){
  const input = document.getElementById(inputId);
  const note = document.getElementById(noteId);
  if(!input || pendingExpirySuggested || input.value) return;
  const guess = guessExpiryDate(ocrText);
  if(guess){
    input.value = guess;
    pendingExpirySuggested = true;
    if(note){ note.textContent = 'Expiry date suggested from the scan — double-check it before saving.'; note.style.display = 'block'; }
  }
}

// A <select> always has SOME value (unlike the expiry input, which starts empty), so "should this
// suggestion apply" can't be answered by checking the current value the way applyExpirySuggestion-
// IfEmpty does — categoryManuallyChanged tracks whether the user has actually touched the dropdown
// themselves since this modal opened, via the 'change' listener wired alongside this call.
function applyCategorySuggestionIfUntouched(selectId, noteId, ocrText){
  const select = document.getElementById(selectId);
  const note = document.getElementById(noteId);
  if(!select || pendingCategorySuggested || categoryManuallyChanged) return;
  const guess = guessCategory(ocrText);
  if(guess){

    pendingCategorySuggested = true;
    if(note){ note.textContent = "Category suggested from the scan — change it if that's not right."; note.style.display = 'block'; }
  }
}

async function saveDocument(){
  const title = document.getElementById('docTitle').value.trim();
  const category = document.getElementById('docCategory').value;
  const expiry = document.getElementById('docExpiry').value;
  const reminderDays = parseReminderDaysInput(document.getElementById('docReminderDays').value);
  const errEl = document.getElementById('addErr');
  const saveBtn = document.getElementById('saveDocBtn');
  const renewalTargetId = state.renewalUploadTargetId;
  const defaultBtnLabel = renewalTargetId ? 'Save & archive old document' : 'Save document';

  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  if(!pendingFile){ errEl.textContent='Choose a file.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try{
    const newDoc = await finalizeAndStoreDocument({title, category, expiry, reminderDays, blob: pendingFile, mimeType: pendingFile.type, ocrText: pendingOcrText, onUploadProgress: setUploadProgress});
    state.renewalUploadTargetId = null;
    closeModal();
    if(renewalTargetId){
      const linked = await linkRenewalAndArchiveOld(renewalTargetId, newDoc.id);
      toast(linked ? 'Renewed — old document archived' : 'Saved, but the old document needs archiving manually');
    } else {
      toast(pendingOcrText ? 'Saved and indexed' : 'Saved');
    }
  } catch(e){
    // Without this, any failure here (a huge file, a Drive error, OCR erroring in a way runOcr
    // didn't already catch) left the button stuck on "Saving…" with no way to retry.
    console.error('Save failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = defaultBtnLabel;
  }
}

// Links a just-uploaded replacement to the document it replaces (supersedes/supersededBy, both
// directions — see confirmRenewExpired) and archives the old one. Kept separate from
// finalizeAndStoreDocument's own try/catch: by the time this runs, the new file is already safely
// saved, so a failure here is "archive the old one yourself" territory, not a failed save.
async function linkRenewalAndArchiveOld(oldId, newId){
  const oldDoc = state.documents.find(d => d.id === oldId);
  const newDoc = state.documents.find(d => d.id === newId);
  if(!oldDoc || !newDoc) return false;
  const archivedAt = new Date().toISOString();
  oldDoc.archived = true; oldDoc.archivedAt = archivedAt; oldDoc.supersededBy = newDoc.id;
  newDoc.supersedes = oldDoc.id;
  try{
    const batch = db.batch();
    batch.update(userDoc().collection('documents').doc(oldDoc.id), {archived: true, archivedAt, supersededBy: newDoc.id});
    batch.update(userDoc().collection('documents').doc(newDoc.id), {supersedes: oldDoc.id});
    await batch.commit();
    render();
    return true;
  } catch(e){
    console.error('Failed to link renewal / archive old document', e);
    oldDoc.archived = false; oldDoc.archivedAt = null; oldDoc.supersededBy = null;
    newDoc.supersedes = null;
    render();
    return false;
  }
}

async function finalizeAndStoreDocument({title, category, expiry, reminderDays, blob, mimeType, ocrText, onUploadProgress}){
  const cat = categoryFor(category);
  const id = 'doc_' + Date.now();
  const filename = safeFilename(title, mimeType);
  const driveFileId = await driveUpload(blob, filename, mimeType, cat.driveFolderId, onUploadProgress);
  const doc = {
    id, title, category: cat.id, expiry: expiry || null, reminderDays: reminderDays || null,
    driveFileId, mimeType, size: blob.size || 0,
    ocrText: ocrText || '',
    addedAt: new Date().toISOString(),
    archived: false
  };
  try{
    await persistDocument(doc);
  } catch(e){
    // The Firestore write failed after the Drive upload already succeeded — clean up the now-
    // orphaned Drive file (best-effort) rather than leaving it dangling, and don't add the
    // document to local state below: if it's not in Firestore, it isn't really saved, and the
    // UI shouldn't show it as if it were.
    try{ await driveDelete(driveFileId); } catch(cleanupErr){ console.error('Could not clean up orphaned Drive file', cleanupErr); }
    throw e;
  }
  state.documents.unshift(doc);
  return doc;
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => { const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
}

/* ---------- camera capture ---------- */
let pendingPageOcrTexts = []; // per-page OCR text, parallel to state.capturedPages — lets removing
                               // a page also cleanly drop just that page's text from pendingOcrText
// Every capturePage()/removeCapturedPage() call rebuilds this modal's whole innerHTML (to show the
// new thumbnail, or reflect a removed page), which would otherwise silently reset every text field
// back to its default each time — not just the category <select> this was originally written for.
// These track whatever's currently in each field (typed by hand or filled by a suggestion) so the
// template below can restore them across that rebuild; snapshotCamFormFields() reads the live DOM
// right before each renderModal() call, so anything typed since the last capture is preserved too,
// not just what a suggestion already wrote in.
let pendingCamTitle = '';
let pendingCamCategory = null;
let pendingCamExpiry = '';
let pendingCamReminderDaysText = '';
function snapshotCamFormFields(){
  const t = document.getElementById('camTitle'), c = document.getElementById('camCategory'),
        e = document.getElementById('camExpiry'), r = document.getElementById('camReminderDays');
  if(t) pendingCamTitle = t.value;
  if(c) pendingCamCategory = c.value;
  if(e) pendingCamExpiry = e.value;
  if(r) pendingCamReminderDaysText = r.value;
}
async function startCamera(){
  const video = document.getElementById('cameraVideo');
  if(state.cameraStream){
    // Every capture re-renders the modal, which rebuilds the <video> element from scratch — the
    // stream itself is still live, so reattach it instead of requesting a brand-new one from
    // getUserMedia each time, which would leak the previous stream's tracks running unseen.
    if(video) video.srcObject = state.cameraStream;
    return;
  }
  try{
    // aspectRatio is a request, not a guarantee — the displayed box stays a fixed size regardless
    // (see .camera-wrap's CSS), this just steers the negotiated stream closer to that box so
    // object-fit:cover has less to crop.
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', aspectRatio:{ideal: 3/4}}});
    // The camera modal (or the whole app, via the app-lock teardown) can close while this permission
    // prompt is still pending — unlike every other async modal-content loader here (viewDocument,
    // renderPdfInto), this one used to skip re-checking relevance after its await, so a stream
    // granted after the fact was stored and left running with nothing left to ever call
    // stopCamera() on it, live behind whatever's on screen now (including a locked device).
    if(state.modal !== 'camera'){ stream.getTracks().forEach(t => t.stop()); return; }
    state.cameraStream = stream;
    if(video) video.srcObject = state.cameraStream;
  } catch(e){
    const err = document.getElementById('camErr');
    if(err){ err.textContent = "Couldn't access the camera — check browser permissions."; err.style.display='block'; }
  }
}
function stopCamera(){
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(t=>t.stop()); state.cameraStream = null; }
}
function openCameraModal(){
  state.modal = 'camera'; state.capturedPages = []; state.capturedPagesRaw = []; state.capturedPageEnhance = [];
  state.cropIndex = null; state.cropSourceDataUrl = null; state.cropRect = null; state.cropEnhanceOn = false;
  state.renewalUploadTargetId = null;
  pendingPageOcrTexts = []; pendingOcrText = ''; pendingExpirySuggested = false; pendingCategorySuggested = false;
  categoryManuallyChanged = false; pendingCamTitle = ''; pendingCamCategory = null; pendingCamExpiry = '';
  pendingCamReminderDaysText = ''; pendingOcrRunning = false; pushAppHistoryState(); render();
}
// Opens the same camera flow, but flagged (like openAddModalForRenewal) so saveCameraDocument()
// links the new capture to oldDocId as its replacement and archives oldDocId once the capture
// succeeds — the camera counterpart to the Renew flow's file-upload path. Pre-fills title/category
// from the old document, same as the 'add' modal does for its own renewal path.
function openCameraModalForRenewal(oldDocId){

const CROP_MIN_SIZE = 40; // on-screen px — keeps handles draggable and forbids a degenerate 0-area crop

// A "leading" edge (top or left): the edge AT `pos` moves by `delta`; the OPPOSITE edge (pos+size)
// must stay fixed, so size shrinks by exactly what pos grows. Clamped so pos can't cross 0 and size
// can't drop below CROP_MIN_SIZE — clamps the DELTA itself (not pos/size after the fact), so the box
// never needs a second corrective jump.
function dragLeadingEdge(pos, size, delta){
  const dMin = -pos;
  const dMax = size - CROP_MIN_SIZE;
  const d = Math.max(dMin, Math.min(delta, dMax));
  return {pos: pos + d, size: size - d};
}
// A "trailing" edge (bottom or right): the edge AT `pos+size` moves by `delta`; `pos` is fixed.
// Clamped so the moving edge stays within [pos+CROP_MIN_SIZE, axisLimit].
function dragTrailingEdge(pos, size, delta, axisLimit){
  const dMin = CROP_MIN_SIZE - size;
  const dMax = axisLimit - (pos + size);
  const d = Math.max(dMin, Math.min(delta, dMax));
  return {size: size + d};
}

// Wires the crop step's drag interactions: a default centered box on first paint, a plain move-drag
// on the box itself, and clamped resize on each of the four corner handles. The stage is an
// inline-block wrapper sized to the image's own rendered box (see the .crop-stage CSS), so
// stage.clientWidth/Height are exactly the image's on-screen size and cropBox's left/top/width/
// height land directly in the image's own coordinate space — no letterboxing offset math needed.
function wireCropOverlay(){
  const img = document.getElementById('cropImage');
  const stage = document.getElementById('cropStage');
  const box = document.getElementById('cropBox');
  if(state.cropEnhanceOn) img.style.filter = ENHANCE_FILTER;

  function paintBox(){
    const r = state.cropRect;
    box.style.left = r.x + 'px'; box.style.top = r.y + 'px';
    box.style.width = r.w + 'px'; box.style.height = r.h + 'px';
  }
  function initRect(){
    if(state.cropRect){ paintBox(); return; }
    const w = img.clientWidth, h = img.clientHeight;
    const mx = w * 0.05, my = h * 0.05; // default: centered box, 5% margin each side
    state.cropRect = {x: mx, y: my, w: w - mx * 2, h: h - my * 2};
    paintBox();
  }
  if(img.complete && img.naturalWidth) initRect(); else img.onload = initRect;

  let dragMode = null; // 'move' | 'tl' | 'tr' | 'bl' | 'br' | null
  let startPointer = {x: 0, y: 0};
  let startRect = null;

  function onPointerDown(mode, e){
    e.preventDefault(); e.stopPropagation();
    dragMode = mode;
    startPointer = {x: e.clientX, y: e.clientY};
    startRect = {...state.cropRect};
    stage.setPointerCapture(e.pointerId);
  }
  box.addEventListener('pointerdown', (e) => onPointerDown('move', e));
  box.querySelectorAll('.crop-handle').forEach(h => {
    h.addEventListener('pointerdown', (e) => onPointerDown(h.dataset.handle, e));
  });

  stage.addEventListener('pointermove', (e) => {
    if(!dragMode) return;
    const dx = e.clientX - startPointer.x, dy = e.clientY - startPointer.y;
    const stageW = stage.clientWidth, stageH = stage.clientHeight;
    let r = {...startRect};
    if(dragMode === 'move'){
      r.x = Math.max(0, Math.min(startRect.x + dx, stageW - startRect.w));
      r.y = Math.max(0, Math.min(startRect.y + dy, stageH - startRect.h));
    } else {
      const isLeft = dragMode === 'tl' || dragMode === 'bl';
      const isTop = dragMode === 'tl' || dragMode === 'tr';
      if(isLeft){ const res = dragLeadingEdge(startRect.x, startRect.w, dx); r.x = res.pos; r.w = res.size; }
      else { const res = dragTrailingEdge(startRect.x, startRect.w, dx, stageW); r.w = res.size; }
      if(isTop){ const res = dragLeadingEdge(startRect.y, startRect.h, dy); r.y = res.pos; r.h = res.size; }
      else { const res = dragTrailingEdge(startRect.y, startRect.h, dy, stageH); r.h = res.size; }
    }
    state.cropRect = r;
    paintBox();
  });
  const endDrag = () => { dragMode = null; };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
}

// Grabs the raw video frame and opens the crop step on it rather than storing it directly — OCR
// and the suggestion logic that used to run right here now run at the end of confirmCrop() instead,
// on the cropped/enhanced pixels, which is a free accuracy improvement (no background/margins).
function capturePage(){
  const video = document.getElementById('cameraVideo');
  if(!video || !video.videoWidth) return;
  snapshotCamFormFields();
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  state.cropIndex = state.capturedPages.length; // "append" position — not pushed yet
  state.cropSourceDataUrl = canvas.toDataURL('image/jpeg', 0.9);
  state.cropEnhanceOn = false;
  state.cropRect = null; // computed on first paint, once the image's on-screen size is known
  renderModal();
}

// Re-opens the crop step for an already-captured page, seeded from its untouched original capture
// rather than its current (possibly already cropped/enhanced) stored image — otherwise repeated
// edits would compound quality loss each time.
function openCropForExistingPage(index){
  state.cropIndex = index;
  state.cropSourceDataUrl = state.capturedPagesRaw[index];
  state.cropEnhanceOn = !!state.capturedPageEnhance[index];
  state.cropRect = null; // re-editing starts from a fresh centered box, not the exact previous rect
  renderModal();
}

const ENHANCE_FILTER = 'contrast(1.4) brightness(1.08) saturate(0.9)';

// Bakes the crop (and, if enabled, the enhance filter) onto a full-resolution canvas and replaces
// or appends into state.capturedPages — the only thing saveCameraDocument()'s jsPDF loop ever
// reads, so that loop needs no changes at all. The on-screen crop rect is converted to true source
// pixels via the live <img>'s natural-vs-rendered size ratio, so the output is never upsampled
// beyond what the camera actually captured.
async function confirmCrop(){
  const img = document.getElementById('cropImage');
  const r = state.cropRect;
  const scaleX = img.naturalWidth / img.clientWidth, scaleY = img.naturalHeight / img.clientHeight;
  const sx = Math.round(r.x * scaleX), sy = Math.round(r.y * scaleY);
  const sw = Math.round(r.w * scaleX), sh = Math.round(r.h * scaleY);

  const canvas = document.createElement('canvas');
  canvas.width = sw; canvas.height = sh;
  const ctx = canvas.getContext('2d');
  if(state.cropEnhanceOn) ctx.filter = ENHANCE_FILTER; // must be set before drawImage
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

  const index = state.cropIndex;
  const isNewPage = index === state.capturedPages.length;
  const rawSrc = state.cropSourceDataUrl;
  const enhanceOn = state.cropEnhanceOn;
  state.cropIndex = null; state.cropSourceDataUrl = null; state.cropRect = null;

  if(isNewPage){
    state.capturedPages.push(dataUrl);
    state.capturedPagesRaw.push(rawSrc);
    state.capturedPageEnhance.push(enhanceOn);
    pendingPageOcrTexts.push('');
  } else {
    state.capturedPages[index] = dataUrl; // in-place replace — saveCameraDocument() needs no change
    state.capturedPageEnhance[index] = enhanceOn;
    // capturedPagesRaw[index] deliberately untouched — a future re-edit keeps starting from the
    // real original, not from this crop's own output.
  }
  pendingOcrRunning = true;
  renderModal();
  const pageNum = isNewPage ? state.capturedPages.length : index + 1;
  const totalPages = state.capturedPages.length;

  // Same OCR/suggestion tail capturePage() used to run inline, now running on the cropped and
  // possibly-enhanced pixels instead of the raw frame.
  const pageText = await runOcr(dataUrl, pct => setOcrProgress(pct, pageNum, totalPages));
  const progEl = document.getElementById('ocrProgress');
  if(progEl) progEl.style.display = 'none';
  // Re-find this page's CURRENT position rather than trusting the index captured before the
  // OCR await — another page could have been deleted in the meantime, shifting positions, and
  // writing to a stale index would land this text on the wrong page.
  const currentIndex = state.capturedPages.indexOf(dataUrl);
  if(currentIndex !== -1) pendingPageOcrTexts[currentIndex] = pageText;
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  applyExpirySuggestionIfEmpty('camExpiry', 'camExpirySuggestNote', pendingOcrText);
  applyCategorySuggestionIfUntouched('camCategory', 'camCategorySuggestNote', pendingOcrText);
  // Re-snapshot — a suggestion above may have just written into the expiry/category fields
  // directly, so this picks that up too, ready for the next renderModal().
  snapshotCamFormFields();
  pendingOcrRunning = false;
  const saveBtn = document.getElementById('saveCamBtn');
  if(saveBtn) saveBtn.disabled = false;
}

function cancelCrop(){
  // A brand-new capture that's cancelled was never pushed to capturedPages — nothing to roll back
  // beyond closing the overlay. Cancelling an edit of an existing page leaves its stored image
  // untouched, since confirmCrop() never ran.
  state.cropIndex = null; state.cropSourceDataUrl = null; state.cropRect = null;
  renderModal();
}

function removeCapturedPage(index){
  snapshotCamFormFields();
  state.capturedPages.splice(index, 1);
  state.capturedPagesRaw.splice(index, 1);
  state.capturedPageEnhance.splice(index, 1);
  pendingPageOcrTexts.splice(index, 1);
  pendingOcrText = pendingPageOcrTexts.join('\n').trim();
  renderModal();
}

async function saveCameraDocument(){
  const title = document.getElementById('camTitle').value.trim();
  const category = document.getElementById('camCategory').value;
  const expiry = document.getElementById('camExpiry').value;
  const reminderDays = parseReminderDaysInput(document.getElementById('camReminderDays').value);
  const errEl = document.getElementById('camErr');
  const saveBtn = document.getElementById('saveCamBtn');

  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  if(!state.capturedPages.length){ errEl.textContent='Capture at least one page.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  const originalLabel = saveBtn.textContent;
  const renewalTargetId = state.renewalUploadTargetId;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try{
    // Always a PDF, even for a single page — a scanned document should behave like one
    // regardless of how many pages it took, not silently become a plain JPEG below 2 pages.
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    state.capturedPages.forEach((img, i) => {
      if(i > 0) pdf.addPage();
      const props = pdf.getImageProperties(img);
      const w = pdf.internal.pageSize.getWidth();
      const h = (props.height * w) / props.width;
      pdf.addImage(img, 'JPEG', 0, 0, w, h);
    });
    const blob = dataUrlToBlob(pdf.output('datauristring'));
    const mimeType = 'application/pdf';

    const newDoc = await finalizeAndStoreDocument({title, category, expiry, reminderDays, blob, mimeType, ocrText: pendingOcrText, onUploadProgress: setUploadProgress});
    state.renewalUploadTargetId = null;
    stopCamera();
    closeModal();
    if(renewalTargetId){
      const linked = await linkRenewalAndArchiveOld(renewalTargetId, newDoc.id);
      toast(linked ? 'Renewed — old document archived' : 'Saved, but the old document needs archiving manually');
    } else {
      toast('Captured and saved');
    }
  } catch(e){
    console.error('Save failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;
  }
}

/* ---------- edit / view / archive / delete ---------- */
function openEditModal(id){ state.modal = 'edit'; state.editDocId = id; pushAppHistoryState(); render(); }
// Custom per-document reminder schedule (days-before-expiry), overriding the global milestone
// list the Apps Script digest otherwise uses — e.g. a passport might warrant a 90-day heads-up,
// not just the default 14. Blank means "use the default schedule", not "remind never".
function parseReminderDaysInput(value){
  if(!value || !value.trim()) return null;
  const days = value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => Number.isFinite(n) && n >= -365 && n <= 365);
  const unique = [...new Set(days)];
  return unique.length ? unique : null;
}

async function saveEditedDocument(){
  const doc = state.documents.find(d => d.id === state.editDocId);
  if(!doc) return;
  const title = document.getElementById('editTitle').value.trim();
  const category = document.getElementById('editCategory').value;
  const expiry = document.getElementById('editExpiry').value;
  const reminderDays = parseReminderDaysInput(document.getElementById('editReminderDays').value);
  const errEl = document.getElementById('editErr');
  const saveBtn = document.getElementById('saveEditBtn');
  if(!title){ errEl.textContent='Enter a document title.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  saveBtn.disabled = true;

  try{

    }

    await persistDocument(updated);

    toast('Document updated');
  } catch(e){
    console.error('Edit failed', e);
    errEl.textContent = friendlyCloudError(e);
    errEl.style.display = 'block';
